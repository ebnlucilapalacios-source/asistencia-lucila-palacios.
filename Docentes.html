<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA EBN LUCILA PALACIOS - COMPLETO 2026</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
            authDomain: "control-de-asistencia-d585e.firebaseapp.com",
            projectId: "control-de-asistencia-d585e",
            storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
            appId: "1:368890880546:web:a97ab4372dea536217207b"
        };

        const app = initializeApp(firebaseConfig);
        const dbCloud = getFirestore(app);
        const CLAVE_INST = "LUCILA2026";
        const USUARIO_ADMIN = "admin_lucila";

        window.usuarioActual = null;
        window.db = { docente: "", seccion: "", grado: "", turno: "", alumnos: [], asistencias: {}, feriados: [] };

        const calcularEdad = (f) => {
            if(!f) return 0;
            const hoy = new Date();
            const cumple = new Date(f);
            let edad = hoy.getFullYear() - cumple.getFullYear();
            if (hoy.getMonth() < cumple.getMonth() || (hoy.getMonth() === cumple.getMonth() && hoy.getDate() < cumple.getDate())) edad--;
            return edad;
        };

        // --- AUTENTICACIÓN ---
        window.mostrarRegistro = (v) => { 
            document.getElementById('loginForm').style.display = v ? 'none' : 'block';
            document.getElementById('registerForm').style.display = v ? 'block' : 'none';
        };

        window.registrarCuenta = async () => {
            const clv = document.getElementById('regClaveInst').value;
            if(clv !== CLAVE_INST) return alert("Clave Institucional Incorrecta");
            const u = document.getElementById('regUser').value.toLowerCase().trim();
            if(!u) return alert("Usuario requerido");
            
            await setDoc(doc(dbCloud, "docentes_db", u), { 
                docente: document.getElementById('regNombre').value.toUpperCase(), 
                pass: document.getElementById('regPass').value, 
                grado: document.getElementById('regGrado').value, 
                seccion: document.getElementById('regSeccion').value.toUpperCase(), 
                turno: document.getElementById('regTurno').value,
                alumnos: [], asistencias: {}, feriados: [] 
            });
            alert("Cuenta registrada."); window.mostrarRegistro(false);
        };

        window.login = async () => {
            const u = document.getElementById('loginUser').value.toLowerCase().trim();
            const p = document.getElementById('loginPass').value;
            const snap = await getDoc(doc(dbCloud, "docentes_db", u));
            
            if (snap.exists() && snap.data().pass === p) {
                window.usuarioActual = u;
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                if (u === USUARIO_ADMIN) document.getElementById('adminPanel').style.display = 'block';
                onSnapshot(doc(dbCloud, "docentes_db", u), (s) => { 
                    window.db = s.data(); 
                    window.render(); 
                });
            } else { alert("Acceso denegado"); }
        };

        // --- PANEL DIRECCIÓN (ELIMINACIÓN Y CONSOLIDADO) ---
        window.eliminarDocente = async () => {
            const userDel = document.getElementById('adminDeleteUser').value.toLowerCase().trim();
            if(!userDel || userDel === USUARIO_ADMIN) return alert("Usuario no válido.");
            
            const ref = doc(dbCloud, "docentes_db", userDel);
            const snap = await getDoc(ref);
            if(!snap.exists()) return alert("No existe el docente.");

            if(confirm(`¿ELIMINAR DEFINITIVAMENTE a ${snap.data().docente}?`)) {
                if(prompt("Escriba ELIMINAR para confirmar:") === "ELIMINAR") {
                    await deleteDoc(ref);
                    alert("Docente borrado de la nube.");
                    document.getElementById('adminDeleteUser').value = "";
                    window.consolidadoMensual();
                }
            }
        };

        window.consolidadoMensual = async () => {
            const fSel = document.getElementById('fechaSeleccionada').value;
            const mesRef = new Date(fSel + "T00:00:00").getMonth();
            const snap = await getDocs(collection(dbCloud, "docentes_db"));
            
            let docentesData = [];
            const excluidos = ["ANGEL FIGUERA", "JUSTINA FERNANDEZ", "YUBIRY MARTINEZ", "LEOSMARY LOROÑO"];

            snap.forEach(dSnap => {
                const d = dSnap.data();
                const nom = (d.docente || "").toUpperCase();
                // Filtrar por nombre y por cargo Especialista
                const esExcluido = excluidos.some(e => nom.includes(e)) || nom.includes("ESPECIALISTA");

                if(dSnap.id !== USUARIO_ADMIN && !esExcluido) {
                    docentesData.push(d);
                }
            });

            docentesData.sort((a,b) => (parseInt(a.grado)-parseInt(b.grado)) || a.seccion.localeCompare(b.seccion));

            let h = `
                <div class="resumen-direccion">
                    <strong>CONSOLIDADO MENSUAL - TOTAL GRUPOS: ${docentesData.length}</strong>
                </div>
                <table class="tabla-admin" id="tablaAdminConsolidado">
                <thead>
                    <tr><th rowspan="2">DOCENTE</th><th rowspan="2">G/S</th><th colspan="3">MATRÍCULA</th><th colspan="2">MOV</th><th colspan="3">PROM. REAL</th><th rowspan="2">%</th></tr>
                    <tr><th>H</th><th>V</th><th>T</th><th>I</th><th>E</th><th>H</th><th>V</th><th>T</th></tr>
                </thead><tbody>`;
            
            let T = { mH:0, mV:0, mT:0, mI:0, mE:0, pH:0, pV:0, pT:0 };

            docentesData.forEach(d => {
                const alms = d.alumnos || [];
                const ac = alms.filter(a => !a.retirado);
                const mH=ac.filter(a=>a.genero==='F').length, mV=ac.filter(a=>a.genero==='M').length, mT=ac.length;
                
                // Movimientos del mes
                const mI = alms.filter(a => a.fechaIngreso && new Date(a.fechaIngreso+"T00:00:00").getMonth() === mesRef).length;
                const mE = alms.filter(a => a.retirado && a.fechaEgreso && new Date(a.fechaEgreso+"T00:00:00").getMonth() === mesRef).length;

                // Cálculo Asistencia Real
                let sH=0, sV=0, ds=0;
                Object.keys(d.asistencias || {}).forEach(f => {
                    const fo = new Date(f + "T00:00:00");
                    if(fo.getMonth() === mesRef && fo.getDay()!==0 && fo.getDay()!==6 && !d.feriados?.includes(f)) {
                        ds++; 
                        ac.forEach(a => { if(d.asistencias[f][a.id] === 1) a.genero === 'F' ? sH++ : sV++; });
                    }
                });
                const pH=ds>0?sH/ds:0, pV=ds>0?sV/ds:0, pT=pH+pV, ef=mT>0?(pT/mT*100).toFixed(0):0;
                
                T.mH+=mH; T.mV+=mV; T.mT+=mT; T.mI+=mI; T.mE+=mE; T.pH+=pH; T.pV+=pV; T.pT+=pT;

                h += `<tr><td style="text-align:left">${d.docente}</td><td>${d.grado}${d.seccion}</td><td>${mH}</td><td>${mV}</td><td>${mT}</td><td>${mI}</td><td>${mE}</td><td>${pH.toFixed(1)}</td><td>${pV.toFixed(1)}</td><td>${pT.toFixed(1)}</td><td>${ef}%</td></tr>`;
            });
            
            const efG = T.mT > 0 ? (T.pT/T.mT*100).toFixed(0) : 0;
            h += `<tr class="fila-total"><td>TOTAL ESCUELA</td><td>-</td><td>${T.mH}</td><td>${T.mV}</td><td>${T.mT}</td><td>${T.mI}</td><td>${T.mE}</td><td>${T.pH.toFixed(1)}</td><td>${T.pV.toFixed(1)}</td><td>${T.pT.toFixed(1)}</td><td>${efG}%</td></tr></tbody></table>`;
            document.getElementById('adminOutput').innerHTML = h;
        };

        // --- FUNCIONES DE DOCENTE (MATRÍCULA Y ASISTENCIA) ---
        window.save = async () => { await setDoc(doc(dbCloud, "docentes_db", window.usuarioActual), window.db); };
        
        window.render = () => {
            const fSel = document.getElementById('fechaSeleccionada').value;
            const esFeriado = window.db.feriados?.includes(fSel);
            const fObj = new Date(fSel + "T00:00:00");
            
            document.getElementById('docenteTxt').innerText = window.db.docente;
            document.getElementById('gradoSeccionTxt').innerText = `${window.db.grado}° "${window.db.seccion}" - ${window.db.turno}`;
            
            const lista = document.getElementById('listaAsistencia');
            lista.innerHTML = "";
            const activos = (window.db.alumnos || []).filter(a => !a.retirado);

            if (esFeriado || fObj.getDay() === 0 || fObj.getDay() === 6) {
                lista.innerHTML = `<div class="aviso-no">🚫 DÍA NO LABORABLE</div>`;
            } else {
                activos.sort((a,b)=>a.nombre.localeCompare(b.nombre)).forEach(a => {
                    const st = (window.db.asistencias[fSel] && window.db.asistencias[fSel][a.id]) || 0;
                    let c = "#ccc", t = "F"; if(st===1){c="var(--exito)"; t="P";} if(st===2){c="var(--morado)"; t="J";}
                    lista.innerHTML += `<div class="alumno-fila">
                        <div class="bola-gen ${a.genero}"></div>
                        <div style="flex-grow:1">${a.nombre}</div>
                        <button onclick="marcar(${a.id})" class="btn-check" style="background:${c}">${t}</button>
                        <button onclick="abrirEdicion(${a.id})" class="btn-x" style="color:#f39c12">✏️</button>
                        <button onclick="retirarAlumno(${a.id})" class="btn-x">✖</button>
                    </div>`;
                });
            }
            window.generarReporte911();
        };

        window.marcar = (id) => {
            const f = document.getElementById('fechaSeleccionada').value;
            if(!window.db.asistencias[f]) window.db.asistencias[f]={};
            window.db.asistencias[f][id] = (window.db.asistencias[f][id]+1)%3 || 1;
            window.save();
        };

        window.agregarAlumno = async () => {
            const n = document.getElementById('nom').value.toUpperCase();
            const na = document.getElementById('nac').value;
            if(!n || !na) return alert("Nombre y Nacimiento obligatorios.");
            window.db.alumnos.push({ 
                id: Date.now(), 
                cedula: document.getElementById('ced').value, 
                nombre: n, 
                genero: document.getElementById('gen').value, 
                nacimiento: na, 
                retirado: false, 
                fechaIngreso: document.getElementById('fechaSeleccionada').value 
            });
            await window.save(); document.getElementById('nom').value=""; window.render();
        };

        window.abrirEdicion = (id) => {
            const a = window.db.alumnos.find(x => x.id === id);
            document.getElementById('editId').value = a.id;
            document.getElementById('editNom').value = a.nombre;
            document.getElementById('editGen').value = a.genero;
            document.getElementById('editNac').value = a.nacimiento;
            document.getElementById('modalEdit').style.display = 'flex';
        };

        window.guardarEdicion = async () => {
            const id = parseInt(document.getElementById('editId').value);
            const idx = window.db.alumnos.findIndex(x => x.id === id);
            window.db.alumnos[idx].nombre = document.getElementById('editNom').value.toUpperCase();
            window.db.alumnos[idx].genero = document.getElementById('editGen').value;
            window.db.alumnos[idx].nacimiento = document.getElementById('editNac').value;
            await window.save(); document.getElementById('modalEdit').style.display='none'; window.render();
        };

        window.retirarAlumno = async (id) => {
            if(confirm("¿Retirar estudiante?")){
                const a = window.db.alumnos.find(x=>x.id===id);
                a.retirado=true; a.fechaEgreso=document.getElementById('fechaSeleccionada').value;
                await window.save(); window.render();
            }
        };

        window.toggleFeriado = async () => {
            const f = document.getElementById('fechaSeleccionada').value;
            if(!window.db.feriados) window.db.feriados = [];
            window.db.feriados.includes(f) ? window.db.feriados=window.db.feriados.filter(x=>x!==f) : window.db.feriados.push(f);
            await window.save(); window.render();
        };

        // --- ESTADÍSTICA 911 (DETALLADA) ---
        window.generarReporte911 = () => {
            const activos = (window.db.alumnos || []).filter(a => !a.retirado);
            let eds = {};
            activos.forEach(al => { 
                const e=calcularEdad(al.nacimiento); 
                if(!eds[e]) eds[e]={F:0, M:0}; 
                eds[e][al.genero]++; 
            });
            let tEd = ""; 
            let sumF=0, sumM=0;
            Object.keys(eds).sort((a,b)=>a-b).forEach(e => { 
                tEd += `<tr><td>${e} años</td><td>${eds[e].F}</td><td>${eds[e].M}</td><td>${eds[e].F+eds[e].M}</td></tr>`;
                sumF+=eds[e].F; sumM+=eds[e].M;
            });
            tEd += `<tr class="fila-total"><td>TOTAL</td><td>${sumF}</td><td>${sumM}</td><td>${sumF+sumM}</td></tr>`;
            document.getElementById('output911').innerHTML = `<table class="tabla-admin"><thead><tr><th>Edad</th><th>H</th><th>V</th><th>T</th></tr></thead><tbody>${tEd}</tbody></table>`;
        };

        // --- EXPORTACIONES ---
        window.exportarExcelGeneral = async () => {
            const snap = await getDocs(collection(dbCloud, "docentes_db"));
            const data = [["GRADO", "SECCIÓN", "DOCENTE", "ALUMNO", "GÉNERO", "EDAD", "ESTADO"]];
            snap.forEach(s => {
                if(s.id === USUARIO_ADMIN) return;
                const d = s.data();
                (d.alumnos || []).forEach(a => {
                    data.push([d.grado, d.seccion, d.docente, a.nombre, a.genero, calcularEdad(a.nacimiento), a.retirado ? 'RETIRADO' : 'ACTIVO']);
                });
            });
            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Matricula");
            XLSX.writeFile(wb, "Reporte_General_Lucila.xlsx");
        };

        window.logout = () => location.reload();
        window.onload = () => { 
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('fechaSeleccionada').value = hoy;
        };
    </script>

    <style>
        :root { --azul: #002147; --exito: #28a745; --morado: #6f42c1; --rojo: #dc3545; --oro: #f39c12; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; }
        header { background: var(--azul); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--oro); }
        .container { max-width: 500px; margin: auto; padding: 10px; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        button { font-weight: bold; cursor: pointer; border: none; }
        .alumno-fila { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
        .bola-gen { width: 12px; height: 12px; border-radius: 50%; }
        .bola-gen.F { background: #ff85a2; } .bola-gen.M { background: #3498db; }
        .btn-check { width: 45px; height: 40px; color: white; border-radius: 6px; }
        .btn-x { background: none; border: none; color: var(--rojo); cursor: pointer; width: auto; font-size: 18px; }
        .tabla-admin { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 10px; }
        .tabla-admin th, .tabla-admin td { border: 1px solid #ddd; padding: 6px; text-align: center; }
        .tabla-admin th { background: var(--azul); color: white; }
        .fila-total { background: #f8f9fa; font-weight: bold; }
        .resumen-direccion { background: #eef7ff; padding: 10px; border-radius: 8px; border: 1px solid var(--azul); text-align: center; }
        .aviso-no { text-align: center; color: var(--rojo); padding: 20px; font-weight: bold; border: 2px dashed #ccc; }
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); align-items:center; justify-content:center; z-index:1000; }
        @media print { .no-print { display: none; } .container { max-width: 100%; } }
    </style>
</head>
<body>

<div id="authSection" style="text-align:center; padding: 50px 20px;">
    <img src="https://raw.githubusercontent.com/ebnlucilapalacios-source/asistencia-lucila-palacios./main/IMG_20260225_005025_993.png" width="90">
    <h2 style="color:var(--azul)">EBN LUCILA PALACIOS</h2>
    <div id="loginForm" class="card" style="max-width:350px; margin:auto">
        <input type="text" id="loginUser" placeholder="Usuario">
        <input type="password" id="loginPass" placeholder="Clave">
        <button onclick="login()" style="background:var(--azul); color:white;">ENTRAR</button>
        <p onclick="mostrarRegistro(true)" style="color:var(--morado); cursor:pointer; font-size:12px; margin-top:10px;">Crear cuenta nueva</p>
    </div>
    <div id="registerForm" class="card" style="max-width:350px; margin:auto; display:none;">
        <input type="text" id="regNombre" placeholder="Nombre Docente">
        <div style="display:flex; gap:5px;"><input type="text" id="regGrado" placeholder="Grado"><input type="text" id="regSeccion" placeholder="Sección"></div>
        <select id="regTurno"><option value="Mañana">Mañana</option><option value="Tarde">Tarde</option></select>
        <input type="text" id="regUser" placeholder="Usuario">
        <input type="password" id="regPass" placeholder="Contraseña">
        <input type="password" id="regClaveInst" placeholder="Clave de Institución">
        <button onclick="registrarCuenta()" style="background:var(--exito); color:white;">REGISTRAR</button>
        <p onclick="mostrarRegistro(false)" style="cursor:pointer; font-size:12px;">Volver</p>
    </div>
</div>

<div id="appContent" style="display:none;">
    <header class="no-print">
        <b>LUCILA PALACIOS 2026</b>
        <button onclick="logout()" style="width:auto; background:var(--rojo); color:white; padding:5px 10px; border-radius:5px;">SALIR</button>
    </header>

    <div class="container">
        <div id="adminPanel" class="card no-print" style="display:none; border:2px solid var(--morado);">
            <b style="color:var(--morado)">📊 PANEL DE DIRECCIÓN</b>
            <div style="display:flex; gap:5px; margin-top:10px;">
                <button onclick="consolidadoMensual()" style="background:var(--morado); color:white;">📈 CONSOLIDADO</button>
                <button onclick="exportarExcelGeneral()" style="background:var(--exito); color:white;">📊 EXCEL GRAL</button>
            </div>
            
            <div style="margin-top:15px; padding:10px; background:#fff0f0; border:1px solid var(--rojo); border-radius:8px;">
                <small style="color:var(--rojo)">ELIMINAR DOCENTE POR USUARIO:</small>
                <div style="display:flex; gap:5px;">
                    <input type="text" id="adminDeleteUser" placeholder="Usuario a borrar">
                    <button onclick="eliminarDocente()" style="background:var(--rojo); color:white; width:80px;">BORRAR</button>
                </div>
            </div>
            <div id="adminOutput" style="overflow-x:auto;"></div>
        </div>

        <div class="card no-print">
            <b>Docente:</b> <span id="docenteTxt"></span><br>
            <b>Sección:</b> <span id="gradoSeccionTxt"></span>
            <input type="date" id="fechaSeleccionada" onchange="window.render()" style="border:2px solid var(--azul)">
            <button onclick="toggleFeriado()" style="font-size:10px; background:none; border:1px solid var(--rojo); color:var(--rojo);">🚩 MARCAR COMO FERIADO/NO LABORABLE</button>
        </div>

        <div class="card no-print">
            <h4 style="margin:0 0 10px 0">+ Inscripción de Alumno</h4>
            <input type="text" id="ced" placeholder="Cédula (Opcional)">
            <input type="text" id="nom" placeholder="Nombres y Apellidos">
            <div style="display:flex; gap:5px;">
                <select id="gen" style="width:35%"><option value="F">H</option><option value="M">V</option></select>
                <input type="date" id="nac" style="width:65%">
            </div>
            <button onclick="agregarAlumno()" style="background:var(--exito); color:white;">AGREGAR A MATRÍCULA</button>
        </div>

        <div class="card" id="cardAsistencia">
            <b style="color:var(--azul)">LISTA DE ASISTENCIA</b>
            <div id="listaAsistencia" style="margin-top:10px;"></div>
        </div>

        <div class="card no-print">
            <b>ESTADÍSTICA 911 (POR EDADES):</b>
            <div id="output911"></div>
        </div>
    </div>
</div>

<div id="modalEdit" class="modal">
    <div class="card" style="width:90%; max-width:350px;">
        <h4 style="margin:0 0 10px 0">Editar Estudiante</h4>
        <input type="hidden" id="editId">
        <label>Nombre:</label><input type="text" id="editNom">
        <label>Género:</label><select id="editGen"><option value="F">H</option><option value="M">V</option></select>
        <label>F. Nacimiento:</label><input type="date" id="editNac">
        <div style="display:flex; gap:5px; margin-top:10px;">
            <button onclick="guardarEdicion()" style="background:var(--exito); color:white;">GUARDAR</button>
            <button onclick="document.getElementById('modalEdit').style.display='none'" style="background:var(--rojo); color:white;">CANCELAR</button>
        </div>
    </div>
</div>

</body>
</html>
