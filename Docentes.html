<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA EBN LUCILA PALACIOS - INTEGRAL 2026</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
            authDomain: "control-de-asistencia-d585e.firebaseapp.com",
            projectId: "control-de-asistencia-d585e",
            storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
            appId: "1:368890880546:web:a97ab4372dea536217207b"
        };

        const app = initializeApp(firebaseConfig);
        const dbCloud = getFirestore(app);
        const CLAVE_INST = "LUCILA2026";
        const USUARIO_ADMIN = "admin_lucila";

        window.usuarioActual = null;
        window.db = { docente: "", seccion: "", grado: "", turno: "", alumnos: [], asistencias: {}, feriados: [] };

        // --- UTILIDADES ---
        const calcularEdad = (f) => {
            if(!f) return 0;
            const hoy = new Date();
            const cumple = new Date(f);
            let edad = hoy.getFullYear() - cumple.getFullYear();
            if (hoy.getMonth() < cumple.getMonth() || (hoy.getMonth() === cumple.getMonth() && hoy.getDate() < cumple.getDate())) edad--;
            return edad;
        };

        // --- AUTENTICACIÓN ---
        window.login = async () => {
            const u = document.getElementById('loginUser').value.toLowerCase().trim();
            const p = document.getElementById('loginPass').value;
            const snap = await getDoc(doc(dbCloud, "docentes_db", u));
            if (snap.exists() && snap.data().pass === p) {
                window.usuarioActual = u;
                // Fecha automática al entrar
                const hoy = new Date();
                const offset = hoy.getTimezoneOffset() * 60000;
                document.getElementById('fechaSeleccionada').value = new Date(hoy.getTime() - offset).toISOString().split('T')[0];
                
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                if (u === USUARIO_ADMIN) document.getElementById('adminPanel').style.display = 'block';
                
                onSnapshot(doc(dbCloud, "docentes_db", u), (s) => { 
                    window.db = s.data(); 
                    window.render(); 
                });
            } else alert("Usuario o clave incorrecta");
        };

        window.logout = () => location.reload();

        // --- FUNCIONES DE DIRECCIÓN ---
        window.consolidadoMensual = async () => {
            const fSel = document.getElementById('fechaSeleccionada').value;
            const mesRef = new Date(fSel + "T00:00:00").getMonth();
            const snap = await getDocs(collection(dbCloud, "docentes_db"));
            let h = `<table class="tabla-admin"><thead><tr><th>DOCENTE</th><th>G/S</th><th>MAT</th><th>H</th><th>V</th><th>EFIC %</th></tr></thead><tbody>`;
            snap.forEach(dSnap => {
                if(dSnap.id === USUARIO_ADMIN) return;
                const d = dSnap.data();
                const ac = (d.alumnos || []).filter(a => !a.retirado);
                let sH=0, sV=0, ds=0;
                Object.keys(d.asistencias || {}).forEach(f => {
                    const fo = new Date(f + "T00:00:00");
                    if(fo.getMonth() === mesRef && fo.getDay()!==0 && fo.getDay()!==6 && !d.feriados?.includes(f)) {
                        ds++; ac.forEach(a => { if(d.asistencias[f][a.id] === 1) a.genero === 'F' ? sH++ : sV++; });
                    }
                });
                const ef = ac.length > 0 && ds > 0 ? (((sH+sV)/ds)/ac.length*100).toFixed(0) : 0;
                h += `<tr><td>${d.docente}</td><td>${d.grado}${d.seccion}</td><td>${ac.length}</td><td>${sH}</td><td>${sV}</td><td>${ef}%</td></tr>`;
            });
            document.getElementById('adminOutput').innerHTML = h + "</tbody></table>";
        };

        window.cambiarCredencialesDocente = async () => {
            const oldU = document.getElementById('adminOldUser').value.toLowerCase().trim();
            const newP = document.getElementById('adminNewPass').value;
            if(!oldU || !newP) return alert("Indique usuario y nueva clave");
            await updateDoc(doc(dbCloud, "docentes_db", oldU), { pass: newP });
            alert("Clave actualizada correctamente");
        };

        // --- FUNCIONES DE DOCENTE ---
        window.actualizarPerfil = async () => {
            const nDoc = document.getElementById('editNombreDoc').value.toUpperCase();
            const nGra = document.getElementById('editGradoDoc').value;
            const nSec = document.getElementById('editSeccionDoc').value.toUpperCase();
            await updateDoc(doc(dbCloud, "docentes_db", window.usuarioActual), { docente: nDoc, grado: nGra, seccion: nSec });
            alert("Perfil Actualizado");
        };

        window.agregarAlumno = async () => {
            const n = document.getElementById('nom').value.toUpperCase();
            const c = document.getElementById('cedAlumno').value;
            const na = document.getElementById('nac').value;
            if(!n || !na) return alert("Nombre y Fecha de Nacimiento son obligatorios");
            window.db.alumnos.push({ 
                id: Date.now(), 
                nombre: n, 
                cedula: c, 
                genero: document.getElementById('gen').value, 
                nacimiento: na, 
                retirado: false 
            });
            await window.save();
            document.getElementById('nom').value = ""; document.getElementById('cedAlumno').value = "";
        };

        window.marcar = (id) => {
            const f = document.getElementById('fechaSeleccionada').value;
            if (f > new Date().toISOString().split('T')[0]) return alert("No se puede marcar asistencia futura");
            if(!window.db.asistencias[f]) window.db.asistencias[f]={};
            window.db.asistencias[f][id] = (window.db.asistencias[f][id]+1)%3 || 1;
            window.save();
        };

        window.save = async () => { await setDoc(doc(dbCloud, "docentes_db", window.usuarioActual), window.db); };

        // --- MANTENIMIENTO ---
        window.limpiarMovimientos = async () => {
            if(confirm("¿Borrar todas las asistencias registradas? (La matrícula se mantiene)")){
                window.db.asistencias = {};
                await window.save();
                alert("Asistencias limpiadas.");
            }
        };

        window.vaciarSeccion = async () => {
            const pass = prompt("Escriba la clave institucional para BORRAR TODO (Alumnos y Asistencias):");
            if(pass === CLAVE_INST){
                window.db.alumnos = [];
                window.db.asistencias = {};
                await window.save();
                alert("Sección vaciada.");
            }
        };

        // --- EXPORTACIÓN ---
        window.exportarNombresPDF = () => {
            const { jsPDF } = window.jspdf;
            const docPDF = new jsPDF();
            docPDF.setFontSize(10);
            docPDF.text("REPÚBLICA BOLIVARIANA DE VENEZUELA", 105, 12, { align: "center" });
            docPDF.text("E.B.N. LUCILA PALACIOS", 105, 17, { align: "center" });
            docPDF.setFontSize(14);
            docPDF.text("LISTA DE ESTUDIANTES", 105, 30, { align: "center" });
            const activos = window.db.alumnos.filter(a => !a.retirado).sort((a,b)=>a.nombre.localeCompare(b.nombre));
            const filas = activos.map((a, i) => [i + 1, a.cedula || 'S/C', a.nombre]);
            docPDF.autoTable({ head: [['N°', 'CÉDULA', 'NOMBRE COMPLETO']], body: filas, startY: 35 });
            docPDF.save(`Lista_${window.db.grado}${window.db.seccion}.pdf`);
        };

        window.exportarNombresExcel = () => {
            const activos = window.db.alumnos.filter(a => !a.retirado);
            const data = activos.map(a => ({ "CÉDULA": a.cedula, "NOMBRE": a.nombre, "GÉNERO": a.genero }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Estudiantes");
            XLSX.writeFile(wb, `Nombres_${window.db.grado}${window.db.seccion}.xlsx`);
        };

        // --- RENDER ---
        window.render = () => {
            const fSel = document.getElementById('fechaSeleccionada').value;
            const fObj = new Date(fSel + "T00:00:00");
            const esFeriado = window.db.feriados?.includes(fSel);
            
            document.getElementById('docenteTxt').innerText = window.db.docente || "No asignado";
            document.getElementById('gradoSeccionTxt').innerText = `${window.db.grado || ""} "${window.db.seccion || ""}"`;
            
            const lista = document.getElementById('listaAsistencia');
            lista.innerHTML = "";
            const activos = (window.db.alumnos || []).filter(a => !a.retirado);

            activos.sort((a,b)=>a.nombre.localeCompare(b.nombre)).forEach(a => {
                const st = (window.db.asistencias[fSel] && window.db.asistencias[fSel][a.id]) || 0;
                let c = "#ccc", t = "F"; if(st===1){c="var(--exito)"; t="P";} if(st===2){c="var(--morado)"; t="J";}
                lista.innerHTML += `<div class="alumno-fila">
                    <div class="bola-gen ${a.genero}"></div>
                    <div style="flex-grow:1; font-size:12px;"><b>${a.cedula || ''}</b> ${a.nombre}</div>
                    <button onclick="marcar(${a.id})" class="btn-check" style="background:${c}">${t}</button>
                    <button onclick="abrirEdicionAlumno(${a.id})" class="btn-x">✏️</button>
                </div>`;
            });

            // Lógica de reporte detallado (911)
            let sH=0, sV=0, dsH=0, eds={};
            activos.forEach(al => { const e=calcularEdad(al.nacimiento); if(!eds[e]) eds[e]={F:0, M:0}; eds[e][al.genero]++; });
            Object.keys(window.db.asistencias || {}).forEach(f => {
                const d = new Date(f + "T00:00:00");
                if(d.getMonth() === fObj.getMonth() && d.getDay()!==0 && d.getDay()!==6 && !window.db.feriados?.includes(f)) {
                    dsH++; activos.forEach(a => { if(window.db.asistencias[f][a.id]===1) a.genero==='F'?sH++:sV++; });
                }
            });
            const pH=dsH>0?sH/dsH:0, pV=dsH>0?sV/dsH:0, ef=activos.length>0 && dsH>0 ?(((pH+pV)/activos.length)*100).toFixed(0):0;
            
            let tEd = ""; Object.keys(eds).sort((a,b)=>a-b).forEach(e => { tEd += `<tr><td>${e}a</td><td>${eds[e].F}</td><td>${eds[e].M}</td><td>${eds[e].F+eds[e].M}</td></tr>`; });

            document.getElementById('reporteEstadistico').innerHTML = `
                <div class="card" style="text-align:center;">
                    <h4>Estadística del Mes</h4>
                    <div class="eficiencia-nro">${ef}% <small>Efic.</small></div>
                    <div style="display:flex; justify-content:space-around; font-size:12px;">
                        <div>H: ${(pH).toFixed(1)}</div><div>V: ${(pV).toFixed(1)}</div><div>T: ${(pH+pV).toFixed(1)}</div>
                    </div>
                    <table class="tabla-admin" style="margin-top:10px;">
                        <thead><tr><th>Edad</th><th>H</th><th>V</th><th>T</th></tr></thead>
                        <tbody>${tEd}</tbody>
                    </table>
                </div>`;
        };

        window.abrirEdicionAlumno = (id) => {
            const a = window.db.alumnos.find(x => x.id === id);
            document.getElementById('editAlumId').value = a.id;
            document.getElementById('editAlumNom').value = a.nombre;
            document.getElementById('editAlumCed').value = a.cedula || "";
            document.getElementById('modalEditarAlumno').style.display = 'flex';
        };

        window.guardarEdicionAlumno = async () => {
            const id = parseInt(document.getElementById('editAlumId').value);
            const idx = window.db.alumnos.findIndex(x => x.id === id);
            window.db.alumnos[idx].nombre = document.getElementById('editAlumNom').value.toUpperCase();
            window.db.alumnos[idx].cedula = document.getElementById('editAlumCed').value;
            await window.save();
            document.getElementById('modalEditarAlumno').style.display = 'none';
        };
    </script>

    <style>
        :root { --azul: #002147; --exito: #28a745; --morado: #6f42c1; --rojo: #dc3545; --naranja: #f39c12; --celeste: #e3f2fd; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; color: #333; }
        header { background: var(--azul); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--naranja); }
        .container { max-width: 480px; margin: auto; padding: 10px; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        button { border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; padding: 12px; font-size: 11px; }
        input, select { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .alumno-fila { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
        .bola-gen { width: 12px; height: 12px; border-radius: 50%; }
        .bola-gen.F { background: #ff85a2; } .bola-gen.M { background: #3498db; }
        .btn-check { width: 38px; height: 38px; }
        .eficiencia-nro { font-size: 24px; font-weight: bold; color: var(--azul); margin: 10px 0; }
        .tabla-admin { width: 100%; border-collapse: collapse; font-size: 11px; }
        .tabla-admin th, .tabla-admin td { border: 1px solid #eee; padding: 8px; text-align: center; }
        .admin-box { border: 2px solid var(--morado); background: white; }
    </style>
</head>
<body>

<div id="authSection" style="text-align:center; padding: 60px 20px;">
    <img src="https://raw.githubusercontent.com/ebnlucilapalacios-source/asistencia-lucila-palacios./main/IMG_20260225_005025_993.png" width="90">
    <h2 style="color:var(--azul)">EBN LUCILA PALACIOS</h2>
    <div class="card" style="max-width:320px; margin:auto">
        <input type="text" id="loginUser" placeholder="Usuario">
        <input type="password" id="loginPass" placeholder="Contraseña">
        <button onclick="login()" style="background:var(--azul); width:100%; font-size:14px;">ENTRAR AL SISTEMA</button>
    </div>
</div>

<div id="appContent" style="display:none;">
    <header>
        <b>SISTEMA LUCILA</b>
        <button onclick="logout()" style="background:var(--rojo); padding:6px 12px;">SALIR</button>
    </header>

    <div class="container">
        <div id="adminPanel" class="card admin-box" style="display:none;">
            <b style="font-size:16px;">📊 DIRECCIÓN</b>
            <div class="btn-grid">
                <button onclick="consolidadoMensual()" style="background:var(--morado);">📈 CONSOLIDADO</button>
                <button onclick="alert('Generando PDF Detallado...')" style="background:var(--exito);">📄 LISTA DETALLADA PDF</button>
            </div>
            <button onclick="alert('Exportando Matrícula...')" style="background:#1e8449; width:100%; margin-top:8px;">📗 MATRÍCULA EXCEL GENERAL</button>
            <div class="btn-grid">
                <button onclick="exportarNombresExcel()" style="background:var(--exito);">📥 NOMBRES EXCEL</button>
                <button onclick="exportarNombresPDF()" style="background:var(--rojo);">📄 NOMBRES PDF</button>
            </div>
            <div id="adminOutput"></div>
            
            <hr style="margin:15px 0; border:0; border-top:1px solid #eee;">
            <b style="font-size:13px;">🔐 Cambiar Credenciales</b>
            <input type="text" id="adminOldUser" placeholder="Usuario del docente">
            <input type="password" id="adminNewPass" placeholder="Nueva contraseña">
            <button onclick="cambiarCredencialesDocente()" style="background:var(--morado); width:100%;">ACTUALIZAR CREDENCIALES</button>
        </div>

        <details class="card">
            <summary>⚙️ <b>Editar Perfil del Docente</b></summary>
            <input type="text" id="editNombreDoc" placeholder="Nombre del Docente">
            <div style="display:flex; gap:5px;">
                <input type="text" id="editGradoDoc" placeholder="Grado">
                <input type="text" id="editSeccionDoc" placeholder="Sección">
            </div>
            <button onclick="actualizarPerfil()" style="background:var(--azul); width:100%;">GUARDAR CAMBIOS</button>
        </details>

        <div class="card">
            <b>Docente:</b> <span id="docenteTxt"></span><br>
            <b>Sección:</b> <span id="gradoSeccionTxt"></span>
            <input type="date" id="fechaSeleccionada" onchange="window.render()">
        </div>

        <div class="card">
            <h4 style="margin:0 0 10px 0">+ Inscribir Estudiante</h4>
            <input type="text" id="cedAlumno" placeholder="Cédula Escolar">
            <input type="text" id="nom" placeholder="Apellidos y Nombres">
            <div style="display:flex; gap:5px;">
                <select id="gen" style="width:40%"><option value="F">Hembra</option><option value="M">Varón</option></select>
                <input type="date" id="nac" style="width:60%">
            </div>
            <button onclick="agregarAlumno()" style="background:var(--exito); width:100%; margin-top:8px;">AGREGAR A MATRÍCULA</button>
        </div>

        <div class="card" id="listaAsistencia"></div>
        
        <div id="reporteEstadistico"></div>

        <div class="card">
            <b>Mantenimiento:</b>
            <button onclick="exportarNombresExcel()" style="background:#27ae60; width:100%; margin-top:5px;">📥 EXPORTAR LISTA EXCEL</button>
            <button onclick="limpiarMovimientos()" style="background:var(--naranja); width:100%; margin-top:5px;">🧹 LIMPIAR MOVIMIENTOS</button>
            <button onclick="vaciarSeccion()" style="background:var(--rojo); width:100%; margin-top:5px;">⚠️ VACIAR SECCIÓN COMPLETA</button>
        </div>
    </div>
</div>

<div id="modalEditarAlumno" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:999; align-items:center; justify-content:center;">
    <div class="card" style="width:85%;">
        <h4>Editar Datos</h4>
        <input type="hidden" id="editAlumId">
        <label>Nombre:</label><input type="text" id="editAlumNom">
        <label>Cédula:</label><input type="text" id="editAlumCed">
        <button onclick="guardarEdicionAlumno()" style="background:var(--exito); width:100%;">GUARDAR</button>
        <button onclick="document.getElementById('modalEditarAlumno').style.display='none'" style="background:none; color:red; width:100%; margin-top:10px;">Cancelar</button>
    </div>
</div>

</body>
</html>
