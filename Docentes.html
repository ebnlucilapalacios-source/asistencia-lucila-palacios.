<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA EBN LUCILA PALACIOS - INTEGRAL 2026</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
            authDomain: "control-de-asistencia-d585e.firebaseapp.com",
            projectId: "control-de-asistencia-d585e",
            storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
            appId: "1:368890880546:web:a97ab4372dea536217207b"
        };

        const app = initializeApp(firebaseConfig);
        const dbCloud = getFirestore(app);
        
        const CLAVE_INST = "LUCILA2026";
        const USUARIO_ADMIN = "admin_lucila";

        window.usuarioActual = null;
        window.db = { docente: "", seccion: "", grado: "", turno: "", alumnos: [], asistencias: {}, feriados: [] };

        const calcularEdad = (f) => {
            if(!f) return 0;
            const hoy = new Date();
            const cumple = new Date(f);
            let edad = hoy.getFullYear() - cumple.getFullYear();
            if (hoy.getMonth() < cumple.getMonth() || (hoy.getMonth() === cumple.getMonth() && hoy.getDate() < cumple.getDate())) edad--;
            return edad;
        };

        // --- AUTENTICACIÓN ---
        window.mostrarRegistro = (v) => { 
            document.getElementById('loginForm').style.display = v ? 'none' : 'block';
            document.getElementById('registerForm').style.display = v ? 'block' : 'none';
        };

        window.registrarCuenta = async () => {
            const cI = document.getElementById('regClaveInst').value.trim();
            if(cI !== CLAVE_INST) return alert("❌ Clave Institucional Incorrecta");

            const u = document.getElementById('regUser').value.toLowerCase().trim();
            const p = document.getElementById('regPass').value.trim();
            const n = document.getElementById('regNombre').value.toUpperCase().trim();
            const g = document.getElementById('regGrado').value;
            const s = document.getElementById('regSeccion').value.toUpperCase().trim();
            const t = document.getElementById('regTurno').value;

            if(!u || !p || !n || !g || !s) return alert("⚠️ Rellene todos los campos.");

            try {
                const docRef = doc(dbCloud, "docentes_db", u);
                const snap = await getDoc(docRef);
                if(snap.exists()) return alert("🚫 Este usuario ya está registrado.");

                // IMPORTANTE: Estructura inicial limpia
                await setDoc(docRef, { 
                    docente: n, pass: p, grado: g, seccion: s, turno: t,
                    alumnos: [], asistencias: {}, feriados: [] 
                });
                alert("✅ ¡Cuenta creada! Ahora inicia sesión."); 
                window.mostrarRegistro(false);
            } catch (e) { alert("Error al registrar: " + e.message); }
        };

        window.login = async () => {
            const u = document.getElementById('loginUser').value.toLowerCase().trim();
            const p = document.getElementById('loginPass').value.trim();
            
            if(!u || !p) return alert("Ingrese usuario y clave.");

            try {
                const docRef = doc(dbCloud, "docentes_db", u);
                const snap = await getDoc(docRef);
                
                if (snap.exists() && snap.data().pass === p) {
                    window.usuarioActual = u;
                    document.getElementById('fechaSeleccionada').value = new Date().toISOString().split('T')[0];
                    document.getElementById('authSection').style.display = 'none';
                    document.getElementById('appContent').style.display = 'block';
                    
                    if (u === USUARIO_ADMIN) document.getElementById('adminPanel').style.display = 'block';
                    
                    onSnapshot(docRef, (s) => { 
                        if(s.exists()){ window.db = s.data(); window.render(); }
                    });
                } else { alert("❌ Usuario o clave incorrectos."); }
            } catch (e) { alert("Error de conexión."); }
        };

        // --- SISTEMA ---
        window.save = async () => { 
            if(window.usuarioActual) await setDoc(doc(dbCloud, "docentes_db", window.usuarioActual), window.db); 
        };

        window.agregarAlumno = async () => {
            const c = document.getElementById('ced').value.trim();
            const n = document.getElementById('nom').value.toUpperCase().trim();
            const na = document.getElementById('nac').value;
            if(!n || !na) return alert("Nombre y Fecha de Nacimiento requeridos");
            
            window.db.alumnos.push({ 
                id: Date.now(), cedula: c, nombre: n, genero: document.getElementById('gen').value, 
                nacimiento: na, retirado: false, fechaIngreso: document.getElementById('fechaSeleccionada').value 
            });
            await window.save();
            document.getElementById('ced').value=""; document.getElementById('nom').value="";
        };

        window.marcar = (id) => {
            const f = document.getElementById('fechaSeleccionada').value;
            const hoy = new Date().toISOString().split('T')[0];
            if (f > hoy) return alert("⚠️ No puedes marcar asistencia futura.");
            
            if(!window.db.asistencias[f]) window.db.asistencias[f]={};
            let actual = window.db.asistencias[f][id] || 0;
            window.db.asistencias[f][id] = (actual + 1) % 3; // 0:F, 1:P, 2:J
            window.save();
        };

        window.render = () => {
            const fSel = document.getElementById('fechaSeleccionada').value;
            const fObj = new Date(fSel + "T00:00:00");
            const esFeriado = window.db.feriados?.includes(fSel);
            const esFinde = (fObj.getDay() === 0 || fObj.getDay() === 6);
            
            document.getElementById('docenteTxt').innerText = window.db.docente;
            document.getElementById('gradoSeccionTxt').innerText = `${window.db.grado}° "${window.db.seccion}" - ${window.db.turno}`;
            document.getElementById('btnFeriado').innerText = esFeriado ? "✅ VOLVER LABORABLE" : "🚩 MARCAR FERIADO";

            const lista = document.getElementById('listaAsistencia');
            lista.innerHTML = "";
            const activos = (window.db.alumnos || []).filter(a => !a.retirado);

            if (esFeriado || esFinde) {
                lista.innerHTML = `<div class="aviso-no">🚫 DÍA NO LABORABLE</div>`;
            } else {
                activos.sort((a,b)=>a.nombre.localeCompare(b.nombre)).forEach(a => {
                    const st = window.db.asistencias[fSel]?.[a.id] || 0;
                    const colores = ["#ccc", "var(--exito)", "var(--morado)"];
                    const textos = ["F", "P", "J"];
                    
                    lista.innerHTML += `
                    <div class="alumno-fila">
                        <div class="bola-gen ${a.genero}"></div>
                        <div style="flex-grow:1">${a.nombre} <br><small>${a.cedula || 'S/C'}</small></div>
                        <button onclick="marcar(${a.id})" class="btn-check" style="background:${colores[st]}">${textos[st]}</button>
                    </div>`;
                });
            }
        };

        window.logout = () => location.reload();
    </script>

    <style>
        :root { --azul: #002147; --exito: #28a745; --morado: #6f42c1; --rojo: #dc3545; }
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; }
        header { background: var(--azul); color: white; padding: 15px; display: flex; justify-content: space-between; }
        .container { max-width: 450px; margin: auto; padding: 15px; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        .alumno-fila { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
        .bola-gen { width: 12px; height: 12px; border-radius: 50%; }
        .bola-gen.F { background: #ff85a2; } .bola-gen.M { background: #3498db; }
        .btn-check { width: 45px; height: 45px; border: none; color: white; font-weight: bold; border-radius: 10px; cursor: pointer; }
        .aviso-no { padding: 20px; text-align: center; color: var(--rojo); font-weight: bold; }
    </style>
</head>
<body>

<div id="authSection" style="text-align:center; padding-top: 50px;">
    <img src="https://raw.githubusercontent.com/ebnlucilapalacios-source/asistencia-lucila-palacios./main/IMG_20260225_005025_993.png" width="80">
    <h2>SISTEMA LUCILA 2026</h2>
    
    <div id="loginForm" class="card" style="max-width:320px; margin:auto">
        <input type="text" id="loginUser" placeholder="Usuario">
        <input type="password" id="loginPass" placeholder="Clave">
        <button onclick="login()" style="background:var(--azul); color:white;">ENTRAR</button>
        <p onclick="mostrarRegistro(true)" style="color:var(--morado); cursor:pointer;">Crear Cuenta Nueva</p>
    </div>

    <div id="registerForm" class="card" style="max-width:320px; margin:auto; display:none;">
        <h3>Nuevo Registro</h3>
        <input type="text" id="regNombre" placeholder="Nombre completo">
        <div style="display:flex; gap:5px;">
            <input type="number" id="regGrado" placeholder="Grado">
            <input type="text" id="regSeccion" placeholder="Secc">
        </div>
        <select id="regTurno"><option value="Mañana">Mañana</option><option value="Tarde">Tarde</option></select>
        <input type="text" id="regUser" placeholder="Usuario">
        <input type="password" id="regPass" placeholder="Clave">
        <input type="password" id="regClaveInst" placeholder="Clave Institucional">
        <button onclick="registrarCuenta()" style="background:var(--exito); color:white;">REGISTRAR</button>
        <p onclick="mostrarRegistro(false)" style="cursor:pointer;">Volver</p>
    </div>
</div>

<div id="appContent" style="display:none;">
    <header>
        <span>LUCILA 2026</span>
        <button onclick="logout()" style="width:auto; padding:5px; background:var(--rojo); color:white; border:none; border-radius:4px;">SALIR</button>
    </header>
    <div class="container">
        <div class="card">
            <b>Docente:</b> <span id="docenteTxt"></span><br>
            <b>Sección:</b> <span id="gradoSeccionTxt"></span>
            <input type="date" id="fechaSeleccionada" onchange="window.render()" style="margin-top:10px; border: 2px solid var(--azul)">
            <button id="btnFeriado" onclick="window.db.feriados.push(document.getElementById('fechaSeleccionada').value); window.save();" style="font-size:11px;"></button>
        </div>

        <div class="card">
            <h4 style="margin:0">+ Inscribir Alumno</h4>
            <input type="text" id="ced" placeholder="Cédula">
            <input type="text" id="nom" placeholder="Nombres">
            <div style="display:flex; gap:5px;">
                <select id="gen" style="width:40%"><option value="F">H</option><option value="M">V</option></select>
                <input type="date" id="nac" style="width:60%">
            </div>
            <button onclick="agregarAlumno()" style="background:var(--exito); color:white;">AGREGAR</button>
        </div>

        <div class="card">
            <div id="listaAsistencia"></div>
        </div>
    </div>
</div>

</body>
</html>
