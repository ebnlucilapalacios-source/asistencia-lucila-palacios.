<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA EBN LUCILA PALACIOS - INTEGRAL 2026</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
            authDomain: "control-de-asistencia-d585e.firebaseapp.com",
            projectId: "control-de-asistencia-d585e",
            storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
            appId: "1:368890880546:web:a97ab4372dea536217207b"
        };

        const app = initializeApp(firebaseConfig);
        const dbCloud = getFirestore(app);
        const CLAVE_INST = "LUCILA2026";
        const USUARIO_ADMIN = "admin_lucila";

        window.usuarioActual = null;
        window.db = { docente: "", seccion: "", grado: "", turno: "", alumnos: [], asistencias: {}, feriados: [] };

        const calcularEdad = (f) => {
            if(!f) return 0;
            const hoy = new Date();
            const cumple = new Date(f);
            let edad = hoy.getFullYear() - cumple.getFullYear();
            if (hoy.getMonth() < cumple.getMonth() || (hoy.getMonth() === cumple.getMonth() && hoy.getDate() < cumple.getDate())) edad--;
            return edad;
        };

        // --- ACCESO ---
        window.mostrarRegistro = (v) => { 
            document.getElementById('loginForm').style.display = v ? 'none' : 'block';
            document.getElementById('registerForm').style.display = v ? 'block' : 'none';
        };

        window.registrarCuenta = async () => {
            if(document.getElementById('regClaveInst').value !== CLAVE_INST) return alert("Clave Institucional Incorrecta");
            const u = document.getElementById('regUser').value.toLowerCase().trim();
            await setDoc(doc(dbCloud, "docentes_db", u), { 
                docente: document.getElementById('regNombre').value.toUpperCase(), 
                pass: document.getElementById('regPass').value, 
                grado: document.getElementById('regGrado').value, 
                seccion: document.getElementById('regSeccion').value.toUpperCase(), 
                turno: document.getElementById('regTurno').value,
                alumnos: [], asistencias: {}, feriados: [] 
            });
            alert("Cuenta creada."); window.mostrarRegistro(false);
        };

        window.login = async () => {
            const u = document.getElementById('loginUser').value.toLowerCase().trim();
            const p = document.getElementById('loginPass').value;
            const snap = await getDoc(doc(dbCloud, "docentes_db", u));
            if (snap.exists() && snap.data().pass === p) {
                window.usuarioActual = u;
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                if (u === USUARIO_ADMIN) document.getElementById('adminPanel').style.display = 'block';
                onSnapshot(doc(dbCloud, "docentes_db", u), (s) => { window.db = s.data(); window.render(); });
            } else alert("Acceso denegado");
        };

        // --- ACTUALIZAR PERFIL ---
        window.actualizarPerfil = async () => {
            window.db.docente = document.getElementById('editDocente').value.toUpperCase();
            window.db.grado = document.getElementById('editGrado').value;
            window.db.seccion = document.getElementById('editSeccion').value.toUpperCase();
            window.db.turno = document.getElementById('editTurno').value;
            await window.save();
            alert("Perfil actualizado correctamente");
        };

        // --- DIRECCIÓN (ESTADÍSTICAS Y REPORTES) ---
        window.consolidadoMensual = async () => {
            const fSel = document.getElementById('fechaSeleccionada').value;
            const mesRef = new Date(fSel + "T00:00:00").getMonth();
            const snap = await getDocs(collection(dbCloud, "docentes_db"));
            
            let docentesData = [];
            let listMañana = [];
            let listTarde = [];

            snap.forEach(dSnap => {
                const d = dSnap.data();
                if(dSnap.id !== USUARIO_ADMIN) {
                    docentesData.push(d);
                    const docInfo = `<b>${d.grado}${d.seccion}</b>: ${d.docente}`;
                    if(d.turno === "Mañana") listMañana.push(docInfo);
                    if(d.turno === "Tarde") listTarde.push(docInfo);
                }
            });

            docentesData.sort((a, b) => {
                const gA = parseInt(a.grado) || 0;
                const gB = parseInt(b.grado) || 0;
                if (gA !== gB) return gA - gB;
                return (a.seccion || "").localeCompare(b.seccion || "");
            });

            // Resumen detallado con nombres de docentes
            let h = `
                <div class="resumen-direccion">
                    <div style="text-align:center; font-size:14px; color:var(--azul);"><strong>TOTAL DOCENTES REGISTRADOS: ${docentesData.length}</strong></div>
                    <hr style="border-top:1px solid #3498db; margin:8px 0;">
                    <div style="display:flex; gap:10px; font-size:12px;">
                        <div style="flex:1;">
                            <strong style="color:#e67e22;">☀️ TURNO MAÑANA (${listMañana.length})</strong><br>
                            <div style="margin-top:5px; line-height:1.4;">${listMañana.join('<br>') || 'Ninguno'}</div>
                        </div>
                        <div style="flex:1; border-left:1px solid #ccc; padding-left:10px;">
                            <strong style="color:#2c3e50;">🌙 TURNO TARDE (${listTarde.length})</strong><br>
                            <div style="margin-top:5px; line-height:1.4;">${listTarde.join('<br>') || 'Ninguno'}</div>
                        </div>
                    </div>
                </div>
                <div class="btns-admin-row no-print">
                    <button onclick="descargarPDFAdmin()" class="btn-pdf">💾 GUARDAR PDF</button>
                    <button onclick="window.print()" class="btn-print-admin">🖨️ IMPRIMIR</button>
                </div>
                <table class="tabla-admin" id="tablaAdminConsolidado">
                <thead>
                    <tr><th rowspan="2">DOCENTE</th><th rowspan="2">G/S/T</th><th colspan="3">MATRÍCULA</th><th colspan="2">MOV</th><th colspan="3">PROM. REAL</th><th rowspan="2">% EFIC</th></tr>
                    <tr><th>H</th><th>V</th><th>T</th><th>I</th><th>E</th><th>H</th><th>V</th><th>T</th></tr>
                </thead><tbody>`;
            
            let T = { mH:0, mV:0, mT:0, mI:0, mE:0, pH:0, pV:0, pT:0 };

            docentesData.forEach(d => {
                const alms = d.alumnos || [];
                const ac = alms.filter(a => !a.retirado);
                const mH=ac.filter(a=>a.genero==='F').length, mV=ac.filter(a=>a.genero==='M').length, mT=ac.length;
                
                const mI = alms.filter(a => a.fechaIngreso && new Date(a.fechaIngreso+"T00:00:00").getMonth() === mesRef).length;
                const mE = alms.filter(a => a.retirado && a.fechaEgreso && new Date(a.fechaEgreso+"T00:00:00").getMonth() === mesRef).length;

                let sH=0, sV=0, ds=0;
                Object.keys(d.asistencias || {}).forEach(f => {
                    const fo = new Date(f + "T00:00:00");
                    if(fo.getMonth() === mesRef && fo.getDay()!==0 && fo.getDay()!==6 && !d.feriados?.includes(f)) {
                        ds++; ac.forEach(a => { if(d.asistencias[f][a.id] === 1) a.genero === 'F' ? sH++ : sV++; });
                    }
                });
                const pH=ds>0?sH/ds:0, pV=ds>0?sV/ds:0, pT=pH+pV, ef=mT>0?(pT/mT*100).toFixed(1):0;
                T.mH+=mH; T.mV+=mV; T.mT+=mT; T.mI+=mI; T.mE+=mE; T.pH+=pH; T.pV+=pV; T.pT+=pT;

                h += `<tr><td style="text-align:left">${d.docente}</td><td>${d.grado}${d.seccion} (${d.turno || ''})</td><td>${mH}</td><td>${mV}</td><td>${mT}</td><td>${mI}</td><td>${mE}</td><td>${pH.toFixed(1)}</td><td>${pV.toFixed(1)}</td><td>${pT.toFixed(1)}</td><td>${ef}%</td></tr>`;
            });
            const efG = T.mT>0?(T.pT/T.mT*100).toFixed(1):0;
            h += `<tr class="fila-total"><td>ESCUELA</td><td>-</td><td>${T.mH}</td><td>${T.mV}</td><td>${T.mT}</td><td>${T.mI}</td><td>${T.mE}</td><td>${T.pH.toFixed(1)}</td><td>${T.pV.toFixed(1)}</td><td>${T.pT.toFixed(1)}</td><td>${efG}%</td></tr></tbody></table>`;
            document.getElementById('adminOutput').innerHTML = h;
        };

        window.descargarPDFAdmin = () => {
            const doc = new jspdf.jsPDF('l');
            doc.text("EBN LUCILA PALACIOS - CONSOLIDADO MENSUAL", 14, 15);
            doc.autoTable({ html: '#tablaAdminConsolidado', startY: 22, theme: 'grid', styles: {fontSize: 8} });
            doc.save("Reporte_Direccion_Consolidado.pdf");
        };

        // --- CONSOLIDADO INDIVIDUAL DEL DOCENTE (ALUMNOS) ---
        window.toggleConsolidadoInd = () => {
            const panel = document.getElementById('panelConsolidadoInd');
            if(panel.style.display === 'none') {
                panel.style.display = 'block';
                window.generarConsolidadoIndividual();
            } else {
                panel.style.display = 'none';
            }
        };

        window.generarConsolidadoIndividual = () => {
            const fSel = document.getElementById('fechaSeleccionada').value;
            const mesRef = new Date(fSel + "T00:00:00").getMonth();
            const d = window.db;

            const alms = d.alumnos || [];
            const activos = alms.filter(a => !a.retirado).sort((a,b) => a.nombre.localeCompare(b.nombre));

            // Calcular cuántos días se ha pasado asistencia en este mes (Días hábiles laborados)
            let diasHabiles = 0;
            let diasList = [];
            Object.keys(d.asistencias || {}).forEach(f => {
                const fo = new Date(f + "T00:00:00");
                if(fo.getMonth() === mesRef && fo.getDay() !== 0 && fo.getDay() !== 6 && !d.feriados?.includes(f)) {
                    diasHabiles++;
                    diasList.push(f);
                }
            });

            let h = `<table class="tabla-admin" id="tablaConsolidadoInd">
                 <thead>
                    <tr>
                        <th>N°</th>
                        <th>NOMBRES Y APELLIDOS</th>
                        <th>GÉNERO</th>
                        <th>EDAD</th>
                        <th>DÍAS HÁBILES</th>
                        <th>ASISTENCIAS</th>
                        <th>INASISTENCIAS</th>
                        <th>% ASIST.</th>
                    </tr>
                 </thead><tbody>`;

            if (activos.length === 0) {
                h += `<tr><td colspan="8">No hay alumnos registrados en esta sección.</td></tr>`;
            } else {
                activos.forEach((a, index) => {
                    let asis = 0;
                    diasList.forEach(f => {
                        if (d.asistencias[f] && d.asistencias[f][a.id] === 1) {
                            asis++;
                        }
                    });
                    
                    let inas = diasHabiles - asis; 
                    let porc = diasHabiles > 0 ? ((asis / diasHabiles) * 100).toFixed(1) : 0;
                    let genero = a.genero === 'F' ? 'H' : 'V';
                    let edad = calcularEdad(a.nacimiento);

                    h += `<tr>
                        <td>${index + 1}</td>
                        <td style="text-align:left">${a.nombre}</td>
                        <td>${genero}</td>
                        <td>${edad}</td>
                        <td>${diasHabiles}</td>
                        <td style="color:var(--exito); font-weight:bold;">${asis}</td>
                        <td style="color:var(--rojo); font-weight:bold;">${inas}</td>
                        <td>${porc}%</td>
                    </tr>`;
                });
            }

            h += `</tbody></table>`;
            document.getElementById('salidaConsolidadoInd').innerHTML = h;
        };

        window.exportarConsolidadoIndPDF = () => {
            const { jsPDF } = window.jspdf;
            const docPDF = new jsPDF('p'); // Formato vertical para lista de estudiantes
            docPDF.setFontSize(14);
            const fSel = document.getElementById('fechaSeleccionada').value;
            const mesObj = new Date(fSel + "T00:00:00");
            const meses = ["ENERO", "FEBRERO", "MARZO", "ABRIL", "MAYO", "JUNIO", "JULIO", "AGOSTO", "SEPTIEMBRE", "OCTUBRE", "NOVIEMBRE", "DICIEMBRE"];
            const mesStr = meses[mesObj.getMonth()] + " " + mesObj.getFullYear();
            
            docPDF.text("EBN LUCILA PALACIOS - CONSOLIDADO DE ASISTENCIA POR ESTUDIANTE", 105, 15, { align: "center" });
            docPDF.setFontSize(10);
            docPDF.text(`MES: ${mesStr} | DOCENTE: ${window.db.docente || ''} | GRADO Y SECCIÓN: ${window.db.grado || ''}${window.db.seccion || ''} | TURNO: ${window.db.turno || ''}`, 14, 22);
            
            docPDF.autoTable({ 
                html: '#tablaConsolidadoInd', 
                startY: 28, 
                theme: 'grid', 
                styles: {fontSize: 9}, 
                headStyles: {fillColor:[0,33,71]} 
            });
            docPDF.save(`Consolidado_Alumnos_${window.db.grado}${window.db.seccion}_${mesStr}.pdf`);
        };

        // --- FUNCIONES DE EXPORTAR GENERALES ---
        window.descargarListaEstudiantesPDF = async () => {
            const { jsPDF } = window.jspdf;
            const docPDF = new jsPDF();
            const snap = await getDocs(collection(dbCloud, "docentes_db"));
            let docentesData = [];
            snap.forEach(dSnap => { if(dSnap.id !== USUARIO_ADMIN) docentesData.push(dSnap.data()); });

            docentesData.sort((a, b) => {
                if (parseInt(a.grado) !== parseInt(b.grado)) return parseInt(a.grado) - parseInt(b.grado);
                return (a.seccion || "").localeCompare(b.seccion || "");
            });

            docPDF.setFontSize(16);
            docPDF.text("LISTADO GENERAL DE ESTUDIANTES - LUCILA PALACIOS", 105, 15, { align: "center" });

            let yPos = 25;
            docentesData.forEach(d => {
                const activos = (d.alumnos || []).filter(a => !a.retirado);
                if (activos.length === 0) return;

                const hembras = activos.filter(a => a.genero === 'F').sort((a,b)=>a.nombre.localeCompare(b.nombre));
                const varones = activos.filter(a => a.genero === 'M').sort((a,b)=>a.nombre.localeCompare(b.nombre));
                const filas = [];
                hembras.forEach((a, i) => filas.push([i+1, a.nombre, "HEMBRA", calcularEdad(a.nacimiento)]));
                varones.forEach((a, i) => filas.push([i+1, a.nombre, "VARÓN", calcularEdad(a.nacimiento)]));

                docPDF.autoTable({
                    head: [[{content: `GRADO: ${d.grado}${d.seccion} | DOCENTE: ${d.docente}`, colSpan: 4, styles: {fillColor:[0,33,71]}}], ['N°', 'NOMBRE', 'GÉNERO', 'EDAD']],
                    body: filas, startY: yPos, theme: 'grid', styles: {fontSize: 8}, headStyles: {fillColor:[52,73,94]}, margin: {bottom: 10}
                });
                yPos = docPDF.lastAutoTable.finalY + 10;
                if(yPos > 270) { docPDF.addPage(); yPos = 20; }
            });
            docPDF.save("Lista_Estudiantes_Lucila.pdf");
        };

        window.exportarExcelGeneral = async () => {
            const snap = await getDocs(collection(dbCloud, "docentes_db"));
            const data = [["GRADO", "SECCIÓN", "TURNO", "DOCENTE", "ESTUDIANTE", "GÉNERO", "EDAD"]];
            let list = [];
            snap.forEach(s => { if(s.id !== USUARIO_ADMIN) list.push(s.data()); });
            list.sort((a,b)=> (parseInt(a.grado)-parseInt(b.grado)) || a.seccion.localeCompare(b.seccion));

            list.forEach(d => {
                const alms = (d.alumnos || []).filter(a => !a.retirado);
                const sorted = [...alms.filter(a=>a.genero==='F').sort((a,b)=>a.nombre.localeCompare(b.nombre)), ...alms.filter(a=>a.genero==='M').sort((a,b)=>a.nombre.localeCompare(b.nombre))];
                sorted.forEach(a => data.push([d.grado, d.seccion, d.turno, d.docente, a.nombre, a.genero==='F'?'HEMBRA':'VARÓN', calcularEdad(a.nacimiento)]));
            });

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(data);
            XLSX.utils.book_append_sheet(wb, ws, "Matrícula");
            XLSX.writeFile(wb, "Matricula_Lucila_Palacios_2026.xlsx");
        };

        window.exportarNombresBasico = async (formato, esAdmin) => {
            let listaDocentes = [];

            if (esAdmin) {
                const snap = await getDocs(collection(dbCloud, "docentes_db"));
                snap.forEach(s => {
                    if (s.id !== USUARIO_ADMIN) listaDocentes.push(s.data());
                });
                listaDocentes.sort((a,b) => (parseInt(a.grado) - parseInt(b.grado)) || (a.seccion || "").localeCompare(b.seccion || ""));
            } else {
                if (!window.db || !window.db.alumnos || window.db.alumnos.length === 0) return alert("No hay datos de alumnos cargados.");
                listaDocentes.push(window.db);
            }

            if (formato === 'excel') {
                const dataExcel = [];
                listaDocentes.forEach(d => {
                    const activos = (d.alumnos || []).filter(a => !a.retirado).sort((a,b)=>a.nombre.localeCompare(b.nombre));
                    if (activos.length === 0) return;
                    
                    dataExcel.push([`GRADO: ${d.grado || ''} | SECCIÓN: ${d.seccion || ''} | DOCENTE: ${d.docente || ''}`]);
                    dataExcel.push(["N°", "NOMBRE DEL ESTUDIANTE"]);
                    
                    activos.forEach((a, i) => dataExcel.push([i + 1, a.nombre]));
                    dataExcel.push([]); 
                });

                if(dataExcel.length === 0) return alert("No hay alumnos activos para exportar.");

                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.aoa_to_sheet(dataExcel);
                XLSX.utils.book_append_sheet(wb, ws, "Nombres");
                XLSX.writeFile(wb, esAdmin ? "Lista_Nombres_General.xlsx" : `Lista_Nombres_${window.db.grado}${window.db.seccion}.xlsx`);
            } 
            else if (formato === 'pdf') {
                const { jsPDF } = window.jspdf;
                const docPDF = new jsPDF();
                docPDF.setFontSize(14);
                docPDF.text("LISTA DE ESTUDIANTES (NOMBRES) - LUCILA PALACIOS", 105, 15, { align: "center" });

                let yPos = 25;
                let hayDatos = false;
                
                listaDocentes.forEach(d => {
                    const activos = (d.alumnos || []).filter(a => !a.retirado).sort((a,b)=>a.nombre.localeCompare(b.nombre));
                    if (activos.length === 0) return;
                    hayDatos = true;

                    const filas = activos.map((a, i) => [i + 1, a.nombre]);
