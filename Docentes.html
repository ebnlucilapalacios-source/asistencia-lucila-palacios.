<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA INTEGRAL - EBN LUCILA PALACIOS</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
            authDomain: "control-de-asistencia-d585e.firebaseapp.com",
            projectId: "control-de-asistencia-d585e",
            storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
            appId: "1:368890880546:web:a97ab4372dea536217207b"
        };

        const app = initializeApp(firebaseConfig);
        const dbCloud = getFirestore(app);
        const CLAVE_INST = "LUCILA2026";
        const USUARIO_ADMIN = "admin_lucila";

        window.usuarioActual = null;
        window.db = { docente: "", seccion: "", grado: "", turno: "", alumnos: [], asistencias: {}, feriados: [] };

        const calcularEdad = (f) => {
            if(!f) return 0;
            const hoy = new Date();
            const cumple = new Date(f);
            let edad = hoy.getFullYear() - cumple.getFullYear();
            if (hoy.getMonth() < cumple.getMonth() || (hoy.getMonth() === cumple.getMonth() && hoy.getDate() < cumple.getDate())) edad--;
            return edad;
        };

        // --- AUTENTICACIÓN ---
        window.mostrarRegistro = (v) => { 
            document.getElementById('loginForm').style.display = v ? 'none' : 'block';
            document.getElementById('registerForm').style.display = v ? 'block' : 'none';
        };

        window.registrarCuenta = async () => {
            if(document.getElementById('regClaveInst').value !== CLAVE_INST) return alert("Clave Institucional Incorrecta");
            const u = document.getElementById('regUser').value.toLowerCase().trim();
            await setDoc(doc(dbCloud, "docentes_db", u), { 
                docente: document.getElementById('regNombre').value.toUpperCase(), 
                pass: document.getElementById('regPass').value, 
                grado: document.getElementById('regGrado').value, 
                seccion: document.getElementById('regSeccion').value.toUpperCase(), 
                turno: document.getElementById('regTurno').value,
                alumnos: [], asistencias: {}, feriados: [] 
            });
            alert("Cuenta registrada."); window.mostrarRegistro(false);
        };

        window.login = async () => {
            const u = document.getElementById('loginUser').value.toLowerCase().trim();
            const p = document.getElementById('loginPass').value;
            const snap = await getDoc(doc(dbCloud, "docentes_db", u));
            if (snap.exists() && snap.data().pass === p) {
                window.usuarioActual = u;
                document.getElementById('fechaSeleccionada').value = new Date().toISOString().split('T')[0];
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                if (u === USUARIO_ADMIN) document.getElementById('adminPanel').style.display = 'block';
                onSnapshot(doc(dbCloud, "docentes_db", u), (s) => { window.db = s.data(); window.render(); });
            } else { alert("Usuario o clave incorrecta"); }
        };

        // --- PANEL DIRECCIÓN ---
        window.eliminarUsuarioDireccion = async (id) => {
            if(id === USUARIO_ADMIN) return;
            if(confirm(`¿Desea ELIMINAR permanentemente la cuenta: ${id}?`)) {
                await deleteDoc(doc(dbCloud, "docentes_db", id));
                window.consolidadoMensual();
            }
        };

        window.consolidadoMensual = async () => {
            const fSel = document.getElementById('fechaSeleccionada').value;
            const mesRef = new Date(fSel + "T00:00:00").getMonth();
            const snap = await getDocs(collection(dbCloud, "docentes_db"));
            let gestionH = "", statsH = "";
            let T = { mH:0, mV:0, mT:0, mI:0, mE:0, pH:0, pV:0, pT:0 };
            const excluidos = ["ANGEL FIGUERA", "JUSTINA FERNANDEZ", "YUBIRY MARTINEZ", "LEOSMARY LOROÑO"];

            let listaDocentes = [];
            snap.forEach(s => { if(s.id !== USUARIO_ADMIN) { let d = s.data(); d.idLogin = s.id; listaDocentes.push(d); } });
            listaDocentes.sort((a,b) => (parseInt(a.grado)||0) - (parseInt(b.grado)||0) || a.seccion.localeCompare(b.seccion));

            listaDocentes.forEach(d => {
                const nom = d.docente.toUpperCase();
                const esEspecialista = excluidos.some(e => nom.includes(e)) || nom.includes("ESPECIALISTA");

                // Fila Gestión
                gestionH += `<tr><td>${d.idLogin}</td><td style="text-align:left">${d.docente}</td><td>${d.grado}${d.seccion}</td><td><button onclick="eliminarUsuarioDireccion('${d.idLogin}')" class="btn-x">🗑️</button></td></tr>`;

                // Fila Estadística (si no es especialista)
                if(!esEspecialista) {
                    const alms = d.alumnos || [];
                    const ac = alms.filter(a => !a.retirado);
                    const mH=ac.filter(a=>a.genero==='F').length, mV=ac.filter(a=>a.genero==='M').length, mT=ac.length;
                    const mI = alms.filter(a => a.fechaIngreso && new Date(a.fechaIngreso+"T00:00:00").getMonth() === mesRef).length;
                    const mE = alms.filter(a => a.retirado && a.fechaEgreso && new Date(a.fechaEgreso+"T00:00:00").getMonth() === mesRef).length;
                    let sH=0, sV=0, ds=0;
                    Object.keys(d.asistencias || {}).forEach(f => {
                        const fo = new Date(f + "T00:00:00");
                        if(fo.getMonth() === mesRef && fo.getDay()!==0 && fo.getDay()!==6 && !d.feriados?.includes(f)) {
                            ds++; ac.forEach(a => { if(d.asistencias[f][a.id] === 1) a.genero === 'F' ? sH++ : sV++; });
                        }
                    });
                    const pH=ds>0?sH/ds:0, pV=ds>0?sV/ds:0, pT=pH+pV, ef=mT>0?(pT/mT*100).toFixed(1):0;
                    T.mH+=mH; T.mV+=mV; T.mT+=mT; T.mI+=mI; T.mE+=mE; T.pH+=pH; T.pV+=pV; T.pT+=pT;
                    statsH += `<tr><td style="text-align:left">${d.docente}</td><td>${d.grado}${d.seccion}</td><td>${mH}</td><td>${mV}</td><td>${mT}</td><td>${mI}</td><td>${mE}</td><td>${pH.toFixed(1)}</td><td>${pV.toFixed(1)}</td><td>${pT.toFixed(1)}</td><td>${ef}%</td></tr>`;
                }
            });

            document.getElementById('adminOutput').innerHTML = `
                <div class="resumen-direccion">
                    <strong style="color:var(--morado)">👥 GESTIÓN DE CUENTAS</strong>
                    <table class="tabla-admin"><thead><tr><th>USER</th><th>DOCENTE</th><th>G/S</th><th>X</th></tr></thead><tbody>${gestionH}</tbody></table>
                    <hr>
                    <strong style="color:var(--azul)">📈 CONSOLIDADO MENSUAL</strong>
                    <table class="tabla-admin" id="tablaAdminConsolidado">
                        <thead>
                            <tr><th rowspan="2">DOCENTE</th><th rowspan="2">G/S</th><th colspan="3">MATRÍCULA</th><th colspan="2">MOV</th><th colspan="3">PROM. REAL</th><th rowspan="2">%</th></tr>
                            <tr><th>H</th><th>V</th><th>T</th><th>I</th><th>E</th><th>H</th><th>V</th><th>T</th></tr>
                        </thead><tbody>${statsH}</tbody>
                        <tr class="fila-total"><td>ESCUELA</td><td>-</td><td>${T.mH}</td><td>${T.mV}</td><td>${T.mT}</td><td>${T.mI}</td><td>${T.mE}</td><td>${T.pH.toFixed(1)}</td><td>${T.pV.toFixed(1)}</td><td>${T.pT.toFixed(1)}</td><td>${(T.mT>0?(T.pT/T.mT*100):0).toFixed(1)}%</td></tr>
                    </table>
                </div>`;
        };

        // --- ASISTENCIA MENSUAL DETALLADA (31 DÍAS) ---
        window.toggleReporteMensual = () => {
            const p = document.getElementById('panelMensualDetalle');
            p.style.display = p.style.display === 'none' ? 'block' : 'none';
            if(p.style.display === 'block') window.generarCuadriculaMensual();
        };

        window.generarCuadriculaMensual = () => {
            const fSel = document.getElementById('fechaSeleccionada').value;
            const fechaObj = new Date(fSel + "T00:00:00");
            const mes = fechaObj.getMonth(), anio = fechaObj.getFullYear();
            const diasMes = new Date(anio, mes + 1, 0).getDate();
            const activos = window.db.alumnos.filter(a => !a.retirado).sort((a,b)=>a.nombre.localeCompare(b.nombre));

            let h = `<table class="tabla-mensual" id="tablaMes"><thead><tr><th>ESTUDIANTE</th>`;
            for(let i=1; i<=diasMes; i++) h += `<th>${i}</th>`;
            h += `<th>T.P</th></tr></thead><tbody>`;

            activos.forEach(a => {
                let tp = 0;
                h += `<tr><td style="text-align:left; font-size:9px;">${a.nombre}</td>`;
                for(let i=1; i<=diasMes; i++){
                    const f = `${anio}-${String(mes+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                    const st = window.db.asistencias[f]?.[a.id];
                    let txt = ""; 
                    if(st===1){ txt="P"; tp++; } else if(st===2) { txt="J"; }
                    h += `<td>${txt}</td>`;
                }
                h += `<td>${tp}</td></tr>`;
            });
            h += `</tbody></table>`;
            document.getElementById('salidaMensual').innerHTML = h;
        };

        // --- FUNCIONES CORE ---
        window.render = () => {
            const fSel = document.getElementById('fechaSeleccionada').value;
            const esFeriado = window.db.feriados?.includes(fSel);
            const diaSemana = new Date(fSel + "T00:00:00").getDay();
            const esFinde = (diaSemana === 0 || diaSemana === 6);
            
            document.getElementById('docenteTxt').innerText = window.db.docente;
            document.getElementById('gradoSeccionTxt').innerText = `${window.db.grado}${window.db.seccion} - ${window.db.turno}`;
            document.getElementById('btnFeriado').innerText = esFeriado ? "✅ MARCAR COMO HÁBIL" : "🚩 MARCAR COMO FERIADO";

            const lista = document.getElementById('listaAsistencia');
            lista.innerHTML = "";
            const activos = window.db.alumnos.filter(a => !a.retirado).sort((a,b)=>a.nombre.localeCompare(b.nombre));

            if(esFeriado || esFinde) {
                lista.innerHTML = `<div class="aviso-no">🚫 DÍA NO LABORABLE</div>`;
            } else {
                activos.forEach(a => {
                    const st = window.db.asistencias[fSel]?.[a.id] || 0;
                    let c = "#ccc", t = "F"; if(st===1){c="var(--exito)"; t="P";} if(st===2){c="var(--morado)"; t="J";}
                    lista.innerHTML += `<div class="alumno-fila">
                        <div class="bola-gen ${a.genero}"></div>
                        <div style="flex-grow:1; font-size:13px;">${a.nombre}</div>
                        <button onclick="marcarAsistencia(${a.id})" class="btn-check" style="background:${c}">${t}</button>
                        <button onclick="abrirEdicion(${a.id})" class="btn-x" style="color:#f39c12">✏️</button>
                        <button onclick="retirarAlumno(${a.id})" class="btn-x">✖</button>
                    </div>`;
                });
            }
            window.generarEstadistica911(activos, fSel);
        };

        window.generarEstadistica911 = (activos, fSel) => {
            const fObj = new Date(fSel + "T00:00:00");
            let eds = {}; 
            activos.forEach(al => { const e=calcularEdad(al.nacimiento); if(!eds[e]) eds[e]={F:0, M:0}; eds[e][al.genero]++; });
            
            let tEd = ""; Object.keys(eds).sort((a,b)=>a-b).forEach(e => {
                tEd += `<tr><td>${e}a</td><td>${eds[e].F}</td><td>${eds[e].M}</td><td>${eds[e].F+eds[e].M}</td></tr>`;
            });

            document.getElementById('reporteDocente').innerHTML = `
                <div class="reporte-card">
                    <h3 style="margin:0; font-size:14px; color:var(--azul);">CUADRO 911 (EDADES)</h3>
                    <table class="tabla-911"><thead><tr><th>Edad</th><th>H</th><th>V</th><th>T</th></tr></thead><tbody>${tEd}</tbody>
                    <tfoot><tr style="background:#eee"><td>TOTAL</td><td>${activos.filter(a=>a.genero==='F').length}</td><td>${activos.filter(a=>a.genero==='M').length}</td><td>${activos.length}</td></tr></tfoot></table>
                </div>`;
        };

        window.marcarAsistencia = (id) => {
            const f = document.getElementById('fechaSeleccionada').value;
            if(!window.db.asistencias[f]) window.db.asistencias[f] = {};
            window.db.asistencias[f][id] = (window.db.asistencias[f][id] + 1) % 3 || 1;
            window.save();
        };

        window.agregarAlumno = async () => {
            const n = document.getElementById('nom').value.toUpperCase();
            const na = document.getElementById('nac').value;
            if(!n || !na) return alert("Faltan datos");
            window.db.alumnos.push({ id: Date.now(), cedula: document.getElementById('ced').value, nombre: n, genero: document.getElementById('gen').value, nacimiento: na, retirado: false, fechaIngreso: document.getElementById('fechaSeleccionada').value });
            await window.save(); document.getElementById('nom').value="";
        };

        window.retirarAlumno = async (id) => {
            if(confirm("¿Retirar estudiante?")) {
                const a = window.db.alumnos.find(x => x.id === id);
                if(a) { a.retirado = true; a.fechaEgreso = document.getElementById('fechaSeleccionada').value; await window.save(); }
            }
        };

        window.toggleFeriado = async () => {
            const f = document.getElementById('fechaSeleccionada').value;
            if(!window.db.feriados) window.db.feriados = [];
            window.db.feriados.includes(f) ? window.db.feriados = window.db.feriados.filter(x => x!==f) : window.db.feriados.push(f);
            await window.save();
        };

        window.abrirEdicion = (id) => {
            const a = window.db.alumnos.find(x => x.id === id);
            document.getElementById('editId').value = a.id;
            document.getElementById('editNom').value = a.nombre;
            document.getElementById('editCed').value = a.cedula || "";
            document.getElementById('editNac').value = a.nacimiento;
            document.getElementById('editGen').value = a.genero;
            document.getElementById('modalEdit').style.display = 'flex';
        };

        window.guardarEdicion = async () => {
            const idx = window.db.alumnos.findIndex(x => x.id === parseInt(document.getElementById('editId').value));
            window.db.alumnos[idx].nombre = document.getElementById('editNom').value.toUpperCase();
            window.db.alumnos[idx].cedula = document.getElementById('editCed').value;
            window.db.alumnos[idx].nacimiento = document.getElementById('editNac').value;
            window.db.alumnos[idx].genero = document.getElementById('editGen').value;
            await window.save(); document.getElementById('modalEdit').style.display = 'none';
        };

        window.save = async () => { await setDoc(doc(dbCloud, "docentes_db", window.usuarioActual), window.db); };
        window.logout = () => location.reload();

        // --- EXPORTACIONES ---
        window.descargarPDFConsolidado = () => {
            const doc = new jspdf.jsPDF('l');
            doc.text("CONSOLIDADO DIRECCION - LUCILA PALACIOS", 14, 15);
            doc.autoTable({ html: '#tablaAdminConsolidado', startY: 22, theme: 'grid', styles: {fontSize: 7} });
            doc.save("Consolidado_Mensual.pdf");
        };
    </script>

    <style>
        :root { --azul: #002147; --exito: #28a745; --morado: #6f42c1; --rojo: #dc3545; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; padding-bottom: 50px; }
        header { background: var(--azul); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #f39c12; }
        .container { max-width: 500px; margin: auto; padding: 10px; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .tabla-admin, .tabla-911, .tabla-mensual { width: 100%; border-collapse: collapse; font-size: 10px; margin-top: 10px; }
        .tabla-admin th, .tabla-911 th, .tabla-mensual th { background: var(--azul); color: white; padding: 5px; border: 1px solid #ddd; }
        .tabla-admin td, .tabla-911 td, .tabla-mensual td { border: 1px solid #ddd; padding: 5px; text-align: center; }
        .tabla-mensual td { padding: 2px; font-size: 8px; }
        .alumno-fila { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
        .bola-gen { width: 12px; height: 12px; border-radius: 50%; }
        .bola-gen.F { background: #ff85a2; } .bola-gen.M { background: #3498db; }
        .btn-check { width: 38px; height: 38px; border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-x { background: none; border: none; cursor: pointer; font-size: 16px; }
        .full-btn { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        input, select { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .aviso-no { text-align: center; padding: 30px; color: var(--rojo); font-weight: bold; background: #fff5f5; border-radius: 10px; }
        #modalEdit { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:none; justify-content:center; align-items:center; z-index:1000; }
        @media print { .no-print { display: none !important; } .container { max-width: 100%; } }
    </style>
</head>
<body>

<div id="authSection" style="text-align:center; padding: 50px 20px;">
    <img src="https://raw.githubusercontent.com/ebnlucilapalacios-source/asistencia-lucila-palacios./main/IMG_20260225_005025_993.png" width="100" style="margin-bottom:10px;">
    <h2 style="color:var(--azul)">EBN LUCILA PALACIOS</h2>
    
    <div id="loginForm" class="card" style="max-width:320px; margin:auto">
        <input type="text" id="loginUser" placeholder="Usuario">
        <input type="password" id="loginPass" placeholder="Clave">
        <button class="full-btn" onclick="login()" style="background:var(--azul); color:white;">ENTRAR</button>
        <p onclick="mostrarRegistro(true)" style="color:var(--morado); cursor:pointer; font-size:12px; margin-top:15px;">Crear Cuenta Nueva</p>
    </div>

    <div id="registerForm" class="card" style="max-width:320px; margin:auto; display:none;">
        <input type="text" id="regNombre" placeholder="Nombre Docente">
        <div style="display:flex; gap:5px;"><input type="text" id="regGrado" placeholder="Grado"><input type="text" id="regSeccion" placeholder="Secc"></div>
        <select id="regTurno"><option value="Mañana">Mañana</option><option value="Tarde">Tarde</option></select>
        <input type="text" id="regUser" placeholder="Usuario Login">
        <input type="password" id="regPass" placeholder="Contraseña">
        <input type="password" id="regClaveInst" placeholder="Clave Institucional">
        <button class="full-btn" onclick="registrarCuenta()" style="background:var(--exito); color:white;">REGISTRAR</button>
        <p onclick="mostrarRegistro(false)" style="cursor:pointer; font-size:12px;">Volver</p>
    </div>
</div>

<div id="appContent" style="display:none;">
    <header class="no-print">
        <b style="font-size:14px;">SISTEMA LUCILA 2026</b>
        <button onclick="logout()" style="background:var(--rojo); color:white; border:none; padding:6px 12px; border-radius:6px; font-size:11px;">SALIR</button>
    </header>

    <div class="container">
        
        <div id="adminPanel" class="card no-print" style="display:none; border:2px solid var(--morado)">
            <b style="color:var(--morado)">⚙️ DIRECCIÓN Y ESTADÍSTICA</b>
            <button onclick="consolidadoMensual()" class="full-btn" style="background:var(--morado); color:white;">📊 CARGAR GESTIÓN Y CONSOLIDADO</button>
            <button onclick="descargarPDFConsolidado()" class="full-btn" style="background:#e74c3c; color:white; font-size:12px;">💾 DESCARGAR CONSOLIDADO PDF</button>
            <div id="adminOutput"></div>
        </div>

        <div class="card">
            <b>Docente:</b> <span id="docenteTxt"></span><br>
            <b>Sección:</b> <span id="gradoSeccionTxt"></span>
            <input type="date" id="fechaSeleccionada" onchange="window.render()" style="margin-top:10px; font-size:16px;">
            <button id="btnFeriado" onclick="toggleFeriado()" class="full-btn" style="background:white; color:var(--rojo); border:1px solid var(--rojo); padding:8px; font-size:11px;"></button>
        </div>

        <div class="card no-print">
            <h4 style="margin:0 0 10px 0">+ Inscripción de Estudiante</h4>
            <input type="text" id="ced" placeholder="Cédula / Escolar">
            <input type="text" id="nom" placeholder="Nombres y Apellidos">
            <div style="display:flex; gap:5px;">
                <select id="gen" style="width:40%"><option value="F">Hembra</option><option value="M">Varón</option></select>
                <input type="date" id="nac" style="width:60%">
            </div>
            <button onclick="agregarAlumno()" class="full-btn" style="background:var(--exito); color:white;">INSCRIBIR ESTUDIANTE</button>
        </div>

        <div class="card">
            <div id="listaAsistencia"></div>
        </div>

        <div id="reporteDocente"></div>

        <div class="card no-print">
            <button onclick="toggleReporteMensual()" class="full-btn" style="background:var(--azul); color:white;">📅 VER ASISTENCIA DEL MES (31 DÍAS)</button>
            <div id="panelMensualDetalle" style="display:none; overflow-x:auto;">
                <button onclick="window.print()" class="full-btn" style="background:#34495e; color:white; font-size:11px;">🖨️ IMPRIMIR ASISTENCIA</button>
                <div id="salidaMensual"></div>
            </div>
        </div>

    </div>
</div>

<div id="modalEdit">
    <div class="card" style="width:90%; max-width:350px;">
        <h3>Editar Estudiante</h3>
        <input type="hidden" id="editId">
        <input type="text" id="editNom" placeholder="Nombre">
        <input type="text" id="editCed" placeholder="Cédula">
        <input type="date" id="editNac">
        <select id="editGen"><option value="F">Hembra</option><option value="M">Varón</option></select>
