<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA EBN LUCILA PALACIOS - INTEGRAL 2026</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
            authDomain: "control-de-asistencia-d585e.firebaseapp.com",
            projectId: "control-de-asistencia-d585e",
            storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
            appId: "1:368890880546:web:a97ab4372dea536217207b"
        };

        const app = initializeApp(firebaseConfig);
        const dbCloud = getFirestore(app);
        
        // Constantes de Sistema
        const CLAVE_INST = "LUCILA2026";
        const USUARIO_ADMIN = "admin_lucila";

        window.usuarioActual = null;
        window.db = { docente: "", seccion: "", grado: "", turno: "", alumnos: [], asistencias: {}, feriados: [] };

        const calcularEdad = (f) => {
            if(!f) return 0;
            const hoy = new Date();
            const cumple = new Date(f);
            let edad = hoy.getFullYear() - cumple.getFullYear();
            if (hoy.getMonth() < cumple.getMonth() || (hoy.getMonth() === cumple.getMonth() && hoy.getDate() < cumple.getDate())) edad--;
            return edad;
        };

        // --- ACCESO Y SEGURIDAD ---
        window.mostrarRegistro = (v) => { 
            document.getElementById('loginForm').style.display = v ? 'none' : 'block';
            document.getElementById('registerForm').style.display = v ? 'block' : 'none';
        };

        window.registrarCuenta = async () => {
            const claveInstInput = document.getElementById('regClaveInst').value.trim();
            if(claveInstInput !== CLAVE_INST) return alert("❌ Clave Institucional Incorrecta");

            const u = document.getElementById('regUser').value.toLowerCase().trim();
            const p = document.getElementById('regPass').value.trim();
            const n = document.getElementById('regNombre').value.toUpperCase().trim();
            const g = document.getElementById('regGrado').value;
            const s = document.getElementById('regSeccion').value.toUpperCase().trim();
            const t = document.getElementById('regTurno').value;

            if(!u || !p || !n) return alert("⚠️ Rellene todos los campos obligatorios.");

            try {
                const docRef = doc(dbCloud, "docentes_db", u);
                const snap = await getDoc(docRef);
                if(snap.exists()) return alert("🚫 El usuario ya existe.");

                await setDoc(docRef, { 
                    docente: n, 
                    pass: p, 
                    grado: g, 
                    seccion: s, 
                    turno: t,
                    alumnos: [], asistencias: {}, feriados: [] 
                });
                alert("✅ Cuenta creada. Inicie sesión."); 
                window.mostrarRegistro(false);
            } catch (e) { alert("Error: " + e.message); }
        };

        window.login = async () => {
            const u = document.getElementById('loginUser').value.toLowerCase().trim();
            const p = document.getElementById('loginPass').value.trim();
            
            if(!u || !p) return alert("Ingrese sus datos.");

            try {
                const docRef = doc(dbCloud, "docentes_db", u);
                const snap = await getDoc(docRef);
                
                if (snap.exists() && snap.data().pass === p) {
                    window.usuarioActual = u;
                    
                    const hoy = new Date();
                    document.getElementById('fechaSeleccionada').value = hoy.toISOString().split('T')[0];

                    document.getElementById('authSection').style.display = 'none';
                    document.getElementById('appContent').style.display = 'block';
                    
                    if (u === USUARIO_ADMIN) document.getElementById('adminPanel').style.display = 'block';
                    
                    onSnapshot(docRef, (s) => { 
                        if(s.exists()){
                            window.db = s.data(); 
                            window.render(); 
                        }
                    });
                } else {
                    alert("❌ Acceso denegado: Usuario o clave incorrectos.");
                }
            } catch (e) { alert("Error de conexión."); }
        };
        
        // --- FUNCIONES DE PERSISTENCIA ---
        window.save = async () => { 
            if(window.usuarioActual) {
                await setDoc(doc(dbCloud, "docentes_db", window.usuarioActual), window.db); 
            }
        };

        // --- GESTIÓN DE ALUMNOS ---
        window.agregarAlumno = async () => {
            const c = document.getElementById('ced').value.trim().toUpperCase();
            const n = document.getElementById('nom').value.toUpperCase().trim();
            const na = document.getElementById('nac').value;
            if(!n || !na) return alert("Nombre y Fecha son obligatorios");
            
            if (c && window.db.alumnos.find(a => a.cedula === c && !a.retirado)) return alert("⚠️ Cédula ya registrada.");
            
            window.db.alumnos.push({ 
                id: Date.now(), 
                cedula: c, 
                nombre: n, 
                genero: document.getElementById('gen').value, 
                nacimiento: na, 
                retirado: false, 
                fechaIngreso: document.getElementById('fechaSeleccionada').value 
            });
            await window.save(); 
            document.getElementById('ced').value=""; 
            document.getElementById('nom').value="";
        };

        window.marcar = (id) => {
            const f = document.getElementById('fechaSeleccionada').value;
            const hoy = new Date(); hoy.setHours(23,59,59,999);
            const fechaSel = new Date(f + "T00:00:00");
            
            if (fechaSel > hoy) return alert("⚠️ No se puede marcar asistencia futura.");
            if(!window.db.asistencias[f]) window.db.asistencias[f]={};
            
            let actual = window.db.asistencias[f][id] || 0;
            window.db.asistencias[f][id] = (actual + 1) > 2 ? 0 : actual + 1;
            window.save();
        };

        window.retirarAlumno = async (id) => {
            if(confirm("¿Seguro que desea retirar este alumno?")){ 
                const a = window.db.alumnos.find(x => x.id === id); 
                if(a){ 
                    a.retirado = true; 
                    a.fechaEgreso = document.getElementById('fechaSeleccionada').value; 
                    await window.save(); 
                } 
            }
        };

        window.abrirEdicionAlumno = (id) => {
            const a = window.db.alumnos.find(x => x.id === id);
            if (!a) return;
            document.getElementById('editAlumId').value = a.id;
            document.getElementById('editAlumCed').value = a.cedula || ""; 
            document.getElementById('editAlumNom').value = a.nombre;
            document.getElementById('editAlumGen').value = a.genero;
            document.getElementById('editAlumNac').value = a.nacimiento;
            document.getElementById('modalEditarAlumno').style.display = 'flex';
        };

        window.cerrarEdicionAlumno = () => document.getElementById('modalEditarAlumno').style.display = 'none';

        window.guardarEdicionAlumno = async () => {
            const id = parseInt(document.getElementById('editAlumId').value);
            const idx = window.db.alumnos.findIndex(x => x.id === id);
            if (idx > -1) {
                window.db.alumnos[idx].cedula = document.getElementById('editAlumCed').value.trim().toUpperCase();
                window.db.alumnos[idx].nombre = document.getElementById('editAlumNom').value.toUpperCase();
                window.db.alumnos[idx].genero = document.getElementById('editAlumGen').value;
                window.db.alumnos[idx].nacimiento = document.getElementById('editAlumNac').value;
                await window.save();
                window.render();
                window.cerrarEdicionAlumno();
            }
        };

        // --- INTERFAZ Y RENDER ---
        window.render = () => {
            const fSel = document.getElementById('fechaSeleccionada').value;
            const fObj = new Date(fSel + "T00:00:00");
            const esFeriado = window.db.feriados?.includes(fSel);
            const esFinde = (fObj.getDay() === 0 || fObj.getDay() === 6);
            
            document.getElementById('docenteTxt').innerText = window.db.docente || "---";
            document.getElementById('gradoSeccionTxt').innerText = `${window.db.grado || ""} ${window.db.seccion || ""} - ${window.db.turno || ""}`;
            document.getElementById('btnFeriado').innerText = esFeriado ? "✅ VOLVER DÍA HÁBIL" : "🚩 MARCAR COMO FERIADO";

            const lista = document.getElementById('listaAsistencia');
            lista.innerHTML = "";
            const activos = (window.db.alumnos || []).filter(a => !a.retirado);

            if (esFeriado || esFinde) {
                lista.innerHTML = `<div class="aviso-no">🚫 DÍA NO LABORABLE (Feriado o Fin de Semana)</div>`;
            } else {
                activos.sort((a,b)=>a.nombre.localeCompare(b.nombre)).forEach(a => {
                    const st = (window.db.asistencias[fSel] && window.db.asistencias[fSel][a.id]) || 0;
                    let c = "#ccc", t = "F"; 
                    if(st===1){c="var(--exito)"; t="P";} 
                    if(st===2){c="var(--morado)"; t="J";}
                    
                    lista.innerHTML += `
                    <div class="alumno-fila">
                        <div class="bola-gen ${a.genero}"></div>
                        <div style="flex-grow:1">${a.nombre} <br><small>${a.cedula ? 'C.E: '+a.cedula : 'S/C'}</small></div>
                        <button onclick="marcar(${a.id})" class="btn-check" style="background:${c}">${t}</button>
                        <button onclick="abrirEdicionAlumno(${a.id})" class="btn-x" style="color:#f39c12;">✏️</button>
                        <button onclick="retirarAlumno(${a.id})" class="btn-x">✖</button>
                    </div>`;
                });
            }

            // Estadísticas rápidas
            let sH=0, sV=0, dsH=0, eds={};
            activos.forEach(al => { 
                const e = calcularEdad(al.nacimiento); 
                if(!eds[e]) eds[e]={F:0, M:0}; 
                eds[e][al.genero]++; 
            });

            Object.keys(window.db.asistencias).forEach(f => {
                const d = new Date(f + "T00:00:00");
                if(d.getMonth() === fObj.getMonth() && d.getDay()!==0 && d.getDay()!==6 && !window.db.feriados?.includes(f)) {
                    dsH++; 
                    activos.forEach(a => { if(window.db.asistencias[f][a.id]===1) a.genero==='F'?sH++:sV++; });
                }
            });

            const pH=dsH>0?sH/dsH:0, pV=dsH>0?sV/dsH:0, ef=activos.length>0?(((pH+pV)/activos.length)*100).toFixed(0):0;
            let tEd = ""; 
            Object.keys(eds).sort((a,b)=>a-b).forEach(e => { 
                tEd += `<tr><td>${e}a</td><td>${eds[e].F}</td><td>${eds[e].M}</td><td>${eds[e].F+eds[e].M}</td></tr>`; 
            });

            document.getElementById('reporteDocente').innerHTML = `
                <div class="reporte-card">
                    <h2>ESTADÍSTICA MENSUAL</h2>
                    <div class="circulo-eficiencia"><b>${ef}%</b><br><small>Efic.</small></div>
                    <div class="grid-promedios"><div>H: <b>${pH.toFixed(1)}</b></div><div>V: <b>${pV.toFixed(1)}</b></div><div>Total: <b>${(pH+pV).toFixed(1)}</b></div></div>
                    <table class="tabla-911"><thead><tr><th>Edad</th><th>H</th><th>V</th><th>T</th></tr></thead><tbody>${tEd}</tbody></table>
                    <button onclick="window.print()" class="btn-print no-print" style="margin-top:10px; background:var(--azul); color:white; border:none; padding:10px; border-radius:5px; width:100%;">🖨️ IMPRIMIR REPORTE</button>
                </div>`;
        };

        // --- REPORTES Y DIRECCIÓN ---
        window.consolidadoMensual = async () => {
            const fSel = document.getElementById('fechaSeleccionada').value;
            const mesRef = new Date(fSel + "T00:00:00").getMonth();
            const snap = await getDocs(collection(dbCloud, "docentes_db"));
            
            let h = `<table class="tabla-admin" id="tablaAdminConsolidado">
                <thead><tr><th>DOCENTE</th><th>G/S</th><th>MAT. T</th><th>P. ASIS</th><th>% EFIC</th></tr></thead><tbody>`;
            
            snap.forEach(dSnap => {
                const d = dSnap.data();
                if(dSnap.id === USUARIO_ADMIN) return;
                const activos = (d.alumnos || []).filter(a => !a.retirado);
                let sT=0, ds=0;
                Object.keys(d.asistencias || {}).forEach(f => {
                    if(new Date(f + "T00:00:00").getMonth() === mesRef && !d.feriados?.includes(f)){
                        ds++; activos.forEach(a => { if(d.asistencias[f][a.id] === 1) sT++; });
                    }
                });
                const pT = ds>0 ? sT/ds : 0;
                const ef = activos.length>0 ? (pT/activos.length*100).toFixed(1) : 0;
                h += `<tr><td>${d.docente}</td><td>${d.grado}${d.seccion}</td><td>${activos.length}</td><td>${pT.toFixed(1)}</td><td>${ef}%</td></tr>`;
            });
            h += `</tbody></table>`;
            document.getElementById('adminOutput').innerHTML = h;
        };

        window.exportarNombresBasico = async (formato, esAdmin) => {
            let listaDocentes = [];
            if (esAdmin) {
                const snap = await getDocs(collection(dbCloud, "docentes_db"));
                snap.forEach(s => { if (s.id !== USUARIO_ADMIN) listaDocentes.push(s.data()); });
            } else {
                listaDocentes.push(window.db);
            }

            if (formato === 'pdf') {
                const { jsPDF } = window.jspdf;
                const docPDF = new jsPDF();
                let y = 20;
                docPDF.text("LISTA DE ESTUDIANTES - EBN LUCILA PALACIOS", 105, y, {align:'center'});
                
                listaDocentes.forEach(d => {
                    const activos = (d.alumnos || []).filter(a => !a.retirado).sort((a,b)=>a.nombre.localeCompare(b.nombre));
                    const filas = activos.map((a, i) => [i+1, a.cedula || 'S/C', a.nombre, a.genero]);
                    docPDF.autoTable({
                        startY: y + 10,
                        head: [[{content: `GRADO: ${d.grado}${d.seccion} - ${d.docente}`, colSpan: 4}], ['N°', 'CÉDULA', 'ESTUDIANTE', 'G']],
                        body: filas
                    });
                    y = docPDF.lastAutoTable.finalY + 10;
                });
                docPDF.save("Lista_Estudiantes.pdf");
            }
        };

        window.toggleFeriado = async () => {
            const f = document.getElementById('fechaSeleccionada').value;
            if(!window.db.feriados) window.db.feriados = [];
            if(window.db.feriados.includes(f)) window.db.feriados = window.db.feriados.filter(x=>x!==f);
            else window.db.feriados.push(f);
            await window.save();
        };

        window.actualizarPerfil = async () => {
            window.db.docente = document.getElementById('editDocente').value.toUpperCase();
            window.db.grado = document.getElementById('editGrado').value;
            window.db.seccion = document.getElementById('editSeccion').value.toUpperCase();
            window.db.turno = document.getElementById('editTurno').value;
            await window.save();
            alert("Perfil actualizado.");
        };

        window.logout = () => location.reload();

    </script>

    <style>
        :root { --azul: #002147; --exito: #28a745; --morado: #6f42c1; --rojo: #dc3545; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; color: #333; }
        header { background: var(--azul); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 500px; margin: auto; padding: 15px; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        input, select, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        .alumno-fila { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
        .bola-gen { width: 12px; height: 12px; border-radius: 50%; }
        .bola-gen.F { background: #ff85a2; } .bola-gen.M { background: #3498db; }
        .btn-check { width: 45px; height: 45px; border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 10px; }
        .btn-x { background: none; border: none; cursor: pointer; width: auto; padding: 5px; color: var(--rojo); }
        .tabla-911, .tabla-admin { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        .tabla-911 th, .tabla-911 td, .tabla-admin th, .tabla-admin td { border: 1px solid #eee; padding: 8px; text-align: center; }
        .circulo-eficiencia { width: 70px; height: 70px; border: 5px solid var(--azul); border-radius: 50%; margin: 10px auto; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; }
        .aviso-no { background: #fee; color: #c33; padding: 20px; text-align: center; border-radius: 10px; font-weight: bold; }
        @media print { .no-print { display: none !important; } .container { max-width: 100%; } }
    </style>
</head>
<body>

<div id="authSection" style="text-align:center; padding: 50px 20px;">
    <img src="https://raw.githubusercontent.com/ebnlucilapalacios-source/asistencia-lucila-palacios./main/IMG_20260225_005025_993.png" width="100" style="margin-bottom:10px;">
    <h2>EBN LUCILA PALACIOS</h2>
    <div id="loginForm" class="card" style="max-width:350px; margin:auto">
        <input type="text" id="loginUser" placeholder="Usuario">
        <input type="password" id="loginPass" placeholder="Clave">
        <button onclick="login()" style="background:var(--azul); color:white; font-weight:bold;">INGRESAR</button>
        <p onclick="mostrarRegistro(true)" style="color:var(--morado); cursor:pointer; font-size:13px; margin-top:10px;">Crear cuenta nueva</p>
    </div>
    <div id="registerForm" class="card" style="max-width:350px; margin:auto; display:none;">
        <h3>Registro de Docente</h3>
        <input type="text" id="regNombre" placeholder="Nombre y Apellido">
        <div style="display:flex; gap:5px;">
            <input type="number" id="regGrado" placeholder="Grado">
            <input type="text" id="regSeccion" placeholder="Secc">
        </div>
        <select id="regTurno"><option value="Mañana">Mañana</option><option value="Tarde">Tarde</option></select>
        <input type="text" id="regUser" placeholder="Crea un Usuario">
        <input type="password" id="regPass" placeholder="Crea una Clave">
        <input type="password" id="regClaveInst" placeholder="Clave de Institución">
        <button onclick="registrarCuenta()" style="background:var(--exito); color:white; font-weight:bold;">REGISTRARME</button>
        <p onclick="mostrarRegistro(false)" style="cursor:pointer; font-size:13px;">Volver al Login</p>
    </div>
</div>

<div id="appContent" style="display:none;">
    <header class="no-print">
        <span><b>SISTEMA LUCILA 2026</b></span>
        <button onclick="logout()" style="width:auto; background:var(--rojo); color:white; padding:5px 10px; font-size:11px;">SALIR</button>
    </header>

    <div class="container">
        <div id="adminPanel" class="card no-print" style="display:none; border: 2px solid var(--morado);">
            <b style="color:var(--morado)">📊 PANEL DIRECCIÓN</b>
            <button onclick="consolidadoMensual()" style="background:var(--morado); color:white; font-size:12px;">GENERAR CONSOLIDADO ESCUELA</button>
            <button onclick="exportarNombresBasico('pdf', true)" style="background:#444; color:white; font-size:12px;">LISTADO GENERAL PDF</button>
            <div id="adminOutput" style="overflow-x:auto"></div>
        </div>

        <div class="card no-print">
            <details>
                <summary style="cursor:pointer; font-weight:bold; color:var(--azul)">⚙️ Configuración de Perfil</summary>
                <input type="text" id="editDocente" placeholder="Nombre Docente">
                <div style="display:flex; gap:5px;">
                    <input type="text" id="editGrado" placeholder="Grado">
                    <input type="text" id="editSeccion" placeholder="Secc">
                </div>
                <select id="editTurno"><option value="Mañana">Mañana</option><option value="Tarde">Tarde</option></select>
                <button onclick="actualizarPerfil()" style="background:var(--azul); color:white;">ACTUALIZAR DATOS</button>
            </details>
        </div>

        <div class="card no-print">
            <div style="font-size:14px;">
                <b>Docente:</b> <span id="docenteTxt"></span><br>
                <b>Sección:</b> <span id="gradoSeccionTxt"></span>
            </div>
            <input type="date" id="fechaSeleccionada" onchange="window.render()" style="margin-top:10px; font-weight:bold; border:2px solid var(--azul)">
            <button id="btnFeriado" onclick="toggleFeriado()" style="font-size:11px; color:var(--rojo); background:none; border:1px solid var(--rojo)"></button>
        </div>

        <div class="card no-print">
            <h4 style="margin:0 0 10px 0">+ Nuevo Estudiante</h4>
            <input type="text" id="ced" placeholder="Cédula o Escolar">
            <input type="text" id="nom" placeholder="Nombres y Apellidos">
            <div style="display:flex; gap:5px;">
                <select id="gen" style="width:40%"><option value="F">Hembra</option><option value="M">Varón</option></select>
                <input type="date" id="nac" style="width:60%">
            </div>
            <button onclick="agregarAlumno()" style="background:var(--exito); color:white; font-weight:bold;">INSCRIBIR</button>
        </div>

        <div class="card" id="cardAsistencia">
            <div id="listaAsistencia"></div>
        </div>

        <div id="reporteDocente"></div>
    </div>
</div>

<div id="modalEditarAlumno" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; align-items:center; justify-content:center;">
    <div class="card" style="width:90%; max-width:400px;">
        <h3>Editar Estudiante</h3>
        <input type="hidden" id="editAlumId">
        <input type="text" id="editAlumCed" placeholder="Cédula">
        <input type="text" id="editAlumNom" placeholder="Nombres">
        <select id="editAlumGen"><option value="F">Hembra</option><option value="M">Varón</option></select>
        <input type="date" id="editAlumNac">
        <button onclick="guardarEdicionAlumno()" style="background:var(--exito); color:white;">GUARDAR</button>
        <button onclick="cerrarEdicionAlumno()" style="background:var(--rojo); color:white;">CANCELAR</button>
    </div>
</div>

</body>
</html>
