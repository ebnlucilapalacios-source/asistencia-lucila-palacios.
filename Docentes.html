<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA EBN LUCILA PALACIOS - INTEGRAL 2026</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
            authDomain: "control-de-asistencia-d585e.firebaseapp.com",
            projectId: "control-de-asistencia-d585e",
            storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
            appId: "1:368890880546:web:a97ab4372dea536217207b"
        };

        const app = initializeApp(firebaseConfig);
        const dbCloud = getFirestore(app);
        const CLAVE_INST = "LUCILA2026";
        const USUARIO_ADMIN = "admin_lucila";

        window.usuarioActual = null;
        // Agregamos asistenciasEsp al objeto base
        window.db = { docente: "", seccion: "", grado: "", turno: "", tipo: "aula", alumnos: [], asistencias: {}, asistenciasEsp: {}, feriados: [] };
        window.alumnosTemporalesEspecialista = [];

        const calcularEdad = (f) => {
            if(!f) return 0;
            const hoy = new Date();
            const cumple = new Date(f);
            let edad = hoy.getFullYear() - cumple.getFullYear();
            if (hoy.getMonth() < cumple.getMonth() || (hoy.getMonth() === cumple.getMonth() && hoy.getDate() < cumple.getDate())) edad--;
            return edad;
        };

        // --- ACCESO ---
        window.mostrarRegistro = (v) => { 
            document.getElementById('loginForm').style.display = v ? 'none' : 'block';
            document.getElementById('registerForm').style.display = v ? 'block' : 'none';
        };

        window.registrarCuenta = async () => {
            if(document.getElementById('regClaveInst').value !== CLAVE_INST) return alert("Clave Institucional Incorrecta");
            const u = document.getElementById('regUser').value.toLowerCase().trim();
            const tipo = document.getElementById('regTipoUser').value;
            
            await setDoc(doc(dbCloud, "docentes_db", u), { 
                docente: document.getElementById('regNombre').value.toUpperCase(), 
                pass: document.getElementById('regPass').value, 
                grado: document.getElementById('regGrado').value || "", 
                seccion: document.getElementById('regSeccion').value.toUpperCase() || "", 
                turno: document.getElementById('regTurno').value,
                tipo: tipo,
                alumnos: [], asistencias: {}, asistenciasEsp: {}, feriados: [] 
            });
            alert("Cuenta creada."); window.mostrarRegistro(false);
        };

        window.login = async () => {
            const u = document.getElementById('loginUser').value.toLowerCase().trim();
            const p = document.getElementById('loginPass').value;
            const snap = await getDoc(doc(dbCloud, "docentes_db", u));
            
            if (snap.exists() && snap.data().pass === p) {
                window.usuarioActual = u;
                
                const hoy = new Date();
                document.getElementById('fechaSeleccionada').value = hoy.toISOString().split('T')[0];

                document.getElementById('authSection').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                
                const data = snap.data();
                if (u === USUARIO_ADMIN) document.getElementById('adminPanel').style.display = 'block';
                
                // Si es especialista, ocultar inscripción y mostrar selector de secciones
                if (data.tipo === "especialista") {
                    document.getElementById('especialistaPanel').style.display = 'block';
                    document.getElementById('cardInscripcion').style.display = 'none';
                    window.actualizarSelectorSecciones();
                }

                onSnapshot(doc(dbCloud, "docentes_db", u), (s) => { 
                    window.db = s.data(); 
                    window.render(); 
                });
            } else { alert("Acceso denegado"); }
        };

        // --- LÓGICA ESPECIALISTAS ---
        window.actualizarSelectorSecciones = async () => {
            const selector = document.getElementById('espSelectorSecciones');
            const snap = await getDocs(collection(dbCloud, "docentes_db"));
            let opciones = '<option value="">-- Seleccione Sección --</option>';
            snap.forEach(docSnap => {
                const d = docSnap.data();
                if(d.tipo === "aula" && d.grado) {
                    opciones += `<option value="${d.grado}-${d.seccion}">${d.grado}° "${d.seccion}" - Prof. ${d.docente}</option>`;
                }
            });
            selector.innerHTML = opciones;
        };

        window.cargarSeccionEspecialista = async () => {
            const val = document.getElementById('espSelectorSecciones').value;
            if(!val) return alert("Seleccione una sección");
            const [g, s] = val.split('-');
            const snap = await getDocs(collection(dbCloud, "docentes_db"));
            snap.forEach(docSnap => {
                const d = docSnap.data();
                if(d.grado == g && d.seccion == s && d.tipo === "aula") {
                    window.alumnosTemporalesEspecialista = d.alumnos || [];
                    window.render();
                }
            });
        };

        window.imprimirPlanillaFisica = () => {
            if (window.alumnosTemporalesEspecialista.length === 0) return alert("Primero cargue una sección.");
            const { jsPDF } = window.jspdf;
            const docPDF = new jsPDF('p', 'pt', 'letter');
            const seleccion = document.getElementById('espSelectorSecciones').value;
            
            docPDF.setFontSize(14);
            docPDF.text("E.B.N. LUCILA PALACIOS - REGISTRO ESPECIALISTA", 40, 50);
            docPDF.setFontSize(10);
            docPDF.text(`SECCIÓN: ${seleccion} | ESPECIALISTA: ${window.db.docente}`, 40, 70);
            docPDF.text(`FECHA: ____ / ____ / 2026`, 450, 70);

            const body = window.alumnosTemporalesEspecialista
                .filter(a => !a.retirado)
                .sort((a,b) => a.nombre.localeCompare(b.nombre))
                .map((a, i) => [i+1, a.nombre, "", ""]);

            docPDF.autoTable({
                startY: 90,
                head: [['N°', 'ESTUDIANTE', 'ASISTENCIA', 'OBSERVACIÓN']],
                body: body,
                theme: 'grid'
            });
            docPDF.save(`Planilla_Fisica_${seleccion}.pdf`);
        };

        // --- FUNCIONES COMUNES ---
        window.render = () => {
            const fSel = document.getElementById('fechaSeleccionada').value;
            const fObj = new Date(fSel + "T00:00:00");
            const esFeriado = window.db.feriados?.includes(fSel);
            const esFinde = (fObj.getDay() === 0 || fObj.getDay() === 6);
            
            document.getElementById('docenteTxt').innerText = window.db.docente || "No asignado";
            const rolTxt = window.db.tipo === "especialista" ? "ESPECIALISTA" : `${window.db.grado || ""} ${window.db.seccion || ""} - ${window.db.turno || ""}`;
            document.getElementById('gradoSeccionTxt').innerText = rolTxt;
            
            const lista = document.getElementById('listaAsistencia');
            lista.innerHTML = "";

            // Determinar qué lista usar
            const activos = (window.db.tipo === "especialista") 
                ? window.alumnosTemporalesEspecialista.filter(a => !a.retirado)
                : (window.db.alumnos || []).filter(a => !a.retirado);

            if (esFeriado || esFinde) {
                lista.innerHTML = `<div class="aviso-no">🚫 DÍA NO LABORABLE</div>`;
            } else {
                activos.sort((a,b)=>a.nombre.localeCompare(b.nombre)).forEach(a => {
                    // Diferenciar qué campo de asistencia leer
                    const dataAsis = (window.db.tipo === "especialista") ? (window.db.asistenciasEsp || {}) : (window.db.asistencias || {});
                    const st = (dataAsis[fSel] && dataAsis[fSel][a.id]) || 0;
                    
                    let c = "#ccc", t = "F"; 
                    if(st===1){c="var(--exito)"; t="P";} 
                    if(st===2){c="var(--morado)"; t="J";}

                    lista.innerHTML += `<div class="alumno-fila">
                        <div class="bola-gen ${a.genero}"></div>
                        <div style="flex-grow:1">${a.nombre}</div>
                        <button onclick="marcar(${a.id})" class="btn-check" style="background:${c}">${t}</button>
                    </div>`;
                });
            }
            
            // Ocultar estadística si es especialista (ellos no llevan la matrícula oficial)
            if(window.db.tipo === "aula") {
                document.getElementById('reporteDocente').style.display = 'block';
                // (Aquí iría el resto de tu lógica de estadística que ya tienes...)
            } else {
                document.getElementById('reporteDocente').style.display = 'none';
            }
        };

        window.marcar = async (id) => {
            const f = document.getElementById('fechaSeleccionada').value;
            const hoy = new Date(); hoy.setHours(0,0,0,0);
            const fechaSel = new Date(f + "T00:00:00");
            if (fechaSel > hoy) return alert("⚠️ No se puede marcar asistencia en fecha futura.");

            // Determinar en qué campo guardar
            const campo = (window.db.tipo === "especialista") ? "asistenciasEsp" : "asistencias";
            
            if(!window.db[campo]) window.db[campo]={};
            if(!window.db[campo][f]) window.db[campo][f]={};
            
            window.db[campo][f][id] = (window.db[campo][f][id]+1)%3 || 1;
            await window.save();
        };

        window.save = async () => { await setDoc(doc(dbCloud, "docentes_db", window.usuarioActual), window.db); };
        window.logout = () => location.reload();
        
        // Mantener el resto de tus funciones de inscripción, dirección, etc.
        window.actualizarPerfil = async () => { /* tu codigo */ };
        window.agregarAlumno = async () => { 
            const c = document.getElementById('ced').value.trim().toUpperCase();
            const n = document.getElementById('nom').value.toUpperCase();
            const na = document.getElementById('nac').value;
            if(!n || !na) return;
            window.db.alumnos.push({ id: Date.now(), cedula: c, nombre: n, genero: document.getElementById('gen').value, nacimiento: na, retirado: false, fechaIngreso: document.getElementById('fechaSeleccionada').value });
            await window.save(); document.getElementById('ced').value=""; document.getElementById('nom').value="";
        };
    </script>

    <style>
        /* Mantener tus estilos y añadir estos */
        :root { --azul: #002147; --exito: #28a745; --morado: #6f42c1; --rojo: #dc3545; --naranja: #e67e22; }
        /* ... el resto de tu CSS ... */
    </style>
</head>
<body>

<div id="authSection" style="text-align:center; padding: 40px 20px;">
    <div id="loginForm" class="card" style="max-width:320px; margin:auto">
        <input type="text" id="loginUser" placeholder="Usuario">
        <input type="password" id="loginPass" placeholder="Clave">
        <button onclick="login()" style="background:var(--azul); color:white; padding:12px; width:100%; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">ENTRAR</button>
        <p onclick="mostrarRegistro(true)" style="font-size:12px; color:var(--morado); cursor:pointer; margin-top:15px;">Registrar Cuenta Nueva</p>
    </div>

    <div id="registerForm" class="card" style="max-width:320px; margin:auto; display:none;">
        <h4>Registro de Personal</h4>
        <select id="regTipoUser" onchange="document.getElementById('divDatosAula').style.display = this.value==='aula'?'block':'none'">
            <option value="aula">Docente de Aula</option>
            <option value="especialista">Especialista (Música/Deporte/etc)</option>
        </select>
        <input type="text" id="regNombre" placeholder="Nombre Completo">
        <div id="divDatosAula">
            <div style="display:flex; gap:4px;">
                <input type="text" id="regGrado" placeholder="Grado">
                <input type="text" id="regSeccion" placeholder="Sec">
            </div>
        </div>
        <select id="regTurno"><option value="Mañana">Mañana</option><option value="Tarde">Tarde</option></select>
        <input type="text" id="regUser" placeholder="Usuario">
        <input type="password" id="regPass" placeholder="Contraseña">
        <input type="password" id="regClaveInst" placeholder="Clave Institucional">
        <button onclick="registrarCuenta()" style="background:var(--exito); color:white; padding:12px; width:100%; border:none; border-radius:6px; font-weight:bold;">REGISTRAR</button>
        <p onclick="mostrarRegistro(false)" style="font-size:12px; cursor:pointer;">Volver</p>
    </div>
</div>

<div id="appContent" style="display:none;">
    <header class="no-print">
        <b>SISTEMA LUCILA</b>
        <button onclick="logout()" style="background:var(--rojo); color:white; border:none; padding:6px 10px; border-radius:5px; font-size:10px; cursor:pointer;">SALIR</button>
    </header>

    <div class="container">
        <div id="adminPanel" class="card no-print" style="display:none; border:2px solid var(--morado);">
            <b>📊 DIRECCIÓN</b>
            </div>

        <div id="especialistaPanel" class="card no-print" style="display:none; border:2px solid var(--naranja);">
            <b style="color:var(--naranja);">🎨 CONTROL ESPECIALISTA</b>
            <p style="font-size:11px; margin:5px 0;">Seleccione el grado donde pasará asistencia hoy:</p>
            <select id="espSelectorSecciones"></select>
            <button onclick="cargarSeccionEspecialista()" style="background:var(--azul); color:white; border:none; padding:10px; border-radius:5px; width:100%; margin-top:5px; font-weight:bold;">CARGAR LISTADO</button>
            <button onclick="imprimirPlanillaFisica()" style="background:#7f8c8d; color:white; border:none; padding:8px; border-radius:5px; width:100%; margin-top:5px; font-size:11px;">🖨️ DESCARGAR PLANILLA FÍSICA (PDF)</button>
        </div>

        <div class="card no-print">
            <b>Personal:</b> <span id="docenteTxt"></span><br>
            <b>Rol/Sección:</b> <span id="gradoSeccionTxt"></span>
            <input type="date" id="fechaSeleccionada" onchange="window.render()" style="margin-top:10px;">
        </div>

        <div class="card no-print" id="cardInscripcion">
            <h4 style="margin:0 0 5px 0">+ Inscribir Alumno</h4>
            <input type="text" id="ced" placeholder="Cédula / C. Escolar">
            <input type="text" id="nom" placeholder="Nombres">
            <div style="display:flex; gap:4px;">
                <select id="gen" style="width:40%"><option value="F">Hembra</option><option value="M">Varón</option></select>
                <input type="date" id="nac" style="width:60%">
            </div>
            <button onclick="agregarAlumno()" style="background:var(--exito); color:white; padding:12px; border:none; width:100%; border-radius:6px; font-weight:bold; margin-top:5px;">AGREGAR A MATRÍCULA</button>
        </div>

        <div class="card" id="cardAsistencia"><div id="listaAsistencia"></div></div>
        <div id="reporteDocente"></div>
    </div>
</div>
</body>
</html>
