<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA EBN LUCILA PALACIOS - INTEGRAL 2026</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
            authDomain: "control-de-asistencia-d585e.firebaseapp.com",
            projectId: "control-de-asistencia-d585e",
            storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
            appId: "1:368890880546:web:a97ab4372dea536217207b"
        };

        const app = initializeApp(firebaseConfig);
        const dbCloud = getFirestore(app);
        const CLAVE_INST = "LUCILA2026";
        const USUARIO_ADMIN = "admin_lucila";

        window.usuarioActual = null;
        window.db = { docente: "", seccion: "", grado: "", turno: "", alumnos: [], asistencias: {}, feriados: [] };

        const calcularEdad = (f) => {
            if(!f) return 0;
            const hoy = new Date();
            const cumple = new Date(f);
            let edad = hoy.getFullYear() - cumple.getFullYear();
            if (hoy.getMonth() < cumple.getMonth() || (hoy.getMonth() === cumple.getMonth() && hoy.getDate() < cumple.getDate())) edad--;
            return edad;
        };

        // --- AUTENTICACIÓN ---
        window.login = async () => {
            const u = document.getElementById('loginUser').value.toLowerCase().trim();
            const p = document.getElementById('loginPass').value;
            const snap = await getDoc(doc(dbCloud, "docentes_db", u));
            if (snap.exists() && snap.data().pass === p) {
                window.usuarioActual = u;
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                if (u === USUARIO_ADMIN) document.getElementById('adminPanel').style.display = 'block';
                onSnapshot(doc(dbCloud, "docentes_db", u), (s) => { window.db = s.data(); window.render(); });
            } else alert("Acceso denegado");
        };

        // --- PANEL DIRECCIÓN (RECUPERADO) ---
        window.cambiarCredencialesDocente = async () => {
            const oldU = document.getElementById('adminOldUser').value.toLowerCase().trim();
            const newU = document.getElementById('adminNewUser').value.toLowerCase().trim();
            const newP = document.getElementById('adminNewPass').value;
            if(!oldU) return alert("Ingrese usuario actual");
            const snap = await getDoc(doc(dbCloud, "docentes_db", oldU));
            if(!snap.exists()) return alert("Usuario no existe");
            const data = snap.data();
            if(newP) data.pass = newP;
            if(newU && newU !== oldU) {
                await setDoc(doc(dbCloud, "docentes_db", newU), data);
                await deleteDoc(doc(dbCloud, "docentes_db", oldU));
            } else { await setDoc(doc(dbCloud, "docentes_db", oldU), data); }
            alert("Credenciales actualizadas");
        };

        window.consolidadoMensual = async () => {
            const fSel = document.getElementById('fechaSeleccionada').value;
            const mesRef = new Date(fSel + "T00:00:00").getMonth();
            const snap = await getDocs(collection(dbCloud, "docentes_db"));
            let list = []; snap.forEach(d => { if(d.id !== USUARIO_ADMIN) list.push(d.data()); });
            list.sort((a,b) => (parseInt(a.grado)-parseInt(b.grado)) || a.seccion.localeCompare(b.seccion));

            let h = `<table class="tabla-admin"><thead><tr><th rowspan="2">DOCENTE</th><th rowspan="2">G/S</th><th colspan="3">MATRÍCULA</th><th colspan="2">MOV</th><th colspan="3">PROM</th><th rowspan="2">%</th></tr><tr><th>H</th><th>V</th><th>T</th><th>I</th><th>E</th><th>H</th><th>V</th><th>T</th></tr></thead><tbody>`;
            list.forEach(d => {
                const ac = (d.alumnos||[]).filter(a=>!a.retirado);
                const mH=ac.filter(a=>a.genero==='F').length, mV=ac.filter(a=>a.genero==='M').length, mT=ac.length;
                const mI = (d.alumnos||[]).filter(a => a.fechaIngreso && new Date(a.fechaIngreso+"T00:00:00").getMonth() === mesRef).length;
                const mE = (d.alumnos||[]).filter(a => a.retirado && a.fechaEgreso && new Date(a.fechaEgreso+"T00:00:00").getMonth() === mesRef).length;
                let sH=0, sV=0, ds=0;
                Object.keys(d.asistencias||{}).forEach(f => {
                    const fo = new Date(f+"T00:00:00");
                    if(fo.getMonth()===mesRef && fo.getDay()!==0 && fo.getDay()!==6) {
                        ds++; ac.forEach(a => { if(d.asistencias[f][a.id]===1) a.genero==='F'?sH++:sV++; });
                    }
                });
                const pH=ds>0?sH/ds:0, pV=ds>0?sV/ds:0;
                h += `<tr><td>${d.docente}</td><td>${d.grado}${d.seccion}</td><td>${mH}</td><td>${mV}</td><td>${mT}</td><td>${mI}</td><td>${mE}</td><td>${pH.toFixed(1)}</td><td>${pV.toFixed(1)}</td><td>${(pH+pV).toFixed(1)}</td><td>${(mT>0?((pH+pV)/mT*100):0).toFixed(0)}%</td></tr>`;
            });
            document.getElementById('adminOutput').innerHTML = h + "</tbody></table>";
        };

        // --- EXPORTACIÓN PDF ---
        window.exportarNombresBasico = async (esAdmin) => {
            const { jsPDF } = window.jspdf; const docPDF = new jsPDF();
            let docs = [];
            if(esAdmin){ const s=await getDocs(collection(dbCloud,"docentes_db")); s.forEach(d=>{if(d.id!==USUARIO_ADMIN) docs.push(d.data())}); }
            else { docs.push(window.db); }
            docs.sort((a,b)=>(parseInt(a.grado)-parseInt(b.grado)) || a.seccion.localeCompare(b.seccion));

            const membrete = (d) => {
                d.setFontSize(10); d.text("REPÚBLICA BOLIVARIANA DE VENEZUELA", 105, 12, {align:"center"});
                d.text("MINISTERIO DEL PODER POPULAR PARA LA EDUCACIÓN", 105, 17, {align:"center"});
                d.setFont("helvetica","bold"); d.text("E.B.N. LUCILA PALACIOS", 105, 25, {align:"center"});
            };

            let y = 35; membrete(docPDF); docPDF.setFontSize(14); docPDF.text("LISTA DE ESTUDIANTES", 105, 32, {align:"center"});
            docs.forEach(d => {
                const ac = (d.alumnos||[]).filter(a=>!a.retirado).sort((a,b)=>a.nombre.localeCompare(b.nombre));
                docPDF.autoTable({ head: [[{content:`${d.grado}${d.seccion} - ${d.docente}`, colSpan:2}]], body: ac.map((a,i)=>[i+1, a.nombre]), startY: y+5, theme:'grid' });
                y = docPDF.lastAutoTable.finalY + 10;
                if(y>250){ docPDF.addPage(); membrete(docPDF); y=30; }
            });
            docPDF.save("Lista_Estudiantes.pdf");
        };

        // --- MANTENIMIENTO ---
        window.limpiarMovimientos = async () => {
            if(confirm("¿Limpiar? Se eliminarán egresos y se resetearán ingresos.")){
                window.db.alumnos = window.db.alumnos.filter(a=>!a.retirado).map(a=>({...a, fechaIngreso:null, fechaEgreso:null}));
                await window.save(); window.render();
            }
        };

        window.borrarMatriculaTotal = async () => {
            if(confirm("¿Borrar todo?") && prompt("Escribe 'BORRAR'")==="BORRAR"){
                window.db.alumnos=[]; window.db.asistencias={}; await window.save(); window.render();
            }
        };

        // --- RENDER Y ESTADÍSTICA ---
        window.render = () => {
            const fSel = document.getElementById('fechaSeleccionada').value;
            const fObj = new Date(fSel + "T00:00:00");
            const activos = (window.db.alumnos || []).filter(a => !a.retirado).sort((a,b)=>a.nombre.localeCompare(b.nombre));
            
            document.getElementById('docenteTxt').innerText = window.db.docente;
            document.getElementById('gradoSeccionTxt').innerText = `${window.db.grado}${window.db.seccion}`;
            
            // Lista Asistencia
            const lista = document.getElementById('listaAsistencia');
            lista.innerHTML = "";
            activos.forEach(a => {
                const st = (window.db.asistencias[fSel] && window.db.asistencias[fSel][a.id]) || 0;
                let c = "#ccc", t = "F"; if(st===1){c="var(--exito)"; t="P";} if(st===2){c="var(--morado)"; t="J";}
                lista.innerHTML += `<div class="alumno-fila">
                    <div class="bola-gen ${a.genero}"></div>
                    <div style="flex-grow:1">${a.nombre}</div>
                    <button onclick="marcar(${a.id})" class="btn-check" style="background:${c}">${t}</button>
                    <button onclick="retirarAlumno(${a.id})" class="btn-x">✖</button>
                </div>`;
            });

            // Estadística
            let sH=0, sV=0, dsH=0, eds={};
            activos.forEach(al => { const e=calcularEdad(al.nacimiento); if(!eds[e]) eds[e]={F:0, M:0}; eds[e][al.genero]++; });
            Object.keys(window.db.asistencias).forEach(f => {
                const d = new Date(f + "T00:00:00");
                if(d.getMonth() === fObj.getMonth() && d.getDay()!==0 && d.getDay()!==6) {
                    dsH++; activos.forEach(a => { if(window.db.asistencias[f][a.id]===1) a.genero==='F'?sH++:sV++; });
                }
            });
            const pH=dsH>0?sH/dsH:0, pV=dsH>0?sV/dsH:0, ef=activos.length>0?(((pH+pV)/activos.length)*100).toFixed(0):0;
            const ingM = (window.db.alumnos || []).filter(a => a.fechaIngreso && new Date(a.fechaIngreso+"T00:00:00").getMonth() === fObj.getMonth());
            const egrM = (window.db.alumnos || []).filter(a => a.retirado && a.fechaEgreso && new Date(a.fechaEgreso+"T00:00:00").getMonth() === fObj.getMonth());

            let tEd = ""; Object.keys(eds).sort((a,b)=>a-b).forEach(e => { tEd += `<tr><td>${e} años</td><td>${eds[e].F}</td><td>${eds[e].M}</td><td>${eds[e].F+eds[e].M}</td></tr>`; });

            document.getElementById('reporteDocente').innerHTML = `
                <div class="reporte-print-area">
                    <div class="membrete-oficial">
                        <p>REPÚBLICA BOLIVARIANA DE VENEZUELA</p>
                        <p>MINISTERIO DEL PODER POPULAR PARA LA EDUCACIÓN</p>
                        <p>ESTADO BOLÍVAR - MUNICIPIO CARONÍ</p>
                        <h3>E.B.N. LUCILA PALACIOS</h3>
                    </div>
                    <h3>REPORTE ESTADÍSTICO - ${fObj.toLocaleString('es-ES', {month:'long'}).toUpperCase()}</h3>
                    <p><b>Docente:</b> ${window.db.docente} | <b>Grado/Secc:</b> ${window.db.grado}${window.db.seccion}</p>
                    
                    <div class="stats-row">
                        <div class="ef-box"><b>${ef}%</b><br><small>EFICIENCIA</small></div>
                        <div class="prom-box">
                            H: ${pH.toFixed(1)} | V: ${pV.toFixed(1)}<br>
                            <b>Promedio Real: ${(pH+pV).toFixed(1)}</b>
                        </div>
                    </div>

                    <table class="tabla-reporte">
                        <thead><tr><th>EDAD</th><th>H</th><th>V</th><th>T</th></tr></thead>
                        <tbody>${tEd}</tbody>
                    </table>

                    <div class="mov-box">
                        <b>INGRESOS:</b> ${ingM.length > 0 ? ingM.map(a=>a.nombre).join(', ') : 'Ninguno'}<br>
                        <b>EGRESOS:</b> ${egrM.length > 0 ? egrM.map(a=>a.nombre).join(', ') : 'Ninguno'}
                    </div>
                </div>
                <button onclick="window.print()" class="btn-azul no-print">🖨️ IMPRIMIR REPORTE</button>
            `;
        };

        window.marcar = (id) => {
            const f = document.getElementById('fechaSeleccionada').value;
            if(!window.db.asistencias[f]) window.db.asistencias[f]={};
            window.db.asistencias[f][id] = (window.db.asistencias[f][id]+1)%3 || 1;
            window.save();
        };

        window.agregarAlumno = async () => {
            const n = document.getElementById('nom').value.toUpperCase(), na = document.getElementById('nac').value;
            if(!n || !na) return;
            window.db.alumnos.push({ id: Date.now(), nombre: n, genero: document.getElementById('gen').value, nacimiento: na, retirado: false, fechaIngreso: document.getElementById('fechaSeleccionada').value });
            await window.save(); document.getElementById('nom').value="";
        };

        window.retirarAlumno = async (id) => {
            if(confirm("¿Retirar?")){ const a=window.db.alumnos.find(x=>x.id===id); if(a){ a.retirado=true; a.fechaEgreso=document.getElementById('fechaSeleccionada').value; await window.save(); } }
        };

        window.save = async () => { await setDoc(doc(dbCloud, "docentes_db", window.usuarioActual), window.db); };
        window.logout = () => location.reload();
    </script>

    <style>
        :root { --azul: #002147; --exito: #28a745; --morado: #6f42c1; --rojo: #dc3545; }
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; }
        header { background: var(--azul); color: white; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 500px; margin: auto; padding: 10px; }
        .card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        /* TABLAS DIRECCION */
        .tabla-admin { width: 100%; border-collapse: collapse; font-size: 9px; }
        .tabla-admin th, .tabla-admin td { border: 1px solid #ddd; padding: 3px; text-align: center; }
        .tabla-admin th { background: var(--azul); color: white; }

        /* REPORTE Y MEMBRETE */
        .membrete-oficial { display: none; text-align: center; line-height: 1.2; margin-bottom: 10px; }
        .membrete-oficial p { margin: 0; font-size: 11px; }
        .reporte-print-area { text-align: center; border: 1px solid #eee; padding: 10px; border-radius: 5px; }
        .stats-row { display: flex; justify-content: space-around; align-items: center; margin: 10px 0; }
        .ef-box { border: 3px solid var(--azul); width: 60px; height: 60px; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; font-size: 14px; }
        .tabla-reporte { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        .tabla-reporte th, .tabla-reporte td { border: 1px solid #ccc; padding: 5px; }
        .mov-box { text-align: left; font-size: 10px; background: #fafafa; padding: 10px; margin-top: 10px; border-radius: 4px; border: 1px solid #eee; }

        /* UI ASISTENCIA */
        .alumno-fila { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eee; }
        .bola-gen { width: 12px; height: 12px; border-radius: 50%; }
        .bola-gen.F { background: #ff85a2; } .bola-gen.M { background: #3498db; }
        .btn-check { width: 35px; height: 35px; border: none; color: white; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .btn-azul { background: var(--azul); color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-rojo { background: var(--rojo); color: white; border: none; padding: 5px; border-radius: 4px; }
        input, select { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }

        @media print {
            .no-print, header, .card:not(#card-reporte), #lista-card { display: none !important; }
            .membrete-oficial { display: block !important; }
            body { background: white; }
            .container { max-width: 100%; }
        }
    </style>
</head>
<body>

<div id="authSection" style="text-align:center; padding: 50px 20px;">
    <img src="https://raw.githubusercontent.com/ebnlucilapalacios-source/asistencia-lucila-palacios./main/IMG_20260225_005025_993.png" width="80">
    <h2>EBN LUCILA PALACIOS</h2>
    <div class="card" style="max-width:300px; margin:auto">
        <input type="text" id="loginUser" placeholder="Usuario">
        <input type="password" id="loginPass" placeholder="Clave">
        <button onclick="login()" class="btn-azul">ENTRAR</button>
    </div>
</div>

<div id="appContent" style="display:none;">
    <header class="no-print">
        <b>SISTEMA LUCILA 2026</b>
        <button onclick="logout()" class="btn-rojo">SALIR</button>
    </header>

    <div class="container">
        <div id="adminPanel" class="card no-print" style="display:none; border: 2px solid var(--morado);">
            <b>📊 PANEL DIRECCIÓN</b>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-top:10px;">
                <button onclick="consolidadoMensual()" class="btn-azul" style="background:var(--morado)">CONSOLIDADO</button>
                <button onclick="exportarNombresBasico(true)" class="btn-azul" style="background:var(--exito)">LISTA PDF</button>
            </div>
            <div id="adminOutput" style="overflow-x:auto; margin-top:10px;"></div>
            
            <hr>
            <small>Gestión de Cuentas:</small>
            <input type="text" id="adminOldUser" placeholder="Usuario Actual">
            <input type="text" id="adminNewUser" placeholder="Nuevo Usuario (Opcional)">
            <input type="password" id="adminNewPass" placeholder="Nueva Clave (Opcional)">
            <button onclick="cambiarCredencialesDocente()" class="btn-azul">ACTUALIZAR DOCENTE</button>
        </div>

        <div class="card no-print">
            <b>Docente:</b> <span id="docenteTxt"></span> | <b>Sección:</b> <span id="gradoSeccionTxt"></span>
            <input type="date" id="fechaSeleccionada" value="2026-03-11" onchange="window.render()">
        </div>

        <div class="card no-print">
            <b>+ Inscribir Estudiante</b>
            <input type="text" id="nom" placeholder="Nombres y Apellidos">
            <select id="gen"><option value="F">Hembra</option><option value="M">Varón</option></select>
            <input type="date" id="nac">
            <button onclick="agregarAlumno()" class="btn-azul" style="background:var(--exito)">AGREGAR</button>
        </div>

        <div class="card" id="lista-card">
            <div id="listaAsistencia"></div>
        </div>

        <div class="card" id="card-reporte">
            <div id="reporteDocente"></div>
        </div>

        <div class="card no-print">
            <b>Mantenimiento</b>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-top:5px;">
                <button onclick="limpiarMovimientos()" class="btn-azul" style="background:#f39c12; font-size:10px;">LIMPIAR MOVIMIENTOS</button>
                <button onclick="borrarMatriculaTotal()" class="btn-azul" style="background:var(--rojo); font-size:10px;">VACIAR SECCIÓN</button>
            </div>
            <button onclick="exportarNombresBasico(false)" class="btn-azul" style="margin-top:5px;">📄 DESCARGAR LISTA ESTUDIANTES PDF</button>
        </div>
    </div>
</div>

</body>
</html>
