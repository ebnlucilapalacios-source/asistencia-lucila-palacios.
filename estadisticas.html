<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA EBN LUCILA PALACIOS - INTEGRAL 2026</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
            authDomain: "control-de-asistencia-d585e.firebaseapp.com",
            projectId: "control-de-asistencia-d585e",
            storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
            appId: "1:368890880546:web:a97ab4372dea536217207b"
        };

        const app = initializeApp(firebaseConfig);
        const dbCloud = getFirestore(app);
        const CLAVE_INST = "LUCILA2026";
        const USUARIO_ADMIN = "admin_lucila";

        window.usuarioActual = null;
        window.db = { docente: "", seccion: "", grado: "", turno: "", alumnos: [], asistencias: {}, feriados: [] };

        const calcularEdad = (f) => {
            if(!f) return 0;
            const hoy = new Date();
            const cumple = new Date(f + "T00:00:00");
            let edad = hoy.getFullYear() - cumple.getFullYear();
            if (hoy.getMonth() < cumple.getMonth() || (hoy.getMonth() === cumple.getMonth() && hoy.getDate() < cumple.getDate())) edad--;
            return edad;
        };

        // --- ACCESO Y REGISTRO ---
        window.mostrarRegistro = (v) => { 
            document.getElementById('loginForm').style.display = v ? 'none' : 'block';
            document.getElementById('registerForm').style.display = v ? 'block' : 'none';
        };

        window.registrarCuenta = async () => {
            if(document.getElementById('regClaveInst').value !== CLAVE_INST) return alert("Clave Institucional Incorrecta");
            const u = document.getElementById('regUser').value.toLowerCase().trim();
            await setDoc(doc(dbCloud, "docentes_db", u), { 
                docente: document.getElementById('regNombre').value.toUpperCase(), 
                pass: document.getElementById('regPass').value, 
                grado: document.getElementById('regGrado').value, 
                seccion: document.getElementById('regSeccion').value.toUpperCase(), 
                turno: document.getElementById('regTurno').value,
                alumnos: [], asistencias: {}, feriados: [] 
            });
            alert("Cuenta registrada."); window.mostrarRegistro(false);
        };

        window.login = async () => {
            const u = document.getElementById('loginUser').value.toLowerCase().trim();
            const p = document.getElementById('loginPass').value;
            const snap = await getDoc(doc(dbCloud, "docentes_db", u));
            if (snap.exists() && snap.data().pass === p) {
                window.usuarioActual = u;
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                if (u === USUARIO_ADMIN) document.getElementById('adminPanel').style.display = 'block';
                onSnapshot(doc(dbCloud, "docentes_db", u), (s) => { 
                    window.db = s.data(); 
                    // Precargar datos en el editor de perfil
                    document.getElementById('editNombre').value = window.db.docente;
                    document.getElementById('editGrado').value = window.db.grado;
                    document.getElementById('editSeccion').value = window.db.seccion;
                    document.getElementById('editTurno').value = window.db.turno;
                    window.render(); 
                });
            } else alert("Datos incorrectos");
        };

        // --- EDITAR PERFIL ---
        window.actualizarPerfil = async () => {
            window.db.docente = document.getElementById('editNombre').value.toUpperCase();
            window.db.grado = document.getElementById('editGrado').value;
            window.db.seccion = document.getElementById('editSeccion').value.toUpperCase();
            window.db.turno = document.getElementById('editTurno').value;
            await window.save();
            alert("Perfil actualizado correctamente");
        };

        // --- DIRECCIÓN (CONSOLIDADO) ---
        window.consolidadoMensual = async () => {
            const fSel = document.getElementById('fechaSeleccionada').value;
            const mesRef = new Date(fSel + "T00:00:00").getMonth();
            const snap = await getDocs(collection(dbCloud, "docentes_db"));
            let docentesData = [];
            snap.forEach(dSnap => { if(dSnap.id !== USUARIO_ADMIN) docentesData.push(dSnap.data()); });
            docentesData.sort((a, b) => (parseInt(a.grado) - parseInt(b.grado)) || a.seccion.localeCompare(b.seccion));

            let h = `
                <div class="btns-admin-row no-print" style="display:flex; gap:10px; margin-bottom:15px;">
                    <button onclick="descargarPDFAdmin()" style="background:#e74c3c; color:white; border:none; padding:12px; flex:1; border-radius:8px; font-weight:bold; cursor:pointer;">💾 PDF</button>
                    <button onclick="exportarExcelBonito()" style="background:#1D6F42; color:white; border:none; padding:12px; flex:1; border-radius:8px; font-weight:bold; cursor:pointer;">📊 EXCEL</button>
                </div>
                <table class="tabla-admin" id="tablaAdminConsolidado">
                <thead>
                    <tr><th rowspan="2">DOCENTE</th><th rowspan="2">G/S</th><th colspan="3">MATRÍCULA</th><th colspan="2">MOV</th><th colspan="3">PROM. REAL</th><th rowspan="2">% EFIC</th><th rowspan="2">VER</th></tr>
                    <tr><th>H</th><th>V</th><th>T</th><th>I</th><th>E</th><th>H</th><th>V</th><th>T</th></tr>
                </thead><tbody>`;
            
            let T = { mH:0, mV:0, mT:0, mI:0, mE:0, pH:0, pV:0, pT:0 };

            docentesData.forEach(d => {
                const alms = d.alumnos || [];
                const ac = alms.filter(a => !a.retirado);
                const mH=ac.filter(a=>a.genero==='F').length, mV=ac.filter(a=>a.genero==='M').length, mT=ac.length;
                const mI = alms.filter(a => a.fechaIngreso && new Date(a.fechaIngreso+"T00:00:00").getMonth() === mesRef).length;
                const mE = alms.filter(a => a.retirado && a.fechaEgreso && new Date(a.fechaEgreso+"T00:00:00").getMonth() === mesRef).length;

                let sH=0, sV=0, ds=0;
                Object.keys(d.asistencias || {}).forEach(f => {
                    const fo = new Date(f + "T00:00:00");
                    if(fo.getMonth() === mesRef && fo.getDay()!==0 && fo.getDay()!==6 && !d.feriados?.includes(f)) {
                        ds++; ac.forEach(a => { if(d.asistencias[f][a.id] === 1) a.genero === 'F' ? sH++ : sV++; });
                    }
                });
                const pH=ds>0?sH/ds:0, pV=ds>0?sV/ds:0, pT=pH+pV, ef=mT>0?((pT/mT)*100).toFixed(1):0;
                T.mH+=mH; T.mV+=mV; T.mT+=mT; T.mI+=mI; T.mE+=mE; T.pH+=pH; T.pV+=pV; T.pT+=pT;

                const dJson = JSON.stringify(d).replace(/"/g, '&quot;');
                h += `<tr><td>${d.docente}</td><td>${d.grado}${d.seccion}</td><td>${mH}</td><td>${mV}</td><td>${mT}</td><td>${mI}</td><td>${mE}</td><td>${pH.toFixed(1)}</td><td>${pV.toFixed(1)}</td><td>${pT.toFixed(1)}</td><td>${ef}%</td><td><button onclick='window.exportarListaSimpleExcel(${dJson})'>📗</button></td></tr>`;
            });
            const efG = T.mT > 0 ? ((T.pT / T.mT) * 100).toFixed(1) : 0;
            h += `<tr style="background:#333; color:white; font-weight:bold;"><td>ESCUELA</td><td>-</td><td>${T.mH}</td><td>${T.mV}</td><td>${T.mT}</td><td>${T.mI}</td><td>${T.mE}</td><td>${T.pH.toFixed(1)}</td><td>${T.pV.toFixed(1)}</td><td>${T.pT.toFixed(1)}</td><td>${efG}%</td><td>-</td></tr></tbody></table>`;
            document.getElementById('adminOutput').innerHTML = h;
        };

        // --- FUNCIONES DOCENTE ---
        window.render = () => {
            const fSel = document.getElementById('fechaSeleccionada').value;
            const fObj = new Date(fSel + "T00:00:00");
            const esFeriado = window.db.feriados?.includes(fSel);
            const activos = (window.db.alumnos || []).filter(a => !a.retirado);
            
            document.getElementById('docenteTxt').innerText = window.db.docente || "-";
            document.getElementById('gradoSeccionTxt').innerText = `${window.db.grado}${window.db.seccion} - ${window.db.turno}`;
            document.getElementById('btnFeriado').innerText = esFeriado ? "✅ DÍA HÁBIL" : "🚩 MARCAR FERIADO";

            const lista = document.getElementById('listaAsistencia');
            lista.innerHTML = esFeriado ? `<div class="aviso-no">🚩 DÍA FERIADO</div>` : "";
            
            if (!esFeriado) {
                activos.sort((a,b)=>a.nombre.localeCompare(b.nombre)).forEach(a => {
                    const st = (window.db.asistencias[fSel] && window.db.asistencias[fSel][a.id]) || 0;
                    let c = "#ccc", t = "F"; if(st===1){c="var(--exito)"; t="P";} if(st===2){c="var(--morado)"; t="J";}
                    lista.innerHTML += `<div class="alumno-fila">
                        <div class="bola-gen ${a.genero}"></div>
                        <div style="flex-grow:1">${a.nombre}</div>
                        <button onclick="marcar(${a.id})" class="btn-check" style="background:${c}">${t}</button>
                        <button onclick="retirarAlumno(${a.id})" class="btn-x">✖</button>
                    </div>`;
                });
            }

            let sH=0, sV=0, dsH=0, eds={};
            activos.forEach(al => { const e=calcularEdad(al.nacimiento); if(!eds[e]) eds[e]={F:0, M:0}; eds[e][al.genero]++; });
            Object.keys(window.db.asistencias).forEach(f => {
                const d = new Date(f + "T00:00:00");
                if(d.getMonth() === fObj.getMonth() && d.getDay()!==0 && d.getDay()!==6 && !window.db.feriados?.includes(f)) {
                    dsH++; activos.forEach(a => { if(window.db.asistencias[f][a.id]===1) a.genero==='F'?sH++:sV++; });
                }
            });
            const pH=dsH>0?sH/dsH:0, pV=dsH>0?sV/dsH:0, pT=pH+pV, ef=activos.length>0?((pT/activos.length)*100).toFixed(0):0;
            let tEd = ""; Object.keys(eds).sort((a,b)=>a-b).forEach(e => { tEd += `<tr><td>${e}a</td><td>${eds[e].F}</td><td>${eds[e].M}</td><td>${eds[e].F+eds[e].M}</td></tr>`; });

            document.getElementById('reporteDocente').innerHTML = `
                <div class="reporte-card">
                    <h3 style="margin-top:0;">REPORTE MENSUAL</h3>
                    <div class="circulo-eficiencia"><b>${ef}%</b><br><small>Efic.</small></div>
                    <div class="grid-promedios"><div>H: <b>${pH.toFixed(1)}</b></div><div>V: <b>${pV.toFixed(1)}</b></div><div>T: <b>${pT.toFixed(1)}</b></div></div>
                    <table class="tabla-911"><thead><tr><th>Edad</th><th>H</th><th>V</th><th>T</th></tr></thead><tbody>${tEd}</tbody></table>
                    <div style="display:flex; gap:10px; margin-top:15px;" class="no-print">
                        <button onclick="window.print()" style="flex:1; background:var(--azul); color:white; border:none; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer;">🖨️ IMPRIMIR</button>
                        <button onclick='window.exportarListaSimpleExcel(window.db)' style="flex:1; background:#1D6F42; color:white; border:none; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer;">📗 EXCEL</button>
                    </div>
                </div>`;
        };

        window.exportarListaSimpleExcel = (datos) => {
            const ac = (datos.alumnos || []).filter(a => !a.retirado);
            const data = [["EBN LUCILA PALACIOS"], [`DOCENTE: ${datos.docente} | SECCIÓN: ${datos.grado}${datos.seccion}`], [], ["N°", "NOMBRE DEL ESTUDIANTE"]];
            ac.sort((a,b)=>a.nombre.localeCompare(b.nombre)).forEach((a, i) => data.push([i+1, a.nombre]));
            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            ws['!cols'] = [{wch: 5}, {wch: 45}];
            XLSX.utils.book_append_sheet(wb, ws, "Lista");
            XLSX.writeFile(wb, `Lista_${datos.grado}${datos.seccion}.xlsx`);
        };

        window.agregarAlumno = async () => {
            const n = document.getElementById('nom').value.toUpperCase(), na = document.getElementById('nac').value;
            if(!n || !na) return alert("Faltan datos");
            window.db.alumnos.push({ id: Date.now(), nombre: n, genero: document.getElementById('gen').value, nacimiento: na, retirado: false, fechaIngreso: document.getElementById('fechaSeleccionada').value });
            await window.save(); document.getElementById('nom').value="";
        };

        window.marcar = (id) => {
            const f = document.getElementById('fechaSeleccionada').value;
            if(!window.db.asistencias[f]) window.db.asistencias[f]={};
            window.db.asistencias[f][id] = (window.db.asistencias[f][id]+1)%3 || 1;
            window.save();
        };

        window.retirarAlumno = async (id) => {
            if(confirm("¿Retirar estudiante?")){ 
                const a = window.db.alumnos.find(x=>x.id===id); 
                if(a){ a.retirado=true; a.fechaEgreso=document.getElementById('fechaSeleccionada').value; await window.save(); } 
            }
        };

        window.toggleFeriado = async () => {
            const f = document.getElementById('fechaSeleccionada').value;
            if(!window.db.feriados) window.db.feriados = [];
            window.db.feriados.includes(f) ? window.db.feriados=window.db.feriados.filter(x=>x!==f) : window.db.feriados.push(f);
            await window.save();
        };

        window.limpiarMovimientos = async () => {
            if (confirm("¿Limpiar historial de movimientos?")) {
                window.db.alumnos = window.db.alumnos.map(a => ({ ...a, retirado: false, fechaIngreso: null, fechaEgreso: null }));
                await window.save();
            }
        };

        window.borrarMatriculaTotal = async () => {
            if (confirm("¿Borrar todos los alumnos?")) {
                if (prompt("Escriba 'BORRAR':") === "BORRAR") {
                    window.db.alumnos = []; window.db.asistencias = {};
                    await window.save();
                }
            }
        };

        window.save = async () => { await setDoc(doc(dbCloud, "docentes_db", window.usuarioActual), window.db); };
        window.logout = () => location.reload();
    </script>

    <style>
        :root { --azul: #002147; --exito: #28a745; --morado: #6f42c1; --rojo: #dc3545; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; color: #333; }
        header { background: var(--azul); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #f39c12; }
        .container { max-width: 480px; margin: auto; padding: 10px; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .tabla-admin, .tabla-911 { width: 100%; border-collapse: collapse; font-size: 10px; margin-top: 10px; }
        .tabla-admin th, .tabla-admin td, .tabla-911 th, .tabla-911 td { border: 1px solid #ddd; padding: 5px; text-align: center; }
        .tabla-admin th { background: var(--azul); color: white; }
        .reporte-card { background: white; padding: 20px; border-radius: 12px; text-align: center; }
        .circulo-eficiencia { width: 80px; height: 80px; border: 6px solid var(--azul); border-radius: 50%; margin: 10px auto; display: flex; flex-direction: column; justify-content: center; font-size: 20px; font-weight: bold; }
        .grid-promedios { display: flex; justify-content: space-around; background: #f8f9fa; padding: 10px; border-radius: 8px; margin: 15px 0; font-size: 12px; }
        .alumno-fila { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
        .bola-gen.F { background: #ff85a2; width: 12px; height: 12px; border-radius: 50%; }
        .bola-gen.M { background: #3498db; width: 12px; height: 12px; border-radius: 50%; }
        .btn-check { width: 40px; height: 35px; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .btn-x { background: none; border: none; color: var(--rojo); cursor: pointer; font-size: 16px; }
        input, select { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        .aviso-no { text-align: center; padding: 20px; color: var(--rojo); font-weight: bold; background: #fff5f5; border-radius: 8px; }
        @media print { .no-print { display: none !important; } .container { max-width: 100%; } }
    </style>
</head>
<body>

<div id="authSection" style="text-align:center; padding: 50px 20px;">
    <img src="https://raw.githubusercontent.com/ebnlucilapalacios-source/asistencia-lucila-palacios./main/IMG_20260225_005025_993.png" width="100">
    <h2>SISTEMA LUCILA PALACIOS</h2>
    <div id="loginForm" class="card" style="max-width:350px; margin:auto">
        <input type="text" id="loginUser" placeholder="Usuario">
        <input type="password" id="loginPass" placeholder="Contraseña">
        <button onclick="login()" style="background:var(--azul); color:white; padding:15px; width:100%; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">ENTRAR</button>
        <p onclick="mostrarRegistro(true)" style="font-size:13px; color:var(--morado); cursor:pointer; margin-top:20px;">Crear Cuenta</p>
    </div>
    <div id="registerForm" class="card" style="max-width:350px; margin:auto; display:none;">
        <input type="text" id="regNombre" placeholder="Nombre Docente">
        <div style="display:flex; gap:5px;"><input type="text" id="regGrado" placeholder="G"><input type="text" id="regSeccion" placeholder="S"></div>
        <select id="regTurno"><option value="Mañana">Mañana</option><option value="Tarde">Tarde</option></select>
        <input type="text" id="regUser" placeholder="Usuario">
        <input type="password" id="regPass" placeholder="Clave">
        <input type="password" id="regClaveInst" placeholder="Clave Institución">
        <button onclick="registrarCuenta()" style="background:var(--exito); color:white; padding:15px; width:100%; border:none; border-radius:8px; font-weight:bold;">REGISTRAR</button>
        <p onclick="mostrarRegistro(false)" style="font-size:13px; cursor:pointer;">Volver</p>
    </div>
</div>

<div id="appContent" style="display:none;">
    <header class="no-print"><b>EBN LUCILA PALACIOS</b> <button onclick="logout()" style="background:var(--rojo); color:white; border:none; padding:8px 15px; border-radius:6px; cursor:pointer;">SALIR</button></header>

    <div class="container">
        <div id="adminPanel" class="card no-print" style="display:none; border:2px solid var(--morado);">
            <b>📊 DIRECCIÓN</b>
            <button onclick="consolidadoMensual()" style="background:var(--morado); color:white; padding:12px; width:100%; border:none; border-radius:8px; font-weight:bold; margin-top:10px;">GENERAR CONSOLIDADO</button>
            <div id="adminOutput"
