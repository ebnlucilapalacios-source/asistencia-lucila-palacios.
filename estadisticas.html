<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA EBN LUCILA PALACIOS 2026</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root { --azul: #002147; --exito: #28a745; --morado: #6f42c1; --rojo: #dc3545; --naranja: #f39c12; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; color: #333; }
        header { background: var(--azul); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--naranja); position: sticky; top: 0; z-index: 1000; }
        .container { max-width: 480px; margin: auto; padding: 10px; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .tabla-admin, .tabla-911 { width: 100%; border-collapse: collapse; font-size: 10px; margin-top: 10px; background: white; }
        .tabla-admin th, .tabla-admin td, .tabla-911 th, .tabla-911 td { border: 1px solid #ddd; padding: 6px; text-align: center; }
        .tabla-admin th, .tabla-911 th { background: var(--azul); color: white; }
        .reporte-card { background: white; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #ddd; }
        .circulo-eficiencia { width: 70px; height: 70px; border: 5px solid var(--azul); border-radius: 50%; margin: 10px auto; display: flex; flex-direction: column; justify-content: center; font-size: 18px; font-weight: bold; }
        .grid-promedios { display: flex; justify-content: space-around; background: #f8f9fa; padding: 10px; border-radius: 8px; margin: 10px 0; font-size: 12px; }
        .alumno-fila { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
        .bola-gen.F { background: #ff85a2; width: 12px; height: 12px; border-radius: 50%; }
        .bola-gen.M { background: #3498db; width: 12px; height: 12px; border-radius: 50%; }
        .btn-check { width: 45px; height: 35px; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .btn-x { background: none; border: none; color: var(--rojo); cursor: pointer; font-size: 18px; padding: 5px; }
        input, select { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 14px; }
        .btn-principal { background: var(--azul); color: white; padding: 14px; width: 100%; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .aviso-no { text-align: center; padding: 20px; color: var(--rojo); font-weight: bold; background: #fff5f5; border-radius: 8px; border: 1px solid var(--rojo); }
        details summary { font-weight: bold; cursor: pointer; color: var(--azul); padding: 5px; outline: none; }
        @media print { .no-print { display: none !important; } .container { max-width: 100%; } }
    </style>
</head>
<body>

<div id="loadingOverlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:white; display:flex; justify-content:center; align-items:center; z-index:9999;">
    <p style="font-weight:bold; color:var(--azul);">Cargando Sistema Lucila Palacios...</p>
</div>

<div id="authSection" style="display:none; text-align:center; padding: 50px 20px;">
    <img src="https://raw.githubusercontent.com/ebnlucilapalacios-source/asistencia-lucila-palacios./main/IMG_20260225_005025_993.png" width="100" alt="Logo">
    <h2 style="color:var(--azul);">EBN LUCILA PALACIOS</h2>
    
    <div id="loginForm" class="card" style="max-width:350px; margin:auto">
        <input type="text" id="loginUser" placeholder="Usuario">
        <input type="password" id="loginPass" placeholder="Contraseña">
        <button onclick="login()" class="btn-principal">ENTRAR</button>
        <p onclick="mostrarRegistro(true)" style="font-size:13px; color:var(--morado); cursor:pointer; margin-top:20px;">Crear Cuenta Nueva</p>
    </div>

    <div id="registerForm" class="card" style="max-width:350px; margin:auto; display:none;">
        <h3 style="color:var(--azul);">Registro Docente</h3>
        <input type="text" id="regNombre" placeholder="Nombre Completo">
        <div style="display:flex; gap:5px;"><input type="text" id="regGrado" placeholder="Grado"><input type="text" id="regSeccion" placeholder="Sección"></div>
        <select id="regTurno"><option value="Mañana">Mañana</option><option value="Tarde">Tarde</option></select>
        <input type="text" id="regUser" placeholder="Nombre de Usuario">
        <input type="password" id="regPass" placeholder="Contraseña">
        <input type="password" id="regClaveInst" placeholder="Clave Institucional">
        <button onclick="registrarCuenta()" class="btn-principal" style="background:var(--exito);">REGISTRARSE</button>
        <p onclick="mostrarRegistro(false)" style="font-size:13px; cursor:pointer; margin-top:15px;">Volver al Inicio</p>
    </div>
</div>

<div id="appContent" style="display:none;">
    <header class="no-print">
        <b>SISTEMA LUCILA 2026</b>
        <button onclick="location.reload()" style="background:var(--rojo); color:white; border:none; padding:8px 15px; border-radius:6px; cursor:pointer; font-weight:bold;">SALIR</button>
    </header>

    <div class="container">
        <div id="adminPanel" class="card no-print" style="display:none; border: 2px solid var(--morado);">
            <b style="color:var(--morado);">📊 PANEL DE DIRECCIÓN</b>
            <button onclick="consolidadoMensual()" class="btn-principal" style="background:var(--morado); margin-top:10px;">GENERAR CONSOLIDADO</button>
            <div id="adminOutput" style="overflow-x:auto;"></div>
        </div>

        <div class="card no-print">
            <details id="detailsPerfil">
                <summary>⚙️ EDITAR MI PERFIL</summary>
                <div style="margin-top:10px;">
                    <label style="font-size:12px;">Nombre del Docente:</label>
                    <input type="text" id="editNombre">
                    <div style="display:flex; gap:5px;">
                        <div style="flex:1;"><label style="font-size:12px;">Grado:</label><input type="text" id="editGrado"></div>
                        <div style="flex:1;"><label style="font-size:12px;">Sección:</label><input type="text" id="editSeccion"></div>
                    </div>
                    <label style="font-size:12px;">Turno:</label>
                    <select id="editTurno"><option value="Mañana">Mañana</option><option value="Tarde">Tarde</option></select>
                    <button onclick="actualizarPerfil()" class="btn-principal" style="margin-top:10px;">GUARDAR CAMBIOS</button>
                </div>
            </details>
        </div>

        <div class="card no-print">
            <div style="border-left:4px solid var(--azul); padding-left:10px;">
                <b id="docenteTxt"></b><br>
                <span id="gradoSeccionTxt" style="color:#666;"></span>
            </div>
            <input type="date" id="fechaSeleccionada" onchange="renderApp()" style="margin-top:10px;">
            <button id="btnFeriado" onclick="toggleFeriado()" style="background:none; border:1px solid var(--rojo); color:var(--rojo); width:100%; padding:10px; border-radius:8px; font-weight:bold; margin-top:10px; cursor:pointer;"></button>
        </div>

        <div class="card no-print">
            <h4 style="margin:0 0 10px 0; color:var(--exito);">+ Inscripción de Estudiantes</h4>
            <input type="text" id="nom" placeholder="Nombres y Apellidos">
            <div style="display:flex; gap:5px;">
                <select id="gen" style="width:40%"><option value="F">Hembra</option><option value="M">Varón</option></select>
                <input type="date" id="nac" style="width:60%">
            </div>
            <button onclick="agregarAlumno()" class="btn-principal" style="background:var(--exito); margin-top:10px;">INSCRIBIR ALUMNO</button>
        </div>

        <div class="card">
            <div id="listaAsistencia"></div>
        </div>
        
        <div id="reporteDocente"></div>

        <div id="consolidadoIndividualArea"></div>

        <div class="card no-print" style="border: 1px solid #ddd; background: #fafafa;">
            <p style="font-size:11px; color:#777; margin:0 0 10px 0; text-align:center;">Herramientas de Mantenimiento</p>
            <div style="display:flex; gap:8px;">
                <button onclick="limpiarMovimientos()" style="flex:1; background:var(--naranja); color:white; border:none; padding:10px; border-radius:8px; font-size:10px; font-weight:bold; cursor:pointer;">LIMPIAR MOVIMIENTOS</button>
                <button onclick="borrarMatriculaTotal()" style="flex:1; background:var(--rojo); color:white; border:none; padding:10px; border-radius:8px; font-size:10px; font-weight:bold; cursor:pointer;">VACIAR SECCIÓN</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
        authDomain: "control-de-asistencia-d585e.firebaseapp.com",
        projectId: "control-de-asistencia-d585e",
        storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
        appId: "1:368890880546:web:a97ab4372dea536217207b"
    };

    const app = initializeApp(firebaseConfig);
    const dbCloud = getFirestore(app);
    const CLAVE_INST = "LUCILA2026";
    const USUARIO_ADMIN = "admin_lucila";

    // Variables Globales
    let usuarioActual = null;
    let dbLocal = { docente: "", seccion: "", grado: "", turno: "", alumnos: [], asistencias: {}, feriados: [] };

    const calcularEdad = (f) => {
        if(!f) return 0;
        const hoy = new Date();
        const cumple = new Date(f + "T00:00:00");
        let edad = hoy.getFullYear() - cumple.getFullYear();
        if (hoy.getMonth() < cumple.getMonth() || (hoy.getMonth() === cumple.getMonth() && hoy.getDate() < cumple.getDate())) edad--;
        return edad;
    };

    // Funciones de Autenticación
    window.mostrarRegistro = (v) => {
        document.getElementById('loginForm').style.display = v ? 'none' : 'block';
        document.getElementById('registerForm').style.display = v ? 'block' : 'none';
    };

    window.registrarCuenta = async () => {
        const ci = document.getElementById('regClaveInst').value;
        if(ci !== CLAVE_INST) return alert("Clave Institucional Incorrecta");
        const u = document.getElementById('regUser').value.toLowerCase().trim();
        if(!u) return alert("Usuario requerido");
        
        await setDoc(doc(dbCloud, "docentes_db", u), {
            docente: document.getElementById('regNombre').value.toUpperCase(),
            pass: document.getElementById('regPass').value,
            grado: document.getElementById('regGrado').value,
            seccion: document.getElementById('regSeccion').value.toUpperCase(),
            turno: document.getElementById('regTurno').value,
            alumnos: [], asistencias: {}, feriados: []
        });
        alert("Cuenta Creada Exitosamente");
        window.mostrarRegistro(false);
    };

    window.login = async () => {
        const u = document.getElementById('loginUser').value.toLowerCase().trim();
        const p = document.getElementById('loginPass').value;
        const snap = await getDoc(doc(dbCloud, "docentes_db", u));
        
        if (snap.exists() && snap.data().pass === p) {
            usuarioActual = u;
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('appContent').style.display = 'block';
            if (u === USUARIO_ADMIN) document.getElementById('adminPanel').style.display = 'block';
            
            onSnapshot(doc(dbCloud, "docentes_db", u), (s) => {
                dbLocal = s.data();
                actualizarCamposPerfil();
                window.renderApp();
            });
        } else {
            alert("Acceso denegado. Verifique su usuario y contraseña.");
        }
    };

    function actualizarCamposPerfil() {
        document.getElementById('editNombre').value = dbLocal.docente;
        document.getElementById('editGrado').value = dbLocal.grado;
        document.getElementById('editSeccion').value = dbLocal.seccion;
        document.getElementById('editTurno').value = dbLocal.turno;
    }

    window.actualizarPerfil = async () => {
        dbLocal.docente = document.getElementById('editNombre').value.toUpperCase();
        dbLocal.grado = document.getElementById('editGrado').value;
        dbLocal.seccion = document.getElementById('editSeccion').value.toUpperCase();
        dbLocal.turno = document.getElementById('editTurno').value;
        await saveCloud();
        alert("Perfil Actualizado Correctamente");
        document.getElementById('detailsPerfil').removeAttribute("open");
    };

    // Renderizado Principal del Docente
    window.renderApp = () => {
        const f = document.getElementById('fechaSeleccionada').value;
        const esFeriado = dbLocal.feriados?.includes(f);
        const activos = dbLocal.alumnos.filter(a => !a.retirado);
        
        document.getElementById('docenteTxt').innerText = dbLocal.docente;
        document.getElementById('gradoSeccionTxt').innerText = `${dbLocal.grado}° Sección "${dbLocal.seccion}" - ${dbLocal.turno}`;
        document.getElementById('btnFeriado').innerText = esFeriado ? "✅ DÍA MARCADO COMO NO LABORABLE" : "🚩 MARCAR COMO FERIADO/NO LABORABLE";

        const listaDiv = document.getElementById('listaAsistencia');
        listaDiv.innerHTML = esFeriado ? `<div class="aviso-no">🚩 DÍA FERIADO / NO LABORABLE</div>` : "";

        if(!esFeriado) {
            activos.sort((a,b) => a.nombre.localeCompare(b.nombre)).forEach(a => {
                const st = (dbLocal.asistencias[f] && dbLocal.asistencias[f][a.id]) || 0;
                let color = "#ccc", texto = "F";
                if(st === 1) { color = "var(--exito)"; texto = "P"; }
                if(st === 2) { color = "var(--morado)"; texto = "J"; }
                
                listaDiv.innerHTML += `
                    <div class="alumno-fila">
                        <div class="bola-gen ${a.genero}"></div>
                        <div style="flex-grow:1; font-size:14px;">${a.nombre}</div>
                        <button onclick="marcar(${a.id})" class="btn-check" style="background:${color}">${texto}</button>
                        <button onclick="retirarAlumno(${a.id})" class="btn-x">✖</button>
                    </div>`;
            });
        }
        generarEstadisticaDocente(f, activos);
        window.generarConsolidadoIndividual(f, activos);
    };

    // Funciones de Asistencia y Matrícula
    window.marcar = (id) => {
        const f = document.getElementById('fechaSeleccionada').value;
        if(!dbLocal.asistencias[f]) dbLocal.asistencias[f] = {};
        
        let actual = dbLocal.asistencias[f][id] || 0;
        // Ciclo: 0(F) -> 1(P) -> 2(J) -> 0(F)
        dbLocal.asistencias[f][id] = (actual + 1) % 3; 
        
        saveCloud();
    };

    window.agregarAlumno = async () => {
        const n = document.getElementById('nom').value.toUpperCase();
        const nac = document.getElementById('nac').value;
        if(!n || !nac) return alert("Por favor complete el nombre y la fecha de nacimiento.");
        
        dbLocal.alumnos.push({ 
            id: Date.now(), 
            nombre: n, 
            genero: document.getElementById('gen').value, 
            nacimiento: nac, 
            retirado: false, 
            fechaIngreso: document.getElementById('fechaSeleccionada').value 
        });
        await saveCloud();
        document.getElementById('nom').value = "";
    };

    window.retirarAlumno = async (id) => {
        if(confirm("¿Está seguro de retirar a este estudiante de su lista activa?")) {
            const a = dbLocal.alumnos.find(x => x.id === id);
            if(a) { 
                a.retirado = true; 
                a.fechaEgreso = document.getElementById('fechaSeleccionada').value; 
                await saveCloud(); 
            }
        }
    };

    window.toggleFeriado = async () => {
        const f = document.getElementById('fechaSeleccionada').value;
        if(!dbLocal.feriados) dbLocal.feriados = [];
        dbLocal.feriados.includes(f) ? dbLocal.feriados = dbLocal.feriados.filter(x => x !== f) : dbLocal.feriados.push(f);
        await saveCloud();
    };

    // Estadísticas del Docente (Reporte Mensual)
    function generarEstadisticaDocente(fechaActual, activos) {
        const fObj = new Date(fechaActual + "T00:00:00");
        const mesRef = fObj.getMonth();
        let sH=0, sV=0, diasHabiles=0;
        let eds = {};

        // Calcular edades
        activos.forEach(al => { 
            const e = calcularEdad(al.nacimiento); 
            if(!eds[e]) eds[e] = {F:0, M:0}; 
            eds[e][al.genero]++; 
        });

        // Calcular promedios del mes
        Object.keys(dbLocal.asistencias).forEach(fecha => {
            const d = new Date(fecha + "T00:00:00");
            if(d.getMonth() === mesRef && d.getDay() !== 0 && d.getDay() !== 6 && !dbLocal.feriados?.includes(fecha)) {
                diasHabiles++;
                activos.forEach(a => { if(dbLocal.asistencias[fecha][a.id] === 1) a.genero === 'F' ? sH++ : sV++; });
            }
        });

        const pH = diasHabiles > 0 ? sH/diasHabiles : 0;
        const pV = diasHabiles > 0 ? sV/diasHabiles : 0;
        const pT = pH + pV;
        const ef = activos.length > 0 ? ((pT / activos.length) * 100).toFixed(0) : 0;

        let tablaEdadesHTML = "";
        Object.keys(eds).sort((a,b)=>a-b).forEach(e => { 
            tablaEdadesHTML += `<tr><td>${e} años</td><td>${eds[e].F}</td><td>${eds[e].M}</td><td>${eds[e].F+eds[e].M}</td></tr>`; 
        });

        document.getElementById('reporteDocente').innerHTML = `
            <div class="reporte-card">
                <h3 style="margin:0; color:var(--azul);">REPORTE ESTADÍSTICO MENSUAL</h3>
                <div class="circulo-eficiencia"><b>${ef}%</b><br><small>Eficiencia</small></div>
                <div class="grid-promedios">
                    <div>Hembras: <br><b>${pH.toFixed(1)}</b></div>
                    <div>Varones: <br><b>${pV.toFixed(1)}</b></div>
                    <div>Total: <br><b>${pT.toFixed(1)}</b></div>
                </div>
                
                <h4 style="margin: 15px 0 5px 0; font-size:12px;">TABLA DE EDADES (911)</h4>
                <table class="tabla-911">
                    <thead><tr><th>Edad</th><th>H</th><th>V</th><th>T</th></tr></thead>
                    <tbody>${tablaEdadesHTML}</tbody>
                </table>

                <div style="display:flex; gap:10px; margin-top:15px;" class="no-print">
                    <button onclick="window.print()" style="flex:1; background:var(--azul); color:white; border:none; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer;">🖨️ IMPRIMIR</button>
                    <button onclick="window.exportarMiExcel()" style="flex:1; background:#1D6F42; color:white; border:none; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer;">📗 MI LISTA EXCEL</button>
                </div>
            </div>`;
    }

    // Consolidado Individual (Oculto en un <details> con botón PDF)
    window.generarConsolidadoIndividual = (fechaActual, activos) => {
        const mesRef = new Date(fechaActual + "T00:00:00").getMonth();
        
        let h = `
            <div class="card no-print" style="margin-top:15px; border-top:4px solid var(--azul);">
                <details>
                    <summary style="font-weight:bold; cursor:pointer; color:var(--azul); font-size:14px; text-align:center;">
                        👀 VER HISTORIAL INDIVIDUAL DEL MES
                    </summary>
                    <div style="margin-top:15px;">
                        <table class="tabla-911">
                            <thead>
                                <tr>
                                    <th style="text-align:left;">Estudiante</th>
                                    <th title="Presente">P</th>
                                    <th title="Justificado">J</th>
                                    <th title="Falta">F</th>
                                    <th>%</th>
                                </tr>
                            </thead>
                            <tbody>`;

        activos.sort((a,b) => a.nombre.localeCompare(b.nombre)).forEach(a => {
            let p=0, j=0, f=0, totalDias=0;
            
            Object.keys(dbLocal.asistencias).forEach(fecha => {
                const d = new Date(fecha + "T00:00:00");
                if(d.getMonth() === mesRef && d.getDay() !== 0 && d.getDay() !== 6 && !dbLocal.feriados?.includes(fecha)) {
                    totalDias++;
                    const st = dbLocal.asistencias[fecha][a.id] || 0; 
                    if(st === 1) p++;
                    else if(st === 2) j++;
                    else f++;
                }
            });

            const porc = totalDias > 0 ? ((p / totalDias) * 100).toFixed(0) : 0;
            const colorPorc = porc < 75 && totalDias > 0 ? 'var(--rojo)' : 'var(--exito)';

            h += `
                <tr>
                    <td style="text-align:left; font-size:11px;">${a.nombre}</td>
                    <td style="color:var(--exito); font-weight:bold;">${p}</td>
                    <td style="color:var(--morado);">${j}</td>
                    <td style="color:var(--rojo);">${f}</td>
                    <td style="font-weight:bold; color:${colorPorc}">${totalDias > 0 ? porc+'%' : '-'}</td>
                </tr>`;
        });

        h += `          </tbody>
                    </table>
                    <button onclick="window.exportarIndividualPDF()" class="btn-principal" style="background:var(--rojo); margin-top:15px; display:flex; justify-content:center; align-items:center; gap:10px;">
                        📄 DESCARGAR PDF INDIVIDUAL
                    </button>
                </div>
            </details>
        </div>`;
        
        document.getElementById('consolidadoIndividualArea').innerHTML = h;
    };

    // NUEVA FUNCIÓN: Exportar el Historial Individual a PDF
    window.exportarIndividualPDF = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        const fSel = document.getElementById('fechaSeleccionada').value;
        const mesRef = new Date(fSel + "T00:00:00").getMonth();
        const nombresMeses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        const mesActual = nombresMeses[mesRef];

        // Encabezado del PDF
        doc.setFontSize(14);
        doc.setTextColor(0, 33, 71); // var(--azul)
        doc.text("EBN LUCILA PALACIOS", 14, 20);
        
        doc.setFontSize(11);
        doc.setTextColor(50, 50, 50);
        doc.text(`Docente: ${dbLocal.docente}`, 14, 28);
        doc.text(`Grado y Sección: ${dbLocal.grado}"${dbLocal.seccion}" - Turno: ${dbLocal.turno}`, 14, 34);
        doc.text(`Reporte de Asistencia Individual - Mes: ${mesActual}`, 14, 40);

        const activos = dbLocal.alumnos.filter(a => !a.retirado).sort((a,b) => a.nombre.localeCompare(b.nombre));
        const bodyData = [];

        // Extraer la data
        activos.forEach(a => {
            let p=0, j=0, f=0, totalDias=0;
            Object.keys(dbLocal.asistencias).forEach(fecha => {
                const d = new Date(fecha + "T00:00:00");
                if(d.getMonth() === mesRef && d.getDay() !== 0 && d.getDay() !== 6 && !dbLocal.feriados?.includes(fecha)) {
                    totalDias++;
                    const st = dbLocal.asistencias[fecha][a.id] || 0;
                    if(st === 1) p++;
                    else if(st === 2) j++;
                    else f++;
                }
            });
            const porc = totalDias > 0 ? ((p / totalDias) * 100).toFixed(0) + '%' : '-';
            bodyData.push([a.nombre, p, j, f, porc]);
        });

        // Crear la tabla en el PDF
        doc.autoTable({
            startY: 46,
            head: [['Nombres y Apellidos del Estudiante', 'Presente (P)', 'Justificado (J)', 'Falta (F)', '% Asistencia']],
            body: bodyData,
            headStyles: { fillColor: [0, 33, 71] }, // Azul Institucional
            styles: { fontSize: 10, halign: 'center' },
            columnStyles: { 0: { halign: 'left' } } // Alinear los nombres a la izquierda
        });

        // Guardar Archivo
        doc.save(`Asistencia_Individual_${dbLocal.grado}${dbLocal.seccion}_${mesActual}.pdf`);
    };

    // Herramientas de Mantenimiento
    window.limpiarMovimientos = async () => {
        if(confirm("¿Desea reiniciar el conteo de ingresos y egresos? (Recomendado al iniciar un nuevo mes o lapso)")) {
            dbLocal.alumnos = dbLocal.alumnos.map(a => ({ ...a, retirado: false, fechaIngreso: null, fechaEgreso: null }));
            await saveCloud();
            alert("Movimientos limpiados.");
        }
    };

    window.borrarMatriculaTotal = async () => {
        if(confirm("¡ADVERTENCIA! ¿Está seguro de querer borrar a todos los estudiantes de esta sección?")) {
            if(prompt("Escriba la palabra BORRAR para confirmar:") === "BORRAR") {
                dbLocal.alumnos = []; 
                dbLocal.asistencias = {}; 
                await saveCloud();
                alert("Sección vaciada.");
            }
        }
    };

    // PANEL DE DIRECCIÓN
    window.consolidadoMensual = async () => {
        const fSel = document.getElementById('fechaSeleccionada').value;
        const mesRef = new Date(fSel + "T00:00:00").getMonth();
        const snap = await getDocs(collection(dbCloud, "docentes_db"));
        let docs = [];
        snap.forEach(s => { if(s.id !== USUARIO_ADMIN) docs.push(s.data()); });
        docs.sort((a,b) => (parseInt(a.grado)-parseInt(b.grado)) || a.seccion.localeCompare(b.seccion));

        let h = `<table class="tabla-admin" id="tablaDireccion"><thead>
            <tr><th rowspan="2">DOCENTE</th><th rowspan="2">G/S</th><th colspan="3">MATRÍCULA</th><th colspan="2">MOV</th><th colspan="3">PROM. REAL</th></tr>
            <tr><th>H</th><th>V</th><th>T</th><th>I</th><th>E</th><th>H</th><th>V</th><th>T</th></tr></thead><tbody>`;
        
        let Totales = { mH:0, mV:0, mT:0, mI:0, mE:0, pH:0, pV:0, pT:0 };

        docs.forEach(d => {
            const ac = d.alumnos.filter(a => !a.retirado);
            const mH = ac.filter(a=>a.genero==='F').length;
            const mV = ac.filter(a=>a.genero==='M').length;
            const mT = mH + mV;
            const mI = d.alumnos.filter(a => a.fechaIngreso && new Date(a.fechaIngreso+"T00:00:00").getMonth() === mesRef).length;
            const mE = d.alumnos.filter(a => a.retirado && a.fechaEgreso && new Date(a.fechaEgreso+"T00:00:00").getMonth() === mesRef).length;
            
            let sH=0, sV=0, ds=0;
            Object.keys(d.asistencias || {}).forEach(f => {
                const fo = new Date(f+"T00:00:00");
                if(fo.getMonth() === mesRef && fo.getDay()!==0 && fo.getDay()!==6 && !d.feriados?.includes(f)) {
                    ds++; 
                    ac.forEach(a => { if(d.asistencias[f][a.id] === 1) a.genero === 'F' ? sH++ : sV++; });
                }
            });
            const pH = ds>0 ? sH/ds : 0;
            const pV = ds>0 ? sV/ds : 0;
            const pT = pH + pV;

            Totales.mH+=mH; Totales.mV+=mV; Totales.mT+=mT; Totales.mI+=mI; Totales.mE+=mE; Totales.pH+=pH; Totales.pV+=pV; Totales.pT+=pT;

            h += `<tr><td>${d.docente}</td><td>${d.grado}${d.seccion}</td><td>${mH}</td><td>${mV}</td><td>${mT}</td><td>${mI}</td><td>${mE}</td><td>${pH.toFixed(1)}</td><td>${pV.toFixed(1)}</td><td>${pT.toFixed(1)}</td></tr>`;
        });
        
        // Fila de Totales de la Escuela
        h += `<tr style="background:#333; color:white; font-weight:bold;"><td>TOTAL ESCUELA</td><td>-</td><td>${Totales.mH}</td><td>${Totales.mV}</td><td>${Totales.mT}</td><td>${Totales.mI}</td><td>${Totales.mE}</td><td>${Totales.pH.toFixed(1)}</td><td>${Totales.pV.toFixed(1)}</td><td>${Totales.pT.toFixed(1)}</td></tr>`;

        h += `</tbody></table><button onclick="window.exportarExcelDireccion()" class="btn-principal" style="background:#1D6F42; margin-top:10px;">📊 DESCARGAR EXCEL DIRECCIÓN</button>`;
        document.getElementById('adminOutput').innerHTML = h;
    };

    window.exportarExcelDireccion = () => {
        const wb = XLSX.utils.table_to_book(document.getElementById("tablaDireccion"), { sheet: "Consolidado Institucional" });
        XLSX.writeFile(wb, "Consolidado_Direccion_Lucila_Palacios.xlsx");
    };

    window.exportarMiExcel = () => {
        const activos = dbLocal.alumnos.filter(a => !a.retirado).sort((a,b)=>a.nombre.localeCompare(b.nombre));
        const data = [["EBN LUCILA PALACIOS"], [`DOCENTE: ${dbLocal.docente} | GRADO/SECCIÓN: ${dbLocal.grado}"${dbLocal.seccion}"`], [], ["N°", "NOMBRES Y APELLIDOS DEL ESTUDIANTE"]];
        activos.forEach((a, i) => data.push([i+1, a.nombre]));
        
        const ws = XLSX.utils.aoa_to_sheet(data);
        ws['!cols'] = [{wch: 5}, {wch: 45}]; // Ajustar tamaño de columnas
        
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Lista de Estudiantes");
        XLSX.writeFile(wb, `Lista_Estudiantes_${dbLocal.grado}${dbLocal.seccion}.xlsx`);
    };

    async function saveCloud() { 
        await setDoc(doc(dbCloud, "docentes_db", usuarioActual), dbLocal); 
    }

    // Inicialización de la Aplicación
    window.onload = () => {
        // Poner la fecha de hoy por defecto
        document.getElementById('fechaSeleccionada').value = new Date().toISOString().split('T')[0];
        // Ocultar pantalla de carga y mostrar login
        document.getElementById('loadingOverlay').style.display = 'none';
        document.getElementById('authSection').style.display = 'block';
    };

</script>
</body>
</html>
