<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA EBN LUCILA PALACIOS - INTEGRAL 2026</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
            authDomain: "control-de-asistencia-d585e.firebaseapp.com",
            projectId: "control-de-asistencia-d585e",
            storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
            appId: "1:368890880546:web:a97ab4372dea536217207b"
        };

        const app = initializeApp(firebaseConfig);
        const dbCloud = getFirestore(app);
        const CLAVE_INST = "LUCILA2026";
        const USUARIO_ADMIN = "admin_lucila";

        window.usuarioActual = null;
        window.db = { docente: "", seccion: "", grado: "", turno: "", rol: "DOCENTE", alumnos: [], asistencias: {}, feriados: [], alumnosVirtuales: [] };

        const calcularEdad = (f) => {
            if(!f) return 0;
            const hoy = new Date();
            const cumple = new Date(f);
            let edad = hoy.getFullYear() - cumple.getFullYear();
            if (hoy.getMonth() < cumple.getMonth() || (hoy.getMonth() === cumple.getMonth() && hoy.getDate() < cumple.getDate())) edad--;
            return edad;
        };

        // --- ACCESO Y SESIÓN ---
        window.mostrarRegistro = (v) => { 
            document.getElementById('loginForm').style.display = v ? 'none' : 'block';
            document.getElementById('registerForm').style.display = v ? 'block' : 'none';
        };

        window.registrarCuenta = async () => {
            if(document.getElementById('regClaveInst').value !== CLAVE_INST) return Swal.fire('Error', 'Clave Institucional Incorrecta', 'error');
            const u = document.getElementById('regUser').value.toLowerCase().trim();
            await setDoc(doc(dbCloud, "docentes_db", u), { 
                docente: document.getElementById('regNombre').value.toUpperCase(), 
                pass: document.getElementById('regPass').value, 
                grado: document.getElementById('regGrado').value, 
                seccion: document.getElementById('regSeccion').value.toUpperCase(), 
                turno: document.getElementById('regTurno').value,
                rol: document.getElementById('regRol').value, // Nuevo campo de rol
                alumnos: [], asistencias: {}, feriados: [] 
            });
            Swal.fire('¡Éxito!', 'Cuenta creada correctamente.', 'success');
            window.mostrarRegistro(false);
        };

        window.login = async () => {
            const u = document.getElementById('loginUser').value.toLowerCase().trim();
            const p = document.getElementById('loginPass').value;
            
            Swal.fire({ title: 'Cargando...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

            try {
                const snap = await getDoc(doc(dbCloud, "docentes_db", u));
                
                if (snap.exists() && snap.data().pass === p) {
                    window.usuarioActual = u;
                    localStorage.setItem('lucila_usuario', u);
                    localStorage.setItem('lucila_pass', p);

                    const hoy = new Date();
                    document.getElementById('fechaSeleccionada').value = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}-${String(hoy.getDate()).padStart(2, '0')}`;

                    document.getElementById('authSection').style.display = 'none';
                    document.getElementById('appContent').style.display = 'block';
                    if (u === USUARIO_ADMIN) document.getElementById('adminPanel').style.display = 'block';
                    
                    onSnapshot(doc(dbCloud, "docentes_db", u), async (s) => { 
                        window.db = s.data();
                        if(!window.db.rol) window.db.rol = "DOCENTE"; // Compatibilidad hacia atrás
                        if(window.db.rol === "ESPECIALISTA") await window.cargarMatriculaEspecialista();
                        window.render(); 
                    });
                    Swal.close();
                } else { 
                    Swal.fire('Acceso denegado', 'Usuario o contraseña incorrectos.', 'error');
                }
            } catch (error) {
                Swal.fire('Error', 'No se pudo conectar a la base de datos.', 'error');
            }
        };

        // --- CARGA DINÁMICA DE ESPECIALISTAS ---
        window.cargarMatriculaEspecialista = async () => {
            const snap = await getDocs(collection(dbCloud, "docentes_db"));
            let alumnosEspecialista = [];
            snap.forEach(dSnap => {
                if(dSnap.id === USUARIO_ADMIN) return;
                const d = dSnap.data();
                // Traer estudiantes de docentes regulares del mismo turno
                if(d.rol !== "ESPECIALISTA" && d.turno === window.db.turno) {
                    const activos = (d.alumnos || []).filter(a => !a.retirado);
                    activos.forEach(a => {
                        alumnosEspecialista.push({ ...a, gradoSeccion: `${d.grado}${d.seccion}` });
                    });
                }
            });
            // Ordenar por grado/sección y luego por nombre
            alumnosEspecialista.sort((a,b) => a.gradoSeccion.localeCompare(b.gradoSeccion) || a.nombre.localeCompare(b.nombre));
            window.db.alumnosVirtuales = alumnosEspecialista;
        };

        window.checkSession = async () => {
            const u = localStorage.getItem('lucila_usuario');
            const p = localStorage.getItem('lucila_pass');
            if (u && p) { document.getElementById('loginUser').value = u; document.getElementById('loginPass').value = p; await window.login(); }
        };

        window.logout = () => { localStorage.clear(); location.reload(); };

        window.actualizarPerfil = async () => {
            window.db.docente = document.getElementById('editDocente').value.toUpperCase();
            window.db.grado = document.getElementById('editGrado').value;
            window.db.seccion = document.getElementById('editSeccion').value.toUpperCase();
            window.db.turno = document.getElementById('editTurno').value;
            window.db.rol = document.getElementById('editRol').value;
            await window.save(); 
            Swal.fire('Actualizado', 'Perfil guardado correctamente', 'success');
        };

        // --- DIRECCIÓN (ESTADÍSTICAS Y GESTIÓN) ---
        window.eliminarDocenteAdmin = async (uID) => {
            if(uID === USUARIO_ADMIN) return Swal.fire('Error', 'No puedes eliminar al administrador.', 'error');
            const result = await Swal.fire({ title: `¿Eliminar al usuario: ${uID}?`, text: "Esta acción es permanente.", icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'Sí, eliminar' });
            if(result.isConfirmed){ await deleteDoc(doc(dbCloud, "docentes_db", uID)); window.consolidadoMensual(); }
        };

        window.cambiarCredencialesDocente = async () => {
            const oldU = document.getElementById('adminOldUser').value.toLowerCase().trim();
            const newU = document.getElementById('adminNewUser').value.toLowerCase().trim();
            const newP = document.getElementById('adminNewPass').value;
            if(!oldU) return;
            const oldRef = doc(dbCloud, "docentes_db", oldU);
            const snap = await getDoc(oldRef);
            if(!snap.exists()) return Swal.fire('Error', 'El usuario actual no existe.', 'error');
            const data = snap.data();
            if(newP) data.pass = newP;
            if(newU && newU !== oldU) { await setDoc(doc(dbCloud, "docentes_db", newU), data); await deleteDoc(oldRef); } 
            else { await setDoc(oldRef, data); }
            Swal.fire('Éxito', 'Credenciales actualizadas.', 'success');
        };

        window.consolidadoMensual = async () => {
            const fSel = document.getElementById('fechaSeleccionada').value;
            const mesRef = new Date(fSel + "T00:00:00").getMonth();
            const snap = await getDocs(collection(dbCloud, "docentes_db"));
            
            let todosLosDocentes = []; 
            let docentesData = []; 
            let especialistasData = [];

            snap.forEach(dSnap => {
                if(dSnap.id === USUARIO_ADMIN) return;
                const d = dSnap.data();
                d.idLogin = dSnap.id;
                todosLosDocentes.push(d);
                
                // Separar Docentes de Especialistas para no duplicar matrícula en escuela
                if(d.rol === "ESPECIALISTA" || d.docente.includes("ESPECIALISTA")) {
                    especialistasData.push(d);
                } else {
                    docentesData.push(d);
                }
            });

            docentesData.sort((a,b) => (parseInt(a.grado) || 0) - (parseInt(b.grado) || 0) || (a.seccion || "").localeCompare(b.seccion || ""));

            let h = `
                <div class="resumen-direccion">
                    <strong style="color:var(--morado);">👥 GESTIÓN DE CUENTAS</strong>
                    <table class="tabla-admin" style="margin-top:5px; margin-bottom:15px;">
                        <thead><tr style="background:#34495e;"><th>USUARIO</th><th>DOCENTE</th><th>ROL</th><th>ELIMINAR</th></tr></thead>
                        <tbody>`;
            todosLosDocentes.forEach(docu => {
                h += `<tr><td>${docu.idLogin}</td><td style="text-align:left">${docu.docente}</td><td>${docu.rol||'DOCENTE'}</td><td><button onclick="eliminarDocenteAdmin('${docu.idLogin}')" style="background:none; border:none; cursor:pointer;">🗑️</button></td></tr>`;
            });
            h += `</tbody></table>
                    <hr style="border:1px dashed #ccc;">
                    <div style="text-align:center; font-size:14px; color:var(--azul); margin-top:10px;"><strong>ESTADÍSTICA INSTITUCIONAL (DOCENTES)</strong></div>
                </div>
                <div class="btns-admin-row no-print">
                    <button onclick="descargarPDFAdmin()" class="btn-pdf">💾 GUARDAR PDF</button>
                    <button onclick="window.print()" class="btn-print-admin">🖨️ IMPRIMIR</button>
                </div>
                <table class="tabla-admin" id="tablaAdminConsolidado">
                <thead>
                    <tr><th rowspan="2">DOCENTE</th><th rowspan="2">G/S/T</th><th colspan="3">MATRÍCULA</th><th colspan="2">MOV</th><th colspan="3">PROM. REAL</th><th rowspan="2">% EFIC</th></tr>
                    <tr><th>H</th><th>V</th><th>T</th><th>I</th><th>E</th><th>H</th><th>V</th><th>T</th></tr>
                </thead><tbody>`;
            
            let T = { mH:0, mV:0, mT:0, mI:0, mE:0, pH:0, pV:0, pT:0 };

            // Función interna para calcular stats por fila
            const calcularFila = (d, alms) => {
                const ac = alms.filter(a => !a.retirado);
                const mH=ac.filter(a=>a.genero==='F').length, mV=ac.filter(a=>a.genero==='M').length, mT=ac.length;
                const mI = alms.filter(a => a.fechaIngreso && new Date(a.fechaIngreso+"T00:00:00").getMonth() === mesRef).length;
                const mE = alms.filter(a => a.retirado && a.fechaEgreso && new Date(a.fechaEgreso+"T00:00:00").getMonth() === mesRef).length;

                let sH=0, sV=0, ds=0;
                Object.keys(d.asistencias || {}).forEach(f => {
                    const fo = new Date(f + "T00:00:00");
                    if(fo.getMonth() === mesRef && fo.getDay()!==0 && fo.getDay()!==6 && !d.feriados?.includes(f)) {
                        ds++; ac.forEach(a => { if(d.asistencias[f] && d.asistencias[f][a.id] === 1) a.genero === 'F' ? sH++ : sV++; });
                    }
                });
                const pH=ds>0?sH/ds:0, pV=ds>0?sV/ds:0, pT=pH+pV, ef=mT>0?(pT/mT*100).toFixed(1):0;
                return {mH, mV, mT, mI, mE, pH, pV, pT, ef};
            };

            docentesData.forEach(d => {
                const s = calcularFila(d, d.alumnos || []);
                T.mH+=s.mH; T.mV+=s.mV; T.mT+=s.mT; T.mI+=s.mI; T.mE+=s.mE; T.pH+=s.pH; T.pV+=s.pV; T.pT+=s.pT;
                h += `<tr><td style="text-align:left">${d.docente}</td><td>${d.grado}${d.seccion}</td><td>${s.mH}</td><td>${s.mV}</td><td>${s.mT}</td><td>${s.mI}</td><td>${s.mE}</td><td>${s.pH.toFixed(1)}</td><td>${s.pV.toFixed(1)}</td><td>${s.pT.toFixed(1)}</td><td>${s.ef}%</td></tr>`;
            });
            const efG = T.mT>0?(T.pT/T.mT*100).toFixed(1):0;
            h += `<tr class="fila-total"><td>ESCUELA</td><td>-</td><td>${T.mH}</td><td>${T.mV}</td><td>${T.mT}</td><td>${T.mI}</td><td>${T.mE}</td><td>${T.pH.toFixed(1)}</td><td>${T.pV.toFixed(1)}</td><td>${T.pT.toFixed(1)}</td><td>${efG}%</td></tr></tbody></table>`;

            // Añadir tabla de especialistas
            if(especialistasData.length > 0) {
                h += `<div style="text-align:center; font-size:14px; color:var(--morado); margin-top:20px;"><strong>ESTADÍSTICA DE ESPECIALISTAS</strong></div>
                <table class="tabla-admin" id="tablaEspecialistas">
                <thead><tr><th rowspan="2">ESPECIALISTA</th><th rowspan="2">TURNO</th><th colspan="3">MATRÍCULA ATENDIDA</th><th colspan="3">PROM. REAL ASIST.</th><th rowspan="2">% EFIC</th></tr>
                <tr><th>H</th><th>V</th><th>T</th><th>H</th><th>V</th><th>T</th></tr></thead><tbody>`;
                
                // Para calcular a los especialistas, necesitamos la matrícula global de su turno
                especialistasData.forEach(esp => {
                    let almsTurno = [];
                    docentesData.filter(doc => doc.turno === esp.turno).forEach(doc => { almsTurno = almsTurno.concat(doc.alumnos||[]); });
                    const s = calcularFila(esp, almsTurno);
                    h += `<tr><td style="text-align:left">${esp.docente}</td><td>${esp.turno}</td><td>${s.mH}</td><td>${s.mV}</td><td>${s.mT}</td><td>${s.pH.toFixed(1)}</td><td>${s.pV.toFixed(1)}</td><td>${s.pT.toFixed(1)}</td><td>${s.ef}%</td></tr>`;
                });
                h += `</tbody></table>`;
            }

            document.getElementById('adminOutput').innerHTML = h;
        };

        window.descargarPDFAdmin = () => {
            const doc = new jspdf.jsPDF('l');
            doc.text("CONSOLIDADO DIRECCIÓN - DOCENTES", 14, 15);
            doc.autoTable({ html: '#tablaAdminConsolidado', startY: 22, theme: 'grid', styles: {fontSize: 8} });
            if(document.getElementById('tablaEspecialistas')){
                doc.text("CONSOLIDADO DIRECCIÓN - ESPECIALISTAS", 14, doc.lastAutoTable.finalY + 15);
                doc.autoTable({ html: '#tablaEspecialistas', startY: doc.lastAutoTable.finalY + 20, theme: 'grid', styles: {fontSize: 8} });
            }
            doc.save("Consolidado_Direccion.pdf");
        };

        // --- CONSOLIDADO INDIVIDUAL ALUMNOS ---
        window.toggleConsolidadoInd = () => {
            const p = document.getElementById('panelConsolidadoInd');
            p.style.display = p.style.display === 'none' ? 'block' : 'none';
            if(p.style.display === 'block') window.generarConsolidadoIndividual();
        };

        window.generarConsolidadoIndividual = () => {
            const fSel = document.getElementById('fechaSeleccionada').value;
            const mesRef = new Date(fSel + "T00:00:00").getMonth();
            const esEspecialista = window.db.rol === "ESPECIALISTA";
            const activos = esEspecialista ? (window.db.alumnosVirtuales || []) : (window.db.alumnos || []).filter(a => !a.retirado).sort((a,b) => a.nombre.localeCompare(b.nombre));
            
            let dsHab = 0, fList = [];
            Object.keys(window.db.asistencias || {}).forEach(f => {
                const fo = new Date(f + "T00:00:00");
                if(fo.getMonth() === mesRef && fo.getDay()!==0 && fo.getDay()!==6 && !window.db.feriados?.includes(f)) { dsHab++; fList.push(f); }
            });

            let h = `<table class="tabla-admin" id="tablaConsolidadoInd"><thead><tr><th>N°</th><th>CÉDULA</th><th>NOMBRE</th><th>G</th><th>ASIS</th><th>INAS</th><th>JUST</th><th>%</th></tr></thead><tbody>`;
            
            activos.forEach((a, i) => {
                let asis = 0, inasis = 0, justif = 0;
                fList.forEach(f => {
                    const estado = window.db.asistencias[f] ? window.db.asistencias[f][a.id] : 0;
                    if(estado === 1) asis++; else if(estado === 2) justif++; else inasis++; 
                });
                let p = dsHab > 0 ? ((asis/dsHab)*100).toFixed(1) : 0;
                h += `<tr><td>${i+1}</td><td>${a.cedula||'S/C'}</td><td style="text-align:left">${a.nombre} ${a.gradoSeccion ? `(${a.gradoSeccion})` : ''}</td><td>${a.genero}</td><td>${asis}</td><td>${inasis}</td><td>${justif}</td><td>${p}%</td></tr>`;
            });
            h += `</tbody></table>`;
            document.getElementById('salidaConsolidadoInd').innerHTML = h;
        };

        window.exportarConsolidadoIndPDF = () => {
            const docPDF = new window.jspdf.jsPDF('l');
            docPDF.text("CONSOLIDADO DE ASISTENCIA POR ALUMNO", 14, 15);
            docPDF.autoTable({ html: '#tablaConsolidadoInd', startY: 22, theme: 'grid', styles: {fontSize: 8} });
            docPDF.save("Consolidado_Alumnos.pdf");
        };

        // Resto de métodos de Exportación y Mantenimiento se mantienen iguales
        window.imprimirListadoEstudiantesPDF = async () => { /* Igual */ };
        window.exportarListadoEstudiantesExcel = () => { /* Igual */ };
        window.descargarListaEstudiantesPDF = async () => { /* Igual */ };
        window.exportarNombresBasico = async (formato, esAdmin) => { /* Igual */ };
        window.exportarBackupJSON = () => { /* Igual */ };
        window.limpiarMovimientos = async () => { /* Igual */ };
        window.borrarMatriculaTotal = async () => { /* Igual */ };

        // --- BUSCADOR ---
        window.filtrarAlumnos = () => {
            const texto = document.getElementById('busquedaAlumno').value.toLowerCase();
            const filas = document.querySelectorAll('.alumno-fila');
            filas.forEach(fila => {
                const divInfo = fila.querySelector('div:nth-child(2)'); 
                if (divInfo) fila.style.display = divInfo.innerText.toLowerCase().includes(texto) ? "flex" : "none";
            });
        };

        // --- RENDER ---
        window.render = () => {
            const fSel = document.getElementById('fechaSeleccionada').value;
            const fObj = new Date(fSel + "T00:00:00");
            const mesRef = fObj.getMonth();
            const esFeriado = window.db.feriados?.includes(fSel);
            const esFinde = (fObj.getDay() === 0 || fObj.getDay() === 6);
            const esEspecialista = window.db.rol === "ESPECIALISTA";
            
            // Adaptar interfaz según el rol
            document.getElementById('docenteTxt').innerText = window.db.docente || "No asignado";
            document.getElementById('gradoSeccionTxt').innerText = esEspecialista ? `ESPECIALIS
