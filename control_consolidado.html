<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBN Lucila Palacios - Sistema</title>
    <style>
        /* DISEÑO INSPIRADO EN TU IMAGEN */
        :root {
            --dark-blue: #001f3f; 
            --bg-gray: #f4f7f6;
            --purple-text: #8e44ad;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-gray);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .logo-escuela {
            width: 120px;
            margin-top: 20px;
        }

        h1 {
            color: #000;
            font-size: 24px;
            margin: 15px 0 30px 0;
            font-weight: bold;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        /* BOTÓN ENTRAR IGUAL A TU IMAGEN */
        .btn-entrar {
            background-color: var(--dark-blue);
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            font-size: 16px;
        }

        .btn-reg {
            background: none;
            border: none;
            color: var(--purple-text);
            margin-top: 20px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
        }

        #auth-ui, #vista-docente, #vista-director, #reg-extra { display: none; }
        
        .item-alumno {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>

    <img src="https://i.ibb.co/L6V2Mvz/logo-escolar.png" class="logo-escuela" alt="Logo">
    <h1>EBN LUCILA PALACIOS</h1>

    <div id="auth-ui" class="card" style="display: block;">
        <input type="text" id="usuario" placeholder="Usuario">
        <input type="password" id="pass" placeholder="Clave">
        
        <div id="reg-extra">
            <select id="rol">
                <option value="docente">Docente Especialista</option>
                <option value="director">Director / Coordinador</option>
            </select>
            <select id="especialidad">
                <option value="Aula Integrada">Aula Integrada</option>
                <option value="Deporte">Deporte</option>
                <option value="Cultura">Cultura</option>
                <option value="Teatro">Teatro</option>
            </select>
        </div>

        <button id="btn-main" class="btn-entrar">ENTRAR</button>
        <button id="btn-toggle" class="btn-reg">Registrar Cuenta Nueva</button>
    </div>

    <div id="vista-docente" class="card">
        <h3>Especialidad: <span id="txt-esp"></span></h3>
        <input type="text" id="nom-alumno" placeholder="Nombre del Alumno">
        <button onclick="addAlumno()" style="background:#27ae60; color:white; border:none; padding:10px; border-radius:5px; width:100%;">+ Inscribir Alumno</button>
        <div id="lista-alumnos" style="margin-top:15px; text-align:left;"></div>
        <textarea id="actividad" placeholder="Actividad de hoy..."></textarea>
        <button onclick="saveAsistencia()" class="btn-entrar">GUARDAR REPORTE</button>
        <button onclick="salir()" class="btn-reg">Cerrar Sesión</button>
    </div>

    <div id="vista-director" class="card">
        <h3>Panel de Dirección</h3>
        <button onclick="verReportes()" class="btn-entrar">VER CONSOLIDADO HOY</button>
        <div id="visor" style="margin-top:20px; text-align:left; font-size:14px;"></div>
        <button onclick="salir()" class="btn-reg">Cerrar Sesión</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // TUS CREDENCIALES
        const firebaseConfig = {
            apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
            authDomain: "control-de-asistencia-d585e.firebaseapp.com",
            projectId: "control-de-asistencia-d585e",
            storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
            messagingSenderId: "368890880546",
            appId: "1:368890880546:web:7d23807bcc34d87617207b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isReg = false;

        // Cambiar entre Entrar y Registrar
        document.getElementById('btn-toggle').onclick = () => {
            isReg = !isReg;
            document.getElementById('reg-extra').style.display = isReg ? "block" : "none";
            document.getElementById('btn-main').innerText = isReg ? "CREAR CUENTA" : "ENTRAR";
            document.getElementById('btn-toggle').innerText = isReg ? "Ya tengo cuenta" : "Registrar Cuenta Nueva";
        };

        // Lógica de acceso (Usando tu truco de @escuela.com para que sea sencillo)
        document.getElementById('btn-main').onclick = async () => {
            const u = document.getElementById('usuario').value;
            const p = document.getElementById('pass').value;
            if(!u || !p) return alert("Escribe usuario y clave");
            
            const email = u + "@escuela.com";

            try {
                if(isReg) {
                    const res = await createUserWithEmailAndPassword(auth, email, p);
                    await setDoc(doc(db, "usuarios", res.user.uid), {
                        rol: document.getElementById('rol').value,
                        especialidad: document.getElementById('especialidad').value
                    });
                } else {
                    await signInWithEmailAndPassword(auth, email, p);
                }
            } catch(e) { 
                alert("Error: Revisa que el usuario sea nuevo al registrar o que la clave tenga 6 números"); 
            }
        };

        window.salir = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            document.getElementById('auth-ui').style.display = user ? "none" : "block";
            if(user) {
                const d = await getDoc(doc(db, "usuarios", user.uid));
                if(d.exists() && d.data().rol === 'director') {
                    document.getElementById('vista-director').style.display = "block";
                } else if(d.exists()) {
                    document.getElementById('vista-docente').style.display = "block";
                    document.getElementById('txt-esp').innerText = d.data().especialidad;
                    renderAlumnos();
                }
            } else {
                document.getElementById('vista-docente').style.display = "none";
                document.getElementById('vista-director').style.display = "none";
            }
        });

        // FUNCIONES DE ALUMNOS Y ASISTENCIA
        async function renderAlumnos() {
            const q = query(collection(db, "alumnos"), where("creador", "==", auth.currentUser.uid));
            const snap = await getDocs(q);
            const div = document.getElementById('lista-alumnos');
            div.innerHTML = "";
            snap.forEach(doc => {
                div.innerHTML += `<div class="item-alumno"><span>${doc.data().nombre}</span> <input type="checkbox" id="c-${doc.id}" checked></div>`;
            });
        }

        window.addAlumno = async () => {
            const n = document.getElementById('nom-alumno').value;
            if(n) {
                await addDoc(collection(db, "alumnos"), { nombre: n, creador: auth.currentUser.uid });
                document.getElementById('nom-alumno').value = "";
                renderAlumnos();
            }
        };

        window.saveAsistencia = async () => {
            const act = document.getElementById('actividad').value;
            if(!act) return alert("Escribe la actividad");
            const uInfo = await getDoc(doc(db, "usuarios", auth.currentUser.uid));
            const checks = document.querySelectorAll('#lista-alumnos input');
            
            for(let ch of checks) {
                await addDoc(collection(db, "asistencias"), {
                    alumno: ch.parentElement.innerText,
                    asistio: ch.checked,
                    actividad: act,
                    especialidad: uInfo.data().especialidad,
                    fecha: new Date().toLocaleDateString()
                });
            }
            alert("Enviado");
            document.getElementById('actividad').value = "";
        };

        window.verReportes = async () => {
            const visor = document.getElementById('visor');
            visor.innerHTML = "Cargando...";
            const hoy = new Date().toLocaleDateString();
            const q = query(collection(db, "asistencias"), where("fecha", "==", hoy));
            const snap = await getDocs(q);
            visor.innerHTML = "";
            snap.forEach(d => {
                const r = d.data();
                visor.innerHTML += `<p><strong>${r.especialidad}</strong>: ${r.alumno} (${r.asistio?'P':'A'})<br><small>${r.actividad}</small></p>`;
            });
        };
    </script>
</body>
</html>
