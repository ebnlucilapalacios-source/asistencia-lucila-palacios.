<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Consolidado Escolar</title>
    <style>
        :root {
            --primary: #bb86fc;
            --secondary: #03dac6;
            --bg: #121212;
            --surface: #1e1e1e;
            --error: #cf6679;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: #e0e0e0; margin: 0; padding: 15px; }
        .card { background: var(--surface); padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2, h3 { color: white; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #444; background: #2c2c2c; color: white; box-sizing: border-box; font-size: 16px; }
        button { background: var(--primary); color: black; padding: 12px; border: none; border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; transition: 0.3s; }
        button:hover { opacity: 0.8; }
        .btn-alt { background: var(--secondary); margin-top: 10px; }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); margin-top: 10px; }
        .btn-danger { background: var(--error); color: white; width: auto; padding: 8px 15px; }
        .badge { padding: 4px 8px; border-radius: 5px; font-size: 12px; font-weight: bold; }
        .presente { background: #03dac644; color: var(--secondary); }
        .ausente { background: #cf667944; color: var(--error); }
        .item-asis { border-bottom: 1px solid #333; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        #vista-docente, #vista-director, #auth-ui { display: none; }
    </style>
</head>
<body>

    <div id="auth-ui" class="card" style="display: block; max-width: 400px; margin: 50px auto;">
        <h2 id="auth-title">Iniciar Sesión</h2>
        <input type="email" id="email" placeholder="Correo institucional">
        <input type="password" id="pass" placeholder="Contraseña">
        
        <div id="reg-extra" style="display:none;">
            <label>Tu Rol:</label>
            <select id="rol">
                <option value="docente">Docente Especialista</option>
                <option value="director">Dirección / Coordinación</option>
            </select>
            <label>Especialidad:</label>
            <select id="especialidad">
                <option value="Aula Integrada">Aula Integrada</option>
                <option value="Deporte">Deporte</option>
                <option value="Cultura">Cultura</option>
                <option value="Dirección">Dirección</option>
            </select>
        </div>

        <button id="btn-main">Entrar al Sistema</button>
        <button id="btn-toggle" class="btn-outline">¿No tienes cuenta? Regístrate</button>
    </div>

    <div id="vista-docente">
        <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h3 id="doc-info" style="border:none; margin:0;">Cargando...</h3>
            </div>
            <button class="btn-danger" onclick="salir()">Cerrar</button>
        </div>

        <div class="card">
            <h3>+ Nuevo Alumno</h3>
            <input type="text" id="new-alumno" placeholder="Nombre completo">
            <button onclick="addAlumno()">Registrar en mi lista</button>
        </div>

        <div class="card">
            <h3>Asistencia y Actividad</h3>
            <div id="lista-alumnos" style="margin-bottom:15px;"></div>
            <textarea id="actividad-texto" rows="3" placeholder="Describe la actividad (Individual/Grupal)"></textarea>
            <button class="btn-alt" onclick="saveAsistencia()">Enviar Reporte a Dirección</button>
        </div>
    </div>

    <div id="vista-director">
        <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="border:none; margin:0;">Panel de Dirección</h3>
            <button class="btn-danger" onclick="salir()">Cerrar</button>
        </div>

        <div class="card">
            <h3>Consolidados</h3>
            <div style="display: flex; gap: 10px;">
                <button onclick="verConsolidado('diario')">Hoy</button>
                <button onclick="verConsolidado('semanal')" class="btn-outline">Semanal</button>
                <button onclick="verConsolidado('mensual')" class="btn-outline">Mensual</button>
            </div>
            <div id="visor-consolidados" style="margin-top:20px;"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // TUS CREDENCIALES (IMAGEN 494581)
        const firebaseConfig = {
            apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
            authDomain: "control-de-asistencia-d585e.firebaseapp.com",
            projectId: "control-de-asistencia-d585e",
            storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
            messagingSenderId: "368890880546",
            appId: "1:368890880546:web:7d23807bcc34d87617207b",
            measurementId: "G-Q3D5955CE5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // LÓGICA DE INTERFAZ
        let isReg = false;
        document.getElementById('btn-toggle').onclick = () => {
            isReg = !isReg;
            document.getElementById('auth-title').innerText = isReg ? "Crear Cuenta" : "Iniciar Sesión";
            document.getElementById('reg-extra').style.display = isReg ? "block" : "none";
            document.getElementById('btn-toggle').innerText = isReg ? "Ya tengo cuenta" : "Registrarse";
        };

        document.getElementById('btn-main').onclick = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            try {
                if(isReg) {
                    const res = await createUserWithEmailAndPassword(auth, email, pass);
                    await setDoc(doc(db, "usuarios", res.user.uid), {
                        rol: document.getElementById('rol').value,
                        especialidad: document.getElementById('especialidad').value
                    });
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
            } catch(e) { alert("Error: " + e.message); }
        };

        window.salir = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            document.getElementById('auth-ui').style.display = user ? "none" : "block";
            if(user) {
                const u = await getDoc(doc(db, "usuarios", user.uid));
                const data = u.data();
                if(data.rol === 'director') {
                    document.getElementById('vista-director').style.display = "block";
                } else {
                    document.getElementById('vista-docente').style.display = "block";
                    document.getElementById('doc-info').innerText = data.especialidad;
                    renderAlumnos();
                }
            } else {
                document.getElementById('vista-docente').style.display = "none";
                document.getElementById('vista-director').style.display = "none";
            }
        });

        // FUNCIONES DOCENTE
        async function renderAlumnos() {
            const q = query(collection(db, "alumnos"), where("creador", "==", auth.currentUser.uid));
            const snap = await getDocs(q);
            const div = document.getElementById('lista-alumnos');
            div.innerHTML = "";
            snap.forEach(d => {
                div.innerHTML += `<div class="item-asis"><span>${d.data().nombre}</span> <input type="checkbox" id="check-${d.id}" checked style="width:auto;"></div>`;
            });
        }

        window.addAlumno = async () => {
            const nom = document.getElementById('new-alumno').value;
            if(!nom) return;
            await addDoc(collection(db, "alumnos"), { nombre: nom, creador: auth.currentUser.uid });
            document.getElementById('new-alumno').value = "";
            renderAlumnos();
        };

        window.saveAsistencia = async () => {
            const txt = document.getElementById('actividad-texto').value;
            if(!txt) return alert("Describe la actividad");
            const u = await getDoc(doc(db, "usuarios", auth.currentUser.uid));
            const boxes = document.querySelectorAll('#lista-alumnos input');
            for(let b of boxes) {
                await addDoc(collection(db, "asistencias"), {
                    alumno: b.parentElement.innerText,
                    asistio: b.checked,
                    actividad: txt,
                    especialidad: u.data().especialidad,
                    fecha: new Date()
                });
            }
            alert("Reporte enviado con éxito");
            document.getElementById('actividad-texto').value = "";
        };

        // FUNCIONES DIRECCIÓN
        window.verConsolidado = async (periodo) => {
            const visor = document.getElementById('visor-consolidados');
            visor.innerHTML = "Cargando datos...";
            const snap = await getDocs(collection(db, "asistencias"));
            const ahora = new Date();
            let stats = {};

            snap.forEach(d => {
                const data = d.data();
                const f = data.fecha.toDate();
                let match = false;

                if(periodo==='diario') match = f.toDateString() === ahora.toDateString();
                if(periodo==='semanal') match = (ahora - f) < (7 * 24 * 60 * 60 * 1000);
                if(periodo==='mensual') match = f.getMonth() === ahora.getMonth();

                if(match) {
                    if(!stats[data.especialidad]) stats[data.especialidad] = { p:0, a:0, logs:[] };
                    data.asistio ? stats[data.especialidad].p++ : stats[data.especialidad].a++;
                    stats[data.especialidad].logs.push(`${data.alumno}: ${data.actividad}`);
                }
            });

            visor.innerHTML = `<h4>Reporte ${periodo.toUpperCase()}</h4>`;
            for(let e in stats) {
                visor.innerHTML += `
                    <div class="card" style="background:#252525">
                        <strong>${e}</strong><br>
                        Presentes: <span class="badge presente">${stats[e].p}</span> 
                        Ausentes: <span class="badge ausente">${stats[e].a}</span>
                        <details style="margin-top:10px;"><summary>Ver detalles</summary>
                        <small>${stats[e].logs.join('<br>')}</small></details>
                    </div>`;
            }
        };
    </script>
</body>
</html>
