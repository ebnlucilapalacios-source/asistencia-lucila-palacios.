<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBN Lucila Palacios - Acceso</title>
    <style>
        /* ESTILO BASADO EN TU IMAGEN */
        :root {
            --primary-blue: #001f3f; /* Azul del botón ENTRAR */
            --bg-light: #f5f7fb;    /* Fondo claro de la imagen */
            --text-dark: #000000;
            --purple-link: #8e44ad; /* Color del enlace de registro */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-container img {
            width: 120px; /* Tamaño del logo escolar */
            height: auto;
        }

        h1 {
            font-size: 26px;
            font-weight: bold;
            color: var(--text-dark);
            margin: 10px 0 30px 0;
            text-transform: uppercase;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }

        input, select, textarea {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #ddd;
            background: #fff;
            color: #333;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background: var(--primary-blue);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
            text-transform: uppercase;
        }

        #btn-toggle {
            display: inline-block;
            margin-top: 20px;
            color: var(--purple-link);
            text-decoration: none;
            font-size: 15px;
            background: none;
            border: none;
            cursor: pointer;
            width: auto;
        }

        /* VISTAS DE TRABAJO */
        #vista-docente, #vista-director, #reg-extra { display: none; }
        
        .item-asis { 
            border-bottom: 1px solid #eee; 
            padding: 12px 0; 
            display: flex; 
            justify-content: space-between;
            color: #333;
        }

        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary-blue);
            padding-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="https://i.ibb.co/L6V2Mvz/logo-escolar.png" alt="Logo EBN Lucila Palacios">
        <h1>EBN LUCILA PALACIOS</h1>
    </div>

    <div id="auth-ui" class="card">
        <input type="text" id="usuario" placeholder="Usuario">
        <input type="password" id="pass" placeholder="Clave">
        
        <div id="reg-extra">
            <select id="rol">
                <option value="docente">Docente Especialista</option>
                <option value="director">Director / Coordinador</option>
            </select>
            <select id="especialidad">
                <option value="Aula Integrada">Aula Integrada</option>
                <option value="Deporte">Deporte</option>
                <option value="Cultura">Cultura</option>
                <option value="Teatro">Teatro</option>
            </select>
        </div>

        <button id="btn-main">ENTRAR</button>
        <button id="btn-toggle">Registrar Cuenta Nueva</button>
    </div>

    <div id="vista-docente" class="card" style="max-width: 500px;">
        <div class="header-panel">
            <h3 style="margin:0; color:var(--primary-blue);">Especialidad: <span id="txt-esp"></span></h3>
            <button onclick="salir()" style="width:auto; padding:5px 10px; background:#e74c3c;">Salir</button>
        </div>
        
        <input type="text" id="nom-alumno" placeholder="Nombre del Alumno">
        <button onclick="addAlumno()" style="background:#27ae60">+ Inscribir Alumno</button>
        <hr style="border: 0.5px solid #eee; margin: 20px 0;">
        <div id="lista-alumnos"></div>
        <textarea id="actividad" rows="3" placeholder="Descripción de la actividad de hoy..."></textarea>
        <button onclick="saveAsistencia()" style="background:var(--primary-blue)">GUARDAR REPORTE</button>
    </div>

    <div id="vista-director" class="card" style="max-width: 500px;">
        <div class="header-panel">
            <h3 style="margin:0; color:var(--primary-blue);">Reportes de Dirección</h3>
            <button onclick="salir()" style="width:auto; padding:5px 10px; background:#e74c3c;">Salir</button>
        </div>
        <button onclick="verReportes()" style="background:#2980b9">VER CONSOLIDADO DE HOY</button>
        <div id="visor" style="margin-top:20px; text-align: left;"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // TUS CREDENCIALES REALES
        const firebaseConfig = {
            apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
            authDomain: "control-de-asistencia-d585e.firebaseapp.com",
            projectId: "control-de-asistencia-d585e",
            storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
            messagingSenderId: "368890880546",
            appId: "1:368890880546:web:7d23807bcc34d87617207b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // LÓGICA DE INTERFAZ
        let isReg = false;
        document.getElementById('btn-toggle').onclick = () => {
            isReg = !isReg;
            document.getElementById('reg-extra').style.display = isReg ? "block" : "none";
            document.getElementById('btn-main').innerText = isReg ? "CREAR CUENTA" : "ENTRAR";
            document.getElementById('btn-toggle').innerText = isReg ? "Volver al Inicio" : "Registrar Cuenta Nueva";
        };

        document.getElementById('btn-main').onclick = async () => {
            const user = document.getElementById('usuario').value + "@lucila.com"; 
            const pass = document.getElementById('pass').value;
            if(!pass || !user) return alert("Completa los campos");
            
            try {
                if(isReg) {
                    const res = await createUserWithEmailAndPassword(auth, user, pass);
                    await setDoc(doc(db, "usuarios", res.user.uid), {
                        rol: document.getElementById('rol').value,
                        especialidad: document.getElementById('especialidad').value
                    });
                } else {
                    await signInWithEmailAndPassword(auth, user, pass);
                }
            } catch(e) { alert("Usuario o Clave incorrecta"); }
        };

        window.salir = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            document.getElementById('auth-ui').style.display = user ? "none" : "block";
            // Ocultar logo cuando ya entraste
            document.querySelector('.logo-container').style.display = user ? "none" : "block";
            
            if(user) {
                const docSnap = await getDoc(doc(db, "usuarios", user.uid));
                const data = docSnap.data();
                if(data.rol === 'director') {
                    document.getElementById('vista-director').style.display = "block";
                } else {
                    document.getElementById('vista-docente').style.display = "block";
                    document.getElementById('txt-esp').innerText = data.especialidad;
                    renderAlumnos();
                }
            } else {
                document.getElementById('vista-docente').style.display = "none";
                document.getElementById('vista-director').style.display = "none";
            }
        });

        async function renderAlumnos() {
            const q = query(collection(db, "alumnos"), where("creador", "==", auth.currentUser.uid));
            const snap = await getDocs(q);
            const div = document.getElementById('lista-alumnos');
            div.innerHTML = "";
            snap.forEach(d => {
                div.innerHTML += `<div class="item-asis"><span>${d.data().nombre}</span> <input type="checkbox" id="c-${d.id}" checked style="width:auto;"></div>`;
            });
        }

        window.addAlumno = async () => {
            const nom = document.getElementById('nom-alumno').value;
            if(nom) {
                await addDoc(collection(db, "alumnos"), { nombre: nom, creador: auth.currentUser.uid });
                document.getElementById('nom-alumno').value = "";
                renderAlumnos();
            }
        };

        window.saveAsistencia = async () => {
            const act = document.getElementById('actividad').value;
            if(!act) return alert("Escribe la actividad realizada");
            const u = await getDoc(doc(db, "usuarios", auth.currentUser.uid));
            const boxes = document.querySelectorAll('#lista-alumnos input');
            for(let b of boxes) {
                await addDoc(collection(db, "asistencias"), {
                    alumno: b.parentElement.innerText,
                    asistio: b.checked,
                    actividad: act,
                    especialidad: u.data().especialidad,
                    fecha: new Date().toDateString()
                });
            }
            alert("Reporte Enviado con Éxito");
            document.getElementById('actividad').value = "";
        };

        window.verReportes = async () => {
            const visor = document.getElementById('visor');
            visor.innerHTML = "Buscando datos...";
            const hoy = new Date().toDateString();
            const q = query(collection(db, "asistencias"), where("fecha", "==", hoy));
            const snap = await getDocs(q);
            visor.innerHTML = "";
            if(snap.empty) visor.innerHTML = "No hay reportes hoy.";
            snap.forEach(d => {
                const r = d.data();
                visor.innerHTML += `<div style="background:#f9f9f9; padding:10px; border-radius:10px; margin-bottom:8px; border-left: 5px solid var(--primary-blue);">
                    <strong>${r.especialidad}</strong>: ${r.alumno} (${r.asistio?'Presente':'Ausente'})<br>
                    <small>Actividad: ${r.actividad}</small>
                </div>`;
            });
        };
    </script>
</body>
</html>
