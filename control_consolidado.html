<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Especialistas - Control Escolar</title>
    <style>
        :root { --primary: #bb86fc; --bg: #121212; --surface: #1e1e1e; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: #e0e0e0; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .card { background: var(--surface); padding: 25px; border-radius: 15px; width: 100%; max-width: 400px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: white; margin-bottom: 20px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #444; background: #2c2c2c; color: white; box-sizing: border-box; font-size: 16px; }
        button { background: var(--primary); color: black; padding: 14px; border: none; border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; margin-top: 10px; }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); margin-top: 15px; }
        #vista-docente, #vista-director, #reg-extra { display: none; }
        .item-asis { border-bottom: 1px solid #333; padding: 10px 0; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <div id="auth-ui" class="card">
        <h2 id="auth-title">Control de Asistencia</h2>
        <input type="text" id="usuario" placeholder="Nombre de Usuario (ej: teatro1)">
        <input type="password" id="pass" placeholder="Clave Especial">
        
        <div id="reg-extra">
            <select id="rol">
                <option value="docente">Docente Especialista</option>
                <option value="director">Director / Coordinador</option>
            </select>
            <select id="especialidad">
                <option value="Aula Integrada">Aula Integrada</option>
                <option value="Deporte">Deporte</option>
                <option value="Cultura">Cultura</option>
                <option value="Teatro">Teatro</option>
            </select>
        </div>

        <button id="btn-main">Entrar</button>
        <button id="btn-toggle" class="btn-outline">Crear Nueva Cuenta</button>
    </div>

    <div id="vista-docente" class="card">
        <h3>Panel: <span id="txt-esp"></span></h3>
        <input type="text" id="nom-alumno" placeholder="Nombre del Alumno">
        <button onclick="addAlumno()">+ Inscribir Alumno</button>
        <hr>
        <div id="lista-alumnos"></div>
        <textarea id="actividad" placeholder="Descripción de la actividad hoy..."></textarea>
        <button onclick="saveAsistencia()" style="background:#03dac6">Guardar Reporte</button>
        <button onclick="salir()" class="btn-outline">Cerrar Sesión</button>
    </div>

    <div id="vista-director" class="card">
        <h3>Reportes de Dirección</h3>
        <button onclick="verReportes()">Ver Consolidado de Hoy</button>
        <div id="visor" style="margin-top:20px;"></div>
        <button onclick="salir()" class="btn-outline">Cerrar Sesión</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
            authDomain: "control-de-asistencia-d585e.firebaseapp.com",
            projectId: "control-de-asistencia-d585e",
            storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
            messagingSenderId: "368890880546",
            appId: "1:368890880546:web:7d23807bcc34d87617207b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isReg = false;
        document.getElementById('btn-toggle').onclick = () => {
            isReg = !isReg;
            document.getElementById('reg-extra').style.display = isReg ? "block" : "none";
            document.getElementById('auth-title').innerText = isReg ? "Registro de Cuenta" : "Control de Asistencia";
            document.getElementById('btn-toggle').innerText = isReg ? "Volver al Inicio" : "Crear Nueva Cuenta";
        };

        document.getElementById('btn-main').onclick = async () => {
            const user = document.getElementById('usuario').value + "@escuela.com"; // Truco para no usar correo
            const pass = document.getElementById('pass').value;
            try {
                if(isReg) {
                    const res = await createUserWithEmailAndPassword(auth, user, pass);
                    await setDoc(doc(db, "usuarios", res.user.uid), {
                        rol: document.getElementById('rol').value,
                        especialidad: document.getElementById('especialidad').value
                    });
                } else {
                    await signInWithEmailAndPassword(auth, user, pass);
                }
            } catch(e) { alert("Usuario o Clave incorrecta"); }
        };

        window.salir = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            document.getElementById('auth-ui').style.display = user ? "none" : "block";
            if(user) {
                const docSnap = await getDoc(doc(db, "usuarios", user.uid));
                const data = docSnap.data();
                if(data.rol === 'director') {
                    document.getElementById('vista-director').style.display = "block";
                } else {
                    document.getElementById('vista-docente').style.display = "block";
                    document.getElementById('txt-esp').innerText = data.especialidad;
                    renderAlumnos();
                }
            } else {
                document.getElementById('vista-docente').style.display = "none";
                document.getElementById('vista-director').style.display = "none";
            }
        });

        async function renderAlumnos() {
            const q = query(collection(db, "alumnos"), where("creador", "==", auth.currentUser.uid));
            const snap = await getDocs(q);
            const div = document.getElementById('lista-alumnos');
            div.innerHTML = "";
            snap.forEach(d => {
                div.innerHTML += `<div class="item-asis"><span>${d.data().nombre}</span> <input type="checkbox" id="c-${d.id}" checked style="width:auto;"></div>`;
            });
        }

        window.addAlumno = async () => {
            const nom = document.getElementById('nom-alumno').value;
            if(nom) {
                await addDoc(collection(db, "alumnos"), { nombre: nom, creador: auth.currentUser.uid });
                document.getElementById('nom-alumno').value = "";
                renderAlumnos();
            }
        };

        window.saveAsistencia = async () => {
            const act = document.getElementById('actividad').value;
            const u = await getDoc(doc(db, "usuarios", auth.currentUser.uid));
            const boxes = document.querySelectorAll('#lista-alumnos input');
            for(let b of boxes) {
                await addDoc(collection(db, "asistencias"), {
                    alumno: b.parentElement.innerText,
                    asistio: b.checked,
                    actividad: act,
                    especialidad: u.data().especialidad,
                    fecha: new Date().toDateString()
                });
            }
            alert("Reporte Enviado");
            document.getElementById('actividad').value = "";
        };

        window.verReportes = async () => {
            const visor = document.getElementById('visor');
            visor.innerHTML = "Buscando...";
            const hoy = new Date().toDateString();
            const q = query(collection(db, "asistencias"), where("fecha", "==", hoy));
            const snap = await getDocs(q);
            visor.innerHTML = "";
            snap.forEach(d => {
                const r = d.data();
                visor.innerHTML += `<div style="background:#2c2c2c; padding:10px; border-radius:10px; margin-bottom:5px;">
                    <strong>${r.especialidad}</strong>: ${r.alumno} (${r.asistio?'P':'A'})<br>
                    <small>${r.actividad}</small>
                </div>`;
            });
        };
    </script>
</body>
</html>
