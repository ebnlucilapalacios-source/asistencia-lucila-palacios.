<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA INTEGRAL - EBN LUCILA PALACIOS 2026</title>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
            authDomain: "control-de-asistencia-d585e.firebaseapp.com",
            projectId: "control-de-asistencia-d585e",
            storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
            appId: "1:368890880546:web:a97ab4372dea536217207b"
        };

        const app = initializeApp(firebaseConfig);
        const dbCloud = getFirestore(app);
        const CLAVE_INST = "LUCILA2026";
        const USUARIO_ADMIN = "admin_lucila";

        window.usuarioActual = null;
        window.db = {};
        window.alumnosGlobales = []; // Para que el especialista busque en toda la escuela

        // --- 1. AUTENTICACIÓN Y CARGA ---
        window.login = async () => {
            const u = document.getElementById('loginUser').value.toLowerCase().trim();
            const p = document.getElementById('loginPass').value;
            const snap = await getDoc(doc(dbCloud, "docentes_db", u));
            
            if (snap.exists() && snap.data().pass === p) {
                window.usuarioActual = u;
                window.db = snap.data();
                
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                document.getElementById('fechaSeleccionada').value = new Date().toISOString().split('T')[0];

                // Limpiar vistas
                document.getElementById('adminPanel').style.display = 'none';
                document.getElementById('panelEspecialistaInterface').style.display = 'none';
                document.getElementById('seccionDocenteAula').style.display = 'none';

                if (u === USUARIO_ADMIN) {
                    document.getElementById('adminPanel').style.display = 'block';
                } else if (window.db.tipo === "especialista") {
                    document.getElementById('panelEspecialistaInterface').style.display = 'block';
                    await cargarDatosParaEspecialista();
                } else {
                    document.getElementById('seccionDocenteAula').style.display = 'block';
                }

                onSnapshot(doc(dbCloud, "docentes_db", u), (s) => { 
                    window.db = s.data(); 
                    if(window.db.tipo === "especialista") actualizarMenusGrupos();
                    window.renderAula(); 
                });
            } else {
                Swal.fire("Acceso Denegado", "Usuario o clave incorrectos", "error");
            }
        };

        // --- 2. PANEL DE DIRECCIÓN (ADMIN) ---
        window.crearCuentaDirectorio = async (tipo) => {
            let user, pass, nombre, extra1, extra2;
            if(tipo === 'aula') {
                user = document.getElementById('regUserAula').value.toLowerCase().trim();
                pass = document.getElementById('regPassAula').value;
                nombre = document.getElementById('regNomAula').value.toUpperCase();
                extra1 = document.getElementById('regGradoAula').value;
                extra2 = document.getElementById('regSecAula').value.toUpperCase();
                if(!user || !pass || !nombre) return Swal.fire("Error", "Faltan datos", "warning");
                await setDoc(doc(dbCloud, "docentes_db", user), { docente: nombre, pass, grado: extra1, seccion: extra2, tipo: "aula", alumnos: [], asistencias: {} });
            } else {
                user = document.getElementById('regUserEsp').value.toLowerCase().trim();
                pass = document.getElementById('regPassEsp').value;
                nombre = document.getElementById('regNomEsp').value.toUpperCase();
                extra1 = document.getElementById('regMatEsp').value;
                if(!user || !pass || !nombre) return Swal.fire("Error", "Faltan datos", "warning");
                await setDoc(doc(dbCloud, "docentes_db", user), { docente: nombre, pass, materia: extra1, tipo: "especialista", gruposEstables: {} });
            }
            Swal.fire("Éxito", "Cuenta creada correctamente", "success");
        };

        window.generarReporteDireccion = async () => {
            const snap = await getDocs(collection(dbCloud, "docentes_db"));
            let totalMatricula = 0;
            snap.forEach(d => { if(d.data().tipo === 'aula') totalMatricula += (d.data().alumnos || []).length; });
            const msj = `*REPORTE LUCILA PALACIOS 2026*\n📍 Matrícula Total: ${totalMatricula}\n📅 Fecha: ${document.getElementById('fechaSeleccionada').value}`;
            navigator.clipboard.writeText(msj);
            Swal.fire("Copiado", "Resumen listo para pegar en WhatsApp", "success");
        };

        // --- 3. PANEL ESPECIALISTA ---
        async function cargarDatosParaEspecialista() {
            const querySnap = await getDocs(collection(dbCloud, "docentes_db"));
            const selSec = document.getElementById('selSecEsp');
            selSec.innerHTML = '<option value="">-- SELECCIONE SECCIÓN --</option>';
            window.alumnosGlobales = [];

            querySnap.forEach(d => {
                const data = d.data();
                if(data.tipo === "aula") {
                    selSec.innerHTML += `<option value="${d.id}">${data.grado}${data.seccion} - ${data.docente}</option>`;
                    if(data.alumnos) {
                        data.alumnos.forEach(a => {
                            if(!a.retirado) window.alumnosGlobales.push({...a, proc: `${data.grado}${data.seccion}`});
                        });
                    }
                }
            });
            actualizarMenusGrupos();
        }

        function actualizarMenusGrupos() {
            const sel1 = document.getElementById('selGrupoDestino');
            const sel2 = document.getElementById('selGrupoAsistencia');
            const placeholder = '<option value="">-- ELIJA GRUPO --</option>';
            sel1.innerHTML = placeholder; sel2.innerHTML = placeholder;
            if(window.db.gruposEstables) {
                Object.keys(window.db.gruposEstables).forEach(g => {
                    const opt = `<option value="${g}">${g}</option>`;
                    sel1.innerHTML += opt; sel2.innerHTML += opt;
                });
            }
        }

        window.crearGrupoEstable = async () => {
            const n = document.getElementById('nomGrupoNuevo').value.toUpperCase().trim();
            if(!n) return;
            let grupos = window.db.gruposEstables || {};
            grupos[n] = [];
            await updateDoc(doc(dbCloud, "docentes_db", window.usuarioActual), { gruposEstables: grupos });
            document.getElementById('nomGrupoNuevo').value = "";
            Swal.fire("Creado", n, "success");
        };

        window.buscarEstudiante = () => {
            const txt = document.getElementById('busqEst').value.toUpperCase();
            const res = document.getElementById('resBusq');
            res.innerHTML = "";
            if(txt.length < 3) return;
            window.alumnosGlobales.filter(a => a.nombre.includes(txt)).forEach(a => {
                res.innerHTML += `<div class="alumno-fila">
                    <span style="font-size:11px">${a.nombre} (${a.proc})</span>
                    <button onclick="meterAlGrupo('${a.nombre}','${a.genero}','${a.proc}')" style="width:30px">+</button>
                </div>`;
            });
        };

        window.meterAlGrupo = async (n, g, p) => {
            const grupoDest = document.getElementById('selGrupoDestino').value;
            if(!grupoDest) return Swal.fire("Atención", "Elija un grupo primero", "warning");
            let grupos = window.db.gruposEstables;
            if(grupos[grupoDest].find(x => x.nombre === n)) return Swal.fire("Ya está", "Alumno en lista", "info");
            grupos[grupoDest].push({nombre: n, genero: g, procedencia: p});
            await updateDoc(doc(dbCloud, "docentes_db", window.usuarioActual), { gruposEstables: grupos });
            Swal.fire("Agregado", n, "success");
        };

        window.cargarListaAsisEsp = async (modo) => {
            const cont = document.getElementById('listaEsp');
            cont.innerHTML = "";
            let lista = [];
            if(modo === 'sec') {
                const id = document.getElementById('selSecEsp').value;
                if(!id) return;
                const snap = await getDoc(doc(dbCloud, "docentes_db", id));
                lista = (snap.data().alumnos || []).filter(a => !a.retirado);
            } else {
                const g = document.getElementById('selGrupoAsistencia').value;
                if(!g) return;
                lista = window.db.gruposEstables[g];
            }
            lista.forEach(a => {
                cont.innerHTML += `<div class="alumno-fila">
                    <span>${a.nombre}</span>
                    <input type="checkbox" class="chkE" data-gen="${a.genero}" checked style="width:25px;height:25px">
                </div>`;
            });
            document.getElementById('btnGuarEsp').style.display = 'block';
        };

        window.guardarAsisEsp = async () => {
            let h=0, v=0;
            document.querySelectorAll('.chkE').forEach(c => { if(c.checked) c.dataset.gen==='F'?h++:v++; });
            await addDoc(collection(dbCloud, "asistencia_especialistas"), {
                especialista: window.db.docente,
                fecha: document.getElementById('fechaSeleccionada').value,
                h, v, total: h+v
            });
            Swal.fire("Éxito", "Estadística guardada", "success");
            document.getElementById('listaEsp').innerHTML = "";
        };

        // --- 4. PANEL AULA ---
        window.renderAula = () => {
            if(window.db.tipo !== 'aula') return;
            document.getElementById('docTxt').innerText = window.db.docente;
            const f = document.getElementById('fechaSeleccionada').value;
            const l = document.getElementById('listaAula'); l.innerHTML = "";
            (window.db.alumnos || []).filter(a => !a.retirado).forEach(a => {
                const s = window.db.asistencias?.[f]?.[a.id] || 0;
                let c = "#ccc"; if(s===1) c="var(--exito)"; if(s===2) c="var(--morado)";
                l.innerHTML += `<div class="alumno-fila"><span>${a.nombre}</span><button onclick="marcar(${a.id})" class="btn-check" style="background:${c}">${s===1?'P':s===2?'J':'F'}</button></div>`;
            });
        };

        window.marcar = async (id) => {
            const f = document.getElementById('fechaSeleccionada').value;
            if(!window.db.asistencias) window.db.asistencias = {};
            if(!window.db.asistencias[f]) window.db.asistencias[f] = {};
            window.db.asistencias[f][id] = (window.db.asistencias[f][id] + 1) % 3 || 1;
            await updateDoc(doc(dbCloud, "docentes_db", window.usuarioActual), { asistencias: window.db.asistencias });
        };

        window.logout = () => location.reload();
    </script>

    <style>
        :root { --azul: #002147; --exito: #28a745; --morado: #6f42c1; --naranja: #e67e22; }
        body { font-family: sans-serif; background: #f4f7f9; margin: 0; padding-bottom: 50px; }
        header { background: var(--azul); color: white; padding: 15px; text-align: center; border-bottom: 4px solid #f39c12; }
        .container { max-width: 450px; margin: auto; padding: 10px; }
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .alumno-fila { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        input, select, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        button { cursor: pointer; font-weight: bold; }
        .btn-check { width: 45px; height: 40px; border: none; color: white; border-radius: 5px; }
    </style>
</head>
<body>

<div id="authSection" style="padding: 50px 20px; text-align: center;">
    <img src="https://raw.githubusercontent.com/ebnlucilapalacios-source/asistencia-lucila-palacios./main/IMG_20260225_005025_993.png" width="80">
    <h2 style="color:var(--azul)">SISTEMA LUCILA PALACIOS</h2>
    <div class="card" style="max-width:300px; margin:auto;">
        <input type="text" id="loginUser" placeholder="Usuario">
        <input type="password" id="loginPass" placeholder="Contraseña">
        <button onclick="login()" style="background:var(--azul); color:white;">ENTRAR</button>
    </div>
</div>

<div id="appContent" style="display:none;">
    <header><b>GESTIÓN ESCOLAR 2026</b></header>
    <div class="container">
        <div class="card" style="text-align:center;">
            <b>FECHA:</b> <input type="date" id="fechaSeleccionada">
            <button onclick="logout()" style="background:#eee; color:#666; border:none; padding:5px; font-size:10px;">CERRAR SESIÓN</button>
        </div>

        <div id="adminPanel" style="display:none;">
            <div class="card" style="border-top: 5px solid var(--morado);">
                <b style="color:var(--morado)">DIRECCIÓN: REPORTES</b>
                <button onclick="generarReporteDireccion()" style="background:var(--exito); color:white;">CIERRE WHATSAPP</button>
                <hr>
                <b>REGISTRAR DOCENTE AULA</b>
                <input type="text" id="regNomAula" placeholder="Nombre Docente">
                <input type="text" id="regGradoAula" placeholder="Grado">
                <input type="text" id="regSecAula" placeholder="Sección">
                <input type="text" id="regUserAula" placeholder="Usuario">
                <input type="text" id="regPassAula" placeholder="Clave">
                <button onclick="crearCuentaDirectorio('aula')" style="background:var(--azul); color:white;">CREAR CUENTA AULA</button>
                <hr>
                <b>REGISTRAR ESPECIALISTA</b>
                <input type="text" id="regNomEsp" placeholder="Nombre Especialista">
                <select id="regMatEsp">
                    <option value="EDUC. FISICA">EDUC. FISICA</option>
                    <option value="INGLES">INGLES</option>
                    <option value="MUSICA">MUSICA</option>
                </select>
                <input type="text" id="regUserEsp" placeholder="Usuario">
                <input type="text" id="regPassEsp" placeholder="Clave">
                <button onclick="crearCuentaDirectorio('esp')" style="background:var(--naranja); color:white;">CREAR CUENTA ESP.</button>
            </div>
        </div>

        <div id="panelEspecialistaInterface" style="display:none;">
            <div class="card" style="border-top: 5px solid var(--naranja);">
                <b>🛠 GRUPOS ESTABLES</b>
                <input type="text" id="nomGrupoNuevo" placeholder="Ej: SELECCIÓN FUTBOL">
                <button onclick="crearGrupoEstable()" style="background:var(--azul); color:white;">CREAR GRUPO</button>
                <hr>
                <b>🔍 BUSCAR ALUMNO (Toda la escuela)</b>
                <select id="selGrupoDestino"></select>
                <input type="text" id="busqEst" onkeyup="buscarEstudiante()" placeholder="Nombre del alumno...">
                <div id="resBusq" style="max-height:100px; overflow-y:auto; background:#f9f9f9;"></div>
            </div>
            <div class="card" style="border-top: 5px solid var(--exito);">
                <b>📝 PASAR ASISTENCIA</b>
                <select id="selSecEsp" onchange="cargarListaAsisEsp('sec')"></select>
                <select id="selGrupoAsistencia" onchange="cargarListaAsisEsp('gru')"></select>
                <div id="listaEsp" style="margin-top:10px;"></div>
                <button id="btnGuarEsp" style="display:none; background:var(--exito); color:white;" onclick="guardarAsisEsp()">GUARDAR DÍA</button>
            </div>
        </div>

        <div id="seccionDocenteAula" style="display:none;">
            <div class="card"><b>Docente:</b> <span id="docTxt"></span></div>
            <div class="card" id="listaAula"></div>
        </div>
    </div>
</div>

</body>
</html>
