<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA INTEGRAL - EBN LUCILA PALACIOS 2026</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs, addDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
            authDomain: "control-de-asistencia-d585e.firebaseapp.com",
            projectId: "control-de-asistencia-d585e",
            storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
            appId: "1:368890880546:web:a97ab4372dea536217207b"
        };

        const app = initializeApp(firebaseConfig);
        const dbCloud = getFirestore(app);
        const CLAVE_INST = "LUCILA2026";
        const USUARIO_ADMIN = "admin_lucila";

        window.usuarioActual = null;
        window.db = {};
        window.todosLosAlumnos = []; // Para el buscador global

        // --- LOGIN ---
        window.login = async () => {
            const u = document.getElementById('loginUser').value.toLowerCase().trim();
            const p = document.getElementById('loginPass').value;
            const snap = await getDoc(doc(dbCloud, "docentes_db", u));
            
            if (snap.exists() && snap.data().pass === p) {
                window.usuarioActual = u;
                window.db = snap.data();
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';

                if (u === USUARIO_ADMIN) {
                    document.getElementById('adminPanel').style.display = 'block';
                } else if (window.db.tipo === "especialista") {
                    document.getElementById('panelEspecialistaInterface').style.display = 'block';
                    document.getElementById('seccionDocenteAula').style.display = 'none';
                    await cargarDatosEspecialista();
                } else {
                    document.getElementById('seccionDocenteAula').style.display = 'block';
                    document.getElementById('panelEspecialistaInterface').style.display = 'none';
                }

                onSnapshot(doc(dbCloud, "docentes_db", u), (s) => { window.db = s.data(); window.render(); });
            } else {
                Swal.fire("Error", "Credenciales incorrectas", "error");
            }
        };

        // --- LÓGICA DE GRUPOS ESTABLES (ESPECIALISTAS) ---
        async function cargarDatosEspecialista() {
            // 1. Cargar Secciones para pase normal
            const querySnap = await getDocs(collection(dbCloud, "docentes_db"));
            const sel = document.getElementById('selSecEsp');
            sel.innerHTML = '<option value="">-- SELECCIONE SECCIÓN --</option>';
            window.todosLosAlumnos = [];

            querySnap.forEach(d => {
                const data = d.data();
                if(data.tipo === "aula") {
                    sel.innerHTML += `<option value="${d.id}">${data.grado}${data.seccion} - ${data.docente}</option>`;
                    // Guardar alumnos para el buscador
                    (data.alumnos || []).forEach(a => {
                        if(!a.retirado) window.todosLosAlumnos.push({...a, gradoOrig: data.grado, secOrig: data.seccion});
                    });
                }
            });
            actualizarListaGrupos();
        }

        window.buscarAlumnoGlobal = () => {
            const busqueda = document.getElementById('inputBusqueda').value.toUpperCase();
            const res = document.getElementById('resultadosBusqueda');
            res.innerHTML = "";
            if(busqueda.length < 3) return;

            const filtrados = window.todosLosAlumnos.filter(a => a.nombre.includes(busqueda));
            filtrados.forEach(a => {
                res.innerHTML += `
                    <div class="alumno-fila" style="font-size:12px;">
                        <span>${a.nombre} (${a.gradoOrig}${a.secOrig})</span>
                        <button onclick="agregarAGrupo('${a.nombre}', '${a.genero}', '${a.gradoOrig}${a.secOrig}')" style="width:auto; padding:5px 10px; background:var(--azul); color:white; border-radius:5px;">+</button>
                    </div>`;
            });
        };

        window.crearNuevoGrupo = async () => {
            const nombreGrupo = document.getElementById('nombreNuevoGrupo').value.toUpperCase();
            if(!nombreGrupo) return;
            if(!window.db.gruposEstables) window.db.gruposEstables = {};
            
            window.db.gruposEstables[nombreGrupo] = [];
            await updateDoc(doc(dbCloud, "docentes_db", window.usuarioActual), { gruposEstables: window.db.gruposEstables });
            Swal.fire("Grupo Creado", nombreGrupo, "success");
            actualizarListaGrupos();
        };

        window.agregarAGrupo = async (nombre, genero, procedencia) => {
            const grupoDestino = document.getElementById('selGrupoDestino').value;
            if(!grupoDestino) return Swal.fire("Atención", "Seleccione un grupo estable primero", "warning");

            const yaExiste = window.db.gruposEstables[grupoDestino].find(x => x.nombre === nombre);
            if(yaExiste) return Swal.fire("Aviso", "El alumno ya está en este grupo", "info");

            window.db.gruposEstables[grupoDestino].push({ nombre, genero, procedencia, id: Date.now() });
            await updateDoc(doc(dbCloud, "docentes_db", window.usuarioActual), { gruposEstables: window.db.gruposEstables });
            Swal.fire("Agregado", nombre, "success");
            actualizarListaGrupos();
        };

        function actualizarListaGrupos() {
            const sel = document.getElementById('selGrupoAsistencia');
            const selDest = document.getElementById('selGrupoDestino');
            sel.innerHTML = '<option value="">-- SELECCIONE GRUPO ESTABLE --</option>';
            selDest.innerHTML = '<option value="">-- ELEGIR GRUPO --</option>';
            
            if(window.db.gruposEstables) {
                Object.keys(window.db.gruposEstables).forEach(g => {
                    sel.innerHTML += `<option value="${g}">${g}</option>`;
                    selDest.innerHTML += `<option value="${g}">${g}</option>`;
                });
            }
        }

        window.verListaGrupoEstable = () => {
            const g = document.getElementById('selGrupoAsistencia').value;
            const cont = document.getElementById('listaAlumnosEsp');
            cont.innerHTML = `<h4>Grupo: ${g}</h4>`;
            if(!g) return;

            window.db.gruposEstables[g].forEach(a => {
                cont.innerHTML += `
                    <div class="alumno-fila">
                        <span>${a.nombre} <small>(${a.procedencia})</small></span>
                        <input type="checkbox" class="chkEsp" data-gen="${a.genero}" checked style="width:25px; height:25px;">
                    </div>`;
            });
            document.getElementById('btnGuardarEsp').style.display = 'block';
        };

        // --- FUNCIONES COMUNES ---
        window.render = () => {
            if(window.db.tipo === "aula") {
                const f = document.getElementById('fechaSeleccionada').value;
                document.getElementById('docenteTxt').innerText = window.db.docente;
                const lista = document.getElementById('listaAsistencia');
                lista.innerHTML = "";
                (window.db.alumnos || []).filter(a => !a.retirado).sort((a,b)=>a.nombre.localeCompare(b.nombre)).forEach(a => {
                    const st = window.db.asistencias?.[f]?.[a.id] || 0;
                    let c = "#ccc"; if(st===1) c="var(--exito)"; if(st===2) c="var(--morado)";
                    lista.innerHTML += `<div class="alumno-fila"><span>${a.nombre}</span><button onclick="marcar(${a.id})" class="btn-check" style="background:${c}">${st===1?'P':st===2?'J':'F'}</button></div>`;
                });
            }
        };

        window.marcar = async (id) => {
            const f = document.getElementById('fechaSeleccionada').value;
            if(!window.db.asistencias) window.db.asistencias = {};
            if(!window.db.asistencias[f]) window.db.asistencias[f] = {};
            window.db.asistencias[f][id] = (window.db.asistencias[f][id] + 1) % 3 || 1;
            await updateDoc(doc(dbCloud, "docentes_db", window.usuarioActual), { asistencias: window.db.asistencias });
        };

        window.logout = () => location.reload();
    </script>

    <style>
        :root { --azul: #002147; --exito: #28a745; --morado: #6f42c1; --naranja: #e67e22; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; }
        header { background: var(--azul); color: white; padding: 15px; text-align: center; border-bottom: 4px solid #f39c12; font-weight: bold; }
        .container { max-width: 480px; margin: auto; padding: 10px; }
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .alumno-fila { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        input, select, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        .btn-check { width: 40px; height: 35px; border: none; color: white; border-radius: 5px; font-weight: bold; }
        .tab-btn { background: #eee; border: none; padding: 10px; flex: 1; cursor: pointer; }
        .tab-active { background: var(--naranja); color: white; }
    </style>
</head>
<body>

<div id="authSection" style="padding: 50px 20px; text-align: center;">
    <img src="https://raw.githubusercontent.com/ebnlucilapalacios-source/asistencia-lucila-palacios./main/IMG_20260225_005025_993.png" width="90">
    <h2 style="color:var(--azul)">LUCILA PALACIOS</h2>
    <div class="card" style="max-width:320px; margin:auto;">
        <input type="text" id="loginUser" placeholder="Usuario">
        <input type="password" id="loginPass" placeholder="Contraseña">
        <button onclick="login()" style="background:var(--azul); color:white;">ENTRAR</button>
    </div>
</div>

<div id="appContent" style="display:none;">
    <header>SISTEMA ESCOLAR 2026</header>
    <div class="container">
        <div class="card" style="text-align:center;">
            <input type="date" id="fechaSeleccionada" onchange="window.render()" style="text-align:center;">
            <button onclick="logout()" style="background:#eee; color:#666; padding:5px; font-size:10px; margin-top:5px; border:none;">CERRAR SESIÓN</button>
        </div>

        <div id="panelEspecialistaInterface" style="display:none;">
            <div class="card" style="border-top: 5px solid var(--naranja);">
                <b style="color:var(--naranja)">🛠 CONFIGURAR GRUPOS ESTABLES</b>
                <input type="text" id="nombreNuevoGrupo" placeholder="Nombre del Grupo (Ej: FUTBOL)">
                <button onclick="crearNuevoGrupo()" style="background:var(--azul); color:white;">+ CREAR GRUPO</button>
                <hr>
                <b>🔍 BUSCAR Y AGREGAR ALUMNOS</b>
                <select id="selGrupoDestino"></select>
                <input type="text" id="inputBusqueda" onkeyup="buscarAlumnoGlobal()" placeholder="Escriba nombre del alumno...">
                <div id="resultadosBusqueda" style="max-height: 150px; overflow-y: auto; background: #f9f9f9; border-radius: 5px;"></div>
            </div>

            <div class="card" style="border-top: 5px solid var(--exito);">
                <b>📝 PASAR ASISTENCIA</b>
                <label>Por Sección:</label>
                <select id="selSecEsp" onchange="window.verListaEsp()"></select>
                <label>Por Grupo Estable:</label>
                <select id="selGrupoAsistencia" onchange="verListaGrupoEstable()"></select>
                
                <div id="listaAlumnosEsp" style="margin-top:15px;"></div>
                <button id="btnGuardarEsp" style="display:none; background:var(--exito); color:white;" onclick="window.guardarAsistenciaEsp()">GUARDAR ASISTENCIA</button>
            </div>
        </div>

        <div id="seccionDocenteAula" style="display:none;">
            <div class="card"><b>Docente:</b> <span id="docenteTxt"></span></div>
            <div class="card">
                <b>+ Inscripción</b>
                <input type="text" id="nom" placeholder="Nombre completo">
                <select id="gen"><option value="F">Femenino</option><option value="M">Masculino</option></select>
                <input type="date" id="nac">
                <button onclick="window.agregarAlumno()" style="background:var(--exito); color:white;">INSCRIBIR</button>
            </div>
            <div class="card" id="listaAsistencia"></div>
        </div>
    </div>
</div>

</body>
</html>
