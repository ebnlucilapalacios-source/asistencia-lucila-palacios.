<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIRECCIÓN - GESTIÓN TOTAL</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --azul: #002147; --oro: #f3c612; --morado: #6f42c1; --rojo: #dc3545; --verde: #28a745; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; padding-bottom: 60px; }
        header { background: var(--azul); color: white; padding: 10px; text-align: center; border-bottom: 4px solid var(--oro); }
        .menu-inferior { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #ddd; z-index: 1000; }
        .menu-item { flex: 1; padding: 12px; text-align: center; font-size: 10px; font-weight: bold; color: #666; cursor: pointer; }
        .menu-item.active { color: var(--azul); border-top: 3px solid var(--oro); }
        .content { padding: 15px; max-width: 600px; margin: auto; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; box-sizing: border-box; }
        .btn { padding: 12px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; }
        .btn-azul { background: var(--azul); }
        .btn-verde { background: var(--verde); }
        .btn-rojo { background: var(--rojo); font-size: 10px; padding: 5px; width: auto; }
        .lista-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee; font-size: 13px; }
    </style>
</head>
<body>

<header>
    <img src="https://raw.githubusercontent.com/ebnlucilapalacios-source/asistencia-lucila-palacios./main/IMG_20260225_005025_993.png" width="35">
    <div style="font-size: 12px;">E.B.N. LUCILA PALACIOS</div>
</header>

<div class="content">
    
    <div id="sec-especialistas" class="seccion">
        <div class="card">
            <h3>👥 Crear Especialista</h3>
            <input type="text" id="esp-user" placeholder="Usuario (ej: deporte1)">
            <input type="text" id="esp-nom" placeholder="Nombre del Docente">
            <input type="password" id="esp-pass" placeholder="Contraseña">
            <button class="btn btn-verde" onclick="crearEspecialista()">+ REGISTRAR ESPECIALISTA</button>
        </div>
        <div class="card">
            <h4>Especialistas Activos</h4>
            <div id="lista-especialistas">Cargando...</div>
        </div>
    </div>

    <div id="sec-alumnos" class="seccion" style="display:none;">
        <div class="card">
            <h3>🎒 Agregar Alumno</h3>
            <select id="alum-grado">
                <option value="1">1ero</option><option value="2">2do</option><option value="3">3ero</option>
                <option value="4">4to</option><option value="5">5to</option><option value="6">6to</option>
            </select>
            <select id="alum-seccion">
                <option value="A">Sección A</option><option value="B">Sección B</option><option value="C">Sección C</option>
            </select>
            <input type="text" id="alum-nom" placeholder="Nombre Apellido">
            <button class="btn btn-azul" onclick="agregarAlumno()">AGREGAR A LISTA</button>
        </div>
        <div id="lista-alumnos-ver" class="card">
            <h4>Alumnos de la Sección</h4>
            <div id="tabla-alumnos">Elija grado arriba para ver</div>
        </div>
    </div>

</div>

<div class="menu-inferior">
    <div class="menu-item active" onclick="verSeccion('especialistas', this)">ESPECIALISTAS</div>
    <div class="menu-item" onclick="verSeccion('alumnos', this)">ALUMNOS</div>
    <div class="menu-item" onclick="location.reload()" style="color:red">SALIR</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, collection, getDocs, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const config = {
        apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
        authDomain: "control-de-asistencia-d585e.firebaseapp.com",
        projectId: "control-de-asistencia-d585e",
        storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
        appId: "1:368890880546:web:a97ab4372dea536217207b"
    };

    const app = initializeApp(config);
    const db = getFirestore(app);

    window.verSeccion = (id, el) => {
        document.querySelectorAll('.seccion').forEach(s => s.style.display = 'none');
        document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
        document.getElementById('sec-' + id).style.display = 'block';
        el.classList.add('active');
        if(id === 'especialistas') listarEspecialistas();
    };

    // --- GESTIÓN ESPECIALISTAS ---
    window.crearEspecialista = async () => {
        const u = document.getElementById('esp-user').value.toLowerCase().trim();
        const n = document.getElementById('esp-nom').value.trim();
        const p = document.getElementById('esp-pass').value.trim();
        if(!u || !n || !p) return alert("Complete los campos");

        await setDoc(doc(db, "credenciales_especialistas", u), { nombre: n, pass: p });
        alert("Especialista Creado");
        listarEspecialistas();
    };

    async function listarEspecialistas() {
        const snap = await getDocs(collection(db, "credenciales_especialistas"));
        const div = document.getElementById('lista-especialistas');
        div.innerHTML = "";
        snap.forEach(d => {
            div.innerHTML += `<div class="lista-item">${d.data().nombre} (${d.id}) 
            <button class="btn-rojo" onclick="eliminarEsp('${d.id}')">Eliminar</button></div>`;
        });
    }

    // --- GESTIÓN ALUMNOS ---
    window.agregarAlumno = async () => {
        const g = document.getElementById('alum-grado').value;
        const s = document.getElementById('alum-seccion').value;
        const n = document.getElementById('alum-nom').value.trim();
        const docID = `DOCENTE_${g}${s}`; // ID unificado

        const nuevoAlum = { id: "ID" + Date.now(), nombre: n };
        
        try {
            const docRef = doc(db, "docentes_db", docID);
            const d = await getDoc(docRef);
            if(d.exists()) {
                await updateDoc(docRef, { alumnos: arrayUnion(nuevoAlum) });
            } else {
                await setDoc(docRef, { grado: g, seccion: s, alumnos: [nuevoAlum], docente: "Por asignar" });
            }
            alert("Alumno Agregado");
            document.getElementById('alum-nom').value = "";
        } catch(e) { alert("Error al agregar"); }
    };

    // Cargar Especialistas al iniciar
    listarEspecialistas();

</script>
</body>
</html>
