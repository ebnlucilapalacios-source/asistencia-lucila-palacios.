<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Lucila Palacios - Gestión Avanzada</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root { --azul: #002147; --oro: #f39c12; --exito: #27ae60; --error: #c0392b; --fondo: #f4f7f6; --admin: #2c3e50; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--fondo); margin: 0; color: #333; }
        header { background: var(--azul); color: white; padding: 15px; text-align: center; border-bottom: 5px solid var(--oro); position: sticky; top:0; z-index: 100; }
        .container { max-width: 1000px; margin: auto; padding: 15px; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid #ddd; }
        
        .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #ddd; cursor: pointer; font-weight: bold; font-size: 11px; white-space: nowrap; }
        .tab-btn.active { background: var(--azul); color: white; }

        .alerta-critica { background: #fff3cd; border-left: 5px solid var(--oro); padding: 12px; margin-bottom: 10px; border-radius: 5px; font-size: 12px; }

        input, select, textarea { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        .btn-primario { background: var(--azul); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        
        /* Buscador de alumnos */
        .search-box { background: #e8f4fd; border: 1px solid var(--azul); padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        
        .chk-list { max-height: 250px; overflow-y: auto; background: #f9f9f9; padding: 10px; border-radius: 8px; border: 1px solid #ddd; }
        .item-alumno { display: flex; align-items: center; padding: 8px; border-bottom: 1px solid #eee; font-size: 12px; }
        
        #app-content, .sec { display: none; }
    </style>
</head>
<body>

    <div id="login-screen" style="display:flex; height:100vh; align-items:center; justify-content:center; background:var(--azul);">
        <div class="card" style="width:320px; text-align:center;">
            <h2 style="color:var(--azul)">LUCILA PALACIOS</h2>
            <input type="text" id="user" placeholder="Usuario">
            <input type="password" id="pass" placeholder="Contraseña">
            <button class="btn-primario" onclick="iniciarSesion()">ENTRAR</button>
        </div>
    </div>

    <div id="app-content">
        <header>
            <h3 id="display-area" style="margin:0;">ÁREA</h3>
            <div id="display-nombre" style="font-size:11px; opacity:0.8;">Nombre</div>
        </header>
        
        <div class="container">
            <div class="nav-tabs">
                <button class="tab-btn active" id="btn-asis" onclick="verTab('asis')">📝 ASISTENCIA</button>
                <button class="tab-btn" id="btn-stats" onclick="verTab('stats')">📊 REPORTES</button>
                <button class="tab-btn" id="btn-admin" onclick="verTab('admin')" style="background:var(--admin); color:white; display:none;">🔑 DIRECCIÓN</button>
                <button class="tab-btn" onclick="location.reload()" style="background:var(--error); color:white">SALIR</button>
            </div>

            <div id="sec-asis" class="sec" style="display:block;">
                <div class="card">
                    <input type="date" id="f-asis">
                    <div style="display:flex; gap:5px;">
                        <select id="g-asis" onchange="actualizarSelectSeccion()">
                            <option value="">Seleccione Grado...</option>
                            <option value="1">1°</option><option value="2">2°</option>
                            <option value="3">3°</option><option value="4">4°</option>
                            <option value="5">5°</option><option value="6">6°</option>
                            <option value="GE">GRUPOS ESTABLES / AULA INT.</option>
                        </select>
                        <select id="s-asis">
                            </select>
                    </div>
                    <button class="btn-primario" style="margin-top:10px;" onclick="buscarAlumnos()">🔍 CARGAR LISTA</button>
                </div>

                <div id="card-lista" class="card" style="display:none;">
                    <div class="search-box">
                        <input type="text" id="busqueda-alumno" onkeyup="filtrarAlumnosEnLista()" placeholder="🔍 Buscar alumno en esta lista...">
                    </div>
                    <h4 id="info-meta" style="color:var(--oro); font-size:12px; margin-bottom:10px;"></h4>
                    <div id="lista-render"></div>
                    <textarea id="obs-clase" placeholder="Observaciones de la sesión..."></textarea>
                    <button class="btn-primario" style="background:var(--exito)" onclick="guardarAsistencia()">💾 GUARDAR ASISTENCIA</button>
                </div>
            </div>

            <div id="sec-stats" class="sec">
                <div id="contenedor-alertas"></div>
                <div class="card">
                    <input type="month" id="mes-filtro">
                    <button onclick="generarReporte()" class="btn-primario" style="margin-top:10px;">VER CONSOLIDADO</button>
                </div>
                <div id="tabla-reporte-contenedor"></div>
            </div>

            <div id="sec-admin" class="sec">
                <div class="card" style="border-top: 5px solid var(--oro);">
                    <h3>Crear Grupo Estable / Especial</h3>
                    <input type="text" id="nombre-ge" placeholder="Nombre del Grupo (ej: Futbol 5to)">
                    <input type="text" id="meta-ge" placeholder="Objetivo Pedagógico">
                    
                    <label style="font-size:12px;">Asignar a Especialista:</label>
                    <select id="select-esp-asignar"></select>

                    <label style="font-size:12px; margin-top:10px; display:block;">Seleccionar Integrantes:</label>
                    <div class="chk-list" id="lista-alumnos-total"></div>
                    
                    <button class="btn-primario" style="margin-top:10px;" onclick="guardarGrupoEstable()">✅ REGISTRAR GRUPO</button>
                </div>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, query, where, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
        authDomain: "control-de-asistencia-d585e.firebaseapp.com",
        projectId: "control-de-asistencia-d585e",
        storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
        appId: "1:368890880546:web:a97ab4372dea536217207b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let sesion = null;
    let alumnosHoy = [];
    let estadosAsis = {};

    // --- SESIÓN ---
    window.iniciarSesion = async () => {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        if(u === "director_lucila" && p === "admin2024") {
            loguear({id:u, nombre:"Dirección", area:"Dirección", rol:"admin"});
        } else {
            const d = await getDoc(doc(db, "credenciales_especialistas", u));
            if(d.exists() && d.data().pass === p) loguear({id:u, ...d.data(), rol:"esp"});
            else alert("Error de acceso");
        }
    };

    async function loguear(data) {
        sesion = data;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-content').style.display = 'block';
        document.getElementById('display-area').innerText = sesion.area;
        document.getElementById('display-nombre').innerText = sesion.nombre;
        if(sesion.rol === 'admin') {
            document.getElementById('btn-admin').style.display = 'block';
            cargarAlumnosDireccion();
            cargarEspecialistasDireccion();
        }
        document.getElementById('f-asis').value = new Date().toISOString().split('T')[0];
        actualizarSelectSeccion(); // Carga grupos estables si es especialista
    }

    window.verTab = (t) => {
        document.querySelectorAll('.sec').forEach(s => s.style.display='none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sec-'+t).style.display='block';
        document.getElementById('btn-'+t).classList.add('active');
        if(t === 'stats') detectarAusentismo();
    };

    // --- LÓGICA DE GRUPOS ---
    window.actualizarSelectSeccion = async () => {
        const g = document.getElementById('g-asis').value;
        const selS = document.getElementById('s-asis');
        selS.innerHTML = "";

        if(g === "GE") {
            const q = query(collection(db, "grupos_estables_db"));
            const snap = await getDocs(q);
            snap.forEach(d => {
                const grupo = d.data();
                // Solo mostrar si es el dueño o si es administrador
                if(sesion.rol === 'admin' || grupo.dueñoId === sesion.id) {
                    selS.innerHTML += `<option value="${d.id}">${grupo.nombreGrupo}</option>`;
                }
            });
            if(selS.innerHTML === "") selS.innerHTML = "<option>Sin grupos asignados</option>";
        } else {
            selS.innerHTML = '<option value="A">A</option><option value="B">B</option><option value="C">C</option>';
        }
    };

    // --- BUSCADOR DENTRO DE LA LISTA ---
    window.filtrarAlumnosEnLista = () => {
        const busqueda = document.getElementById('busqueda-alumno').value.toLowerCase();
        const filas = document.querySelectorAll('.fila-alumno');
        filas.forEach(f => {
            const nombre = f.querySelector('.nombre-txt').innerText.toLowerCase();
            f.style.display = nombre.includes(busqueda) ? 'flex' : 'none';
        });
    };

    window.buscarAlumnos = async () => {
        const g = document.getElementById('g-asis').value;
        const s = document.getElementById('s-asis').value;
        if(!g || !s) return alert("Seleccione grado y sección/grupo");

        document.getElementById('card-lista').style.display = 'block';
        const cont = document.getElementById('lista-render');
        cont.innerHTML = "Cargando...";

        if(g === "GE") {
            const d = await getDoc(doc(db, "grupos_estables_db", s));
            alumnosHoy = d.data().alumnos;
            document.getElementById('info-meta').innerText = "🎯 META: " + d.data().meta;
        } else {
            const snap = await getDocs(collection(db, "docentes_db"));
            snap.forEach(d => {
                if(String(d.data().grado).includes(g) && d.data().seccion.toUpperCase() === s) {
                    alumnosHoy = d.data().alumnos.filter(a => !a.retirado);
                }
            });
        }
        renderizarLista();
    };

    function renderizarLista() {
        const cont = document.getElementById('lista-render');
        cont.innerHTML = "";
        alumnosHoy.forEach(a => {
            if(!estadosAsis[a.id]) estadosAsis[a.id] = 1;
            cont.innerHTML += `
                <div class="fila-alumno" style="display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px solid #eee;">
                    <span class="nombre-txt" style="font-size:13px;">${a.nombre}</span>
                    <button onclick="cambiarAsis(${a.id})" style="background:${estadosAsis[a.id]===1?'var(--exito)':'var(--error)'}; color:white; border:none; border-radius:8px; padding:8px 12px; font-weight:bold;">
                        ${estadosAsis[a.id]===1?'P':'I'}
                    </button>
                </div>`;
        });
    }

    window.cambiarAsis = (id) => {
        estadosAsis[id] = estadosAsis[id] === 1 ? 0 : 1;
        renderizarLista();
        filtrarAlumnosEnLista(); // Mantiene el filtro si estaba buscando
    };

    window.guardarAsistencia = async () => {
        const f = document.getElementById('f-asis').value;
        const g = document.getElementById('g-asis').value;
        const s = document.getElementById('s-asis').value;
        const obs = document.getElementById('obs-clase').value;

        let av=0, ah=0, mv=0, mh=0, faltas = [];
        alumnosHoy.forEach(a => {
            const isV = a.genero.toLowerCase().startsWith('v');
            if(isV) mv++; else mh++;
            if(estadosAsis[a.id] === 1) { if(isV) av++; else ah++; }
            else { faltas.push({id: a.id, nombre: a.nombre, g: g, s: s}); }
        });

        await setDoc(doc(db, "asistencia_especialistas", `${sesion.id}_${f}_${s}`.replace(/\s+/g, '')), {
            espNom: sesion.nombre, area: sesion.area, fecha: f, grado: g, seccion: s,
            av, ah, mv, mh, obs, faltistas: faltas
        });
        alert("✅ Asistencia Guardada");
        location.reload();
    };

    // --- DIRECCIÓN: GESTIÓN ---
    async function cargarAlumnosDireccion() {
        const cont = document.getElementById('lista-alumnos-total');
        const snap = await getDocs(collection(db, "docentes_db"));
        cont.innerHTML = "";
        snap.forEach(d => {
            d.data().alumnos.forEach(a => {
                cont.innerHTML += `
                <div class="item-alumno">
                    <input type="checkbox" class="chk-ge" data-id="${a.id}" data-nom="${a.nombre}" data-gen="${a.genero}">
                    ${a.nombre} (${d.data().grado}° ${d.data().seccion})
                </div>`;
            });
        });
    }

    async function cargarEspecialistasDireccion() {
        const sel = document.getElementById('select-esp-asignar');
        const snap = await getDocs(collection(db, "credenciales_especialistas"));
        sel.innerHTML = "";
        snap.forEach(d => {
            sel.innerHTML += `<option value="${d.id}">${d.data().nombre} (${d.data().area})</option>`;
        });
    }

    window.guardarGrupoEstable = async () => {
        const nom = document.getElementById('nombre-ge').value;
        const meta = document.getElementById('meta-ge').value;
        const espId = document.getElementById('select-esp-asignar').value;
        const checks = document.querySelectorAll('.chk-ge:checked');

        if(!nom || checks.length === 0) return alert("Faltan datos");

        let seleccion = [];
        checks.forEach(c => seleccion.push({id: c.dataset.id, nombre: c.dataset.nom, genero: c.dataset.gen}));

        await setDoc(doc(db, "grupos_estables_db", nom.replace(/\s+/g, '_')), {
            nombreGrupo: nom, meta: meta, dueñoId: espId, alumnos: seleccion
        });
        alert("Grupo Creado y Asignado");
        location.reload();
    };

</script>
</body>
</html>
