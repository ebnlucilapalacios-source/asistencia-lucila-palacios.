<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA INTEGRAL - EBN LUCILA PALACIOS 2026</title>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
            authDomain: "control-de-asistencia-d585e.firebaseapp.com",
            projectId: "control-de-asistencia-d585e",
            storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
            appId: "1:368890880546:web:a97ab4372dea536217207b"
        };

        const app = initializeApp(firebaseConfig);
        const dbCloud = getFirestore(app);
        const CLAVE_INST = "LUCILA2026";

        window.usuarioActual = null;
        window.db = {};
        window.todosLosAlumnosGlobal = [];

        // --- INICIO DE SESIÓN ---
        window.login = async () => {
            const u = document.getElementById('loginUser').value.toLowerCase().trim();
            const p = document.getElementById('loginPass').value;
            const snap = await getDoc(doc(dbCloud, "docentes_db", u));
            
            if (snap.exists() && snap.data().pass === p) {
                window.usuarioActual = u;
                window.db = snap.data();
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                document.getElementById('fechaSeleccionada').value = new Date().toISOString().split('T')[0];

                if (window.db.tipo === "especialista") {
                    document.getElementById('panelEspecialistaInterface').style.display = 'block';
                    document.getElementById('seccionDocenteAula').style.display = 'none';
                    await sincronizarDatosEspecialista();
                } else if (u === "admin_lucila") {
                    document.getElementById('adminPanel').style.display = 'block';
                } else {
                    document.getElementById('seccionDocenteAula').style.display = 'block';
                    document.getElementById('panelEspecialistaInterface').style.display = 'none';
                }

                onSnapshot(doc(dbCloud, "docentes_db", u), (s) => { 
                    window.db = s.data(); 
                    if(window.db.tipo === "especialista") actualizarInterfazGrupos();
                    window.renderAula(); 
                });
            } else {
                Swal.fire("Error", "Usuario o clave incorrectos", "error");
            }
        };

        // --- LÓGICA ESPECIALISTA (GRUPOS ESTABLES Y BUSCADOR) ---
        async function sincronizarDatosEspecialista() {
            const querySnap = await getDocs(collection(dbCloud, "docentes_db"));
            const selSec = document.getElementById('selSecEsp');
            selSec.innerHTML = '<option value="">-- SELECCIONE SECCIÓN --</option>';
            window.todosLosAlumnosGlobal = [];

            querySnap.forEach(d => {
                const data = d.data();
                if(data.tipo === "aula") {
                    selSec.innerHTML += `<option value="${d.id}">${data.grado}${data.seccion} - ${data.docente}</option>`;
                    if(data.alumnos) {
                        data.alumnos.forEach(a => {
                            if(!a.retirado) window.todosLosAlumnosGlobal.push({...a, procedencia: `${data.grado}${data.seccion}`});
                        });
                    }
                }
            });
            actualizarInterfazGrupos();
        }

        function actualizarInterfazGrupos() {
            const selDestino = document.getElementById('selGrupoDestino');
            const selAsistencia = document.getElementById('selGrupoAsistencia');
            const txt = '<option value="">-- ELIJA UN GRUPO --</option>';
            
            selDestino.innerHTML = txt;
            selAsistencia.innerHTML = txt;

            if (window.db.gruposEstables) {
                Object.keys(window.db.gruposEstables).forEach(g => {
                    selDestino.innerHTML += `<option value="${g}">${g}</option>`;
                    selAsistencia.innerHTML += `<option value="${g}">${g}</option>`;
                });
            }
        }

        window.crearNuevoGrupo = async () => {
            const nombre = document.getElementById('nombreNuevoGrupo').value.toUpperCase().trim();
            if(!nombre) return;
            
            let grupos = window.db.gruposEstables || {};
            grupos[nombre] = [];
            
            await updateDoc(doc(dbCloud, "docentes_db", window.usuarioActual), { gruposEstables: grupos });
            document.getElementById('nombreNuevoGrupo').value = "";
            Swal.fire("Grupo Creado", nombre, "success");
        };

        window.buscarAlumnoGlobal = () => {
            const b = document.getElementById('inputBusqueda').value.toUpperCase();
            const res = document.getElementById('resultadosBusqueda');
            res.innerHTML = "";
            if(b.length < 3) return;

            window.todosLosAlumnosGlobal.filter(a => a.nombre.includes(b)).forEach(a => {
                res.innerHTML += `
                    <div class="alumno-fila" style="font-size:12px; border-bottom:1px solid #eee; padding:5px;">
                        <span>${a.nombre} (${a.procedencia})</span>
                        <button onclick="agregarAlumnoAGrupo('${a.nombre}', '${a.genero}', '${a.procedencia}')" style="width:30px; background:var(--azul); color:white;">+</button>
                    </div>`;
            });
        };

        window.agregarAlumnoAGrupo = async (nombre, genero, procedencia) => {
            const grupo = document.getElementById('selGrupoDestino').value;
            if(!grupo) return Swal.fire("Atención", "Seleccione el grupo arriba", "warning");

            let grupos = window.db.gruposEstables;
            if(grupos[grupo].find(x => x.nombre === nombre)) return Swal.fire("Ya existe", "El alumno ya está en el grupo", "info");

            grupos[grupo].push({ nombre, genero, procedencia, id: Date.now() });
            await updateDoc(doc(dbCloud, "docentes_db", window.usuarioActual), { gruposEstables: grupos });
            Swal.fire("Agregado", nombre, "success");
        };

        window.mostrarListaAsistencia = async (tipo) => {
            const cont = document.getElementById('listaAlumnosEsp');
            cont.innerHTML = "";
            let alumnos = [];

            if(tipo === 'seccion') {
                const id = document.getElementById('selSecEsp').value;
                if(!id) return;
                const snap = await getDoc(doc(dbCloud, "docentes_db", id));
                alumnos = (snap.data().alumnos || []).filter(a => !a.retirado);
                cont.innerHTML = `<h4>Sección: ${snap.data().grado}${snap.data().seccion}</h4>`;
            } else {
                const g = document.getElementById('selGrupoAsistencia').value;
                if(!g) return;
                alumnos = window.db.gruposEstables[g];
                cont.innerHTML = `<h4>Grupo: ${g} <button onclick="gestionarGrupo('${g}')" style="width:auto; font-size:10px; background:red; color:white;">Eliminar Alumnos</button></h4>`;
            }

            alumnos.forEach(a => {
                cont.innerHTML += `
                    <div class="alumno-fila">
                        <span>${a.nombre}</span>
                        <input type="checkbox" class="chkEsp" data-gen="${a.genero}" checked style="width:25px; height:25px;">
                    </div>`;
            });
            document.getElementById('btnGuardarEsp').style.display = 'block';
        };

        window.guardarAsistenciaEsp = async () => {
            const chks = document.querySelectorAll('.chkEsp');
            let h = 0, v = 0;
            chks.forEach(c => { if(c.checked) c.dataset.gen === 'F' ? h++ : v++; });
            
            await addDoc(collection(dbCloud, "asistencia_especialistas"), {
                especialista: window.db.docente,
                fecha: document.getElementById('fechaSeleccionada').value,
                hembras: h, varones: v, total: h+v,
                timestamp: new Date()
            });
            Swal.fire("Guardado", "Estadística enviada", "success");
            cont.innerHTML = "";
        };

        // --- LÓGICA AULA ---
        window.renderAula = () => {
            if(window.db.tipo !== "aula") return;
            const f = document.getElementById('fechaSeleccionada').value;
            const lista = document.getElementById('listaAsistencia');
            lista.innerHTML = "";
            (window.db.alumnos || []).filter(a => !a.retirado).forEach(a => {
                const st = window.db.asistencias?.[f]?.[a.id] || 0;
                let c = "#ccc"; if(st===1) c="var(--exito)"; if(st===2) c="var(--morado)";
                lista.innerHTML += `<div class="alumno-fila"><span>${a.nombre}</span><button onclick="marcar(${a.id})" class="btn-check" style="background:${c}">${st===1?'P':st===2?'J':'F'}</button></div>`;
            });
        };

        window.marcar = async (id) => {
            const f = document.getElementById('fechaSeleccionada').value;
            if(!window.db.asistencias) window.db.asistencias = {};
            if(!window.db.asistencias[f]) window.db.asistencias[f] = {};
            window.db.asistencias[f][id] = (window.db.asistencias[f][id] + 1) % 3 || 1;
            await updateDoc(doc(dbCloud, "docentes_db", window.usuarioActual), { asistencias: window.db.asistencias });
        };

        window.logout = () => location.reload();
    </script>

    <style>
        :root { --azul: #002147; --exito: #28a745; --morado: #6f42c1; --naranja: #e67e22; }
        body { font-family: sans-serif; background: #f4f7f9; margin: 0; }
        header { background: var(--azul); color: white; padding: 15px; text-align: center; border-bottom: 4px solid #f39c12; }
        .container { max-width: 480px; margin: auto; padding: 10px; }
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .alumno-fila { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
        input, select, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        .btn-check { width: 45px; height: 40px; border: none; color: white; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div id="authSection" style="padding: 50px 20px; text-align: center;">
    <img src="https://raw.githubusercontent.com/ebnlucilapalacios-source/asistencia-lucila-palacios./main/IMG_20260225_005025_993.png" width="80">
    <h2>LUCILA PALACIOS</h2>
    <div class="card" style="max-width:320px; margin:auto;">
        <input type="text" id="loginUser" placeholder="Usuario">
        <input type="password" id="loginPass" placeholder="Contraseña">
        <button onclick="login()" style="background:var(--azul); color:white;">ENTRAR</button>
    </div>
</div>

<div id="appContent" style="display:none;">
    <header><b>SISTEMA ESCOLAR 2026</b></header>
    <div class="container">
        <div class="card" style="text-align:center;">
            <input type="date" id="fechaSeleccionada">
            <button onclick="logout()" style="background:#eee; color:#666; border:none; padding:5px; font-size:10px;">CERRAR SESIÓN</button>
        </div>

        <div id="panelEspecialistaInterface" style="display:none;">
            <div class="card" style="border-top: 5px solid var(--naranja);">
                <b>🛠 1. GRUPOS ESTABLES</b>
                <input type="text" id="nombreNuevoGrupo" placeholder="Nombre: Ej FUTBOL">
                <button onclick="crearNuevoGrupo()" style="background:var(--azul); color:white;">+ CREAR GRUPO</button>
                <hr>
                <b>👥 2. AÑADIR ALUMNOS</b>
                <select id="selGrupoDestino"></select>
                <input type="text" id="inputBusqueda" onkeyup="buscarAlumnoGlobal()" placeholder="Buscar por nombre...">
                <div id="resultadosBusqueda" style="max-height:120px; overflow-y:auto; background:#f9f9f9;"></div>
            </div>

            <div class="card" style="border-top: 5px solid var(--exito);">
                <b>📝 3. PASAR ASISTENCIA</b>
                <select id="selSecEsp" onchange="mostrarListaAsistencia('seccion')"></select>
                <select id="selGrupoAsistencia" onchange="mostrarListaAsistencia('grupo')"></select>
                <div id="listaAlumnosEsp" style="margin-top:10px;"></div>
                <button id="btnGuardarEsp" style="display:none; background:var(--exito); color:white;" onclick="guardarAsistenciaEsp()">GUARDAR DÍA</button>
            </div>
        </div>

        <div id="seccionDocenteAula" style="display:none;">
            <div class="card"><span id="docenteTxt"></span></div>
            <div class="card" id="listaAsistencia"></div>
        </div>
    </div>
</div>

</body>
</html>
