<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA INTEGRAL - EBN LUCILA PALACIOS</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
            authDomain: "control-de-asistencia-d585e.firebaseapp.com",
            projectId: "control-de-asistencia-d585e",
            storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
            appId: "1:368890880546:web:a97ab4372dea536217207b"
        };

        const app = initializeApp(firebaseConfig);
        const dbCloud = getFirestore(app);
        const USUARIO_ADMIN = "admin_lucila";

        window.usuarioActual = null;
        window.db = {}; 
        window.alumnosTemporalesEspecialista = [];

        // --- MOTOR DE ACCESO (EL NÚCLEO) ---
        window.login = async () => {
            const u = document.getElementById('loginUser').value.toLowerCase().trim();
            const p = document.getElementById('loginPass').value;
            
            try {
                const snap = await getDoc(doc(dbCloud, "docentes_db", u));
                
                if (snap.exists() && snap.data().pass === p) {
                    window.usuarioActual = u;
                    const datos = snap.data();
                    
                    // Limpiar interfaz antes de entrar
                    document.getElementById('authSection').style.display = 'none';
                    document.getElementById('appContent').style.display = 'block';
                    document.getElementById('adminPanel').style.display = 'none';
                    document.getElementById('especialistaPanel').style.display = 'none';
                    document.getElementById('formInscripcion').style.display = 'none';

                    // ESCUCHA EN TIEMPO REAL
                    onSnapshot(doc(dbCloud, "docentes_db", u), (s) => { 
                        window.db = s.data(); 
                        window.renderSegunRol(); 
                    });

                    // RUTEO POR ROL
                    if (u === USUARIO_ADMIN) {
                        document.getElementById('adminPanel').style.display = 'block';
                    } else if (datos.tipo === "especialista") {
                        document.getElementById('especialistaPanel').style.display = 'block';
                        window.actualizarSelectorSecciones(); 
                    } else {
                        // Es Docente de Aula
                        document.getElementById('formInscripcion').style.display = 'block';
                    }
                } else {
                    alert("Credenciales incorrectas.");
                }
            } catch (e) { alert("Error de conexión"); }
        };

        // --- LÓGICA ESPECIALISTA (CARGA GLOBAL) ---
        window.actualizarSelectorSecciones = async () => {
            const selector = document.getElementById('espSelectorSecciones');
            selector.innerHTML = '<option>Cargando secciones...</option>';
            
            const snap = await getDocs(collection(dbCloud, "docentes_db"));
            let opciones = '<option value="">-- Seleccione Sección --</option>';
            snap.forEach(dSnap => {
                const d = dSnap.data();
                if(d.tipo === "aula" && d.grado) {
                    opciones += `<option value="${d.grado}-${d.seccion}">${d.grado}° "${d.seccion}" - Prof. ${d.docente}</option>`;
                }
            });
            selector.innerHTML = opciones;
        };

        window.cargarSeccionEspecialista = async () => {
            const val = document.getElementById('espSelectorSecciones').value;
            if(!val) return alert("Seleccione una sección");
            
            const [g, s] = val.split('-');
            const snap = await getDocs(collection(dbCloud, "docentes_db"));
            
            window.alumnosTemporalesEspecialista = []; // Reset
            snap.forEach(dSnap => {
                const d = dSnap.data();
                if(d.grado == g && d.seccion == s && d.tipo === "aula") {
                    window.alumnosTemporalesEspecialista = d.alumnos || [];
                }
            });
            
            if(window.alumnosTemporalesEspecialista.length > 0) {
                window.renderEspecialista();
            } else {
                alert("Esta sección no tiene alumnos inscritos.");
            }
        };

        window.renderEspecialista = () => {
            const lista = document.getElementById('listaAsistencia'); // Usamos el mismo contenedor
            const f = document.getElementById('fechaSeleccionada').value;
            lista.innerHTML = `<h4 style="color:var(--naranja)">Asistencia Especialista</h4>`;
            
            window.alumnosTemporalesEspecialista.filter(a => !a.retirado).forEach(a => {
                const st = (window.db.asistenciasEsp && window.db.asistenciasEsp[f] && window.db.asistenciasEsp[f][a.id]) || 0;
                let color = st === 1 ? 'var(--exito)' : '#ccc';
                lista.innerHTML += `
                    <div class="alumno-fila">
                        <span>${a.nombre}</span>
                        <button onclick="marcarEsp(${a.id})" class="btn-check" style="background:${color}">${st===1?'P':'F'}</button>
                    </div>`;
            });
        };

        // --- RENDERIZADO GENERAL ---
        window.renderSegunRol = () => {
            if(!window.db.docente) return;
            
            // Saludo común para todos
            document.getElementById('textoSaludo').innerHTML = `¡Hola, ${window.db.docente}!`;
            document.getElementById('docenteInfo').innerText = `${window.db.grado || ''} ${window.db.seccion || ''} (${window.db.tipo.toUpperCase()})`;

            // Si es docente de aula, mostrar su propia lista
            if(window.db.tipo === "aula") {
                const lista = document.getElementById('listaAsistencia');
                const fSel = document.getElementById('fechaSeleccionada').value;
                lista.innerHTML = "";
                
                (window.db.alumnos || []).filter(a => !a.retirado).forEach(a => {
                    const st = (window.db.asistencias[fSel] && window.db.asistencias[fSel][a.id]) || 0;
                    let c = st === 1 ? "var(--exito)" : (st === 2 ? "var(--morado)" : "#ccc");
                    lista.innerHTML += `
                        <div class="alumno-fila">
                            <div style="flex:1">${a.nombre}</div>
                            <button onclick="marcarAula(${a.id})" class="btn-check" style="background:${c}">${st===1?'P':(st===2?'J':'F')}</button>
                        </div>`;
                });
            }
        };

        window.marcarAula = async (id) => {
            const f = document.getElementById('fechaSeleccionada').value;
            if(!window.db.asistencias[f]) window.db.asistencias[f] = {};
            window.db.asistencias[f][id] = (window.db.asistencias[f][id] + 1) % 3;
            await setDoc(doc(dbCloud, "docentes_db", window.usuarioActual), window.db);
        };

        window.marcarEsp = async (id) => {
            const f = document.getElementById('fechaSeleccionada').value;
            if(!window.db.asistenciasEsp) window.db.asistenciasEsp = {};
            if(!window.db.asistenciasEsp[f]) window.db.asistenciasEsp[f] = {};
            window.db.asistenciasEsp[f][id] = (window.db.asistenciasEsp[f][id] === 1) ? 0 : 1;
            await setDoc(doc(dbCloud, "docentes_db", window.usuarioActual), window.db);
            window.renderEspecialista();
        };

        window.registrarCuenta = async () => {
            const u = document.getElementById('regUser').value.toLowerCase().trim();
            await setDoc(doc(dbCloud, "docentes_db", u), { 
                docente: document.getElementById('regNombre').value.toUpperCase(), 
                pass: document.getElementById('regPass').value, 
                grado: document.getElementById('regGrado').value, 
                seccion: document.getElementById('regSeccion').value.toUpperCase(), 
                tipo: document.getElementById('regTipoUser').value,
                alumnos: [], asistencias: {}, asistenciasEsp: {}
            });
            alert("Cuenta registrada."); location.reload();
        };

    </script>

    <style>
        :root { --azul: #002147; --exito: #28a745; --morado: #6f42c1; --naranja: #e67e22; }
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; }
        .container { max-width: 400px; margin: auto; padding: 15px; }
        .card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .alumno-fila { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        .btn-check { width: 40px; height: 40px; border: none; color: white; border-radius: 5px; font-weight: bold; cursor: pointer; }
        input, select, button { width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; }
        header { background: var(--azul); color: white; padding: 15px; text-align: center; }
    </style>
</head>
<body>

<div id="authSection" class="container">
    <div class="card">
        <h3>ACCESO UNIFICADO</h3>
        <input type="text" id="loginUser" placeholder="Usuario">
        <input type="password" id="loginPass" placeholder="Contraseña">
        <button onclick="login()" style="background:var(--azul); color:white;">ENTRAR</button>
        <hr>
        <h4>REGISTRO NUEVO</h4>
        <input type="text" id="regNombre" placeholder="Nombre completo">
        <input type="text" id="regGrado" placeholder="Grado (Solo si es Aula)">
        <input type="text" id="regSeccion" placeholder="Sección (Solo si es Aula)">
        <select id="regTipoUser">
            <option value="aula">Docente de Aula</option>
            <option value="especialista">Especialista</option>
        </select>
        <input type="text" id="regUser" placeholder="Usuario">
        <input type="password" id="regPass" placeholder="Contraseña">
        <button onclick="registrarCuenta()">CREAR CUENTA</button>
    </div>
</div>

<div id="appContent" style="display:none;">
    <header>E.B.N. LUCILA PALACIOS</header>
    <div class="container">
        <div id="textoSaludo" class="card" style="font-weight:bold;"></div>
        
        <div class="card">
            <span id="docenteInfo"></span>
            <input type="date" id="fechaSeleccionada" onchange="location.reload()">
        </div>

        <div id="adminPanel" class="card" style="display:none; border:2px solid var(--morado);">
            <b>📊 PANEL DIRECTIVO</b>
            <button onclick="alert('Generando consolidado...')">VER TODA LA ESCUELA</button>
        </div>

        <div id="especialistaPanel" class="card" style="display:none; border:2px solid var(--naranja);">
            <b>🎨 PANEL ESPECIALISTA</b>
            <select id="espSelectorSecciones"></select>
            <button onclick="cargarSeccionEspecialista()" style="background:var(--azul); color:white;">CARGAR ALUMNOS</button>
        </div>

        <div id="formInscripcion" class="card" style="display:none;">
            <b>+ Inscribir Alumno</b>
            <input type="text" id="nom" placeholder="Nombre del niño/a">
            <button onclick="agregarAlumno()" style="background:var(--exito); color:white;">GUARDAR</button>
        </div>

        <div id="listaAsistencia" class="card"></div>
        
        <button onclick="location.reload()" style="background:var(--naranja); color:white; border:none;">SALIR</button>
    </div>
</div>

</body>
</html>
