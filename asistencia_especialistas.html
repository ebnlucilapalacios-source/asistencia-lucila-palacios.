<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.C.A. - Lucila Palacios (Especialistas)</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root { --azul: #002147; --oro: #f3c612; --exito: #27ae60; --error: #c0392b; --fondo: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--fondo); margin: 0; }
        
        .login-screen { height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--azul); }
        .login-card { background: white; padding: 30px; border-radius: 20px; width: 340px; text-align: center; border-top: 6px solid var(--oro); }
        
        header { background: var(--azul); color: white; padding: 15px; text-align: center; border-bottom: 5px solid var(--oro); }
        .logo-h { width: 50px; height: 50px; background: white; border-radius: 50%; padding: 2px; }

        .container { max-width: 950px; margin: auto; padding: 15px; }
        .nav-tabs { display: flex; gap: 5px; margin-bottom: 20px; overflow-x: auto; padding: 5px; background: #ddd; border-radius: 10px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 11px; white-space: nowrap; }
        .tab-btn.active { background: var(--oro); color: var(--azul); }

        .card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        
        .btn { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; color: white; }
        .btn-azul { background: var(--azul); }
        .btn-exito { background: var(--exito); }
        
        .fila-alumno { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .btn-asis { width: 40px; height: 40px; border-radius: 50%; border: none; color: white; cursor: pointer; font-weight: bold; }

        #app-content, .sec { display: none; }
        .badge-gen { font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 5px; color: white; }
    </style>
</head>
<body>

    <div id="login-screen" class="login-screen">
        <div class="login-card">
            <img src="421692.png" width="100" onerror="this.src='https://via.placeholder.com/100'">
            <h2 style="color:var(--azul)">S.C.A. LUCILA</h2>
            <input type="text" id="user" placeholder="Usuario">
            <input type="password" id="pass" placeholder="Contraseña">
            <button class="btn btn-azul" onclick="iniciarSesion()">ENTRAR</button>
        </div>
    </div>

    <div id="app-content">
        <header>
            <img src="421692.png" class="logo-h">
            <h3 id="display-area" style="margin:5px 0 0 0; font-size:14px;">ÁREA</h3>
            <div id="display-nombre" style="font-size:11px;">Docente</div>
        </header>

        <div class="container">
            <div class="nav-tabs">
                <button class="tab-btn active" id="btn-asis" onclick="verTab('asis')">ASISTENCIA</button>
                <button class="tab-btn" id="btn-mge" onclick="verTab('mge')">MIS GRUPOS</button>
                <button class="tab-btn" id="btn-stats" onclick="verTab('stats')">ESTADÍSTICAS</button>
                <button class="tab-btn" id="btn-admin" onclick="verTab('admin')" style="display:none; background:var(--azul); color:white;">DIRECCIÓN</button>
                <button class="tab-btn" onclick="location.reload()" style="background:var(--error); color:white;">SALIR</button>
            </div>

            <div id="sec-asis" class="sec" style="display:block;">
                <div class="card">
                    <input type="date" id="fecha-selector">
                    <div style="display:flex; gap:10px;">
                        <select id="grado-sel" onchange="actualizarSecciones()">
                            <option value="">-- Grado --</option>
                            <option value="1">1° Grado</option><option value="2">2° Grado</option>
                            <option value="3">3° Grado</option><option value="4">4° Grado</option>
                            <option value="5">5° Grado</option><option value="6">6° Grado</option>
                            <option value="GE">Grupo Estable</option>
                        </select>
                        <select id="secc-sel"></select>
                    </div>
                    <button class="btn btn-azul" onclick="cargarLista()">CARGAR LISTA 1A</button>
                </div>
                <div id="panel-lista" class="card" style="display:none;">
                    <div id="info-header" style="font-weight:bold; color:var(--azul); margin-bottom:10px;"></div>
                    <div id="render-alumnos"></div>
                    <button class="btn btn-exito" style="margin-top:15px;" onclick="guardarAsistencia()">💾 GUARDAR JORNADA</button>
                </div>
            </div>

            <div id="sec-stats" class="sec">
                <div class="card">
                    <h4>📊 CONTROL ESTADÍSTICO</h4>
                    <input type="month" id="mes-pdf">
                    <button class="btn btn-exito" onclick="generarReporteAvanzado()">📥 DESCARGAR PDF DISGREGADO</button>
                </div>
                <div id="vista-previa-stats"></div>
            </div>

            <div id="sec-admin" class="sec">
                <div class="card">
                    <h4>⚙️ GESTIÓN DE ESPECIALISTAS</h4>
                    <input type="text" id="adm-nom" placeholder="Nombre">
                    <input type="text" id="adm-area" placeholder="Área">
                    <input type="text" id="adm-user" placeholder="Usuario">
                    <input type="text" id="adm-pass" placeholder="Clave">
                    <button class="btn btn-azul" onclick="gestionarEsp()">GUARDAR / ACTUALIZAR</button>
                    <hr>
                    <div id="lista-esp"></div>
                </div>
            </div>
            
            <div id="sec-mge" class="sec">
                <div class="card">
                    <h4>🔨 CREAR GRUPO PROPIO</h4>
                    <input type="text" id="mge-nombre" placeholder="Nombre del Grupo">
                    <p style="font-size:10px; font-weight:bold;">SELECCIONAR DE TODA LA ESCUELA:</p>
                    <div id="mge-buscador-total" style="max-height:200px; overflow-y:auto; border:1px solid #ddd; padding:5px;"></div>
                    <button class="btn btn-azul" style="margin-top:10px;" onclick="crearGE()">CREAR GRUPO</button>
                </div>
            </div>

        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
        authDomain: "control-de-asistencia-d585e.firebaseapp.com",
        projectId: "control-de-asistencia-d585e",
        storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
        appId: "1:368890880546:web:a97ab4372dea536217207b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let sesion = null;
    let listaAlumnos = [];
    let asisData = {};

    window.iniciarSesion = async () => {
        const u = document.getElementById('user').value.trim();
        const p = document.getElementById('pass').value.trim();
        if(u === "director" && p === "lucila2026") {
            entrar({id:"admin", nombre:"Dirección", area:"Administración", rol:"admin"});
        } else {
            const d = await getDoc(doc(db, "credenciales_especialistas", u));
            if(d.exists() && d.data().pass === p) entrar({id:u, ...d.data(), rol:"esp"});
            else alert("Error de acceso");
        }
    };

    function entrar(data) {
        sesion = data;
        document.getElementById('login-screen').style.display='none';
        document.getElementById('app-content').style.display='block';
        document.getElementById('display-area').innerText = sesion.area;
        document.getElementById('display-nombre').innerText = sesion.nombre;
        document.getElementById('fecha-selector').value = new Date().toISOString().split('T')[0];
        if(sesion.rol === 'admin') { 
            document.getElementById('btn-admin').style.display='block';
            cargarListaEsp();
        }
        actualizarSecciones();
        prepararBuscadorMGE();
    }

    window.verTab = (t) => {
        document.querySelectorAll('.sec').forEach(s => s.style.display='none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sec-'+t).style.display='block';
        document.getElementById('btn-'+t).classList.add('active');
    };

    window.actualizarSecciones = async () => {
        const g = document.getElementById('grado-sel').value;
        const s = document.getElementById('secc-sel');
        s.innerHTML = '<option value="">-- Secc --</option>';
        if(g === "GE") {
            const snap = await getDocs(collection(db, "grupos_estables_db"));
            snap.forEach(d => { if(sesion.rol === 'admin' || d.data().creador === sesion.id) s.innerHTML += `<option value="${d.id}">${d.data().nombre}</option>`; });
        } else if(g !== "") {
            ['A','B','C','D','E'].forEach(l => s.innerHTML += `<option value="${l}">${l}</option>`);
        }
    };

    // CORRECCIÓN PARA CARGAR 1A Y OTROS
    window.cargarLista = async () => {
        const g = document.getElementById('grado-sel').value;
        const s = document.getElementById('secc-sel').value;
        if(!g || !s) return alert("Seleccione grado y sección");

        const render = document.getElementById('render-alumnos');
        render.innerHTML = "Buscando datos...";
        document.getElementById('panel-lista').style.display='block';
        
        listaAlumnos = []; asisData = {};

        if(g === "GE") {
            const d = await getDoc(doc(db, "grupos_estables_db", s));
            if(d.exists()) listaAlumnos = d.data().alumnos;
        } else {
            const snap = await getDocs(collection(db, "docentes_db"));
            snap.forEach(docu => {
                const d = docu.data();
                // Lógica ultra-flexible para grado y sección
                const gDB = String(d.grado).trim();
                const sDB = String(d.seccion).trim().toUpperCase();
                
                if(gDB === String(g) && sDB === s.toUpperCase()) {
                    listaAlumnos = [...listaAlumnos, ...d.alumnos.filter(a => !a.retirado)];
                }
            });
        }
        dibujarAsistencia();
    };

    function dibujarAsistencia() {
        const c = document.getElementById('render-alumnos');
        c.innerHTML = (listaAlumnos.length === 0) ? "No se encontraron alumnos en 1A." : "";
        listaAlumnos.sort((a,b)=>a.nombre.localeCompare(b.nombre)).forEach(a => {
            if(!asisData[a.id]) asisData[a.id] = { status: 1, gen: a.genero || 'M' };
            const colorGen = asisData[a.id].gen === 'F' ? '#e91e63' : '#2196f3';
            c.innerHTML += `
                <div class="fila-alumno">
                    <span>${a.nombre} <span class="badge-gen" style="background:${colorGen}">${asisData[a.id].gen}</span></span>
                    <button class="btn-asis" onclick="toggle('${a.id}')" style="background:${asisData[asisData[a.id].status===1?'var(--exito)':'var(--error)']}">${asisData[a.id].status===1?'P':'I'}</button>
                </div>`;
        });
        actualizarBotonColor();
    }

    function actualizarBotonColor() {
        document.querySelectorAll('.btn-asis').forEach((btn, index) => {
            const id = listaAlumnos[index].id;
            btn.style.background = asisData[id].status === 1 ? 'var(--exito)' : 'var(--error)';
            btn.innerText = asisData[id].status === 1 ? 'P' : 'I';
        });
    }

    window.toggle = (id) => { asisData[id].status = asisData[id].status === 1 ? 0 : 1; dibujarAsistencia(); };

    window.guardarAsistencia = async () => {
        const f = document.getElementById('fecha-selector').value;
        const g = document.getElementById('grado-sel').value;
        const s = document.getElementById('secc-sel').value;
        const idDoc = `${sesion.id}_${f}_${s}`.replace(/\s+/g,'');
        
        await setDoc(doc(db, "asistencia_especialistas", idDoc), {
            docente: sesion.nombre,
            area: sesion.area,
            fecha: f,
            grado: g,
            seccion: s,
            asistencias: asisData,
            timestamp: new Date().getTime()
        });
        alert("¡Asistencia de hoy guardada!");
        location.reload();
    };

    // --- ESTADÍSTICAS AVANZADAS ---
    window.generarReporteAvanzado = async () => {
        const mes = document.getElementById('mes-pdf').value;
        if(!mes) return alert("Seleccione mes");

        const { jsPDF } = window.jspdf;
        const docP = new jsPDF('p', 'mm', 'a4');
        
        docP.setFontSize(14);
        docP.text("REPORTE ESTADÍSTICO DE ESPECIALISTAS", 105, 15, {align:'center'});
        docP.setFontSize(10);
        docP.text(`E.B.N. LUCILA PALACIOS | MES: ${mes}`, 105, 20, {align:'center'});

        const snap = await getDocs(collection(db, "asistencia_especialistas"));
        let tabla = [];
        let totalMatricula = 0;
        let totalAsistentes = 0;
        let tM = 0, tF = 0, aM = 0, aF = 0;

        snap.forEach(d => {
            const data = d.data();
            if(data.fecha.startsWith(mes) && (sesion.rol === 'admin' || data.docente === sesion.nombre)) {
                let matricula = Object.keys(data.asistencias).length;
                let presentes = Object.values(data.asistencias).filter(v => v.status === 1).length;
                
                // Conteo Género
                let m = Object.values(data.asistencias).filter(v => v.gen === 'M').length;
                let f = Object.values(data.asistencias).filter(v => v.gen === 'F').length;
                let am = Object.values(data.asistencias).filter(v => v.gen === 'M' && v.status === 1).length;
                let af = Object.values(data.asistencias).filter(v => v.gen === 'F' && v.status === 1).length;

                let porcentaje = ((presentes / matricula) * 100).toFixed(1) + "%";
                
                tabla.push([data.fecha, `${data.grado}°${data.seccion}`, matricula, presentes, porcentaje, `M:${am}/F:${af}`]);
                
                totalMatricula += matricula;
                totalAsistentes += presentes;
                tM += m; tF += f; aM += am; aF += af;
            }
        });

        docP.autoTable({
            startY: 25,
            head: [['Fecha', 'G/S', 'Matrícula', 'Asist.', '%', 'M/F']],
            body: tabla,
        });

        const finalY = docP.lastAutoTable.finalY + 10;
        const promedioGeral = ((totalAsistentes / totalMatricula) * 100).toFixed(1);

        docP.setFontSize(12);
        docP.text("RESUMEN DISGREGADO:", 15, finalY);
        docP.setFontSize(10);
        docP.text(`- Matrícula Total Atendida: ${totalMatricula} alumnos`, 15, finalY + 7);
        docP.text(`- Promedio Real de Asistencia: ${promedioGeral}%`, 15, finalY + 14);
        docP.text(`- Desglose por Género (Asistentes): Varones: ${aM} | Hembras: ${aF}`, 15, finalY + 21);

        docP.save(`Estadistica_${sesion.area}_${mes}.pdf`);
    };

    // --- DIRECCIÓN ---
    async function cargarListaEsp() {
        const snap = await getDocs(collection(db, "credenciales_especialistas"));
        const div = document.getElementById('lista-esp');
        div.innerHTML = "";
        snap.forEach(d => div.innerHTML += `<div class="fila-alumno">${d.data().nombre} (${d.data().area}) <button class="btn btn-error btn-mini" onclick="borrarEsp('${d.id}')">X</button></div>`);
    }

    window.gestionarEsp = async () => {
        const u = document.getElementById('adm-user').value;
        await setDoc(doc(db, "credenciales_especialistas", u), {
            nombre: document.getElementById('adm-nom').value,
            area: document.getElementById('adm-area').value,
            pass: document.getElementById('adm-pass').value
        });
        alert("Especialista guardado"); cargarListaEsp();
    };

    // --- MGE ---
    async function prepararBuscadorMGE() {
        const snap = await getDocs(collection(db, "docentes_db"));
        const div = document.getElementById('mge-buscador-total');
        div.innerHTML = "";
        snap.forEach(d => d.data().alumnos.forEach(a => {
            if(!a.retirado) div.innerHTML += `<div><label><input type="checkbox" class="chk-mge" data-id="${a.id}" data-nom="${a.nombre}" data-gen="${a.genero||'M'}"> ${a.nombre} (${d.data().grado}°${d.data().seccion})</label></div>`;
        }));
    }

    window.crearGE = async () => {
        const n = document.getElementById('mge-nombre').value;
        const sel = [];
        document.querySelectorAll('.chk-mge:checked').forEach(c => sel.push({id: c.dataset.id, nombre: c.dataset.nom, genero: c.dataset.gen}));
        await setDoc(doc(db, "grupos_estables_db", n.replace(/ /g,'_')), { nombre: n, creador: sesion.id, alumnos: sel });
        alert("Grupo Creado"); actualizarSecciones();
    };

</script>
</body>
</html>
