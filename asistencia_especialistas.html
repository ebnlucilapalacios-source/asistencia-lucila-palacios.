<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA LUCILA - ACCESO TOTAL</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --azul: #002147; --oro: #f3c612; --morado: #6f42c1; }
        body { font-family: sans-serif; background: #f4f7f6; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 20px; width: 300px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); border-bottom: 5px solid var(--oro); }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ccc; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; background: var(--azul); color: white; }
        #app { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100; padding: 20px; box-sizing: border-box; text-align: center; }
        header { background: var(--azul); color: white; padding: 20px; margin: -20px -20px 20px -20px; border-bottom: 4px solid var(--oro); }
        .admin-box { border: 2px solid var(--morado); padding: 15px; border-radius: 10px; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="login-box" class="card">
        <img src="https://raw.githubusercontent.com/ebnlucilapalacios-source/asistencia-lucila-palacios./main/IMG_20260225_005025_993.png" width="80">
        <h2 style="color:var(--azul)">SISTEMA LUCILA</h2>
        <input type="text" id="u" placeholder="Usuario">
        <input type="password" id="p" placeholder="Contraseña">
        <button class="btn" onclick="validar()">INGRESAR</button>
    </div>

    <div id="app">
        <header>
            <img src="https://raw.githubusercontent.com/ebnlucilapalacios-source/asistencia-lucila-palacios./main/IMG_20260225_005025_993.png" width="60">
            <h2 id="saludo">BIENVENIDO</h2>
        </header>
        
        <div class="admin-box">
            <h3 style="color:var(--morado)">📊 PANEL DE DIRECCIÓN ACTIVO</h3>
            <p>Desde aquí puede supervisar toda la institución.</p>
            <button class="btn" style="background:var(--morado)" onclick="alert('Generando Reporte General...')">📥 DESCARGAR CONSOLIDADO PDF</button>
        </div>
        
        <button class="btn" style="margin-top: 20px; background:#666;" onclick="location.reload()">CERRAR SESIÓN</button>
    </div>

    <script>
        function validar() {
            // Pasamos todo a minúsculas para evitar errores de teclado
            const user = document.getElementById('u').value.trim().toLowerCase();
            const pass = document.getElementById('p').value.trim();

            console.log("Intentando entrar con:", user);

            // LLAVE MAESTRA LOCAL (No depende de Firebase para entrar)
            if (user === "admin_lucila" && pass === "lucila2026") {
                mostrarSistema("DIRECCIÓN LUCILA");
            } 
            else if (user === "especialista1" && pass === "12345") {
                mostrarSistema("DOCENTE ESPECIALISTA");
            }
            else {
                alert("❌ Acceso Incorrecto.\n\nVerifique que el usuario sea: admin_lucila\ny la clave sea: lucila2026");
            }
        }

        function mostrarSistema(nombre) {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            document.getElementById('saludo').innerText = "HOLA, " + nombre;
            alert("✅ ¡Bienvenido al Sistema!");
        }
    </script>
</body>
</html>
