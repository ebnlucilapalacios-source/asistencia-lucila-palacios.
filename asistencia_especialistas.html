<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia Especialistas - Lucila Palacios</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --azul: #002147; --oro: #f39c12; --verde: #27ae60; --rojo: #e74c3c; --fondo: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--fondo); margin: 0; padding-bottom: 50px; }
        header { background: var(--azul); color: white; padding: 15px; text-align: center; border-bottom: 4px solid var(--oro); }
        .container { max-width: 800px; margin: auto; padding: 15px; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* Buscador de Secciones */
        .seccion-selector { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; scrollbar-width: thin; }
        .btn-sec { background: #eee; border: 1px solid #ccc; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; white-space: nowrap; }
        .btn-sec.active { background: var(--azul); color: white; border-color: var(--oro); }

        /* Lista de Alumnos para seleccionar */
        .lista-alumnos { border: 1px solid #ddd; border-radius: 8px; max-height: 250px; overflow-y: auto; margin: 15px 0; }
        .alumno-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
        .alumno-item:hover { background: #f0f7ff; }
        .alumno-item.selected { background: #e8f5e9; border-left: 5px solid var(--verde); }

        /* Tabla de Asistencia Final */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background: var(--azul); color: white; padding: 10px; font-size: 12px; }
        td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 13px; }
        
        .btn-main { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; }
        .btn-confirm { background: var(--azul); color: white; }
        .btn-save { background: var(--verde); color: white; }
        
        .badge { background: var(--oro); color: var(--azul); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>

<header>
    <h2>E.B.N. LUCILA PALACIOS</h2>
    <p>Control de Asistencia para Especialistas</p>
</header>

<div class="container">

    <div id="paso1" class="card">
        <h3>1. Armar Grupo Estable</h3>
        <p>Selecciona una sección y marca a los niños que asistirán hoy a tu clase:</p>
        
        <div class="seccion-selector" id="menu-secciones">
            </div>

        <div id="contenedor-lista" class="lista-alumnos">
            <p style="padding: 20px; text-align: center; color: #666;">Seleccione una sección arriba para ver los alumnos</p>
        </div>

        <div style="background: #e3f2fd; padding: 15px; border-radius: 8px; text-align: center;">
            <strong>Alumnos en el grupo:</strong> <span id="count" class="badge">0</span>
            <button class="btn-main btn-confirm" onclick="irAAsistencia()">CONFIRMAR GRUPO SELECCIONADO</button>
        </div>
    </div>

    <div id="paso2" class="card hidden">
        <h3>2. Marcar Asistencia (P / I)</h3>
        <div id="tabla-asistencia"></div>
        <button class="btn-main btn-save" onclick="generarEstadistica()">GUARDAR Y VER REPORTE</button>
    </div>

    <div id="paso3" class="card hidden">
        <h3>📊 Estadística Disgregada</h3>
        <div id="resultado-final"></div>
        <button class="btn-main btn-confirm" onclick="descargarExcel()">DESCARGAR REPORTE EXCEL</button>
        <button class="btn-main" style="background:#666; color:white;" onclick="location.reload()">NUEVA CLASE</button>
    </div>

</div>

<script>
    // BASE DE DATOS EXTRAÍDA DE TU PDF (Ejemplo representativo)
    const baseDatosAlumnos = {
        "1A": [
            {id: "1A1", nombre: "AMANDA GABRIELA GARCÍA FIGUERA", sexo: "HEMBRA"},
            {id: "1A2", nombre: "ANAIAH SHANTAL PALACIO FIGUERA", sexo: "HEMBRA"},
            {id: "1A3", nombre: "ANGELA SUSEJ ROJAS ROSAS", sexo: "HEMBRA"},
            {id: "1A4", nombre: "ANNELYS ESTEFANIA SOLORZANO", sexo: "HEMBRA"},
            {id: "1A5", nombre: "DEYLISMAR NAHIATA PÉREZ", sexo: "HEMBRA"}
        ],
        "1B": [
            {id: "1B1", nombre: "JHORMAN ROSOAN ADELLAN", sexo: "VARÓN"},
            {id: "1B2", nombre: "ALFONSO DE JESUS AGUILERA", sexo: "VARÓN"},
            {id: "1B3", nombre: "JUAN ANDRÉS BASTIDAS", sexo: "VARÓN"},
            {id: "1B4", nombre: "DANIEL JOSUE CARABALLO", sexo: "VARÓN"}
        ],
        "1C": [
            {id: "1C1", nombre: "MICHELLY DE LOS ANGELES ROJAS", sexo: "HEMBRA"},
            {id: "1C2", nombre: "ISMARIS DE JESUS SALAS", sexo: "HEMBRA"},
            {id: "1C3", nombre: "JOEL DANIEL CARABALLO", sexo: "VARÓN"}
        ]
        // Se pueden agregar todas las secciones del PDF aquí...
    };

    let grupoEstable = [];
    let asistenciaLocal = {};

    // Crear menú de secciones A-E
    const menuSec = document.getElementById('menu-secciones');
    ["1A", "1B", "1C", "1D", "1E", "2A", "2B", "2C", "3A", "3B", "4A", "5A", "6A"].forEach(sec => {
        const btn = document.createElement('button');
        btn.className = 'btn-sec';
        btn.innerText = sec;
        btn.onclick = () => mostrarAlumnos(sec, btn);
        menuSec.appendChild(btn);
    });

    function mostrarAlumnos(sec, btn) {
        document.querySelectorAll('.btn-sec').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        const cont = document.getElementById('contenedor-lista');
        cont.innerHTML = "";
        
        const alumnos = baseDatosAlumnos[sec] || [];
        if (alumnos.length === 0) {
            cont.innerHTML = "<p style='padding:10px'>No hay alumnos cargados para esta sección.</p>";
            return;
        }

        alumnos.forEach(a => {
            const div = document.createElement('div');
            div.className = "alumno-item " + (grupoEstable.find(x => x.id === a.id) ? "selected" : "");
            div.innerHTML = `<span>${a.nombre}</span> <span class="badge">${a.sexo[0]}</span>`;
            div.onclick = () => seleccionarParaGrupo(a, div);
            cont.appendChild(div);
        });
    }

    function seleccionarParaGrupo(alumno, div) {
        const index = grupoEstable.findIndex(x => x.id === alumno.id);
        if (index > -1) {
            grupoEstable.splice(index, 1);
            div.classList.remove('selected');
        } else {
            grupoEstable.push(alumno);
            div.classList.add('selected');
        }
        document.getElementById('count').innerText = grupoEstable.length;
    }

    function irAAsistencia() {
        if (grupoEstable.length === 0) return alert("Selecciona al menos un alumno.");
        document.getElementById('paso1').classList.add('hidden');
        document.getElementById('paso2').classList.remove('hidden');

        const tabla = document.getElementById('tabla-asistencia');
        tabla.innerHTML = "";
        grupoEstable.forEach(a => {
            asistenciaLocal[a.id] = "P";
            tabla.innerHTML += `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px solid #eee; background:white; margin-bottom:5px; border-radius:8px;">
                    <span style="font-size:12px;">${a.nombre}</span>
                    <select onchange="asistenciaLocal['${a.id}']=this.value" style="padding:5px; border-radius:5px; border:1px solid #ccc; font-weight:bold;">
                        <option value="P">PRESENTE</option>
                        <option value="I">INASISTENTE</option>
                    </select>
                </div>
            `;
        });
    }

    function generarEstadistica() {
        let stats = { mv: 0, mh: 0, av: 0, ah: 0 };

        grupoEstable.forEach(a => {
            const esV = (a.sexo === "VARÓN" || a.sexo === "V");
            if (esV) stats.mv++; else stats.mh++;

            if (asistenciaLocal[a.id] === "P") {
                if (esV) stats.av++; else stats.ah++;
            }
        });

        const matT = stats.mv + stats.mh;
        const asisT = stats.av + stats.ah;
        const porc = ((asisT / matT) * 100).toFixed(1);

        document.getElementById('resultado-final').innerHTML = `
            <table id="tabla-export">
                <tr><th>GENERO</th><th>MATRÍCULA</th><th>ASISTENCIA</th><th>% REAL</th></tr>
                <tr><td>VARONES</td><td>${stats.mv}</td><td>${stats.av}</td><td>${((stats.av/stats.mv)*100 || 0).toFixed(1)}%</td></tr>
                <tr><td>HEMBRAS</td><td>${stats.mh}</td><td>${stats.ah}</td><td>${((stats.ah/stats.mh)*100 || 0).toFixed(1)}%</td></tr>
                <tr style="background:#eee; font-weight:bold;"><td>TOTAL</td><td>${matT}</td><td>${asisT}</td><td>${porc}%</td></tr>
            </table>
        `;
        document.getElementById('paso2').classList.add('hidden');
        document.getElementById('paso3').classList.remove('hidden');
    }

    function descargarExcel() {
        const table = document.getElementById("tabla-export");
        const wb = XLSX.utils.table_to_book(table);
        XLSX.writeFile(wb, "Estadistica_Lucila_Palacios.xlsx");
    }
</script>

</body>
</html>
