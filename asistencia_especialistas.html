<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA EBN LUCILA PALACIOS - INTEGRAL 2026</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
            authDomain: "control-de-asistencia-d585e.firebaseapp.com",
            projectId: "control-de-asistencia-d585e",
            storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
            appId: "1:368890880546:web:a97ab4372dea536217207b"
        };

        const app = initializeApp(firebaseConfig);
        const dbCloud = getFirestore(app);
        const CLAVE_INST = "LUCILA2026";
        const USUARIO_ADMIN = "admin_lucila";

        window.usuarioActual = null;
        window.db = { docente: "", seccion: "", grado: "", turno: "", tipo: "aula", alumnos: [], asistencias: {}, asistenciasEsp: {} };
        window.alumnosTemporalesEspecialista = [];

        // --- SALUDO MOTIVADOR ---
        window.obtenerSaludoMotivador = () => {
            const frases = [
                "Enseñar es dejar una huella en la vida de una persona. ¡Buen trabajo!",
                "La educación es el arma más poderosa para cambiar el mundo.",
                "Tu labor construye el futuro de Venezuela. ¡Sigue adelante!",
                "Un buen maestro toma la mano y toca el corazón.",
                "Tu dedicación hace la diferencia en la Lucila Palacios."
            ];
            const frase = frases[Math.floor(Math.random() * frases.length)];
            const nombre = window.db.docente ? window.db.docente.split(' ')[0] : "Docente";
            return `¡Hola, Prof. ${nombre}! 👋<br><small style="font-style:italic; color:#555;">"${frase}"</small>`;
        };

        // --- AUTENTICACIÓN ---
        window.login = async () => {
            const u = document.getElementById('loginUser').value.toLowerCase().trim();
            const p = document.getElementById('loginPass').value;
            const snap = await getDoc(doc(dbCloud, "docentes_db", u));
            
            if (snap.exists() && snap.data().pass === p) {
                window.usuarioActual = u;
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                
                onSnapshot(doc(dbCloud, "docentes_db", u), (s) => { 
                    window.db = s.data(); 
                    window.render(); 
                });

                if (u === USUARIO_ADMIN) document.getElementById('adminPanel').style.display = 'block';
                
                if (snap.data().tipo === "especialista") {
                    document.getElementById('especialistaPanel').style.display = 'block';
                    document.getElementById('formInscripcion').style.display = 'none';
                    window.actualizarSelectorSecciones();
                }
            } else { alert("Usuario o contraseña incorrectos"); }
        };

        window.registrarCuenta = async () => {
            if(document.getElementById('regClaveInst').value !== CLAVE_INST) return alert("Clave Institucional Incorrecta");
            const u = document.getElementById('regUser').value.toLowerCase().trim();
            await setDoc(doc(dbCloud, "docentes_db", u), { 
                docente: document.getElementById('regNombre').value.toUpperCase(), 
                pass: document.getElementById('regPass').value, 
                grado: document.getElementById('regGrado').value, 
                seccion: document.getElementById('regSeccion').value.toUpperCase(), 
                turno: document.getElementById('regTurno').value,
                tipo: document.getElementById('regTipoUser').value,
                alumnos: [], asistencias: {}, asistenciasEsp: {}
            });
            alert("Cuenta creada."); location.reload();
        };

        // --- GESTIÓN DE ESPECIALISTAS ---
        window.actualizarSelectorSecciones = async () => {
            const selector = document.getElementById('espSelectorSecciones');
            const snap = await getDocs(collection(dbCloud, "docentes_db"));
            let opciones = '<option value="">-- Seleccione Sección --</option>';
            let secciones = [];
            snap.forEach(dSnap => {
                const d = dSnap.data();
                if(d.tipo === "aula" && d.grado) secciones.push(d);
            });
            secciones.sort((a,b) => a.grado - b.grado).forEach(s => {
                opciones += `<option value="${s.grado}-${s.seccion}">${s.grado}° "${s.seccion}" - Prof. ${s.docente}</option>`;
            });
            selector.innerHTML = opciones;
        };

        window.cargarSeccionEspecialista = async () => {
            const val = document.getElementById('espSelectorSecciones').value;
            if(!val) return alert("Seleccione una sección");
            const [g, s] = val.split('-');
            const snap = await getDocs(collection(dbCloud, "docentes_db"));
            snap.forEach(dSnap => {
                const d = dSnap.data();
                if(d.grado == g && d.seccion == s && d.tipo === "aula") {
                    window.alumnosTemporalesEspecialista = d.alumnos;
                    window.renderEspecialista();
                }
            });
        };

        window.renderEspecialista = () => {
            const lista = document.getElementById('listaAsistenciaEsp');
            const f = document.getElementById('fechaSeleccionada').value;
            lista.innerHTML = "<h4>Pase de Asistencia:</h4>";
            window.alumnosTemporalesEspecialista.filter(a => !a.retirado).forEach(a => {
                const st = (window.db.asistenciasEsp[f] && window.db.asistenciasEsp[f][a.id]) || 0;
                let color = st === 1 ? 'var(--exito)' : '#ccc';
                lista.innerHTML += `<div class="alumno-fila">
                    <span>${a.nombre}</span>
                    <button onclick="marcarEsp(${a.id})" class="btn-check" style="background:${color}">${st===1?'P':'F'}</button>
                </div>`;
            });
        };

        window.marcarEsp = async (id) => {
            const f = document.getElementById('fechaSeleccionada').value;
            if(!window.db.asistenciasEsp[f]) window.db.asistenciasEsp[f] = {};
            window.db.asistenciasEsp[f][id] = window.db.asistenciasEsp[f][id] === 1 ? 0 : 1;
            await setDoc(doc(dbCloud, "docentes_db", window.usuarioActual), window.db);
            window.renderEspecialista();
        };

        // --- REPORTES Y DIRECCIÓN ---
        window.generarGraficaComparativa = (labels, datos, titulo) => {
            const ctx = document.getElementById('graficaEficiencia').getContext('2d');
            document.getElementById('containerGrafica').style.display = 'block';
            if (window.miGrafica) window.miGrafica.destroy();
            window.miGrafica = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{ label: '% Eficiencia', data: datos, backgroundColor: '#3498db' }]
                },
                options: { scales: { y: { beginAtZero: true, max: 100 } } }
            });
        };

        window.imprimirPlanillaFisica = () => {
            if (window.alumnosTemporalesEspecialista.length === 0) return alert("Cargue una sección primero");
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'pt', 'letter');
            doc.text("EBN LUCILA PALACIOS - CONTROL FÍSICO", 40, 50);
            const body = window.alumnosTemporalesEspecialista.filter(a=>!a.retirado).map((a, i) => [i+1, a.nombre, "", ""]);
            doc.autoTable({ startY: 70, head: [['N°', 'ALUMNO', 'ASISTENCIA', 'OBS']], body: body });
            doc.save("Planilla_Asistencia_Fisica.pdf");
        };

        // --- FUNCIONES BASE ---
        window.render = () => {
            if(!window.db.docente) return;
            document.getElementById('textoSaludo').innerHTML = window.obtenerSaludoMotivador();
            document.getElementById('docenteTxt').innerText = window.db.docente;
            document.getElementById('gradoSeccionTxt').innerText = `${window.db.grado}${window.db.seccion}`;
            
            const lista = document.getElementById('listaAsistencia');
            const fSel = document.getElementById('fechaSeleccionada').value;
            lista.innerHTML = "";
            
            (window.db.alumnos || []).filter(a => !a.retirado).sort((a,b)=>a.nombre.localeCompare(b.nombre)).forEach(a => {
                const st = (window.db.asistencias[fSel] && window.db.asistencias[fSel][a.id]) || 0;
                let c = "#ccc"; if(st===1) c="var(--exito)"; if(st===2) c="var(--morado)";
                lista.innerHTML += `<div class="alumno-fila">
                    <div class="bola-gen ${a.genero}"></div>
                    <div style="flex:1; font-size:12px;">${a.nombre}</div>
                    <button onclick="marcar(${a.id})" class="btn-check" style="background:${c}">${st===1?'P':(st===2?'J':'F')}</button>
                </div>`;
            });
        };

        window.marcar = async (id) => {
            const f = document.getElementById('fechaSeleccionada').value;
            if(!window.db.asistencias[f]) window.db.asistencias[f] = {};
            window.db.asistencias[f][id] = (window.db.asistencias[f][id] + 1) % 3;
            await setDoc(doc(dbCloud, "docentes_db", window.usuarioActual), window.db);
        };

        window.agregarAlumno = async () => {
            const n = document.getElementById('nom').value.toUpperCase();
            const na = document.getElementById('nac').value;
            if(!n || !na) return alert("Faltan datos");
            window.db.alumnos.push({ id: Date.now(), nombre: n, genero: document.getElementById('gen').value, nacimiento: na, retirado: false });
            await setDoc(doc(dbCloud, "docentes_db", window.usuarioActual), window.db);
            document.getElementById('nom').value = "";
        };

        window.onload = () => { document.getElementById('fechaSeleccionada').value = new Date().toISOString().split('T')[0]; };
    </script>

    <style>
        :root { --azul: #002147; --exito: #28a745; --morado: #6f42c1; --rojo: #dc3545; --naranja: #e67e22; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f9; margin: 0; padding-bottom: 30px; }
        header { background: var(--azul); color: white; padding: 15px; text-align: center; font-weight: bold; }
        .container { max-width: 450px; margin: auto; padding: 10px; }
        .card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .alumno-fila { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #eee; }
        .btn-check { width: 38px; height: 38px; border: none; color: white; border-radius: 8px; font-weight: bold; }
        .bola-gen { width: 8px; height: 8px; border-radius: 50%; }
        .bola-gen.F { background: #fd79a8; } .bola-gen.M { background: #0984e3; }
        input, select, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; }
        .btn-primary { background: var(--azul); color: white; border: none; font-weight: bold; }
        .no-print { display: block; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>

<div id="authSection" class="container" style="padding-top: 50px;">
    <div style="text-align:center; margin-bottom:20px;">
        <img src="https://raw.githubusercontent.com/ebnlucilapalacios-source/asistencia-lucila-palacios./main/IMG_20260225_005025_993.png" width="80">
        <h3>LUCILA PALACIOS 2026</h3>
    </div>
    
    <div id="loginForm" class="card">
        <input type="text" id="loginUser" placeholder="Usuario">
        <input type="password" id="loginPass" placeholder="Contraseña">
        <button onclick="login()" class="btn-primary">ENTRAR</button>
        <p onclick="document.getElementById('loginForm').style.display='none'; document.getElementById('registerForm').style.display='block';" style="text-align:center; font-size:12px; color:var(--morado); cursor:pointer;">Crear cuenta nueva</p>
    </div>

    <div id="registerForm" class="card" style="display:none;">
        <input type="text" id="regNombre" placeholder="Nombre del Docente">
        <div style="display:flex; gap:5px;">
            <input type="number" id="regGrado" placeholder="Grado">
            <input type="text" id="regSeccion" placeholder="Sección">
        </div>
        <select id="regTurno"><option value="Mañana">Mañana</option><option value="Tarde">Tarde</option></select>
        <select id="regTipoUser"><option value="aula">Docente de Aula</option><option value="especialista">Especialista</option></select>
        <input type="text" id="regUser" placeholder="Usuario">
        <input type="password" id="regPass" placeholder="Contraseña">
        <input type="password" id="regClaveInst" placeholder="Clave de Institución">
        <button onclick="registrarCuenta()" style="background:var(--exito); color:white; border:none;">REGISTRARSE</button>
    </div>
</div>

<div id="appContent" style="display:none;">
    <header>SISTEMA DE ASISTENCIA INTEGRAL</header>
    
    <div class="container">
        <div id="saludoContenedor" class="card" style="background:#eefaff; border-left: 5px solid var(--azul);">
            <div id="textoSaludo"></div>
        </div>

        <div id="adminPanel" class="card no-print" style="display:none; border:2px solid var(--morado);">
            <b style="color:var(--morado);">📊 DIRECCIÓN</b>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-top:10px;">
                <button onclick="consolidadoMensual()" style="font-size:11px;">CONSOLIDADO AULA</button>
                <button onclick="consolidadoEspecialistas()" style="font-size:11px;">ESPECIALISTAS</button>
            </div>
            <div id="containerGrafica" style="display:none;"><canvas id="graficaEficiencia"></canvas></div>
            <div id="adminOutput"></div>
        </div>

        <div id="especialistaPanel" class="card no-print" style="display:none; border:2px solid var(--naranja);">
            <b style="color:var(--naranja);">🎨 ESPECIALISTAS</b>
            <select id="espSelectorSecciones" style="margin-top:10px;"></select>
            <button onclick="cargarSeccionEspecialista()" class="btn-primary">CARGAR LISTADO</button>
            <button onclick="imprimirPlanillaFisica()" style="background:#7f8c8d; color:white; font-size:11px;">🖨️ PDF CONTROL FÍSICO</button>
            <div id="listaAsistenciaEsp"></div>
        </div>

        <div class="card no-print">
            <span id="docenteTxt" style="font-weight:bold;"></span> | <span id="gradoSeccionTxt"></span>
            <input type="date" id="fechaSeleccionada" onchange="window.render()">
        </div>

        <div id="formInscripcion" class="card no-print">
            <input type="text" id="nom" placeholder="Nombre del Estudiante">
            <div style="display:flex; gap:5px;">
                <select id="gen" style="width:40%;"><option value="F">F</option><option value="M">M</option></select>
                <input type="date" id="nac">
            </div>
            <button onclick="agregarAlumno()" style="background:var(--exito); color:white; border:none;">+ INSCRIBIR</button>
        </div>

        <div id="listaAsistencia" class="card"></div>
        
        <button onclick="location.reload()" style="background:var(--rojo); color:white; border:none; margin-top:10px;">CERRAR SESIÓN</button>
    </div>
</div>

</body>
</html>
