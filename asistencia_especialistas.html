<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Especialistas - EBN Lucila Palacios</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root { --azul: #002147; --oro: #f39c12; --exito: #27ae60; --error: #c0392b; --morado: #8e44ad; --fondo: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--fondo); margin: 0; color: #333; }
        
        /* Login */
        .login-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--azul); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-box { background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        
        /* Header */
        header { background: var(--azul); color: white; padding: 15px; text-align: center; border-bottom: 4px solid var(--oro); }
        .container { max-width: 900px; margin: auto; padding: 15px; }
        
        /* UI Elements */
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #ddd; cursor: pointer; font-weight: bold; white-space: nowrap; }
        .tab-btn.active { background: var(--azul); color: white; }
        
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; }
        .btn-accion { background: var(--morado); color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn-save { background: var(--exito); color: white; font-size: 16px; }

        /* Tablas Estadísticas */
        .table-wrapper { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; background: white; font-size: 12px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #f8f9fa; color: var(--azul); }
        .bg-total { background: #f1f1f1; font-weight: bold; }
        
        .disgregado { display: flex; justify-content: space-around; font-size: 11px; color: #666; margin-top: 4px; }
        .v { color: #2980b9; } .h { color: #e84393; }

        #app-content { display: none; }
    </style>
</head>
<body>

    <div id="login-screen" class="login-overlay">
        <div class="login-box">
            <img src="https://cdn-icons-png.flaticon.com/512/1048/1048953.png" width="80" alt="logo">
            <h2>Especialistas</h2>
            <p>E.B.N. Lucila Palacios</p>
            <input type="text" id="user" placeholder="Usuario">
            <input type="password" id="pass" placeholder="Contraseña">
            <button class="btn-accion" onclick="intentarLogin()">INGRESAR</button>
            <p id="login-err" style="color:red; font-size:12px; display:none;">Credenciales incorrectas</p>
        </div>
    </div>

    <div id="app-content">
        <header>
            <h2 id="display-area" style="margin:0;">CARGANDO...</h2>
            <div id="display-nombre" style="font-size: 14px; opacity: 0.9;"></div>
        </header>

        <div class="container">
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="showTab('asis', this)">📝 ASISTENCIA</button>
                <button class="tab-btn" onclick="showTab('stats', this)">📊 ESTADÍSTICA MENSUAL</button>
                <button class="tab-btn" onclick="location.reload()" style="color:var(--error)">SALIR</button>
            </div>

            <div id="tab-asis" class="tab-content">
                <div class="card">
                    <label>Fecha:</label>
                    <input type="date" id="fecha-hoy">
                    <div style="display:flex; gap:10px;">
                        <select id="sel-grado">
                            <option value="1">1° Grado</option><option value="2">2° Grado</option>
                            <option value="3">3° Grado</option><option value="4">4° Grado</option>
                            <option value="5">5° Grado</option><option value="6">6° Grado</option>
                        </select>
                        <select id="sel-seccion">
                            <option value="A">A</option><option value="B">B</option>
                            <option value="C">C</option><option value="D">D</option><option value="E">E</option>
                        </select>
                    </div>
                    <button class="btn-accion" onclick="cargarSeccion()">🔍 BUSCAR ESTUDIANTES</button>
                </div>

                <div id="lista-card" class="card" style="display:none;">
                    <h3 id="info-seccion" style="color:var(--azul); margin-top:0;"></h3>
                    <div id="contenedor-alumnos"></div>
                    <button class="btn-save" onclick="guardarAsistencia()">💾 GUARDAR ASISTENCIA</button>
                </div>
            </div>

            <div id="tab-stats" class="tab-content" style="display:none;">
                <div class="card">
                    <h4>Reporte Estadístico Consolidado</h4>
                    <label>Mes a Reportar:</label>
                    <input type="month" id="mes-reporte">
                    <button class="btn-accion" onclick="generarEstadisticaCompleta()">📈 GENERAR INFORME</button>
                </div>

                <div id="resultado-estadistica"></div>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
        authDomain: "control-de-asistencia-d585e.firebaseapp.com",
        projectId: "control-de-asistencia-d585e",
        storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
        appId: "1:368890880546:web:a97ab4372dea536217207b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // USUARIOS CONFIGURADOS (Puedes agregar más aquí)
    const USERS = {
        "deporte1": { pass: "lucila2024", nombre: "Angel Figuera", area: "Educación Física" },
        "ingles1": { pass: "lucila2024", nombre: "Yubiry Martinez", area: "Inglés" },
        "cultura1": { pass: "lucila2024", nombre: "Gaudy Rodriguez", area: "Cultura" }
    };

    let userLogueado = null;
    let alumnosActuales = [];
    let estadosAsis = {};

    window.intentarLogin = () => {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        if(USERS[u] && USERS[u].pass === p) {
            userLogueado = { id: u, ...USERS[u] };
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            document.getElementById('display-area').innerText = userLogueado.area.toUpperCase();
            document.getElementById('display-nombre').innerText = `Especialista: ${userLogueado.nombre}`;
        } else {
            document.getElementById('login-err').style.display = 'block';
        }
    };

    window.showTab = (tab, btn) => {
        document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + tab).style.display = 'block';
        btn.classList.add('active');
    };

    window.cargarSeccion = async () => {
        const grado = document.getElementById('sel-grado').value;
        const seccion = document.getElementById('sel-seccion').value;
        const cont = document.getElementById('contenedor-alumnos');
        cont.innerHTML = "Buscando datos...";
        document.getElementById('lista-card').style.display = 'block';

        const snap = await getDocs(collection(db, "docentes_db"));
        let encontrada = false;

        snap.forEach(d => {
            const data = d.data();
            const gDb = String(data.grado).replace(/\D/g,'');
            if(gDb === grado && String(data.seccion).toUpperCase() === seccion) {
                encontrada = true;
                alumnosActuales = data.alumnos.filter(a => !a.retirado).sort((a,b)=>a.nombre.localeCompare(b.nombre));
                document.getElementById('info-seccion').innerText = `${grado}° Grado - Sección "${seccion}"`;
                renderAlumnos();
            }
        });

        if(!encontrada) cont.innerHTML = "❌ No se encontró esta sección registrada por ninguna docente.";
    };

    function renderAlumnos() {
        const cont = document.getElementById('contenedor-alumnos');
        cont.innerHTML = "";
        alumnosActuales.forEach(a => {
            if(estadosAsis[a.id] === undefined) estadosAsis[a.id] = 1;
            const s = estadosAsis[a.id];
            const color = s === 1 ? '#27ae60' : (s === 0 ? '#c0392b' : '#8e44ad');
            const texto = s === 1 ? 'P' : (s === 0 ? 'I' : 'J');
            
            cont.innerHTML += `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #eee;">
                    <div style="font-size:13px;"><b>${a.nombre}</b><br><small>${a.genero}</small></div>
                    <button onclick="cicloAsis(${a.id})" style="width:45px; background:${color}; color:white; border:none; border-radius:8px; padding:10px;">${texto}</button>
                </div>`;
        });
    }

    window.cicloAsis = (id) => {
        const actual = estadosAsis[id];
        if(actual === 1) estadosAsis[id] = 0;
        else if(actual === 0) estadosAsis[id] = 2;
        else estadosAsis[id] = 1;
        renderAlumnos();
    };

    window.guardarAsistencia = async () => {
        const fecha = document.getElementById('fecha-hoy').value;
        const grado = document.getElementById('sel-grado').value;
        const seccion = document.getElementById('sel-seccion').value;
        if(!fecha) return alert("Seleccione fecha");

        // Cálculo de totales por género para la estadística
        let v_total = 0, h_total = 0, v_asist = 0, h_asist = 0;

        alumnosActuales.forEach(a => {
            const esVaron = a.genero.toLowerCase().startsWith('v');
            if(esVaron) v_total++; else h_total++;
            
            if(estadosAsis[a.id] === 1) {
                if(esVaron) v_asist++; else h_asist++;
            }
        });

        const idDoc = `${userLogueado.id}_${fecha}_${grado}${seccion}`;
        await setDoc(doc(db, "asistencia_especialistas", idDoc), {
            especialistaId: userLogueado.id,
            nombreEspecialista: userLogueado.nombre,
            area: userLogueado.area,
            fecha, grado, seccion,
            v_total, h_total, v_asist, h_asist,
            total_matricula: alumnosActuales.length,
            total_asist: (v_asist + h_asist)
        });

        alert("✅ Asistencia Guardada con éxito");
        document.getElementById('lista-card').style.display = 'none';
    };

    // --- MOTOR ESTADÍSTICO ---
    window.generarEstadisticaCompleta = async () => {
        const mes = document.getElementById('mes-reporte').value;
        if(!mes) return alert("Elija un mes");
        const cont = document.getElementById('resultado-reporte');
        cont.innerHTML = "Procesando promedios y desglose...";

        const q = query(collection(db, "asistencia_especialistas"), where("especialistaId", "==", userLogueado.id));
        const snap = await getDocs(q);
        
        let registros = [];
        snap.forEach(d => { if(d.data().fecha.startsWith(mes)) registros.push(d.data()); });

        if(registros.length === 0) { cont.innerHTML = "No hay datos para este mes."; return; }

        // Agrupación por Grado
        let statsPorGrado = {}; // { "1": { mat_v, mat_h, asis_v, asis_h, sesiones } }

        registros.forEach(r => {
            if(!statsPorGrado[r.grado]) statsPorGrado[r.grado] = { mv:0, mh:0, av:0, ah:0, s:0 };
            statsPorGrado[r.grado].mv += r.v_total;
            statsPorGrado[r.grado].mh += r.h_total;
            statsPorGrado[r.grado].av += r.v_asist;
            statsPorGrado[r.grado].ah += r.h_asist;
            statsPorGrado[r.grado].s++;
        });

        let tablaHtml = `
            <div class="card">
                <h3 style="text-align:center; margin-bottom:0;">CUADRO ESTADÍSTICO MENSUAL</h3>
                <p style="text-align:center; font-size:12px; margin-top:5px;">Periodo: ${mes} | Especialidad: ${userLogueado.area}</p>
                
                <div class="table-wrapper">
                    <h4>1. Desglose por Secciones Atendidas</h4>
                    <table>
                        <thead>
                            <tr>
                                <th>Fecha</th><th>Sección</th>
                                <th>Matrícula<br><small>(V / H / T)</small></th>
                                <th>Asistencia<br><small>(V / H / T)</small></th>
                                <th>% Efic.</th>
                            </tr>
                        </thead>
                        <tbody>`;

        let gMatV = 0, gMatH = 0, gAsisV = 0, gAsisH = 0;

        registros.sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(r => {
            const ef = ((r.total_asist / r.total_matricula) * 100).toFixed(1);
            tablaHtml += `
                <tr>
                    <td>${r.fecha.split('-')[2]}</td>
                    <td>${r.grado}° "${r.seccion}"</td>
                    <td>${r.v_total} / ${r.h_total} / <b>${r.total_matricula}</b></td>
                    <td>${r.v_asist} / ${r.h_asist} / <b>${r.total_asist}</b></td>
                    <td>${ef}%</td>
                </tr>`;
        });

        tablaHtml += `</tbody></table></div>

                <div class="table-wrapper">
                    <h4>2. Resumen General por Grados (Promedio Real)</h4>
                    <table>
                        <thead>
                            <tr>
                                <th>Grado</th><th>Atenciones</th>
                                <th>Matrícula Prom.</th>
                                <th>Asist. Prom. <br><small>Disgregada</small></th>
                                <th>Promedio Real</th>
                            </tr>
                        </thead>
                        <tbody>`;

        let totalGeneralAsis = 0, totalGeneralMat = 0, totalSesiones = 0;

        Object.keys(statsPorGrado).sort().forEach(g => {
            const d = statsPorGrado[g];
            const pReal = (d.av + d.ah) / d.s;
            const pRealV = (d.av / d.s).toFixed(1);
            const pRealH = (d.ah / d.s).toFixed(1);
            
            totalGeneralAsis += (d.av + d.ah);
            totalGeneralMat += (d.mv + d.mh);
            totalSesiones += d.s;

            tablaHtml += `
                <tr>
                    <td><b>${g}° GRADO</b></td>
                    <td>${d.s}</td>
                    <td>${((d.mv+d.mh)/d.s).toFixed(1)}</td>
                    <td>V: ${pRealV} | H: ${pRealH}</td>
                    <td style="background:#e8f4fd;"><b>${pReal.toFixed(1)}</b></td>
                </tr>`;
        });

        const efGral = ((totalGeneralAsis / totalGeneralMat) * 100).toFixed(1);
        const promRealTotal = (totalGeneralAsis / totalSesiones).toFixed(1);

        tablaHtml += `
                        <tr class="bg-total">
                            <td colspan="2">CONSOLIDADO FINAL</td>
                            <td>${(totalGeneralMat/totalSesiones).toFixed(1)}</td>
                            <td>Total Niños Atendidos: ${totalGeneralAsis}</td>
                            <td style="background:var(--oro); color:var(--azul);">PR: ${promRealTotal}</td>
                        </tr>
                    </tbody>
                </table>
                <p style="font-size:14px; margin-top:15px;"><b>Porcentaje de Eficiencia General: ${efGral}%</b></p>
                <div style="display:flex; gap:10px;" class="no-print">
                    <button onclick="window.print()" style="background:var(--azul); color:white;">🖨️ IMPRIMIR</button>
                    <button onclick="exportarExcelEspecialista('${mes}')" style="background:var(--exito); color:white;">📗 EXCEL</button>
                </div>
            </div>`;

        cont.innerHTML = tablaHtml;
        window.datosUltimoReporte = registros;
    };

    window.exportarExcelEspecialista = (mes) => {
        const ws = XLSX.utils.json_to_sheet(window.datosUltimoReporte);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Estadística");
        XLSX.writeFile(wb, `Estadistica_${userLogueado.area}_${mes}.xlsx`);
    };

    document.getElementById('fecha-hoy').value = new Date().toISOString().split('T')[0];
</script>

</body>
</html>
