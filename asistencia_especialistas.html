<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESPECIALISTAS - EBN LUCILA PALACIOS</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, getDocs, addDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // TU CONFIGURACIÓN DE FIREBASE (Usa la misma que en el de docentes)
        const firebaseConfig = {
            apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
            authDomain: "control-de-asistencia-d585e.firebaseapp.com",
            projectId: "control-de-asistencia-d585e",
            storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
            appId: "1:368890880546:web:a97ab4372dea536217207b"
        };

        const app = initializeApp(firebaseConfig);
        const dbCloud = getFirestore(app);

        window.especialistaActual = null;
        window.seccionSeleccionada = null;

        // --- LOGIN PARA ESPECIALISTAS ---
        window.loginEspecialista = async () => {
            const u = document.getElementById('userEsp').value.toLowerCase().trim();
            const p = document.getElementById('passEsp').value;
            
            // Usaremos una colección diferente o la misma, pero identificada
            const snap = await getDoc(doc(dbCloud, "especialistas_db", u));
            
            if (snap.exists() && snap.data().pass === p) {
                window.especialistaActual = snap.data();
                window.especialistaActual.id = u;
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                document.getElementById('nombreDocente').innerText = window.especialistaActual.nombre;
                cargarSeccionesExistentes();
            } else {
                Swal.fire("Error", "Usuario o clave incorrecta", "error");
            }
        };

        // --- CARGAR SECCIONES DE LA BASE DE DATOS DE DOCENTES ---
        async function cargarSeccionesExistentes() {
            const snap = await getDocs(collection(dbCloud, "docentes_db"));
            const selector = document.getElementById('selectorSeccion');
            selector.innerHTML = '<option value="">-- Seleccione Sección --</option>';
            
            snap.forEach(d => {
                if(d.id !== "admin_lucila") {
                    const data = d.data();
                    const option = document.createElement('option');
                    option.value = d.id; // El ID del docente (usuario)
                    option.textContent = `${data.grado}${data.seccion} - ${data.docente}`;
                    selector.appendChild(option);
                }
            });
        }

        // --- MOSTRAR LISTA DE LA SECCIÓN SELECCIONADA ---
        window.cargarListaSeccion = async () => {
            const docenteId = document.getElementById('selectorSeccion').value;
            if(!docenteId) return;

            const snap = await getDoc(doc(dbCloud, "docentes_db", docenteId));
            const data = snap.data();
            window.seccionSeleccionada = data;

            const lista = document.getElementById('listaAsistenciaEsp');
            lista.innerHTML = "";
            
            const activos = (data.alumnos || []).filter(a => !a.retirado).sort((a,b)=>a.nombre.localeCompare(b.nombre));

            activos.forEach(a => {
                lista.innerHTML += `
                    <div class="alumno-fila">
                        <div style="flex-grow:1"><b>${a.nombre}</b></div>
                        <input type="checkbox" class="check-asistencia" data-id="${a.id}" checked style="width:25px; height:25px;">
                    </div>`;
            });
            document.getElementById('btnGuardar').style.display = 'block';
        };

        // --- GUARDAR ESTADÍSTICA DEL ESPECIALISTA ---
        window.guardarAsistenciaEspecialista = async () => {
            const checkboxes = document.querySelectorAll('.check-asistencia');
            let varones = 0; let hembras = 0;

            checkboxes.forEach(cb => {
                if(cb.checked) {
                    const idAlum = parseInt(cb.dataset.id);
                    const alumno = window.seccionSeleccionada.alumnos.find(x => x.id === idAlum);
                    alumno.genero === 'M' ? varones++ : hembras++;
                }
            });

            const estadistica = {
                especialista: window.especialistaActual.nombre,
                materia: window.especialistaActual.materia,
                grado: window.seccionSeleccionada.grado,
                seccion: window.seccionSeleccionada.seccion,
                varones: varones,
                hembras: hembras,
                total: varones + hembras,
                fecha: new Date().toISOString().split('T')[0],
                timestamp: new Date()
            };

            await addDoc(collection(dbCloud, "estadisticas_especialistas"), estadistica);
            Swal.fire("¡Éxito!", "Asistencia de especialista guardada", "success");
            document.getElementById('listaAsistenciaEsp').innerHTML = "";
            document.getElementById('btnGuardar').style.display = 'none';
        };

    </script>

    <style>
        :root { --azul: #002147; --dorado: #f39c12; }
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; }
        .header { background: var(--azul); color: white; padding: 15px; text-align: center; border-bottom: 4px solid var(--dorado); }
        .container { max-width: 450px; margin: auto; padding: 15px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .alumno-fila { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        input, select, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        .btn-entrar { background: var(--azul); color: white; font-weight: bold; cursor: pointer; }
        .btn-guardar { background: #28a745; color: white; font-weight: bold; border: none; display: none; }
    </style>
</head>
<body>

<div id="authSection" class="container" style="margin-top: 50px;">
    <div class="card" style="text-align: center;">
        <img src="https://raw.githubusercontent.com/ebnlucilapalacios-source/asistencia-lucila-palacios./main/IMG_20260225_005025_993.png" width="80">
        <h3>ESPECIALISTAS</h3>
        <input type="text" id="userEsp" placeholder="Usuario Especialista">
        <input type="password" id="passEsp" placeholder="Contraseña">
        <button class="btn-entrar" onclick="loginEspecialista()">INGRESAR</button>
    </div>
</div>

<div id="appContent" style="display:none;">
    <div class="header">
        <b>EBN LUCILA PALACIOS</b><br>
        <small id="nombreDocente"></small>
    </div>
    
    <div class="container">
        <div class="card">
            <label><b>Seleccione el Grado y Sección:</b></label>
            <select id="selectorSeccion" onchange="cargarListaSeccion()"></select>
        </div>

        <div class="card">
            <div id="listaAsistenciaEsp"></div>
            <button id="btnGuardar" class="btn-guardar" onclick="guardarAsistenciaEspecialista()">GUARDAR ASISTENCIA</button>
        </div>
    </div>
</div>

</body>
</html>
