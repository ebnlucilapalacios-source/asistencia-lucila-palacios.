<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA LUCILA - PRUEBA FINAL</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #e5e7eb; }
        .box { background: white; padding: 20px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { display: block; width: 250px; padding: 10px; margin: 10px auto; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 5px; border: none; }
        .btn-azul { background: #002147; color: white; }
        .btn-verde { background: #10b981; color: white; margin-top: 20px; }
        #log { margin-top: 20px; color: red; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="box">
        <img src="https://raw.githubusercontent.com/ebnlucilapalacios-source/asistencia-lucila-palacios./main/IMG_20260225_005025_993.png" width="80">
        <h2>ACCESO DIRECTO</h2>
        
        <input type="text" id="u" placeholder="Usuario">
        <input type="password" id="p" placeholder="Contraseña">
        
        <button class="btn-azul" onclick="entrar()">ENTRAR AL SISTEMA</button>
        <br>
        <button class="btn-verde" onclick="crear()">1. ACTIVAR USUARIOS (Clic aquí primero)</button>
        
        <div id="log"></div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const config = {
        apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
        authDomain: "control-de-asistencia-d585e.firebaseapp.com",
        projectId: "control-de-asistencia-d585e",
        storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
        appId: "1:368890880546:web:a97ab4372dea536217207b"
    };

    const app = initializeApp(config);
    const db = getFirestore(app);

    // FUNCIÓN PARA CREAR LOS USUARIOS
    window.crear = async () => {
        alert("Intentando activar usuarios...");
        try {
            // Creamos especialista1
            await setDoc(doc(db, "credenciales_especialistas", "especialista1"), {
                nombre: "Docente Especialista",
                pass: "12345"
            });
            alert("✅ USUARIOS ACTIVADOS. Ya puedes intentar entrar con especialista1 y 12345");
        } catch (e) {
            document.getElementById('log').innerText = "ERROR AL ACTIVAR: " + e.message;
            alert("Error: No se pudo activar. Revisa tus REGLAS de Firebase.");
        }
    };

    // FUNCIÓN PARA ENTRAR
    window.entrar = async () => {
        const user = document.getElementById('u').value.trim();
        const pass = document.getElementById('p').value;

        if(!user) return alert("Escribe el usuario");
        alert("Buscando a: " + user);

        try {
            const docRef = doc(db, "credenciales_especialistas", user);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const data = docSnap.data();
                if (String(data.pass) === String(pass)) {
                    alert("¡BIENVENIDO! Has logrado ingresar.");
                    document.body.innerHTML = "<h1>SISTEMA ABIERTO. ¡Éxito!</h1>";
                } else {
                    alert("❌ Contraseña incorrecta. En la base de datos dice: " + data.pass);
                }
            } else {
                alert("❌ El usuario '" + user + "' no existe. ¿Ya le diste al botón verde de activar?");
            }
        } catch (e) {
            alert("❌ ERROR CRÍTICO: " + e.message);
        }
    };
</script>
</body>
</html>
