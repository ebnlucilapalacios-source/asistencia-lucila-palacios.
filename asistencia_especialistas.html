<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA LUCILA PALACIOS 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, onSnapshot, collection, getDocs, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
            authDomain: "control-de-asistencia-d585e.firebaseapp.com",
            projectId: "control-de-asistencia-d585e",
            storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
            appId: "1:368890880546:web:a97ab4372dea536217207b"
        };

        const app = initializeApp(firebaseConfig);
        const dbCloud = getFirestore(app);

        window.usuarioActual = null;
        window.db = {};
        window.alumnosGlobales = [];

        // --- 1. LOGIN ---
        window.login = async () => {
            const u = document.getElementById('loginUser').value.toLowerCase().trim();
            const p = document.getElementById('loginPass').value.trim();
            
            const snap = await getDoc(doc(dbCloud, "docentes_db", u));
            if (snap.exists() && snap.data().pass === p) {
                window.usuarioActual = u;
                window.db = snap.data();
                
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                document.getElementById('fechaSeleccionada').value = new Date().toISOString().split('T')[0];

                if (u === "admin_lucila") {
                    document.getElementById('adminPanel').style.display = 'block';
                } else if (window.db.tipo === "especialista") {
                    document.getElementById('panelEspecialistaInterface').style.display = 'block';
                    await cargarEstudiantesParaEspecialista();
                } else {
                    document.getElementById('seccionDocenteAula').style.display = 'block';
                    document.getElementById('docTxt').innerText = window.db.docente;
                    // Escuchar cambios para renderizar lista
                    onSnapshot(doc(dbCloud, "docentes_db", u), (s) => {
                        window.db = s.data();
                        renderAula();
                    });
                }
            } else {
                Swal.fire("Error", "Usuario o clave incorrectos", "error");
            }
        };

        // --- 2. LÓGICA DE AULA (LO QUE TE FUNCIONABA) ---
        window.renderAula = () => {
            const l = document.getElementById('listaAula');
            const f = document.getElementById('fechaSeleccionada').value;
            l.innerHTML = "";
            const alumnos = (window.db.alumnos || []).filter(a => !a.retirado);
            
            if(alumnos.length === 0) {
                l.innerHTML = "<p style='text-align:center; padding:20px; color:gray;'>No hay alumnos registrados.</p>";
                return;
            }

            alumnos.forEach(a => {
                const s = window.db.asistencias?.[f]?.[a.id] || 0;
                let c = "#ccc"; if(s===1) c="#28a745"; if(s===2) c="#6f42c1";
                l.innerHTML += `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px solid #eee;">
                    <span>${a.nombre}</span>
                    <button onclick="marcar(${a.id})" style="background:${c}; color:white; width:45px; height:40px; border:none; border-radius:8px; font-weight:bold;">
                        ${s===1?'P':s===2?'J':'F'}
                    </button>
                </div>`;
            });
        };

        window.marcar = async (id) => {
            const f = document.getElementById('fechaSeleccionada').value;
            let asis = window.db.asistencias || {};
            if(!asis[f]) asis[f] = {};
            asis[f][id] = (asis[f][id] + 1) % 3 || 1;
            await updateDoc(doc(dbCloud, "docentes_db", window.usuarioActual), { asistencias: asis });
        };

        // --- 3. LÓGICA ESPECIALISTA (NUEVA Y SEGURA) ---
        async function cargarEstudiantesParaEspecialista() {
            const querySnap = await getDocs(collection(dbCloud, "docentes_db"));
            window.alumnosGlobales = [];
            querySnap.forEach(d => {
                const data = d.data();
                if(data.tipo === "aula" && data.alumnos) {
                    data.alumnos.forEach(a => {
                        if(!a.retirado) window.alumnosGlobales.push({...a, proc: `${data.grado}${data.seccion}`});
                    });
                }
            });
            actualizarMenuGrupos();
        }

        window.buscarEstudiante = () => {
            const txt = document.getElementById('busqEst').value.toUpperCase();
            const res = document.getElementById('resBusq');
            res.innerHTML = "";
            if(txt.length < 3) return;
            window.alumnosGlobales.filter(a => a.nombre.includes(txt)).forEach(a => {
                res.innerHTML += `<div style="padding:8px; border-bottom:1px solid #eee; font-size:12px; display:flex; justify-content:space-between;">
                    <span>${a.nombre} (${a.proc})</span>
                    <button onclick="agregarAlGrupo('${a.nombre}','${a.genero}','${a.proc}')" style="background:#002147; color:white; border:none; padding:2px 10px; border-radius:4px;">+</button>
                </div>`;
            });
        };

        window.agregarAlGrupo = async (nombre, genero, proc) => {
            const grupo = document.getElementById('selGrupoDestino').value;
            if(!grupo) return Swal.fire("Aviso", "Elige un grupo", "warning");
            let grupos = window.db.gruposEstables || {};
            if(!grupos[grupo].find(x => x.nombre === nombre)) {
                grupos[grupo].push({ nombre, genero, procedencia: proc });
                await updateDoc(doc(dbCloud, "docentes_db", window.usuarioActual), { gruposEstables: grupos });
                Swal.fire("Éxito", "Estudiante agregado al grupo", "success");
            }
        };

        window.crearGrupo = async () => {
            const n = document.getElementById('nomG').value.toUpperCase().trim();
            if(!n) return;
            let grupos = window.db.gruposEstables || {};
            grupos[n] = [];
            await updateDoc(doc(dbCloud, "docentes_db", window.usuarioActual), { gruposEstables: grupos });
            document.getElementById('nomG').value = "";
            actualizarMenuGrupos();
        };

        function actualizarMenuGrupos() {
            const s = document.getElementById('selGrupoDestino');
            s.innerHTML = '<option value="">-- ELIJA UN GRUPO --</option>';
            if(window.db.gruposEstables) {
                Object.keys(window.db.gruposEstables).forEach(g => {
                    s.innerHTML += `<option value="${g}">${g}</option>`;
                });
            }
        }

        window.logout = () => location.reload();
    </script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f9; margin: 0; }
        .header { background: #002147; color: white; padding: 15px; text-align: center; }
        .container { max-width: 400px; margin: auto; padding: 10px; }
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        button { cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="authSection" style="padding-top: 50px; text-align: center;">
    <h2>LUCILA PALACIOS 2026</h2>
    <div class="container">
        <div class="card">
            <input type="text" id="loginUser" placeholder="Usuario">
            <input type="password" id="loginPass" placeholder="Clave">
            <button onclick="login()" style="background:#002147; color:white;">ENTRAR</button>
        </div>
    </div>
</div>

<div id="appContent" style="display:none;">
    <div class="header"><b>PANEL ESCOLAR</b></div>
    <div class="container">
        <div class="card" style="text-align:center;">
            <input type="date" id="fechaSeleccionada" onchange="if(window.db.tipo==='aula') renderAula()">
            <button onclick="logout()" style="background:none; border:none; color:red; font-size:11px;">CERRAR SESIÓN</button>
        </div>

        <div id="seccionDocenteAula" style="display:none;">
            <div class="card" style="background:#e3f2fd; text-align:center;"><b id="docTxt"></b></div>
            <div class="card" id="listaAula"></div>
        </div>

        <div id="panelEspecialistaInterface" style="display:none;">
            <div class="card">
                <b>GESTIÓN DE GRUPOS</b>
                <input type="text" id="nomG" placeholder="Nombre de Grupo">
                <button onclick="crearGrupo()" style="background:#e67e22; color:white;">+ CREAR GRUPO</button>
                <hr>
                <select id="selGrupoDestino"></select>
                <input type="text" id="busqEst" onkeyup="buscarEstudiante()" placeholder="Buscar alumno...">
                <div id="resBusq" style="max-height:150px; overflow-y:auto;"></div>
            </div>
        </div>

        <div id="adminPanel" style="display:none;">
            <div class="card"><h3>DIRECCIÓN</h3><p>Panel Administrativo Activo</p></div>
        </div>
    </div>
</div>

</body>
</html>
