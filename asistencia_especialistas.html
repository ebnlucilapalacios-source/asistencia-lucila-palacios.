<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA EBN LUCILA PALACIOS - OFICIAL 2026</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // --- CONFIGURACIÓN FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
            authDomain: "control-de-asistencia-d585e.firebaseapp.com",
            projectId: "control-de-asistencia-d585e",
            storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
            appId: "1:368890880546:web:a97ab4372dea536217207b"
        };

        const app = initializeApp(firebaseConfig);
        const dbCloud = getFirestore(app);
        const CLAVE_INST = "LUCILA2026";
        const USUARIO_ADMIN = "admin_lucila";

        // Variables de Estado
        window.usuarioActual = null;
        window.db = { docente: "", seccion: "", grado: "", turno: "", rol: "AULA", alumnos: [], feriados: [], diasLaborales: [1,2,3,4,5] };
        window.asistenciaMesActual = {}; 
        window.mesCargado = ""; 
        window.seccionesEscuela = []; 
        window.seccionActivaEspecialista = null; 
        window.alumnosSeccionActiva = [];

        const getMesRef = (f) => f.substring(0, 7);

        // --- PERSISTENCIA Y CARGA ---
        window.cargarAsistenciaDelMes = async (fecha) => {
            const mesRef = getMesRef(fecha);
            if (window.mesCargado === mesRef) return;
            const docId = `${window.usuarioActual}_${mesRef}`;
            const snap = await getDoc(doc(dbCloud, "asistencias_db", docId));
            window.asistenciaMesActual = snap.exists() ? snap.data().datos : {};
            window.mesCargado = mesRef;
        };

        window.save = async () => {
            const loading = Swal.fire({ title: 'Sincronizando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
                await setDoc(doc(dbCloud, "docentes_db", window.usuarioActual), window.db);
                if (window.mesCargado) {
                    await setDoc(doc(dbCloud, "asistencias_db", `${window.usuarioActual}_${window.mesCargado}`), { datos: window.asistenciaMesActual });
                }
                Swal.close();
            } catch (e) { Swal.fire('Error', 'Fallo de red', 'error'); }
        };

        // --- SISTEMA DE ACCESO ---
        window.login = async () => {
            const u = document.getElementById('loginUser').value.toLowerCase().trim();
            const p = document.getElementById('loginPass').value;
            const snap = await getDoc(doc(dbCloud, "docentes_db", u));
            
            if (snap.exists() && snap.data().pass === p) {
                window.usuarioActual = u;
                localStorage.setItem('lucila_usuario', u);
                localStorage.setItem('lucila_pass', p);
                
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';

                if (u === USUARIO_ADMIN) document.getElementById('adminPanel').style.display = 'block';

                onSnapshot(doc(dbCloud, "docentes_db", u), async (s) => { 
                    window.db = s.data(); 
                    if (window.db.rol === 'ESPECIALISTA') await window.cargarSeccionesEscuela();
                    await window.cargarAsistenciaDelMes(document.getElementById('fechaSeleccionada').value);
                    window.render(); 
                });
            } else { Swal.fire('Error', 'Credenciales incorrectas', 'error'); }
        };

        // --- LÓGICA DE ASISTENCIA ---
        window.render = async () => {
            const fSel = document.getElementById('fechaSeleccionada').value;
            await window.cargarAsistenciaDelMes(fSel);
            const fObj = new Date(fSel + "T00:00:00");
            const esFeriado = window.db.feriados?.includes(fSel);
            const esEspecialista = window.db.rol === 'ESPECIALISTA';
            
            document.getElementById('docenteTxt').innerText = window.db.docente;
            document.getElementById('infoRol').innerText = esEspecialista ? window.db.especialidad : `${window.db.grado}° "${window.db.seccion}"`;

            const lista = document.getElementById('listaAsistencia');
            lista.innerHTML = "";
            const alumnosMostrados = esEspecialista ? window.alumnosSeccionActiva : (window.db.alumnos || []).filter(a => !a.retirado);

            if (esFeriado || fObj.getDay() === 0 || fObj.getDay() === 6) {
                lista.innerHTML = `<div class="aviso">🚩 DÍA NO LABORABLE</div>`;
            } else {
                alumnosMostrados.sort((a,b) => a.nombre.localeCompare(b.nombre)).forEach(a => {
                    let st = esEspecialista ? (window.asistenciaMesActual[fSel]?.[window.seccionActivaEspecialista]?.[a.id] || 0) : (window.asistenciaMesActual[fSel]?.[a.id] || 0);
                    let color = st === 1 ? 'var(--exito)' : (st === 2 ? 'var(--morado)' : '#ccc');
                    let texto = st === 1 ? 'P' : (st === 2 ? 'J' : 'F');
                    lista.innerHTML += `<div class="fila"><span>${a.nombre}</span><button onclick="marcar(${a.id})" style="background:${color}">${texto}</button></div>`;
                });
            }
            window.actualizarResumen911(alumnosMostrados, fSel.substring(0,7));
        };

        window.marcar = async (id) => {
            const f = document.getElementById('fechaSeleccionada').value;
            if(!window.asistenciaMesActual[f]) window.asistenciaMesActual[f] = {};
            if (window.db.rol === 'ESPECIALISTA') {
                const s = window.seccionActivaEspecialista;
                if(!window.asistenciaMesActual[f][s]) window.asistenciaMesActual[f][s] = {};
                window.asistenciaMesActual[f][s][id] = ((window.asistenciaMesActual[f][s][id] || 0) + 1) % 3;
            } else {
                window.asistenciaMesActual[f][id] = ((window.asistenciaMesActual[f][id] || 0) + 1) % 3;
            }
            await window.save();
            window.render();
        };

        // --- REPORTES 911 (PDF Y EXCEL) ---
        window.actualizarResumen911 = (activos, mesSel) => {
            let sH=0, sV=0, ds=0;
            Object.keys(window.asistenciaMesActual).forEach(f => {
                if(f.startsWith(mesSel) && !window.db.feriados.includes(f)) {
                    ds++; activos.forEach(a => { if(window.asistenciaMesActual[f][a.id]===1) a.genero==='F'?sH++:sV++; });
                }
            });
            const pH = ds>0 ? sH/ds : 0, pV = ds>0 ? sV/ds : 0;
            const ef = activos.length>0 ? (((pH+pV)/activos.length)*100).toFixed(1) : 0;

            document.getElementById('stats911').innerHTML = `
                <div class="card-stats">
                    <h3>RESUMEN ESTADÍSTICO 911</h3>
                    <table class="tabla-reporte">
                        <tr><th>MATRÍCULA T</th><td>${activos.length}</td><th>PROM. REAL</th><td>${(pH+pV).toFixed(1)}</td></tr>
                        <tr><th>EFICIENCIA</th><td colspan="3"><b>${ef}%</b></td></tr>
                    </table>
                    <div style="display:flex; gap:5px; margin-top:10px;">
                        <button onclick="exportarPDF()" class="btn-pdf">📕 PDF 911</button>
                        <button onclick="exportarExcel()" class="btn-excel">📗 EXCEL</button>
                    </div>
                </div>`;
        };

        window.exportarPDF = () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(14); doc.text("EBN LUCILA PALACIOS - REPORTE 911", 105, 15, {align:"center"});
            doc.setFontSize(10); doc.text(`Docente: ${window.db.docente} | Mes: ${window.mesCargado}`, 14, 25);
            
            const headers = [["Nombres", "Cédula", "Gén", "Asistencias", "%"]];
            const data = window.db.alumnos.filter(a=>!a.retirado).map(a => {
                let p = 0; Object.values(window.asistenciaMesActual).forEach(d => { if(d[a.id]===1) p++; });
                return [a.nombre, a.cedula, a.genero, p, ((p/20)*100).toFixed(0)+"%"];
            });

            doc.autoTable({ head: headers, body: data, startY: 30, theme: 'grid' });
            doc.save(`911_${window.db.docente}_${window.mesCargado}.pdf`);
        };

        window.exportarExcel = () => {
            const ws = XLSX.utils.json_to_sheet(window.db.alumnos);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Alumnos");
            XLSX.writeFile(wb, `Nomina_${window.db.seccion}.xlsx`);
        };

        // --- ADMIN: CONSOLIDADO ---
        window.consolidadoMensual = async () => {
            const mes = document.getElementById('mesAdmin').value;
            const snap = await getDocs(collection(dbCloud, "docentes_db"));
            let html = `<table class="tabla-admin"><thead><tr><th>DOCENTE</th><th>G/S</th><th>MAT</th><th>P.REAL</th><th>% EFIC</th></tr></thead><tbody>`;
            
            for(const dDoc of snap.docs) {
                const d = dDoc.data();
                if(dDoc.id === USUARIO_ADMIN || d.rol === 'ESPECIALISTA') continue;
                const aSnap = await getDoc(doc(dbCloud, "asistencias_db", `${dDoc.id}_${mes}`));
                const asis = aSnap.exists() ? aSnap.data().datos : {};
                // ... lógica de cálculo similar a render ...
                html += `<tr><td>${d.docente}</td><td>${d.grado}${d.seccion}</td><td>${d.alumnos?.length || 0}</td><td>-</td><td>-</td></tr>`;
            }
            document.getElementById('adminOutput').innerHTML = html + "</tbody></table>";
        };

        window.registrarCuenta = async () => {
            const u = document.getElementById('regUser').value.toLowerCase().trim();
            const data = { 
                docente: document.getElementById('regNombre').value.toUpperCase(),
                pass: document.getElementById('regPass').value,
                rol: document.getElementById('regRol').value,
                grado: document.getElementById('regGrado').value,
                seccion: document.getElementById('regSeccion').value.toUpperCase(),
                alumnos: [], feriados: [], turno: "Mañana"
            };
            await setDoc(doc(dbCloud, "docentes_db", u), data);
            Swal.fire('Éxito', 'Cuenta Creada', 'success');
        };

        window.agregarAlumno = async () => {
            const n = document.getElementById('nom').value.toUpperCase();
            if(!n) return;
            window.db.alumnos.push({ id: Date.now(), nombre: n, cedula: document.getElementById('ced').value, genero: document.getElementById('gen').value, retirado: false });
            await window.save();
            window.render();
        };

        window.toggleFeriado = async () => {
            const f = document.getElementById('fechaSeleccionada').value;
            window.db.feriados.includes(f) ? window.db.feriados = window.db.feriados.filter(x=>x!==f) : window.db.feriados.push(f);
            await window.save(); window.render();
        };

        // Inicio automático
        const hu = localStorage.getItem('lucila_usuario');
        if(hu) { document.getElementById('loginUser').value = hu; document.getElementById('loginPass').value = localStorage.getItem('lucila_pass'); window.login(); }
    </script>

    <style>
        :root { --azul: #002147; --dorado: #f39c12; --exito: #2ecc71; --morado: #9b59b6; --rojo: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f7f6; color: #333; }
        header { background: var(--azul); color: white; padding: 15px; text-align: center; border-bottom: 4px solid var(--dorado); }
        .container { max-width: 500px; margin: auto; padding: 15px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; }
        button { border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .fila { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        .fila button { width: 50px; height: 40px; margin: 0; color: white; }
        .btn-pdf { background: var(--rojo); color: white; }
        .btn-excel { background: var(--exito); color: white; }
        .tabla-reporte { width: 100%; font-size: 12px; border-collapse: collapse; margin-top: 10px; }
        .tabla-reporte th, .tabla-reporte td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        .aviso { background: #fff3cd; color: #856404; padding: 20px; text-align: center; border-radius: 10px; font-weight: bold; }
        .admin-box { border: 2px solid var(--morado); }
    </style>
</head>
<body>

<div id="authSection" class="container" style="padding-top: 50px;">
    <div class="card" style="text-align: center;">
        <img src="https://raw.githubusercontent.com/ebnlucilapalacios-source/asistencia-lucila-palacios./main/IMG_20260225_005025_993.png" width="100">
        <h2>INICIAR SESIÓN</h2>
        <input type="text" id="loginUser" placeholder="Usuario">
        <input type="password" id="loginPass" placeholder="Contraseña">
        <button onclick="login()" style="background: var(--azul); color: white;">ENTRAR AL SISTEMA</button>
        <hr>
        <button onclick="document.getElementById('regBox').style.display='block'" style="background: none; color: var(--morado); font-size: 14px;">Crear Cuenta Nueva</button>
    </div>

    <div id="regBox" class="card" style="display: none;">
        <h3>REGISTRO DOCENTE</h3>
        <input type="text" id="regNombre" placeholder="Nombre y Apellido">
        <select id="regRol"><option value="AULA">Aula</option><option value="ESPECIALISTA">Especialista</option></select>
        <div style="display: flex; gap: 5px;"><input type="text" id="regGrado" placeholder="Grado"><input type="text" id="regSeccion" placeholder="Sección"></div>
        <input type="text" id="regUser" placeholder="Nombre de Usuario">
        <input type="password" id="regPass" placeholder="Contraseña">
        <button onclick="registrarCuenta()" style="background: var(--exito); color: white;">CONFIRMAR REGISTRO</button>
    </div>
</div>

<div id="appContent" style="display: none;">
    <header>
        <h1 style="margin:0; font-size: 18px;">EBN LUCILA PALACIOS</h1>
        <small id="docenteTxt"></small> | <small id="infoRol"></small>
    </header>

    <div class="container">
        <div id="adminPanel" class="card admin-box" style="display: none;">
            <h3 style="color: var(--morado); margin-top: 0;">📊 PANEL DE DIRECCIÓN</h3>
            <input type="month" id="mesAdmin" onchange="consolidadoMensual()">
            <div id="adminOutput"></div>
        </div>

        <div class="card">
            <input type="date" id="fechaSeleccionada" onchange="window.render()">
            <button onclick="toggleFeriado()" style="background: none; color: var(--rojo); border: 1px solid var(--rojo); font-size: 12px;">MARCAR/QUITAR FERIADO</button>
        </div>

        <div class="card">
            <h3>ASISTENCIA DIARIA</h3>
            <div id="listaAsistencia"></div>
        </div>

        <div id="stats911"></div>

        <div class="card">
            <h3>+ INSCRIBIR ALUMNO</h3>
            <input type="text" id="ced" placeholder="Cédula">
            <input type="text" id="nom" placeholder="Nombre Completo">
            <select id="gen"><option value="F">Femenino</option><option value="M">Masculino</option></select>
            <button onclick="agregarAlumno()" style="background: var(--azul); color: white;">GUARDAR ESTUDIANTE</button>
        </div>

        <button onclick="localStorage.clear(); location.reload();" style="background: var(--rojo); color: white; margin-top: 20px;">CERRAR SESIÓN</button>
    </div>
</div>

</body>
</html>
