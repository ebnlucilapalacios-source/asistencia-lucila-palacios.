<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA INTEGRAL EBN LUCILA PALACIOS 2026</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
            authDomain: "control-de-asistencia-d585e.firebaseapp.com",
            projectId: "control-de-asistencia-d585e",
            storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
            appId: "1:368890880546:web:a97ab4372dea536217207b"
        };

        const app = initializeApp(firebaseConfig);
        const dbCloud = getFirestore(app);
        const USUARIO_ADMIN = "admin_lucila";

        window.usuarioActual = null;
        window.db = {}; 
        window.alumnosTemporalesEspecialista = [];

        // --- LÓGICA DE ACCESO ---
        window.login = async () => {
            const u = document.getElementById('loginUser').value.toLowerCase().trim();
            const p = document.getElementById('loginPass').value;
            const snap = await getDoc(doc(dbCloud, "docentes_db", u));
            
            if (snap.exists() && snap.data().pass === p) {
                window.usuarioActual = u;
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';

                onSnapshot(doc(dbCloud, "docentes_db", u), (s) => { 
                    window.db = s.data(); 
                    window.renderTodo(); 
                });

                // Activar Paneles según Rol
                if (u === USUARIO_ADMIN) {
                    document.getElementById('adminPanel').style.display = 'block';
                } else if (snap.data().tipo === "especialista") {
                    document.getElementById('especialistaPanel').style.display = 'block';
                    document.getElementById('formInscripcion').style.display = 'none';
                    window.actualizarSelectorSecciones();
                } else {
                    document.getElementById('formInscripcion').style.display = 'block';
                }
            } else { alert("Error de acceso"); }
        };

        // --- FUNCIONES DE ESPECIALISTA (SIN ELIMINAR DOCENTES) ---
        window.actualizarSelectorSecciones = async () => {
            const selector = document.getElementById('espSelectorSecciones');
            const snap = await getDocs(collection(dbCloud, "docentes_db"));
            let opciones = '<option value="">-- Seleccionar Sección --</option>';
            snap.forEach(dSnap => {
                const d = dSnap.data();
                if(d.tipo === "aula") opciones += `<option value="${d.grado}-${d.seccion}">${d.grado}° "${d.seccion}" - Prof. ${d.docente}</option>`;
            });
            selector.innerHTML = opciones;
        };

        window.cargarSeccionEspecialista = async () => {
            const val = document.getElementById('espSelectorSecciones').value;
            if(!val) return;
            const [g, s] = val.split('-');
            const snap = await getDocs(collection(dbCloud, "docentes_db"));
            snap.forEach(dSnap => {
                const d = dSnap.data();
                if(d.grado == g && d.seccion == s && d.tipo === "aula") {
                    window.alumnosTemporalesEspecialista = d.alumnos || [];
                    window.renderTodo();
                }
            });
        };

        // --- RENDERIZADO UNIFICADO ---
        window.renderTodo = () => {
            if(!window.db.docente) return;
            document.getElementById('docenteTxt').innerText = window.db.docente;
            document.getElementById('infoRol').innerText = (window.db.tipo === "aula") ? `${window.db.grado}° "${window.db.seccion}"` : "ESPECIALISTA";
            
            const lista = document.getElementById('listaAsistencia');
            const fSel = document.getElementById('fechaSeleccionada').value;
            lista.innerHTML = "";

            // Determinar qué lista mostrar
            let listaAImprimir = (window.db.tipo === "especialista") ? window.alumnosTemporalesEspecialista : (window.db.alumnos || []);

            listaAImprimir.filter(a => !a.retirado).sort((a,b)=>a.nombre.localeCompare(b.nombre)).forEach(a => {
                const asisObj = (window.db.tipo === "especialista") ? (window.db.asistenciasEsp || {}) : (window.db.asistencias || {});
                const st = (asisObj[fSel] && asisObj[fSel][a.id]) || 0;
                
                let color = "#ccc";
                if(st === 1) color = "var(--exito)";
                if(st === 2) color = "var(--morado)";

                lista.innerHTML += `
                    <div class="alumno-fila">
                        <div class="bola-gen ${a.genero}"></div>
                        <div style="flex:1; font-size:13px;"><b>${a.nombre}</b></div>
                        <button onclick="marcarGeneral(${a.id})" class="btn-check" style="background:${color}">${st===1?'P':(st===2?'J':'F')}</button>
                    </div>`;
            });
        };

        window.marcarGeneral = async (id) => {
            const f = document.getElementById('fechaSeleccionada').value;
            const campoAsis = (window.db.tipo === "especialista") ? "asistenciasEsp" : "asistencias";
            
            if(!window.db[campoAsis]) window.db[campoAsis] = {};
            if(!window.db[campoAsis][f]) window.db[campoAsis][f] = {};
            
            // Especialista solo tiene P/F (1 o 0), Aula tiene P/F/J (0, 1, 2)
            if(window.db.tipo === "especialista") {
                window.db[campoAsis][f][id] = window.db[campoAsis][f][id] === 1 ? 0 : 1;
            } else {
                window.db[campoAsis][f][id] = (window.db[campoAsis][f][id] + 1) % 3;
            }
            
            await setDoc(doc(dbCloud, "docentes_db", window.usuarioActual), window.db);
        };

        // --- FUNCIONES DE DOCENTE (INSCRIPCIÓN) ---
        window.agregarAlumno = async () => {
            const n = document.getElementById('nom').value.toUpperCase();
            const na = document.getElementById('nac').value;
            if(!n || !na) return alert("Faltan datos");
            window.db.alumnos.push({ id: Date.now(), nombre: n, genero: document.getElementById('gen').value, nacimiento: na, retirado: false });
            await setDoc(doc(dbCloud, "docentes_db", window.usuarioActual), window.db);
            document.getElementById('nom').value = "";
        };

    </script>

    <style>
        :root { --azul: #002147; --exito: #28a745; --morado: #6f42c1; --rojo: #dc3545; --naranja: #e67e22; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; margin: 0; padding-bottom: 40px; }
        .container { max-width: 450px; margin: auto; padding: 10px; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        header { background: var(--azul); color: white; padding: 20px; text-align: center; font-weight: bold; border-bottom: 4px solid var(--naranja); }
        .alumno-fila { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid #eee; }
        .btn-check { width: 40px; height: 40px; border: none; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .bola-gen { width: 10px; height: 10px; border-radius: 50%; }
        .bola-gen.F { background: #fd79a8; } .bola-gen.M { background: #0984e3; }
        input, select, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        .btn-primario { background: var(--azul); color: white; font-weight: bold; border: none; }
    </style>
</head>
<body>

<div id="authSection" class="container" style="margin-top:50px;">
    <div class="card" style="text-align:center;">
        <img src="https://raw.githubusercontent.com/ebnlucilapalacios-source/asistencia-lucila-palacios./main/IMG_20260225_005025_993.png" width="70">
        <h2>SISTEMA INTEGRAL 2026</h2>
        <input type="text" id="loginUser" placeholder="Usuario">
        <input type="password" id="loginPass" placeholder="Contraseña">
        <button onclick="login()" class="btn-primario">ENTRAR</button>
    </div>
</div>

<div id="appContent" style="display:none;">
    <header>E.B.N. LUCILA PALACIOS</header>
    
    <div class="container">
        <div id="adminPanel" class="card" style="display:none; border:2px solid var(--morado);">
            <b style="color:var(--morado);">📊 PANEL DE DIRECCIÓN</b>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px; margin-top:10px;">
                <button onclick="alert('Consolidando docentes...')">CONSOLIDADO AULA</button>
                <button onclick="alert('Consolidando especialistas...')">CONSOLIDADO ESP.</button>
            </div>
            <canvas id="graficaEficiencia" style="margin-top:10px;"></canvas>
        </div>

        <div id="especialistaPanel" class="card" style="display:none; border:2px solid var(--naranja);">
            <b style="color:var(--naranja);">🎨 PANEL ESPECIALISTA</b>
            <select id="espSelectorSecciones" style="margin-top:10px;"></select>
            <button onclick="cargarSeccionEspecialista()" class="btn-primario">CARGAR ALUMNOS</button>
        </div>

        <div class="card">
            <b>Docente:</b> <span id="docenteTxt"></span> | <span id="infoRol" style="color:var(--azul); font-weight:bold;"></span>
            <input type="date" id="fechaSeleccionada" onchange="window.renderTodo()">
        </div>

        <div id="formInscripcion" class="card" style="display:none;">
            <b style="color:var(--exito);">+ Inscribir Estudiante</b>
            <input type="text" id="nom" placeholder="Nombres y Apellidos">
            <div style="display:flex; gap:5px;">
                <select id="gen" style="width:30%;"><option value="F">F</option><option value="M">M</option></select>
                <input type="date" id="nac">
            </div>
            <button onclick="agregarAlumno()" style="background:var(--exito); color:white; border:none;">GUARDAR EN MATRÍCULA</button>
        </div>

        <div id="listaAsistencia" class="card"></div>

        <button onclick="location.reload()" style="background:var(--rojo); color:white; border:none; margin-top:10px;">CERRAR SESIÓN</button>
    </div>
</div>

</body>
</html>
