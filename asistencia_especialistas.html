<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA INTEGRAL - EBN LUCILA PALACIOS 2026</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
            authDomain: "control-de-asistencia-d585e.firebaseapp.com",
            projectId: "control-de-asistencia-d585e",
            storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
            appId: "1:368890880546:web:a97ab4372dea536217207b"
        };

        const app = initializeApp(firebaseConfig);
        const dbCloud = getFirestore(app);
        const CLAVE_INST = "LUCILA2026";
        const USUARIO_ADMIN = "admin_lucila";

        window.usuarioActual = null;
        window.db = {};
        let miGraficoEsp = null;

        // --- AUTENTICACIÓN Y ROLES ---
        window.login = async () => {
            const u = document.getElementById('loginUser').value.toLowerCase().trim();
            const p = document.getElementById('loginPass').value;
            const snap = await getDoc(doc(dbCloud, "docentes_db", u));
            
            if (snap.exists() && snap.data().pass === p) {
                window.usuarioActual = u;
                window.db = snap.data();
                
                document.getElementById('fechaSeleccionada').value = new Date().toISOString().split('T')[0];
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';

                // Limpiar vistas antes de mostrar la correcta
                document.getElementById('adminPanel').style.display = 'none';
                document.getElementById('panelEspecialistaInterface').style.display = 'none';
                document.getElementById('seccionDocenteAula').style.display = 'none';

                if (u === USUARIO_ADMIN) {
                    document.getElementById('adminPanel').style.display = 'block';
                } else if (window.db.tipo === "especialista") {
                    document.getElementById('panelEspecialistaInterface').style.display = 'block';
                    cargarSeccionesParaEspecialista();
                } else {
                    document.getElementById('seccionDocenteAula').style.display = 'block';
                }

                onSnapshot(doc(dbCloud, "docentes_db", u), (s) => { 
                    window.db = s.data(); 
                    window.render(); 
                });
            } else {
                Swal.fire("Error", "Usuario o clave incorrectos", "error");
            }
        };

        // --- FUNCIONES ESPECIALISTAS ---
        window.cargarSeccionesParaEspecialista = async () => {
            const snap = await getDocs(collection(dbCloud, "docentes_db"));
            const sel = document.getElementById('selSecEsp');
            sel.innerHTML = '<option value="">-- SELECCIONE GRADO --</option>';
            snap.forEach(d => {
                const data = d.data();
                if(data.tipo === "aula") {
                    sel.innerHTML += `<option value="${d.id}">${data.grado}${data.seccion} - ${data.docente}</option>`;
                }
            });
        };

        window.verListaEsp = async () => {
            const id = document.getElementById('selSecEsp').value;
            if(!id) return;
            const snap = await getDoc(doc(doc(dbCloud, "docentes_db", id)));
            const alumnos = (snap.data().alumnos || []).filter(a => !a.retirado);
            const cont = document.getElementById('listaAlumnosEsp');
            cont.innerHTML = `<h4>Asistencia: ${snap.data().grado}${snap.data().seccion}</h4>`;
            alumnos.forEach(a => {
                cont.innerHTML += `
                <div class="alumno-fila">
                    <span>${a.nombre}</span>
                    <input type="checkbox" class="chkEsp" data-gen="${a.genero}" checked>
                </div>`;
            });
            document.getElementById('btnGuardarEsp').style.display = 'block';
        };

        window.guardarAsistenciaEsp = async () => {
            const chks = document.querySelectorAll('.chkEsp');
            let h = 0, v = 0;
            chks.forEach(c => { if(c.checked) c.dataset.gen === 'F' ? h++ : v++; });
            
            await addDoc(collection(dbCloud, "asistencia_especialistas"), {
                especialista: window.db.docente,
                materia: window.db.materia,
                seccionAtendida: document.getElementById('selSecEsp').options[document.getElementById('selSecEsp').selectedIndex].text,
                hembras: h, varones: v, total: h+v,
                fecha: document.getElementById('fechaSeleccionada').value
            });
            Swal.fire("Guardado", "Estadística enviada a dirección", "success");
            document.getElementById('listaAlumnosEsp').innerHTML = "";
            document.getElementById('btnGuardarEsp').style.display = 'none';
        };

        // --- FUNCIONES ADMINISTRADOR ---
        window.registrarEspecialistaDB = async () => {
            const n = document.getElementById('regNomEsp').value.toUpperCase();
            const m = document.getElementById('regMateriaEsp').value;
            const u = document.getElementById('regUserEsp').value.toLowerCase().trim();
            const p = document.getElementById('regPassEsp').value;
            if(!n || !u || !p) return;
            await setDoc(doc(dbCloud, "docentes_db", u), { docente: n, pass: p, materia: m, tipo: "especialista", grado: "ESP", seccion: "ESP" });
            Swal.fire("Éxito", "Especialista Creado", "success");
        };

        window.generarCierreMensualWA = async () => {
            const fSel = document.getElementById('fechaSeleccionada').value;
            const mesRef = new Date(fSel + "T00:00:00").getMonth();
            const snap = await getDocs(collection(dbCloud, "docentes_db"));
            let tMat = 0, tAsis = 0, tM = 0;

            snap.forEach(docSnap => {
                const d = docSnap.data();
                if(d.tipo === "aula") {
                    const activos = (d.alumnos || []).filter(a => !a.retirado);
                    tMat += activos.length;
                    Object.keys(d.asistencias || {}).forEach(f => {
                        if(new Date(f + "T00:00:00").getMonth() === mesRef) {
                            Object.values(d.asistencias[f]).forEach(v => { if(v === 1) tAsis++; });
                            if(!d.feriados?.includes(f)) tM += activos.length;
                        }
                    });
                }
            });
            const ef = tM > 0 ? ((tAsis / tM) * 100).toFixed(1) : 0;
            const msj = `📌 *REPORTE LUCILA PALACIOS*\n🏫 Matrícula: ${tMat}\n📈 Eficiencia: ${ef}%`;
            navigator.clipboard.writeText(msj);
            Swal.fire("Copiado", "Resumen listo para WhatsApp", "success");
        };

        // --- FUNCIONES AULA ---
        window.render = () => {
            if(window.db.tipo !== "aula") return;
            const fSel = document.getElementById('fechaSeleccionada').value;
            document.getElementById('docenteTxt').innerText = window.db.docente;
            const lista = document.getElementById('listaAsistencia');
            lista.innerHTML = "";
            const alumnos = (window.db.alumnos || []).filter(a => !a.retirado).sort((a,b)=>a.nombre.localeCompare(b.nombre));
            alumnos.forEach(a => {
                const st = (window.db.asistencias[fSel] && window.db.asistencias[fSel][a.id]) || 0;
                let c = "#ccc", t = "F"; if(st===1){c="var(--exito)"; t="P";} if(st===2){c="var(--morado)"; t="J";}
                lista.innerHTML += `<div class="alumno-fila"><span>${a.nombre}</span><button onclick="marcar(${a.id})" class="btn-check" style="background:${c}">${t}</button></div>`;
            });
        };

        window.marcar = (id) => {
            const f = document.getElementById('fechaSeleccionada').value;
            if(!window.db.asistencias[f]) window.db.asistencias[f]={};
            window.db.asistencias[f][id] = (window.db.asistencias[f][id]+1)%3 || 1;
            setDoc(doc(dbCloud, "docentes_db", window.usuarioActual), window.db);
        };

        window.agregarAlumno = async () => {
            const n = document.getElementById('nom').value.toUpperCase();
            if(!n) return;
            window.db.alumnos.push({ id: Date.now(), nombre: n, genero: document.getElementById('gen').value, nacimiento: document.getElementById('nac').value, retirado: false });
            await setDoc(doc(dbCloud, "docentes_db", window.usuarioActual), window.db);
            document.getElementById('nom').value="";
        };

        window.logout = () => location.reload();
        window.mostrarRegistro = (v) => { document.getElementById('loginForm').style.display = v?'none':'block'; document.getElementById('registerForm').style.display = v?'block':'none'; };
        
        window.registrarCuenta = async () => {
            if(document.getElementById('regClaveInst').value !== CLAVE_INST) return alert("Clave Incorrecta");
            const u = document.getElementById('regUser').value.toLowerCase().trim();
            await setDoc(doc(dbCloud, "docentes_db", u), { 
                docente: document.getElementById('regNombre').value.toUpperCase(), 
                pass: document.getElementById('regPass').value, 
                grado: document.getElementById('regGrado').value, 
                seccion: document.getElementById('regSeccion').value.toUpperCase(), 
                tipo: "aula", alumnos: [], asistencias: {}, feriados: [] 
            });
            Swal.fire("Listo", "Cuenta Creada", "success"); window.mostrarRegistro(false);
        };
    </script>

    <style>
        :root { --azul: #002147; --exito: #28a745; --morado: #6f42c1; --naranja: #e67e22; }
        body { font-family: sans-serif; background: #f4f7f9; margin: 0; }
        header { background: var(--azul); color: white; padding: 15px; text-align: center; border-bottom: 4px solid #f39c12; }
        .container { max-width: 450px; margin: auto; padding: 10px; }
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .alumno-fila { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
        .btn-check { width: 40px; height: 35px; border: none; color: white; border-radius: 5px; font-weight: bold; cursor: pointer; }
        input, select, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button { cursor: pointer; font-weight: bold; }
        .btn-naranja { background: var(--naranja); color: white; border: none; }
    </style>
</head>
<body>

<div id="authSection" style="padding: 40px 20px; text-align: center;">
    <img src="https://raw.githubusercontent.com/ebnlucilapalacios-source/asistencia-lucila-palacios./main/IMG_20260225_005025_993.png" width="80">
    <h2>LUCILA PALACIOS</h2>
    <div id="loginForm" class="card">
        <input type="text" id="loginUser" placeholder="Usuario">
        <input type="password" id="loginPass" placeholder="Contraseña">
        <button onclick="login()" style="background:var(--azul); color:white;">ENTRAR</button>
        <p onclick="mostrarRegistro(true)" style="color:var(--morado); cursor:pointer;">Registrar Nueva Aula</p>
    </div>
    <div id="registerForm" class="card" style="display:none;">
        <input type="text" id="regNombre" placeholder="Nombre Docente">
        <input type="text" id="regGrado" placeholder="Grado (Ej: 1ero)">
        <input type="text" id="regSeccion" placeholder="Sección (Ej: A)">
        <input type="text" id="regUser" placeholder="Nuevo Usuario">
        <input type="password" id="regPass" placeholder="Nueva Clave">
        <input type="password" id="regClaveInst" placeholder="Clave Institucional">
        <button onclick="registrarCuenta()" style="background:var(--exito); color:white;">REGISTRAR</button>
        <p onclick="mostrarRegistro(false)" style="cursor:pointer;">Volver</p>
    </div>
</div>

<div id="appContent" style="display:none;">
    <header><b>SISTEMA ESCOLAR 2026</b></header>
    
    <div class="container">
        <div class="card">
            <input type="date" id="fechaSeleccionada" onchange="window.render()">
            <button onclick="logout()" style="background:#666; color:white; padding:5px; font-size:10px;">CERRAR SESIÓN</button>
        </div>

        <div id="adminPanel" style="display:none;">
            <div class="card" style="border-top: 5px solid var(--morado);">
                <b>Panel de Dirección</b>
                <button onclick="generarCierreMensualWA()" style="background:var(--exito); color:white;">GENERAR CIERRE WHATSAPP</button>
                <hr>
                <b>Crear Especialista</b>
                <input type="text" id="regNomEsp" placeholder="Nombre Especialista">
                <select id="regMateriaEsp">
                    <option value="EDUCACIÓN FÍSICA">EDUCACIÓN FÍSICA</option>
                    <option value="INGLÉS">INGLÉS</option>
                    <option value="MÚSICA">MÚSICA</option>
                </select>
                <input type="text" id="regUserEsp" placeholder="Usuario">
                <input type="password" id="regPassEsp" placeholder="Clave">
                <button onclick="registrarEspecialistaDB()" class="btn-naranja">CREAR CUENTA</button>
            </div>
        </div>

        <div id="panelEspecialistaInterface" style="display:none;">
            <div class="card" style="border-top: 5px solid var(--naranja);">
                <h3>Asistencia Especialista</h3>
                <select id="selSecEsp" onchange="verListaEsp()"></select>
                <div id="listaAlumnosEsp"></div>
                <button id="btnGuardarEsp" style="display:none; background:var(--exito); color:white;" onclick="guardarAsistenciaEsp()">GUARDAR DÍA</button>
            </div>
        </div>

        <div id="seccionDocenteAula" style="display:none;">
            <div class="card">
                <b>Docente:</b> <span id="docenteTxt"></span>
            </div>
            <div class="card">
                <input type="text" id="nom" placeholder="Nombre Estudiante">
                <select id="gen"><option value="F">Femenino</option><option value="M">Masculino</option></select>
                <input type="date" id="nac">
                <button onclick="agregarAlumno()" style="background:var(--exito); color:white;">+ AGREGAR ALUMNO</button>
            </div>
            <div class="card" id="listaAsistencia"></div>
        </div>
    </div>
</div>

</body>
</html>
