<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema EBN Lucila Palacios - Gestión Total</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root { --azul: #002147; --oro: #f39c12; --exito: #27ae60; --error: #c0392b; --fondo: #f4f7f6; --admin: #2c3e50; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--fondo); margin: 0; }
        header { background: var(--azul); color: white; padding: 15px; text-align: center; border-bottom: 5px solid var(--oro); }
        .container { max-width: 1000px; margin: auto; padding: 15px; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        .tab-btn { padding: 12px; border: none; border-radius: 8px; background: #ddd; cursor: pointer; font-weight: bold; font-size: 11px; }
        .tab-btn.active { background: var(--azul); color: white; }

        input, select, textarea { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        .btn-primario { background: var(--azul); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        
        /* Buscador solo para Grupos Estables */
        #buscador-ge { display: none; background: #fff3cd; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--oro); }
        
        .chk-list { max-height: 200px; overflow-y: auto; background: #f9f9f9; padding: 10px; border-radius: 8px; }
        .fila-alumno { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        
        #app-content, .sec { display: none; }
    </style>
</head>
<body>

    <div id="login-screen" style="display:flex; height:100vh; align-items:center; justify-content:center; background:var(--azul);">
        <div class="card" style="width:320px; text-align:center;">
            <h2 style="color:var(--azul)">LUCILA PALACIOS</h2>
            <input type="text" id="user" placeholder="Usuario">
            <input type="password" id="pass" placeholder="Contraseña">
            <button class="btn-primario" onclick="iniciarSesion()">ENTRAR</button>
        </div>
    </div>

    <div id="app-content">
        <header>
            <h3 id="display-area" style="margin:0;">ÁREA</h3>
            <div id="display-nombre" style="font-size:11px; opacity:0.8;">Nombre</div>
        </header>
        
        <div class="container">
            <div class="nav-tabs" style="display:flex; gap:5px; margin-bottom:20px;">
                <button class="tab-btn active" id="btn-asis" onclick="verTab('asis')">📝 ASISTENCIA</button>
                <button class="tab-btn" id="btn-stats" onclick="verTab('stats')">📊 REPORTES</button>
                <button class="tab-btn" id="btn-admin" onclick="verTab('admin')" style="background:var(--admin); color:white; display:none;">🔑 DIRECCIÓN</button>
                <button class="tab-btn" onclick="location.reload()" style="background:var(--error); color:white">SALIR</button>
            </div>

            <div id="sec-asis" class="sec" style="display:block;">
                <div class="card">
                    <input type="date" id="f-asis">
                    <div style="display:flex; gap:5px;">
                        <select id="g-asis" onchange="alternarBuscador()">
                            <option value="">Seleccione Grado...</option>
                            <option value="1">1°</option><option value="2">2°</option>
                            <option value="3">3°</option><option value="4">4°</option>
                            <option value="5">5°</option><option value="6">6°</option>
                            <option value="GE">GRUPOS ESTABLES / AULA INT.</option>
                        </select>
                        <select id="s-asis" onfocus="cargarSeccionesOGrupos()">
                            <option value="A">A</option><option value="B">B</option><option value="C">C</option>
                        </select>
                    </div>
                    <button class="btn-primario" style="margin-top:10px;" onclick="buscarAlumnos()">🔍 CARGAR LISTA COMPLETA</button>
                </div>

                <div id="card-lista" class="card" style="display:none;">
                    <div id="buscador-ge">
                        <label style="font-size:11px; font-weight:bold;">🔎 BUSCAR ALUMNO EN EL GRUPO:</label>
                        <input type="text" id="input-busqueda" onkeyup="filtrarLista()" placeholder="Escriba nombre del alumno...">
                    </div>
                    <h4 id="info-meta" style="color:var(--oro); font-size:12px; margin-bottom:10px;"></h4>
                    <div id="lista-render"></div>
                    <textarea id="obs-clase" placeholder="Observaciones de la jornada..."></textarea>
                    <button class="btn-primario" style="background:var(--exito)" onclick="guardarAsistencia()">💾 GUARDAR ASISTENCIA</button>
                </div>
            </div>

            <div id="sec-admin" class="sec">
                <div class="card" style="border-left: 5px solid var(--azul);">
                    <h3>🔐 Registro de Especialistas</h3>
                    <input type="text" id="new-esp-nom" placeholder="Nombre Completo">
                    <input type="text" id="new-esp-area" placeholder="Área (Ejem: Deporte, Música)">
                    <div style="display:flex; gap:5px;">
                        <input type="text" id="new-esp-user" placeholder="Usuario">
                        <input type="password" id="new-esp-pass" placeholder="Contraseña">
                    </div>
                    <button class="btn-primario" onclick="crearUsuarioEspecialista()">💾 CREAR CUENTA</button>
                </div>

                <div class="card" style="border-left: 5px solid var(--oro);">
                    <h3>🏆 Constructor de Grupos Estables</h3>
                    <input type="text" id="ge-nombre" placeholder="Nombre del Grupo">
                    <input type="text" id="ge-meta" placeholder="Meta Pedagógica">
                    <select id="ge-dueño"></select>
                    <div class="chk-list" id="ge-alumnos-escuela"></div>
                    <button class="btn-primario" style="margin-top:10px;" onclick="guardarGrupoEstable()">✅ CREAR GRUPO</button>
                </div>
            </div>
            
            <div id="sec-stats" class="sec">
                <div class="card">
                    <input type="month" id="mes-filtro">
                    <button onclick="generarReporte()" class="btn-primario">GENERAR CONSOLIDADO</button>
                </div>
                <div id="tabla-reporte-contenedor"></div>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, query, where, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
        authDomain: "control-de-asistencia-d585e.firebaseapp.com",
        projectId: "control-de-asistencia-d585e",
        storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
        appId: "1:368890880546:web:a97ab4372dea536217207b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let sesion = null;
    let alumnosActivos = [];
    let asistenciaLocal = {};

    // --- LOGIN ---
    window.iniciarSesion = async () => {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        if(u === "director_lucila" && p === "admin2024") {
            loguear({id:u, nombre:"Director", area:"Dirección", rol:"admin"});
        } else {
            const d = await getDoc(doc(db, "credenciales_especialistas", u));
            if(d.exists() && d.data().pass === p) loguear({id:u, ...d.data(), rol:"esp"});
            else alert("Error: Usuario o Clave incorrecta");
        }
    };

    function loguear(data) {
        sesion = data;
        document.getElementById('login-screen').style.display='none';
        document.getElementById('app-content').style.display='block';
        document.getElementById('display-area').innerText = sesion.area;
        document.getElementById('display-nombre').innerText = sesion.nombre;
        if(sesion.rol === 'admin') {
            document.getElementById('btn-admin').style.display='block';
            cargarDatosAdmin();
        }
        document.getElementById('f-asis').value = new Date().toISOString().split('T')[0];
    }

    window.verTab = (t) => {
        document.querySelectorAll('.sec').forEach(s => s.style.display='none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sec-'+t).style.display='block';
        document.getElementById('btn-'+t).classList.add('active');
    };

    // --- LÓGICA DE ASISTENCIA ---
    window.alternarBuscador = () => {
        const g = document.getElementById('g-asis').value;
        document.getElementById('buscador-ge').style.display = (g === "GE") ? "block" : "none";
    };

    window.cargarSeccionesOGrupos = async () => {
        const g = document.getElementById('g-asis').value;
        const sel = document.getElementById('s-asis');
        if(g === "GE") {
            sel.innerHTML = "<option>Cargando grupos...</option>";
            const snap = await getDocs(collection(db, "grupos_estables_db"));
            sel.innerHTML = "";
            snap.forEach(d => {
                if(sesion.rol === 'admin' || d.data().dueñoId === sesion.id) {
                    sel.innerHTML += `<option value="${d.id}">${d.data().nombreGrupo}</option>`;
                }
            });
        } else {
            sel.innerHTML = '<option value="A">A</option><option value="B">B</option><option value="C">C</option>';
        }
    };

    window.buscarAlumnos = async () => {
        const g = document.getElementById('g-asis').value;
        const s = document.getElementById('s-asis').value;
        if(!g || !s) return alert("Seleccione Grado y Sección/Grupo");

        const cont = document.getElementById('lista-render');
        cont.innerHTML = "Cargando lista...";
        alumnosActivos = [];

        if(g === "GE") {
            const d = await getDoc(doc(db, "grupos_estables_db", s));
            alumnosActivos = d.data().alumnos;
            document.getElementById('info-meta').innerText = "🎯 META: " + d.data().meta;
        } else {
            const snap = await getDocs(collection(db, "docentes_db"));
            snap.forEach(d => {
                const f_grado = String(d.data().grado);
                const f_secc = String(d.data().seccion).toUpperCase();
                if(f_grado.includes(g) && f_secc === s.toUpperCase()) {
                    alumnosActivos = d.data().alumnos.filter(a => !a.retirado);
                }
            });
            document.getElementById('info-meta').innerText = `Lista Regular: ${g}° ${s}`;
        }
        renderLista();
    };

    function renderLista() {
        document.getElementById('card-lista').style.display = 'block';
        const cont = document.getElementById('lista-render');
        cont.innerHTML = "";
        alumnosActivos.forEach(a => {
            if(!asistenciaLocal[a.id]) asistenciaLocal[a.id] = 1;
            cont.innerHTML += `
                <div class="fila-alumno" data-nombre="${a.nombre.toLowerCase()}">
                    <span>${a.nombre}</span>
                    <button onclick="toggle(${a.id})" style="background:${asistenciaLocal[a.id]===1?'var(--exito)':'var(--error)'}; color:white; border:none; border-radius:8px; padding:10px; width:45px;">
                        ${asistenciaLocal[a.id]===1?'P':'I'}
                    </button>
                </div>`;
        });
    }

    window.toggle = (id) => {
        asistenciaLocal[id] = asistenciaLocal[id] === 1 ? 0 : 1;
        renderLista();
    };

    window.filtrarLista = () => {
        const txt = document.getElementById('input-busqueda').value.toLowerCase();
        document.querySelectorAll('.fila-alumno').forEach(f => {
            f.style.display = f.dataset.nombre.includes(txt) ? 'flex' : 'none';
        });
    };

    window.guardarAsistencia = async () => {
        const f = document.getElementById('f-asis').value;
        const g = document.getElementById('g-asis').value;
        const s = document.getElementById('s-asis').value;
        const obs = document.getElementById('obs-clase').value;

        await setDoc(doc(db, "asistencia_especialistas", `${sesion.id}_${f}_${s}`.replace(/\s+/g, '')), {
            esp: sesion.nombre, area: sesion.area, fecha: f, grado: g, seccion: s, obs: obs
        });
        alert("✅ Guardado Correctamente");
        location.reload();
    };

    // --- DIRECCIÓN: GESTIÓN ---
    window.crearUsuarioEspecialista = async () => {
        const u = document.getElementById('new-esp-user').value;
        const p = document.getElementById('new-esp-pass').value;
        const n = document.getElementById('new-esp-nom').value;
        const a = document.getElementById('new-esp-area').value;
        if(!u || !p) return alert("Faltan datos");
        await setDoc(doc(db, "credenciales_especialistas", u), { nombre: n, area: a, pass: p });
        alert("Usuario Creado");
    };

    async function cargarDatosAdmin() {
        const snapAlumnos = await getDocs(collection(db, "docentes_db"));
        const contAl = document.getElementById('ge-alumnos-escuela');
        contAl.innerHTML = "";
        snapAlumnos.forEach(d => {
            d.data().alumnos.forEach(a => {
                contAl.innerHTML += `<div><input type="checkbox" class="chk-ge" data-id="${a.id}" data-nom="${a.nombre}" data-gen="${a.genero}"> ${a.nombre} (${d.data().grado}°${d.data().seccion})</div>`;
            });
        });

        const snapEsp = await getDocs(collection(db, "credenciales_especialistas"));
        const selEsp = document.getElementById('ge-dueño');
        selEsp.innerHTML = "";
        snapEsp.forEach(d => {
            selEsp.innerHTML += `<option value="${d.id}">${d.data().nombre}</option>`;
        });
    }

    window.guardarGrupoEstable = async () => {
        const nom = document.getElementById('ge-nombre').value;
        const meta = document.getElementById('ge-meta').value;
        const dueño = document.getElementById('ge-dueño').value;
        const chks = document.querySelectorAll('.chk-ge:checked');
        let lista = [];
        chks.forEach(c => lista.push({id: c.dataset.id, nombre: c.dataset.nom, genero: c.dataset.gen}));
        
        await setDoc(doc(db, "grupos_estables_db", nom.replace(/\s+/g, '_')), {
            nombreGrupo: nom, meta: meta, dueñoId: dueño, alumnos: lista
        });
        alert("Grupo Creado");
        location.reload();
    };

</script>
</body>
</html>
