<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.C.A. - E.B.N. Lucila Palacios</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root { --azul: #002147; --oro: #f3c612; --exito: #27ae60; --error: #c0392b; --fondo: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--fondo); margin: 0; color: #333; }
        
        /* LOGIN */
        .login-screen { height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--azul) 0%, #00152e 100%); }
        .login-card { background: white; padding: 30px; border-radius: 20px; width: 340px; text-align: center; border-top: 6px solid var(--oro); }
        .logo-img { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--oro); margin-bottom: 15px; background: #fff; }

        /* HEADER */
        header { background: var(--azul); color: white; padding: 15px; text-align: center; border-bottom: 5px solid var(--oro); display: flex; flex-direction: column; align-items: center; }
        .logo-header { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--oro); background: white; margin-bottom: 5px; }

        .container { max-width: 900px; margin: auto; padding: 15px; }
        .nav-tabs { display: flex; gap: 5px; margin-bottom: 20px; background: #ddd; padding: 5px; border-radius: 10px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 11px; }
        .tab-btn.active { background: var(--oro); color: var(--azul); }

        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        
        .btn { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; color: white; margin-top: 5px; }
        .btn-azul { background: var(--azul); }
        .btn-exito { background: var(--exito); }
        .btn-pdf { background: #d35400; }

        .fila-alumno, .item-gestion { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .btn-asis { width: 45px; height: 45px; border-radius: 50%; border: none; color: white; font-weight: bold; cursor: pointer; }
        
        /* BUSCADOR ADMIN */
        .search-admin { background: #f9f9f9; border: 2px solid var(--oro) !important; margin-bottom: 10px; }

        #app-content, .sec { display: none; }
    </style>
</head>
<body>

    <div id="login-screen" class="login-screen">
        <div class="login-card">
            <img src="https://images.clothes.com/i/421692.png" alt="Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/120?text=Logo+Lucila'">
            <h2 style="color:var(--azul); margin:0; font-size: 18px;">LUCILA PALACIOS</h2>
            <p style="font-size:10px; color:#666; margin-bottom:20px;">CONTROL DE ASISTENCIA</p>
            <input type="text" id="user" placeholder="Usuario">
            <input type="password" id="pass" placeholder="Contraseña">
            <button class="btn btn-azul" onclick="iniciarSesion()">ENTRAR</button>
        </div>
    </div>

    <div id="app-content">
        <header>
            <img src="https://images.clothes.com/i/421692.png" class="logo-header" onerror="this.src='https://via.placeholder.com/50?text=LP'">
            <h3 id="display-area" style="margin:0; text-transform: uppercase; font-size: 14px;">ÁREA</h3>
            <div id="display-nombre" style="font-size:11px; opacity:0.9;">Docente</div>
        </header>

        <div class="container">
            <div class="nav-tabs">
                <button class="tab-btn active" id="btn-asis" onclick="verTab('asis')">ASISTENCIA</button>
                <button class="tab-btn" id="btn-stats" onclick="verTab('stats')">REPORTES</button>
                <button class="tab-btn" id="btn-admin" onclick="verTab('admin')" style="background:var(--azul); color:white; display:none;">DIRECCIÓN</button>
                <button class="tab-btn" onclick="location.reload()" style="background:var(--error); color:white;">SALIR</button>
            </div>

            <div id="sec-asis" class="sec" style="display:block;">
                <div class="card">
                    <input type="date" id="fecha-selector">
                    <div style="display:flex; gap:8px;">
                        <select id="grado-sel" onchange="actualizarSecciones()">
                            <option value="">-- Grado --</option>
                            <option value="1">1°</option><option value="2">2°</option><option value="3">3°</option>
                            <option value="4">4°</option><option value="5">5°</option><option value="6">6°</option>
                            <option value="GE">Grupo Estable</option>
                        </select>
                        <select id="secc-sel"></select>
                    </div>
                    <button class="btn btn-azul" onclick="cargarLista()">CARGAR LISTA</button>
                </div>

                <div id="panel-lista" class="card" style="display:none;">
                    <input type="text" id="input-busqueda" onkeyup="filtrarAlumnos('fila-alumno')" placeholder="🔍 Buscar estudiante..." style="display:none; background:#fff3cd;">
                    <div id="meta-info" style="font-weight:bold; margin-bottom:10px; font-size:13px;"></div>
                    <div id="render-alumnos"></div>
                    <textarea id="obs-jornada" placeholder="Observaciones de la clase..."></textarea>
                    <button class="btn btn-exito" onclick="guardarAsistencia()">GUARDAR REGISTRO</button>
                </div>
            </div>

            <div id="sec-admin" class="sec">
                <div class="card">
                    <h4>👤 GESTIÓN DE ESPECIALISTAS</h4>
                    <input type="text" id="adm-nom" placeholder="Nombre">
                    <input type="text" id="adm-area" placeholder="Área">
                    <div style="display:flex; gap:5px;"><input type="text" id="adm-user" placeholder="Usuario"><input type="text" id="adm-pass" placeholder="Clave"></div>
                    <button class="btn btn-azul" onclick="crearEspecialista()">CREAR</button>
                    <div id="lista-esp-admin"></div>
                </div>

                <div class="card">
                    <h4>🏆 CONSTRUCTOR DE GRUPOS ESTABLES</h4>
                    <input type="text" id="ge-nom" placeholder="Nombre del Grupo">
                    <input type="text" id="ge-obj" placeholder="Meta">
                    <select id="ge-dueño"></select>
                    
                    <p style="font-size:11px; font-weight:bold; margin-top:10px;">BUSCAR Y SELECCIONAR INTEGRANTES:</p>
                    <input type="text" id="input-busqueda-admin" onkeyup="filtrarAlumnos('check-item')" class="search-admin" placeholder="🔍 Escribe nombre para filtrar...">
                    
                    <div id="ge-alumnos-check" style="max-height:250px; overflow-y:auto; border:1px solid #ddd; padding:10px; background:#fafafa;"></div>
                    <button class="btn btn-azul" onclick="guardarGrupoEstable()">CREAR GRUPO</button>
                    <div id="lista-ge-admin" style="margin-top:15px;"></div>
                </div>
            </div>

            <div id="sec-stats" class="sec">
                <div class="card">
                    <h4>ESTADÍSTICAS MENSUALES</h4>
                    <input type="month" id="mes-filtro">
                    <button class="btn btn-pdf" onclick="descargarReporte()">📥 DESCARGAR REPORTE PDF</button>
                </div>
                <div id="render-stats"></div>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, getDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
        authDomain: "control-de-asistencia-d585e.firebaseapp.com",
        projectId: "control-de-asistencia-d585e",
        storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
        appId: "1:368890880546:web:a97ab4372dea536217207b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let user = null;
    let listaActual = [];
    let asisEstado = {};

    window.iniciarSesion = async () => {
        const u = document.getElementById('user').value.trim();
        const p = document.getElementById('pass').value.trim();
        if(u === "director" && p === "lucila2026") login({id:"admin", nombre:"Dirección", area:"Dirección", rol:"admin"});
        else {
            const d = await getDoc(doc(db, "credenciales_especialistas", u));
            if(d.exists() && d.data().pass === p) login({id:u, ...d.data(), rol:"esp"});
            else alert("Error de acceso");
        }
    };

    function login(d) {
        user = d;
        document.getElementById('login-screen').style.display='none';
        document.getElementById('app-content').style.display='block';
        document.getElementById('display-area').innerText = user.area;
        document.getElementById('display-nombre').innerText = user.nombre;
        document.getElementById('fecha-selector').value = new Date().toISOString().split('T')[0];
        if(user.rol === 'admin') { document.getElementById('btn-admin').style.display='block'; cargarAdmin(); }
        actualizarSecciones();
    }

    window.verTab = (t) => {
        document.querySelectorAll('.sec').forEach(s => s.style.display='none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sec-'+t).style.display='block';
        document.getElementById('btn-'+t).classList.add('active');
    };

    window.actualizarSecciones = async () => {
        const g = document.getElementById('grado-sel').value;
        const selS = document.getElementById('secc-sel');
        selS.innerHTML = "";
        if(g === "GE") {
            const snap = await getDocs(collection(db, "grupos_estables_db"));
            snap.forEach(d => { if(user.rol === 'admin' || d.data().espId === user.id) selS.innerHTML += `<option value="${d.id}">${d.data().nom}</option>`; });
        } else if(g !== "") {
            ['A','B','C','D','E'].forEach(s => selS.innerHTML += `<option value="${s}">Sección ${s}</option>`);
        }
    };

    window.cargarLista = async () => {
        const g = document.getElementById('grado-sel').value;
        const s = document.getElementById('secc-sel').value;
        if(!g || !s) return;
        document.getElementById('panel-lista').style.display='block';
        document.getElementById('input-busqueda').style.display = (g === "GE" ? 'block' : 'none');
        listaActual = []; asisEstado = {};

        if(g === "GE") {
            const d = await getDoc(doc(db, "grupos_estables_db", s));
            if(d.exists()) { listaActual = d.data().alumnos; document.getElementById('meta-info').innerText = "PROYECTO: " + d.data().meta; }
        } else {
            const snap = await getDocs(collection(db, "docentes_db"));
            snap.forEach(docAl => {
                if(String(docAl.data().grado) === g && docAl.data().seccion.toUpperCase() === s.toUpperCase()) {
                    listaActual = [...listaActual, ...docAl.data().alumnos.filter(a => !a.retirado)];
                }
            });
            document.getElementById('meta-info').innerText = `${g}° Grado - ${s}`;
        }
        renderLista();
    };

    function renderLista() {
        const c = document.getElementById('render-alumnos');
        c.innerHTML = "";
        listaActual.sort((a,b)=>a.nombre.localeCompare(b.nombre)).forEach(a => {
            if(!asisEstado[a.id]) asisEstado[a.id] = 1;
            c.innerHTML += `<div class="fila-alumno" data-n="${a.nombre.toLowerCase()}">
                <span>${a.nombre}</span>
                <button class="btn-asis" onclick="toggle(${a.id})" style="background:${asisEstado[a.id]===1?'var(--exito)':'var(--error)'}">${asisEstado[a.id]===1?'P':'I'}</button>
            </div>`;
        });
    }

    window.toggle = (id) => { asisEstado[id] = asisEstado[id] === 1 ? 0 : 1; renderLista(); };

    window.filtrarAlumnos = (clase) => {
        const bus = (clase === 'fila-alumno' ? 'input-busqueda' : 'input-busqueda-admin');
        const v = document.getElementById(bus).value.toLowerCase();
        document.querySelectorAll('.' + clase).forEach(f => f.style.display = f.dataset.n.includes(v) ? 'flex' : 'none');
    };

    window.guardarAsistencia = async () => {
        const f = document.getElementById('fecha-selector').value;
        const s = document.getElementById('secc-sel').value;
        await setDoc(doc(db, "asistencia_especialistas", `${user.id}_${f}_${s}`), {
            esp: user.nombre, area: user.area, fecha: f, data: asisEstado, obs: document.getElementById('obs-jornada').value
        });
        alert("Guardado"); location.reload();
    };

    // --- DIRECCIÓN ---
    async function cargarAdmin() {
        const snapEsp = await getDocs(collection(db, "credenciales_especialistas"));
        const snapDoc = await getDocs(collection(db, "docentes_db"));
        const selE = document.getElementById('ge-dueño');
        const checkA = document.getElementById('ge-alumnos-check');
        selE.innerHTML = ""; checkA.innerHTML = "";
        
        snapEsp.forEach(d => selE.innerHTML += `<option value="${d.id}">${d.data().nombre}</option>`);
        snapDoc.forEach(d => d.data().alumnos.forEach(a => {
            if(!a.retirado) checkA.innerHTML += `<div class="check-item" data-n="${a.nombre.toLowerCase()}" style="display:flex; gap:10px;"><input type="checkbox" class="c-ge" data-id="${a.id}" data-nom="${a.nombre}"> ${a.nombre} (${d.data().grado}°${d.data().seccion})</div>`;
        }));
    }

    window.crearEspecialista = async () => {
        const u = document.getElementById('adm-user').value;
        await setDoc(doc(db, "credenciales_especialistas", u), { nombre: document.getElementById('adm-nom').value, area: document.getElementById('adm-area').value, pass: document.getElementById('adm-pass').value });
        alert("Creado"); cargarAdmin();
    };

    window.guardarGrupoEstable = async () => {
        const n = document.getElementById('ge-nom').value;
        const l = []; document.querySelectorAll('.c-ge:checked').forEach(c => l.push({id: c.dataset.id, nombre: c.dataset.nom}));
        await setDoc(doc(db, "grupos_estables_db", n.replace(/ /g,'_')), { nom: n, meta: document.getElementById('ge-obj').value, espId: document.getElementById('ge-dueño').value, alumnos: l });
        alert("Grupo Creado"); cargarAdmin();
    };

    // --- REPORTE PDF ---
    window.descargarReporte = async () => {
        const mes = document.getElementById('mes-filtro').value;
        if(!mes) return alert("Seleccione un mes");
        
        const { jsPDF } = window.jspdf;
        const docPDF = new jsPDF();
        
        docPDF.setFontSize(16);
        docPDF.text("E.B.N. LUCILA PALACIOS - REPORTE MENSUAL", 20, 20);
        docPDF.setFontSize(12);
        docPDF.text(`Resumen de Asistencia - Mes: ${mes}`, 20, 30);

        const snapAsis = await getDocs(collection(db, "asistencia_especialistas"));
        let rows = [];
        
        snapAsis.forEach(d => {
            if(d.data().fecha.startsWith(mes)) {
                const presentes = Object.values(d.data().data).filter(v => v === 1).length;
                const total = Object.values(d.data().data).length;
                rows.push([d.data().fecha, d.data().esp, d.data().area, total, presentes]);
            }
        });

        docPDF.autoTable({
            startY: 40,
            head: [['Fecha', 'Especialista', 'Área', 'Matrícula', 'Asistieron']],
            body: rows,
        });

        docPDF.save(`Reporte_Asistencia_${mes}.pdf`);
    };

</script>
</body>
</html>
