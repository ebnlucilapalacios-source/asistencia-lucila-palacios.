<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA LUCILA PALACIOS 2026</title>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs, deleteDoc, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
            authDomain: "control-de-asistencia-d585e.firebaseapp.com",
            projectId: "control-de-asistencia-d585e",
            storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
            appId: "1:368890880546:web:a97ab4372dea536217207b"
        };

        const app = initializeApp(firebaseConfig);
        const dbCloud = getFirestore(app);
        const USUARIO_ADMIN = "admin_lucila";

        window.usuarioActual = null;
        window.db = {};
        window.alumnosGlobales = [];

        // --- LOGIN REFORZADO ---
        window.login = async () => {
            const u = document.getElementById('loginUser').value.toLowerCase().trim();
            const p = document.getElementById('loginPass').value.trim();
            
            if(!u || !p) return Swal.fire("Atención", "Escriba usuario y clave", "warning");

            Swal.showLoading();
            try {
                const snap = await getDoc(doc(dbCloud, "docentes_db", u));
                
                if (snap.exists() && snap.data().pass === p) {
                    window.usuarioActual = u;
                    window.db = snap.data();
                    
                    document.getElementById('authSection').style.display = 'none';
                    document.getElementById('appContent').style.display = 'block';
                    document.getElementById('fechaSeleccionada').value = new Date().toISOString().split('T')[0];

                    if (u === USUARIO_ADMIN) {
                        document.getElementById('adminPanel').style.display = 'block';
                        listarCuentasAdmin();
                    } else if (window.db.tipo === "especialista") {
                        document.getElementById('panelEspecialistaInterface').style.display = 'block';
                        await sincronizarEspecialista();
                    } else {
                        document.getElementById('seccionDocenteAula').style.display = 'block';
                        document.getElementById('docTxt').innerText = window.db.docente;
                        window.renderAula();
                    }
                    Swal.close();
                } else {
                    Swal.fire("Error", "Usuario no encontrado o clave incorrecta", "error");
                }
            } catch (e) {
                Swal.fire("Error de Red", "Verifique su conexión", "error");
            }
        };

        // --- DIRECCIÓN: CREAR CUENTAS ---
        window.crearCuenta = async (tipo) => {
            let u, p, n;
            try {
                if(tipo === 'aula') {
                    u = document.getElementById('regUserAula').value.toLowerCase().trim();
                    p = document.getElementById('regPassAula').value.trim();
                    n = document.getElementById('regNomAula').value.toUpperCase().trim();
                    const g = document.getElementById('regGradoAula').value;
                    const s = document.getElementById('regSecAula').value.toUpperCase();
                    if(!u || !p || !n) return Swal.fire("Faltan datos", "", "warning");
                    
                    await setDoc(doc(dbCloud, "docentes_db", u), { 
                        docente: n, pass: p, grado: g, seccion: s, tipo: "aula", alumnos: [], asistencias: {} 
                    });
                } else {
                    u = document.getElementById('regUserEsp').value.toLowerCase().trim();
                    p = document.getElementById('regPassEsp').value.trim();
                    n = document.getElementById('regNomEsp').value.toUpperCase().trim();
                    const mat = document.getElementById('regMatEsp').value;
                    if(!u || !p || !n) return Swal.fire("Faltan datos", "", "warning");
                    
                    await setDoc(doc(dbCloud, "docentes_db", u), { 
                        docente: n, pass: p, materia: mat, tipo: "especialista", gruposEstables: {} 
                    });
                }
                Swal.fire("Éxito", `Cuenta ${u} creada correctamente`, "success");
                listarCuentasAdmin();
            } catch (e) {
                Swal.fire("Error", "No se pudo guardar la cuenta", "error");
            }
        };

        window.listarCuentasAdmin = async () => {
            const snap = await getDocs(collection(dbCloud, "docentes_db"));
            const lista = document.getElementById('listaCuentasAdmin');
            lista.innerHTML = "";
            snap.forEach(d => {
                const data = d.data();
                if(d.id !== USUARIO_ADMIN) {
                    lista.innerHTML += `
                    <div style="display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid #eee; font-size:12px;">
                        <span><b>${d.id}</b> (${data.tipo})</span>
                        <button onclick="eliminarCuenta('${d.id}')" style="background:red; color:white; width:25px; padding:0; border-radius:4px;">X</button>
                    </div>`;
                }
            });
        };

        window.eliminarCuenta = async (id) => {
            if(confirm(`¿Eliminar cuenta ${id}?`)) {
                await deleteDoc(doc(dbCloud, "docentes_db", id));
                listarCuentasAdmin();
            }
        };

        // --- ESPECIALISTA: SINCRONIZAR ---
        async function sincronizarEspecialista() {
            const querySnap = await getDocs(collection(dbCloud, "docentes_db"));
            const selSec = document.getElementById('selSecEsp');
            selSec.innerHTML = '<option value="">-- SELECCIONE SECCIÓN --</option>';
            window.alumnosGlobales = [];
            
            querySnap.forEach(docSnap => {
                const data = docSnap.data();
                if(data.tipo === "aula") {
                    selSec.innerHTML += `<option value="${docSnap.id}">${data.grado}${data.seccion} - ${data.docente}</option>`;
                    if(data.alumnos) {
                        data.alumnos.forEach(a => {
                            if(!a.retirado) window.alumnosGlobales.push({...a, proc: `${data.grado}${data.seccion}`});
                        });
                    }
                }
            });
            actualizarMenusGrupos();
        }

        window.buscarEstudiante = () => {
            const txt = document.getElementById('busqEst').value.toUpperCase();
            const res = document.getElementById('resBusq');
            res.innerHTML = "";
            if(txt.length < 3) return;
            window.alumnosGlobales.filter(a => a.nombre.includes(txt)).forEach(a => {
                res.innerHTML += `
                <div class="alumno-fila" style="font-size:11px;">
                    <span>${a.nombre} (${a.proc})</span>
                    <button onclick="agregarAlGrupo('${a.nombre}','${a.genero}','${a.proc}')" style="width:30px; background:var(--azul); color:white;">+</button>
                </div>`;
            });
        };

        window.agregarAlGrupo = async (n, g, p) => {
            const grupoDest = document.getElementById('selGrupoDestino').value;
            if(!grupoDest) return Swal.fire("Aviso", "Seleccione un grupo arriba", "warning");
            let grupos = window.db.gruposEstables || {};
            if(!grupos[grupoDest]) grupos[grupoDest] = [];
            if(grupos[grupoDest].find(x => x.nombre === n)) return Swal.fire("Ya está en el grupo", "", "info");
            
            grupos[grupoDest].push({ nombre: n, genero: g, procedencia: p });
            await updateDoc(doc(dbCloud, "docentes_db", window.usuarioActual), { gruposEstables: grupos });
            Swal.fire("Agregado", n, "success");
        };

        window.crearGrupo = async () => {
            const nombre = document.getElementById('nomGrupoNuevo').value.toUpperCase().trim();
            if(!nombre) return;
            let grupos = window.db.gruposEstables || {};
            grupos[nombre] = [];
            await updateDoc(doc(dbCloud, "docentes_db", window.usuarioActual), { gruposEstables: grupos });
            document.getElementById('nomGrupoNuevo').value = "";
            actualizarMenusGrupos();
            Swal.fire("Grupo Creado", nombre, "success");
        };

        function actualizarMenusGrupos() {
            const s1 = document.getElementById('selGrupoDestino');
            const s2 = document.getElementById('selGrupoAsistencia');
            s1.innerHTML = '<option value="">-- ELIJA GRUPO --</option>';
            s2.innerHTML = '<option value="">-- ELIJA GRUPO --</option>';
            if(window.db.gruposEstables) {
                Object.keys(window.db.gruposEstables).forEach(g => {
                    const o = `<option value="${g}">${g}</option>`;
                    s1.innerHTML += o; s2.innerHTML += o;
                });
            }
        }

        window.logout = () => location.reload();
    </script>

    <style>
        :root { --azul: #002147; --exito: #28a745; --morado: #6f42c1; --naranja: #e67e22; }
        body { font-family: sans-serif; background: #f4f7f9; margin: 0; }
        header { background: var(--azul); color: white; padding: 15px; text-align: center; border-bottom: 4px solid #f39c12; }
        .container { max-width: 450px; margin: auto; padding: 10px; }
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .alumno-fila { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
        input, select, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        button { cursor: pointer; font-weight: bold; border: none; }
    </style>
</head>
<body>

<div id="authSection" style="padding: 50px 20px; text-align: center;">
    <img src="https://raw.githubusercontent.com/ebnlucilapalacios-source/asistencia-lucila-palacios./main/IMG_20260225_005025_993.png" width="80">
    <h2 style="color:var(--azul)">LUCILA PALACIOS 2026</h2>
    <div class="card" style="max-width:320px; margin:auto;">
        <input type="text" id="loginUser" placeholder="Usuario">
        <input type="password" id="loginPass" placeholder="Clave">
        <button onclick="login()" style="background:var(--azul); color:white;">ENTRAR</button>
    </div>
</div>

<div id="appContent" style="display:none;">
    <header><b>GESTIÓN INTEGRAL 2026</b></header>
    <div class="container">
        
        <div class="card" style="text-align:center;">
            <b>FECHA:</b> <input type="date" id="fechaSeleccionada">
            <button onclick="logout()" style="background:#eee; font-size:10px;">CERRAR SESIÓN</button>
        </div>

        <div id="adminPanel" style="display:none;">
            <div class="card" style="border-top: 6px solid var(--morado);">
                <b style="color:var(--morado)">⚙️ DIRECCIÓN</b>
                <div id="listaCuentasAdmin" style="max-height:120px; overflow-y:auto; background:#f9f9f9; border:1px solid #ddd; margin:10px 0;"></div>
                <hr>
                <b>REGISTRAR ESPECIALISTA</b>
                <input type="text" id="regNomEsp" placeholder="Nombre Completo">
                <select id="regMatEsp">
                    <option value="EDUC. FISICA">EDUC. FISICA</option>
                    <option value="INGLES">INGLES</option>
                    <option value="MUSICA">MUSICA</option>
                </select>
                <input type="text" id="regUserEsp" placeholder="Usuario (Ej: juan_ef)">
                <input type="text" id="regPassEsp" placeholder="Clave">
                <button onclick="crearCuenta('esp')" style="background:var(--naranja); color:white;">GUARDAR ESPECIALISTA</button>
            </div>
        </div>

        <div id="panelEspecialistaInterface" style="display:none;">
            <div class="card" style="border-top: 6px solid var(--naranja);">
                <b>🛠 GRUPOS ESTABLES</b>
                <input type="text" id="nomGrupoNuevo" placeholder="Ej: ATLETISMO">
                <button onclick="crearGrupo()" style="background:var(--azul); color:white;">CREAR GRUPO</button>
                <hr>
                <b>🔍 AÑADIR ALUMNOS</b>
                <select id="selGrupoDestino"></select>
                <input type="text" id="busqEst" onkeyup="buscarEstudiante()" placeholder="Buscar alumno...">
                <div id="resBusq" style="max-height:150px; overflow-y:auto;"></div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
