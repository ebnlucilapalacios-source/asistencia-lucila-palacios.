<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Integral Especialistas - Lucila Palacios</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root { --azul: #002147; --oro: #f39c12; --exito: #27ae60; --error: #c0392b; --admin: #2c3e50; --fondo: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--fondo); margin: 0; color: #333; }
        
        /* Login */
        .login-screen { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--azul); display:flex; align-items:center; justify-content:center; z-index:1000; }
        .login-card { background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* UI */
        header { background: var(--azul); color: white; padding: 15px; text-align: center; border-bottom: 5px solid var(--oro); }
        .container { max-width: 1000px; margin: auto; padding: 15px; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #ddd; }
        
        /* Tabs */
        .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #ddd; cursor: pointer; font-weight: bold; white-space: nowrap; }
        .tab-btn.active { background: var(--azul); color: white; }
        .btn-admin { background: var(--admin); color: white; }

        /* Tablas */
        .table-wrapper { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; background: white; font-size: 12px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #f8f9fa; color: var(--azul); }
        .fila-alerta { background: #fff5f5; border-left: 4px solid var(--error); }
        
        /* Inputs */
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        .btn-save { background: var(--exito); color: white; font-weight: bold; border: none; cursor: pointer; font-size: 16px; }
        
        .genero-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; color: white; margin-left: 5px; }
        .bg-v { background: #3498db; } .bg-h { background: #e91e63; }

        #app-content, .sec { display: none; }
    </style>
</head>
<body>

    <div id="login-screen" class="login-screen">
        <div class="login-card">
            <h2 style="color:var(--azul)">SISTEMA EBN</h2>
            <p>Acceso Especialistas / Dirección</p>
            <input type="text" id="user" placeholder="Usuario">
            <input type="password" id="pass" placeholder="Contraseña">
            <button onclick="iniciarSesion()" style="background:var(--azul); color:white; border:none; padding:12px; border-radius:8px; cursor:pointer; width:100%;">ENTRAR</button>
            <p id="err" style="color:red; display:none; font-size:12px; margin-top:10px;">Credenciales incorrectas</p>
        </div>
    </div>

    <div id="app-content">
        <header>
            <h3 id="txt-area" style="margin:0;">CARGANDO...</h3>
            <div id="txt-nombre" style="font-size:13px; opacity:0.8;"></div>
        </header>

        <div class="container">
            <div class="nav-tabs">
                <button class="tab-btn active" id="t-asis" onclick="verTab('asis')">📝 ASISTENCIA</button>
                <button class="tab-btn" id="t-stats" onclick="verTab('stats')">📊 ESTADÍSTICA</button>
                <button class="tab-btn btn-admin" id="t-admin" onclick="verTab('admin')" style="display:none;">🔑 DIRECCIÓN</button>
                <button class="tab-btn" onclick="location.reload()" style="background:var(--error); color:white;">SALIR</button>
            </div>

            <div id="sec-asis" class="sec" style="display:block;">
                <div class="card">
                    <label>Fecha:</label>
                    <input type="date" id="fecha-asistencia">
                    <div style="display:flex; gap:10px;">
                        <select id="sel-grado">
                            <option value="1">1° Grado</option><option value="2">2° Grado</option>
                            <option value="3">3° Grado</option><option value="4">4° Grado</option>
                            <option value="5">5° Grado</option><option value="6">6° Grado</option>
                        </select>
                        <select id="sel-seccion">
                            <option value="A">A</option><option value="B">B</option><option value="C">C</option>
                            <option value="D">D</option><option value="E">E</option>
                        </select>
                    </div>
                    <button class="btn-save" style="background:var(--azul)" onclick="cargarAlumnos()">🔍 CARGAR LISTA</button>
                </div>

                <div id="div-lista" class="card" style="display:none;">
                    <h4 id="info-grupo" style="color:var(--azul); margin:0 0 15px 0;"></h4>
                    <div id="contenedor-alumnos"></div>
                    <button class="btn-save" onclick="enviarAsistencia()">💾 GUARDAR ASISTENCIA</button>
                </div>
            </div>

            <div id="sec-stats" class="sec">
                <div class="card">
                    <h4>Generar Reporte Mensual</h4>
                    <input type="month" id="mes-busqueda">
                    <button class="btn-save" style="background:var(--azul)" onclick="procesarEstadistica()">📈 VER INFORME</button>
                </div>
                <div id="reporte-final"></div>
            </div>

            <div id="sec-admin" class="sec">
                <div class="card">
                    <h3>Panel de Control de Usuarios</h3>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr><th>Usuario</th><th>Nombre</th><th>Área</th><th>Acciones</th></tr>
                            </thead>
                            <tbody id="tbody-users"></tbody>
                        </table>
                    </div>
                    <button class="btn-save" onclick="abrirModalUsuario()" style="margin-top:15px;">➕ NUEVO ESPECIALISTA</button>
                </div>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, query, where, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
        authDomain: "control-de-asistencia-d585e.firebaseapp.com",
        projectId: "control-de-asistencia-d585e",
        storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
        appId: "1:368890880546:web:a97ab4372dea536217207b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let sesion = null;
    let alumnosHoy = [];
    let estados = {}; // { idEstudiante: estado } 1=P, 0=I, 2=J

    // --- LOGIN ---
    window.iniciarSesion = async () => {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;

        if(u === "director_lucila" && p === "admin2024") {
            entrar({id: u, nombre: "Dirección General", area: "Dirección", rol: "admin"});
        } else {
            const d = await getDoc(doc(db, "credenciales_especialistas", u));
            if(d.exists() && d.data().pass === p) entrar({id: u, ...d.data(), rol: "esp"});
            else document.getElementById('err').style.display = 'block';
        }
    };

    function entrar(data) {
        sesion = data;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-content').style.display = 'block';
        document.getElementById('txt-area').innerText = sesion.area.toUpperCase();
        document.getElementById('txt-nombre').innerText = sesion.nombre;
        if(sesion.rol === 'admin') {
            document.getElementById('t-admin').style.display = 'block';
            cargarListaUsuarios();
        }
        document.getElementById('fecha-asistencia').value = new Date().toISOString().split('T')[0];
    }

    window.verTab = (t) => {
        document.querySelectorAll('.sec').forEach(s => s.style.display = 'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sec-'+t).style.display = 'block';
        document.getElementById('t-'+t).classList.add('active');
    };

    // --- ASISTENCIA REAL ---
    window.cargarAlumnos = async () => {
        const g = document.getElementById('sel-grado').value;
        const s = document.getElementById('sel-seccion').value;
        const cont = document.getElementById('contenedor-alumnos');
        cont.innerHTML = "Buscando alumnos de las maestras...";
        document.getElementById('div-lista').style.display = 'block';

        const snap = await getDocs(collection(db, "docentes_db"));
        let found = false;

        snap.forEach(doc => {
            const data = doc.data();
            if(String(data.grado).includes(g) && String(data.seccion).toUpperCase() === s) {
                found = true;
                alumnosHoy = data.alumnos.filter(a => !a.retirado).sort((a,b)=>a.nombre.localeCompare(b.nombre));
                renderizarLista(g, s);
            }
        });
        if(!found) cont.innerHTML = "⚠️ No hay alumnos cargados para esta sección en el sistema de maestras.";
    };

    function renderizarLista(g, s) {
        document.getElementById('info-grupo').innerText = `${g}° Grado - Sección "${s}"`;
        const cont = document.getElementById('contenedor-alumnos');
        cont.innerHTML = "";
        
        alumnosHoy.forEach(a => {
            if(!estados[a.id]) estados[a.id] = 1;
            const label = estados[a.id] === 1 ? 'P' : (estados[a.id] === 0 ? 'I' : 'J');
            const color = estados[a.id] === 1 ? 'var(--exito)' : (estados[a.id] === 0 ? 'var(--error)' : 'var(--morado)');
            const genClase = a.genero.toLowerCase().startsWith('v') ? 'bg-v' : 'bg-h';

            cont.innerHTML += `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid #eee;">
                    <div>
                        <span style="font-size:13px; font-weight:bold;">${a.nombre}</span><br>
                        <span class="genero-badge ${genClase}">${a.genero}</span>
                    </div>
                    <button onclick="cambiarEstado(${a.id})" style="width:50px; background:${color}; color:white; border:none; border-radius:8px; padding:10px; font-weight:bold;">${label}</button>
                </div>`;
        });
    }

    window.cambiarEstado = (id) => {
        estados[id] = estados[id] === 1 ? 0 : (estados[id] === 0 ? 2 : 1);
        renderizarLista(document.getElementById('sel-grado').value, document.getElementById('sel-seccion').value);
    };

    window.enviarAsistencia = async () => {
        const f = document.getElementById('fecha-asistencia').value;
        const g = document.getElementById('sel-grado').value;
        const s = document.getElementById('sel-seccion').value;
        if(!f) return alert("Seleccione fecha");

        let mv=0, mh=0, av=0, ah=0;
        alumnosHoy.forEach(a => {
            const isV = a.genero.toLowerCase().startsWith('v');
            if(isV) mv++; else mh++;
            if(estados[a.id] === 1) { if(isV) av++; else ah++; }
        });

        await setDoc(doc(db, "asistencia_especialistas", `${sesion.id}_${f}_${g}${s}`), {
            espId: sesion.id, espNom: sesion.nombre, area: sesion.area,
            fecha: f, grado: g, seccion: s,
            mv, mh, av, ah, total_m: (mv+mh), total_a: (av+ah),
            timestamp: new Date().toISOString()
        });

        alert("✅ Asistencia guardada correctamente");
        document.getElementById('div-lista').style.display = 'none';
    };

    // --- ESTADÍSTICA Y AUDITORÍA ---
    window.procesarEstadistica = async () => {
        const mes = document.getElementById('mes-busqueda').value;
        const cont = document.getElementById('reporte-final');
        cont.innerHTML = "Calculando promedios reales...";

        let q = query(collection(db, "asistencia_especialistas"));
        if(sesion.rol !== 'admin') q = query(collection(db, "asistencia_especialistas"), where("espId", "==", sesion.id));

        const snap = await getDocs(q);
        let registros = [];
        snap.forEach(d => { if(d.data().fecha.startsWith(mes)) registros.push(d.data()); });

        if(registros.length === 0) { cont.innerHTML = "❌ Sin datos para este mes."; return; }

        let html = `<div class="card"><h3>CONSOLIDADO MENSUAL: ${mes}</h3>`;
        
        // Alerta de Auditoría (Solo para Director)
        if(sesion.rol === 'admin') {
            const especialistas = await getDocs(collection(db, "credenciales_especialistas"));
            especialistas.forEach(e => {
                const count = registros.filter(r => r.espId === e.id).length;
                if(count < 4) {
                    html += `<div class="fila-alerta" style="padding:10px; margin-bottom:10px;">
                        ⚠️ <b>${e.data().nombre} (${e.data().area})</b>: Muy poca actividad (${count} sesiones).
                    </div>`;
                }
            });
        }

        html += `
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>Fecha</th><th>Especialista</th><th>Grado/Sec</th><th>Matrícula (V/H)</th><th>Asist. (V/H)</th><th>Prom. Real</th></tr>
                    </thead>
                    <tbody>`;

        registros.sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(r => {
            html += `
                <tr>
                    <td>${r.fecha.split('-')[2]}</td>
                    <td>${r.espNom}</td>
                    <td>${r.grado}° "${r.seccion}"</td>
                    <td>${r.mv} / ${r.mh}</td>
                    <td>${r.av} / ${r.ah}</td>
                    <td style="background:#e8f4fd"><b>${r.total_a}</b></td>
                </tr>`;
        });

        html += `</tbody></table></div></div>`;
        cont.innerHTML = html;
    };

    // --- PANEL DIRECCIÓN ---
    async function cargarListaUsuarios() {
        const tbody = document.getElementById('tbody-users');
        const snap = await getDocs(collection(db, "credenciales_especialistas"));
        tbody.innerHTML = "";
        snap.forEach(d => {
            const u = d.data();
            tbody.innerHTML += `
                <tr>
                    <td>${d.id}</td><td>${u.nombre}</td><td>${u.area}</td>
                    <td><button onclick="abrirEdicion('${d.id}')" style="background:var(--oro); color:white; border:none; padding:5px; border-radius:4px; cursor:pointer;">✏️ EDITAR</button></td>
                </tr>`;
        });
    }

    window.abrirEdicion = async (id) => {
        const d = await getDoc(doc(db, "credenciales_especialistas", id));
        const n = prompt("Nuevo nombre:", d.data().nombre);
        const a = prompt("Nueva área:", d.data().area);
        const p = prompt("Nueva contraseña:", d.data().pass);
        if(n && a && p) {
            await setDoc(doc(db, "credenciales_especialistas", id), { nombre: n, area: a, pass: p });
            alert("Actualizado");
            cargarListaUsuarios();
        }
    };

    window.abrirModalUsuario = async () => {
        const id = prompt("Usuario ID (ej: musica1):");
        const n = prompt("Nombre completo:");
        const a = prompt("Área:");
        const p = prompt("Contraseña:");
        if(id && n && a && p) {
            await setDoc(doc(db, "credenciales_especialistas", id), { nombre: n, area: a, pass: p });
            alert("Creado");
            cargarListaUsuarios();
        }
    };

</script>
</body>
</html>
