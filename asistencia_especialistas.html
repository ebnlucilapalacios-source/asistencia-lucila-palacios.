<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Control Lucila Palacios - PRO</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root { --azul: #002147; --oro: #f39c12; --exito: #27ae60; --error: #c0392b; --fondo: #f4f7f6; --admin: #2c3e50; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--fondo); margin: 0; color: #333; }
        header { background: var(--azul); color: white; padding: 15px; text-align: center; border-bottom: 5px solid var(--oro); position: sticky; top:0; z-index: 100; }
        .container { max-width: 1000px; margin: auto; padding: 15px; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid #ddd; }
        
        /* Navegación */
        .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #ddd; cursor: pointer; font-weight: bold; font-size: 11px; white-space: nowrap; transition: 0.3s; }
        .tab-btn.active { background: var(--azul); color: white; }

        /* Alertas */
        .alerta-critica { background: #fff3cd; border-left: 5px solid var(--oro); padding: 12px; margin-bottom: 10px; border-radius: 5px; font-size: 12px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        /* Tablas */
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #f4f4f4; color: var(--azul); }

        /* Botones y Form */
        input, select, textarea { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        .btn-primario { background: var(--azul); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-exito { background: var(--exito); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        
        #app-content, .sec { display: none; }
        .chk-list { max-height: 200px; overflow-y: auto; background: #f9f9f9; padding: 10px; border-radius: 8px; border: 1px solid #eee; }
    </style>
</head>
<body>

    <div id="login-screen" style="display:flex; height:100vh; align-items:center; justify-content:center; background:var(--azul);">
        <div class="card" style="width:320px; text-align:center;">
            <h2 style="color:var(--azul); margin-bottom:0;">LUCILA PALACIOS</h2>
            <p style="font-size:12px; color:#666;">Sistema de Especialistas v2.0</p>
            <input type="text" id="user" placeholder="Usuario">
            <input type="password" id="pass" placeholder="Contraseña">
            <button class="btn-primario" onclick="iniciarSesion()">ENTRAR</button>
        </div>
    </div>

    <div id="app-content">
        <header>
            <h3 id="display-area" style="margin:0; font-size: 16px;">ÁREA</h3>
            <div id="display-nombre" style="font-size:11px; opacity:0.8;">Nombre del Especialista</div>
        </header>
        
        <div class="container">
            <div class="nav-tabs">
                <button class="tab-btn active" id="btn-asis" onclick="verTab('asis')">📝 ASISTENCIA</button>
                <button class="tab-btn" id="btn-stats" onclick="verTab('stats')">📊 REPORTES</button>
                <button class="tab-btn" id="btn-admin" onclick="verTab('admin')" style="background:var(--admin); color:white; display:none;">🔑 DIRECCIÓN</button>
                <button class="tab-btn" onclick="location.reload()" style="background:var(--error); color:white">SALIR</button>
            </div>

            <div id="sec-asis" class="sec" style="display:block;">
                <div class="card">
                    <label>Fecha de Atención:</label>
                    <input type="date" id="f-asis">
                    <div style="display:flex; gap:5px;">
                        <select id="g-asis">
                            <option value="">Seleccione...</option>
                            <optgroup label="Grados Regulares">
                                <option value="1">1° Grado</option><option value="2">2° Grado</option>
                                <option value="3">3° Grado</option><option value="4">4° Grado</option>
                                <option value="5">5° Grado</option><option value="6">6° Grado</option>
                            </optgroup>
                            <optgroup label="Especiales" id="opt-grupos-estables">
                                <option value="GE">Grupo Estable / Aula Int.</option>
                            </optgroup>
                        </select>
                        <select id="s-asis">
                            <option value="A">A</option><option value="B">B</option><option value="C">C</option>
                        </select>
                    </div>
                    <button class="btn-primario" style="margin-top:10px;" onclick="buscarAlumnos()">🔍 CARGAR LISTA</button>
                </div>

                <div id="card-lista" class="card" style="display:none;">
                    <h4 id="info-meta" style="color:var(--oro); font-size:12px; margin:0 0 10px 0;"></h4>
                    <div id="lista-render"></div>
                    <textarea id="obs-clase" placeholder="Observaciones de la jornada..." style="margin-top:15px;"></textarea>
                    <button class="btn-exito" onclick="guardarAsistencia()">💾 GUARDAR REGISTRO</button>
                </div>
            </div>

            <div id="sec-stats" class="sec">
                <div id="contenedor-alertas"></div>
                <div class="card">
                    <input type="month" id="mes-filtro">
                    <div style="display:flex; gap:5px; margin-top:10px;">
                        <button onclick="generarReporte()" class="btn-primario">GENERAR TABLA</button>
                        <button onclick="exportarExcel()" style="background:#1d6f42; color:white; border:none; border-radius:8px; padding:10px;">Excel</button>
                        <button onclick="exportarPDF()" style="background:#af2a2a; color:white; border:none; border-radius:8px; padding:10px;">PDF</button>
                    </div>
                </div>
                <div id="tabla-reporte-contenedor" class="table-wrapper"></div>
            </div>

            <div id="sec-admin" class="sec">
                <div class="card" style="border-left: 5px solid var(--oro);">
                    <h3>Constructor de Grupos Estables</h3>
                    <p style="font-size:11px;">Cree listas mixtas para Deporte, Aula Integrada o Cultura.</p>
                    <input type="text" id="nombre-ge" placeholder="Nombre del Grupo (ej: Futbol 4to)">
                    <input type="text" id="meta-ge" placeholder="Meta Pedagógica o Proyecto">
                    <div class="chk-list" id="lista-alumnos-escuela"></div>
                    <button class="btn-primario" style="margin-top:10px;" onclick="guardarGrupoEstable()">✅ CREAR GRUPO</button>
                </div>

                <div class="card">
                    <h3>Gestión de Especialistas</h3>
                    <div id="lista-usuarios-admin"></div>
                    <button class="btn-primario" onclick="crearEspecialista()">➕ NUEVO USUARIO</button>
                </div>

                <div class="card" style="border: 2px solid var(--error);">
                    <button onclick="limpiarAsistencias()" style="background:var(--error); color:white; border:none; padding:10px; width:100%; border-radius:8px;">🗑️ LIMPIAR TODAS LAS PRUEBAS</button>
                </div>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, query, where, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
        authDomain: "control-de-asistencia-d585e.firebaseapp.com",
        projectId: "control-de-asistencia-d585e",
        storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
        appId: "1:368890880546:web:a97ab4372dea536217207b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let user = null;
    let alumnosActivos = [];
    let asistenciaTemp = {};

    // LOGIN
    window.iniciarSesion = async () => {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        if(u === "director_lucila" && p === "admin2024") {
            entrar({id:u, nombre:"Director", area:"Dirección", rol:"admin"});
        } else {
            const d = await getDoc(doc(db, "credenciales_especialistas", u));
            if(d.exists() && d.data().pass === p) entrar({id:u, ...d.data(), rol:"esp"});
            else alert("Credenciales incorrectas");
        }
    };

    function entrar(data) {
        user = data;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-content').style.display = 'block';
        document.getElementById('display-area').innerText = user.area.toUpperCase();
        document.getElementById('display-nombre').innerText = user.nombre;
        if(user.rol === 'admin') {
            document.getElementById('btn-admin').style.display = 'block';
            cargarAlumnosParaGE();
            cargarListaEspecialistas();
        }
        document.getElementById('f-asis').value = new Date().toISOString().split('T')[0];
        actualizarSelectGE();
    }

    window.verTab = (t) => {
        document.querySelectorAll('.sec').forEach(s => s.style.display = 'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sec-'+t).style.display = 'block';
        document.getElementById('btn-'+t).classList.add('active');
        if(t === 'stats') detectarAusentismo();
    };

    // BÚSQUEDA CORREGIDA (1° A Y GRUPOS ESTABLES)
    window.buscarAlumnos = async () => {
        const g = document.getElementById('g-asis').value;
        const s = document.getElementById('s-asis').value;
        if(!g) return alert("Seleccione grado");

        let found = false;
        alumnosActivos = [];
        document.getElementById('info-meta').innerText = "";

        if(g === "GE") {
            // BUSCAR EN GRUPOS ESTABLES
            const snap = await getDocs(collection(db, "grupos_estables_db"));
            snap.forEach(d => {
                if(d.data().nombreGrupo === s) {
                    found = true;
                    alumnosActivos = d.data().alumnos;
                    document.getElementById('info-meta').innerText = "PROYECTO: " + (d.data().meta || "General");
                }
            });
        } else {
            // BUSCAR EN DOCENTES_DB (BLINDADO)
            const snap = await getDocs(collection(db, "docentes_db"));
            snap.forEach(d => {
                const f_grado = String(d.data().grado).trim();
                const f_seccion = String(d.data().seccion).toUpperCase().trim();
                if(f_grado.includes(g) && f_seccion === s.toUpperCase()) {
                    found = true;
                    alumnosActivos = d.data().alumnos.filter(a => a.retirado !== true);
                }
            });
        }

        if(found) renderListaAsistencia();
        else alert("No se encontró la lista de " + g + " " + s);
    };

    function renderListaAsistencia() {
        document.getElementById('card-lista').style.display = 'block';
        const cont = document.getElementById('lista-render');
        cont.innerHTML = "";
        alumnosActivos.forEach(a => {
            if(!asistenciaTemp[a.id]) asistenciaTemp[a.id] = 1;
            const color = asistenciaTemp[a.id] === 1 ? 'var(--exito)' : 'var(--error)';
            cont.innerHTML += `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px solid #eee;">
                    <span style="font-size:13px;">${a.nombre}</span>
                    <button onclick="toggleAsis(${a.id})" style="background:${color}; color:white; border:none; border-radius:8px; width:45px; padding:8px; font-weight:bold;">
                        ${asistenciaTemp[a.id] === 1 ? 'P' : 'I'}
                    </button>
                </div>`;
        });
    }

    window.toggleAsis = (id) => {
        asistenciaTemp[id] = asistenciaTemp[id] === 1 ? 0 : 1;
        renderListaAsistencia();
    };

    window.guardarAsistencia = async () => {
        const f = document.getElementById('f-asis').value;
        const g = document.getElementById('g-asis').value;
        const s = document.getElementById('s-asis').value;
        const obs = document.getElementById('obs-clase').value;
        
        let mv=0, mh=0, av=0, ah=0, faltistas = [];
        alumnosActivos.forEach(a => {
            const isV = a.genero && a.genero.toLowerCase().startsWith('v');
            if(isV) mv++; else mh++;
            if(asistenciaTemp[a.id] === 1) { if(isV) av++; else ah++; }
            else { faltistas.push({id: a.id, nombre: a.nombre, g: g, s: s}); }
        });

        const idDoc = `${user.id}_${f}_${g}${s}`.replace(/\s+/g, '');
        await setDoc(doc(db, "asistencia_especialistas", idDoc), {
            espId: user.id, espNom: user.nombre, area: user.area,
            fecha: f, grado: g, seccion: s,
            mv, mh, av, ah, obs, faltistas,
            total_m: (mv+mh), total_a: (av+ah)
        });
        alert("✅ Registro guardado");
        location.reload();
    };

    // --- DIRECCIÓN: CONSTRUCTOR DE GRUPOS ---
    async function cargarAlumnosParaGE() {
        const cont = document.getElementById('lista-alumnos-escuela');
        const snap = await getDocs(collection(db, "docentes_db"));
        cont.innerHTML = "";
        snap.forEach(d => {
            d.data().alumnos.forEach(a => {
                if(!a.retirado) {
                    cont.innerHTML += `
                    <div style="font-size:11px; margin-bottom:3px;">
                        <input type="checkbox" class="chk-ge" data-id="${a.id}" data-nom="${a.nombre}" data-gen="${a.genero}">
                        ${a.nombre} (${d.data().grado}° ${d.data().seccion})
                    </div>`;
                }
            });
        });
    }

    window.guardarGrupoEstable = async () => {
        const nom = document.getElementById('nombre-ge').value;
        const meta = document.getElementById('meta-ge').value;
        const selected = document.querySelectorAll('.chk-ge:checked');
        if(!nom || selected.length === 0) return alert("Complete los datos");

        let lista = [];
        selected.forEach(c => lista.push({id: c.dataset.id, nombre: c.dataset.nom, genero: c.dataset.gen}));
        
        await setDoc(doc(db, "grupos_estables_db", nom.replace(/\s+/g, '_')), {
            nombreGrupo: nom, meta: meta, alumnos: lista
        });
        alert("Grupo Creado");
        location.reload();
    };

    async function actualizarSelectGE() {
        const snap = await getDocs(collection(db, "grupos_estables_db"));
        const sel = document.getElementById('s-asis');
        // Si el grado es GE, cambiamos las opciones de sección por los nombres de los grupos
        document.getElementById('g-asis').addEventListener('change', (e) => {
            if(e.target.value === "GE") {
                sel.innerHTML = "";
                snap.forEach(d => {
                    sel.innerHTML += `<option value="${d.data().nombreGrupo}">${d.data().nombreGrupo}</option>`;
                });
            } else {
                sel.innerHTML = '<option value="A">A</option><option value="B">B</option><option value="C">C</option>';
            }
        });
    }

    // --- REPORTES Y ALERTAS ---
    async function detectarAusentismo() {
        const snap = await getDocs(collection(db, "asistencia_especialistas"));
        let globalFaltas = {};
        snap.forEach(d => {
            const f = d.data().faltistas || [];
            f.forEach(niño => {
                if(!globalFaltas[niño.id]) globalFaltas[niño.id] = {nom: niño.nombre, c: 0};
                globalFaltas[niño.id].c++;
            });
        });
        const cont = document.getElementById('contenedor-alertas');
        cont.innerHTML = "";
        for(let id in globalFaltas) {
            if(globalFaltas[id].c >= 3) {
                cont.innerHTML += `<div class="alerta-critica">🚩 <b>CRÍTICO:</b> ${globalFaltas[id].nom} tiene ${globalFaltas[id].c} inasistencias acumuladas.</div>`;
            }
        }
    }

    window.generarReporte = async () => {
        const mes = document.getElementById('mes-filtro').value;
        const snap = await getDocs(collection(db, "asistencia_especialistas"));
        let html = `<table><thead><tr><th>Fecha</th><th>Especialista</th><th>Grado</th><th>V/H</th><th>Obs.</th><th>Acción</th></tr></thead><tbody>`;
        snap.forEach(d => {
            const r = d.data();
            if(r.fecha.startsWith(mes)) {
                html += `<tr>
                    <td>${r.fecha.split('-')[2]}</td><td>${r.espNom}</td><td>${r.grado}${r.seccion}</td>
                    <td>${r.av}/${r.ah}</td><td><small>${r.obs || '-'}</small></td>
                    <td><button onclick="borrarReg('${d.id}')" style="background:red; color:white; border:none; padding:5px; border-radius:4px;">X</button></td>
                </tr>`;
            }
        });
        html += `</tbody></table>`;
        document.getElementById('tabla-reporte-contenedor').innerHTML = html;
    };

    window.borrarReg = async (id) => { if(confirm("¿Borrar?")) { await deleteDoc(doc(db, "asistencia_especialistas", id)); generarReporte(); } };

    window.exportarExcel = () => {
        const wb = XLSX.utils.table_to_book(document.querySelector("table"));
        XLSX.writeFile(wb, "Reporte_Especialistas_Lucila.xlsx");
    };

    window.exportarPDF = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("Resumen de Especialistas - EBN Lucila Palacios", 10, 10);
        doc.autoTable({ html: 'table', startY: 20, styles: {fontSize: 8} });
        doc.save("Reporte.pdf");
    };

    window.limpiarAsistencias = async () => {
        if(confirm("⚠️ ¿Borrar todos los registros de asistencia?")) {
            const snap = await getDocs(collection(db, "asistencia_especialistas"));
            snap.forEach(async d => await deleteDoc(doc(db, "asistencia_especialistas", d.id)));
            alert("Limpieza exitosa");
        }
    };
</script>
</body>
</html>
