<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA LUCILA PALACIOS - ESPECIALISTAS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --azul: #002147; --oro: #f3c612; --verde: #28a745; --rojo: #dc3545; --gris: #f4f7f6; }
        body { font-family: sans-serif; background: var(--gris); margin: 0; padding-bottom: 70px; }
        header { background: var(--azul); color: white; padding: 15px; text-align: center; border-bottom: 4px solid var(--oro); }
        .container { max-width: 800px; margin: auto; padding: 15px; }
        .card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        select, input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        .btn-verde { background: var(--verde); color: white; font-weight: bold; border: none; }
        .btn-azul { background: var(--azul); color: white; font-weight: bold; border: none; }
        
        /* TABLA ESTADÍSTICA DISGREGADA */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th { background: var(--azul); color: white; padding: 10px; }
        td { padding: 8px; border: 1px solid #ddd; text-align: center; }
        .resumen-global { background: #e9ecef; font-weight: bold; }
        
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 2px solid #ddd; }
        .nav-item { flex: 1; padding: 15px; text-align: center; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<header>SISTEMA LUCILA PALACIOS - GRUPOS ESTABLES</header>

<div class="container">
    <div id="seccion-especialista" class="card">
        <h3>🛠️ Configurar Grupo Estable</h3>
        <p><small>Seleccione los grados que integran su grupo para pasar asistencia conjunta.</small></p>
        <div id="selector-grados" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            </div>
        <button class="btn-azul" onclick="cargarGrupoEspecialista()">CARGAR ALUMNOS DEL GRUPO</button>
    </div>

    <div id="area-asistencia" class="card" style="display:none;">
        <h3 id="titulo-especialidad">Pase de Asistencia</h3>
        <div id="lista-alumnos"></div>
        <button class="btn-verde" onclick="guardarAsistenciaEspecialista()">💾 GUARDAR Y GENERAR ESTADÍSTICA</button>
    </div>

    <div id="seccion-reporte" class="card" style="display:none;">
        <h3>📊 Resumen Estadístico Disgregado</h3>
        <div id="tabla-estadistica"></div>
        <button class="btn-azul" onclick="exportarExcel()">Descargar Reporte Excel</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const config = { /* Tu configuración de Firebase aquí */ };
    const app = initializeApp(config);
    const db = getFirestore(app);

    const grados = ["1A", "1B", "1C", "1D", "2A", "2B", "2C", "2D", "3A", "3B", "3C", "3D"];
    let grupoActual = [];

    // Inicializar selectores de grado
    const selector = document.getElementById('selector-grados');
    grados.forEach(g => {
        selector.innerHTML += `<label><input type="checkbox" value="${g}" class="grado-check"> ${g}</label>`;
    });

    window.cargarGrupoEspecialista = async () => {
        const seleccionados = Array.from(document.querySelectorAll('.grado-check:checked')).map(cb => cb.value);
        if(seleccionados.length === 0) return alert("Seleccione al menos una sección.");

        grupoActual = [];
        for(let g of seleccionados) {
            const snap = await getDoc(doc(db, "docentes_db", `DOCENTE_${g}`));
            if(snap.exists()) {
                const alumnos = snap.data().alumnos.map(a => ({...a, seccionOriginal: g}));
                grupoActual.push(...alumnos);
            }
        }

        renderLista();
    };

    function renderLista() {
        const div = document.getElementById('lista-alumnos');
        div.innerHTML = "";
        grupoActual.sort((a,b) => a.nombre.localeCompare(b.nombre)).forEach(a => {
            div.innerHTML += `
                <div style="display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid #eee;">
                    <span>${a.nombre} <small>(${a.seccionOriginal} - ${a.sexo})</small></span>
                    <select class="status" data-id="${a.id}" data-sexo="${a.sexo}" style="width:70px;">
                        <option value="P">P</option>
                        <option value="I">I</option>
                    </select>
                </div>`;
        });
        document.getElementById('area-asistencia').style.display = 'block';
    }

    window.guardarAsistenciaEspecialista = async () => {
        const filas = document.querySelectorAll('.status');
        let stats = { mv: 0, mh: 0, av: 0, ah: 0 };

        filas.forEach(f => {
            const sexo = f.getAttribute('data-sexo'); // V o H
            if(sexo === 'VARÓN' || sexo === 'V') stats.mv++; else stats.mh++;
            
            if(f.value === 'P') {
                if(sexo === 'VARÓN' || sexo === 'V') stats.av++; else stats.ah++;
            }
        });

        const totalMatricula = stats.mv + stats.mh;
        const totalAsistencia = stats.av + stats.ah;
        const promedioReal = ((totalAsistencia / totalMatricula) * 100).toFixed(2);

        mostrarResumen(stats, promedioReal);
    };

    function mostrarResumen(s, prom) {
        const div = document.getElementById('tabla-estadistica');
        div.innerHTML = `
            <table>
                <tr>
                    <th>GÉNERO</th>
                    <th>MATRÍCULA</th>
                    <th>ASISTENCIA</th>
                    <th>% REAL</th>
                </tr>
                <tr>
                    <td>VARONES</td>
                    <td>${s.mv}</td>
                    <td>${s.av}</td>
                    <td>${((s.av/s.mv)*100 || 0).toFixed(2)}%</td>
                </tr>
                <tr>
                    <td>HEMBRAS</td>
                    <td>${s.mh}</td>
                    <td>${s.ah}</td>
                    <td>${((s.ah/s.mh)*100 || 0).toFixed(2)}%</td>
                </tr>
                <tr class="resumen-global">
                    <td>TOTAL</td>
                    <td>${s.mv + s.mh}</td>
                    <td>${s.av + s.ah}</td>
                    <td>${prom}%</td>
                </tr>
            </table>
        `;
        document.getElementById('seccion-reporte').style.display = 'block';
        alert("Estadística generada con éxito.");
    }
</script>
</body>
</html>
