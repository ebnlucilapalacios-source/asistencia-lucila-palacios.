<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA INTEGRAL EBN LUCILA PALACIOS</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root { --azul: #002147; --oro: #f3c612; --exito: #28a745; --error: #dc3545; --morado: #6f42c1; --fondo: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--fondo); margin: 0; }
        
        .login-screen { height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--azul); }
        .login-card { background: white; padding: 30px; border-radius: 20px; width: 320px; text-align: center; border-bottom: 6px solid var(--oro); }
        
        header { background: var(--azul); color: white; padding: 15px; text-align: center; border-bottom: 4px solid var(--oro); }
        .logo-nav { width: 70px; margin-bottom: 5px; }

        .container { max-width: 500px; margin: auto; padding: 15px; }
        .card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; }
        .btn { padding: 14px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; color: white; margin-top: 5px; }
        .btn-azul { background: var(--azul); }
        .btn-morado { background: var(--morado); }
        
        .nav-tabs { display: flex; gap: 5px; margin-bottom: 15px; overflow-x: auto; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; background: white; font-weight: bold; font-size: 11px; white-space: nowrap; }
        .tab-btn.active { background: var(--oro); color: var(--azul); }

        .alumno-fila { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .btn-asis { width: 45px; height: 45px; border-radius: 10px; border: none; color: white; font-weight: bold; }

        #appContent, .sec, #adminExtra { display: none; }
    </style>
</head>
<body>

    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <img src="https://raw.githubusercontent.com/ebnlucilapalacios-source/asistencia-lucila-palacios./main/IMG_20260225_005025_993.png" alt="Logo" width="90">
            <h2 style="color:var(--azul);">SISTEMA LUCILA</h2>
            <input type="text" id="logUser" placeholder="Usuario">
            <input type="password" id="logPass" placeholder="Contraseña">
            <button class="btn btn-azul" onclick="iniciarSesion()">INGRESAR</button>
        </div>
    </div>

    <div id="appContent">
        <header>
            <img src="https://raw.githubusercontent.com/ebnlucilapalacios-source/asistencia-lucila-palacios./main/IMG_20260225_005025_993.png" class="logo-nav">
            <div id="headerDocente" style="font-weight: bold;">Cargando...</div>
        </header>

        <div class="container">
            <div id="adminExtra" class="card" style="border: 2px solid var(--morado);">
                <b style="color:var(--morado)">📊 PANEL DE DIRECCIÓN</b>
                <button class="btn btn-morado" style="font-size:11px;" onclick="verConsolidadoGeneral()">VER CONSOLIDADO ESCUELA</button>
            </div>

            <div class="nav-tabs">
                <button class="tab-btn active" id="tab-asis" onclick="verTab('asis')">ASISTENCIA</button>
                <button class="tab-btn" id="tab-ge" onclick="verTab('ge')">G. ESTABLES</button>
                <button class="tab-btn" id="tab-stats" onclick="verTab('stats')">REPORTE</button>
                <button class="tab-btn" onclick="location.reload()" style="background:var(--error); color:white;">SALIR</button>
            </div>

            <div id="sec-asis" class="sec" style="display: block;">
                <div class="card">
                    <input type="date" id="fechaControl">
                    <select id="gradoSel" onchange="actualizarSecciones()">
                        <option value="">Seleccione Grado</option>
                        <option value="1">1ero</option><option value="2">2do</option><option value="3">3ero</option>
                        <option value="4">4to</option><option value="5">5to</option><option value="6">6to</option>
                        <option value="GE">Grupo Estable</option>
                    </select>
                    <select id="seccionSel"></select>
                    <button class="btn btn-azul" onclick="cargarLista()">CARGAR LISTA</button>
                </div>
                <div id="panelLista" class="card" style="display:none;"><div id="renderAlumnos"></div><button class="btn btn-exito" onclick="guardarAsistencia()">GUARDAR</button></div>
            </div>

            <div id="sec-ge" class="sec">
                <div class="card">
                    <h4>🔨 Configurar Grupo Estable</h4>
                    <input type="text" id="geNombre" placeholder="Nombre del Grupo">
                    <div id="geBuscador" style="max-height:150px; overflow-y:auto; border:1px solid #ddd; padding:5px;"></div>
                    <button class="btn btn-azul" onclick="crearGrupoEstable()">CREAR GRUPO</button>
                </div>
                <div id="misGruposRender"></div>
            </div>

            <div id="sec-stats" class="sec">
                <div class="card">
                    <h4>📊 Reporte Mensual</h4>
                    <input type="month" id="mesReporte">
                    <button class="btn btn-morado" onclick="generarReportePDF()">DESCARGAR PDF CON LOGO</button>
                </div>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAERrG77MB-PVjHFWZ2vAaBmfYCc-zNazg",
        authDomain: "control-de-asistencia-d585e.firebaseapp.com",
        projectId: "control-de-asistencia-d585e",
        storageBucket: "control-de-asistencia-d585e.firebasestorage.app",
        appId: "1:368890880546:web:a97ab4372dea536217207b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let sesion = null;
    let alumnosActivos = [];
    let recordAsis = {};

    // --- ESCÁNER DE ACCESO TOTAL ---
    window.iniciarSesion = async () => {
        const u = document.getElementById('logUser').value.toLowerCase().trim();
        const p = document.getElementById('logPass').value;

        try {
            let snap = null;
            const tablas = ["docentes_db", "credenciales_especialistas"];
            
            for (let t of tablas) {
                let docRef = await getDoc(doc(db, t, u));
                if(docRef.exists()) { snap = docRef; break; }
            }

            if(snap && (snap.data().pass === p || snap.data().contraseña === p)) {
                sesion = { id: u, ...snap.data() };
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                document.getElementById('headerDocente').innerText = sesion.nombre || sesion.docente;
                document.getElementById('fechaControl').value = new Date().toISOString().split('T')[0];
                
                if(u === "admin_lucila") document.getElementById('adminExtra').style.display = 'block';
                
                cargarBuscadorEstudiantes();
                renderizarGruposGE();
            } else {
                alert("Usuario o clave incorrecta");
            }
        } catch(e) { alert("Error de red"); }
    };

    window.verTab = (t) => {
        document.querySelectorAll('.sec').forEach(s => s.style.display='none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sec-'+t).style.display='block';
        document.getElementById('tab-'+t).classList.add('active');
    };

    window.actualizarSecciones = async () => {
        const g = document.getElementById('gradoSel').value;
        const s = document.getElementById('seccionSel');
        s.innerHTML = '<option value="">Sec.</option>';
        if(g === "GE") {
            const snap = await getDocs(collection(db, "grupos_estables_db"));
            snap.forEach(d => { if(d.data().creador === sesion.id) s.innerHTML += `<option value="${d.id}">${d.data().nombre}</option>`; });
        } else {
            ['A','B','C','D','E'].forEach(l => s.innerHTML += `<option value="${l}">${l}</option>`);
        }
    };

    window.cargarLista = async () => {
        const g = document.getElementById('gradoSel').value;
        const s = document.getElementById('seccionSel').value;
        alumnosActivos = []; recordAsis = {};
        document.getElementById('panelLista').style.display = 'block';

        if(g === "GE") {
            const d = await getDoc(doc(db, "grupos_estables_db", s));
            if(d.exists()) alumnosActivos = d.data().alumnos;
        } else {
            const snap = await getDocs(collection(db, "docentes_db"));
            snap.forEach(docSnap => {
                let d = docSnap.data();
                if(String(d.grado) === String(g) && d.seccion === s) {
                    alumnosActivos = [...alumnosActivos, ...d.alumnos.filter(a => !a.retirado)];
                }
            });
        }
        dibujarLista();
    };

    function dibujarLista() {
        const r = document.getElementById('renderAlumnos');
        r.innerHTML = "";
        alumnosActivos.forEach(a => {
            recordAsis[a.id] = { p: 1, g: a.genero || 'M' };
            r.innerHTML += `<div class="alumno-fila"><span>${a.nombre}</span><button class="btn-asis" id="b-${a.id}" onclick="toggleAsis('${a.id}')" style="background:var(--exito)">P</button></div>`;
        });
    }

    window.toggleAsis = (id) => {
        recordAsis[id].p = recordAsis[id].p === 1 ? 0 : 1;
        document.getElementById('b-'+id).innerText = recordAsis[id].p === 1 ? 'P' : 'I';
        document.getElementById('b-'+id).style.background = recordAsis[id].p === 1 ? 'var(--exito)' : 'var(--error)';
    };

    window.guardarAsistencia = async () => {
        const f = document.getElementById('fechaControl').value;
        const g = document.getElementById('gradoSel').value;
        const s = document.getElementById('seccionSel').value;
        await setDoc(doc(db, "asistencia_especialistas", `ASIS_${sesion.id}_${f}_${s}`), {
            docente: sesion.nombre || sesion.docente, fecha: f, grado: g, seccion: s, data: recordAsis
        });
        alert("Guardado");
    };

    async function cargarBuscadorEstudiantes() {
        const snap = await getDocs(collection(db, "docentes_db"));
        const div = document.getElementById('geBuscador');
        div.innerHTML = "";
        snap.forEach(d => {
            if(d.data().alumnos) d.data().alumnos.forEach(a => {
                if(!a.retirado) div.innerHTML += `<div><label><input type="checkbox" class="chk-ge" data-id="${a.id}" data-nom="${a.nombre}" data-gen="${a.genero}"> ${a.nombre}</label></div>`;
            });
        });
    }

    window.crearGrupoEstable = async () => {
        const nom = document.getElementById('geNombre').value.trim();
        const seleccion = [];
        document.querySelectorAll('.chk-ge:checked').forEach(c => seleccion.push({id: c.dataset.id, nombre: c.dataset.nom, genero: c.dataset.gen}));
        await setDoc(doc(db, "grupos_estables_db", nom.replace(/ /g,'_')), { nombre: nom, creador: sesion.id, alumnos: seleccion });
        alert("Grupo Creado"); renderizarGruposGE();
    };

    async function renderizarGruposGE() {
        const snap = await getDocs(collection(db, "grupos_estables_db"));
        const div = document.getElementById('misGruposRender');
        div.innerHTML = "";
        snap.forEach(d => { if(d.data().creador === sesion.id) div.innerHTML += `<div class="card">${d.data().nombre}</div>`; });
    }

    window.generarReportePDF = () => {
        const { jsPDF } = window.jspdf;
        const docP = new jsPDF();
        docP.addImage("https://raw.githubusercontent.com/ebnlucilapalacios-source/asistencia-lucila-palacios./main/IMG_20260225_005025_993.png", 'PNG', 10, 10, 25, 25);
        docP.text("E.B.N. LUCILA PALACIOS", 105, 20, {align:'center'});
        docP.text("REPORTE MENSUAL", 105, 30, {align:'center'});
        docP.save("Reporte.pdf");
    };

</script>
</body>
</html>
